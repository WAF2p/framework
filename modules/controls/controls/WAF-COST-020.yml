# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-COST-020
id: WAF-COST-020
pillar: cost
severity: high
type:
  - governance
description: |
  Cost budgets MUST be defined as IaC resources (not manually in cloud console UIs) for each cloud account, subscription, or project. Budget alerts MUST be configured at 80% and 100% of the budget limit and automatically routed to the workload owner and FinOps team. Budget resources in IaC ensure they are version-controlled, reviewable, and reproducible.
regulatory_mapping:
  - framework: 'FinOps Foundation'
    controls:
      - 'Inform Phase – Budget Visibility and Accountability'
      - 'Operate Phase – Budget Management and Variance Reporting'
  - framework: 'ISO 20000'
    controls:
      - 'Service financial management – budget control'
  - framework: 'Internal Governance'
    controls:
      - 'Cloud Cost Governance Policy – Budget Enforcement'
checks:
  - id: waf-cost-020.tf.aws.budgets-budget-exists
    engine: terraform
    automated: true
    title: 'AWS budget must be defined as IaC resource'
    provider: aws
    description: 'An aws_budgets_budget resource must exist in the Terraform configuration. Budgets set only in the AWS Console are not version-controlled and may be deleted or modified without audit trail.'
    expected: 'true'
    remediation: 'Add an aws_budgets_budget resource to your Terraform configuration. Set budget_type = "COST", time_unit = "MONTHLY", and configure notification blocks for 80% and 100% thresholds.\n'
    example:
      compliant: |
        resource "aws_budgets_budget" "workload_monthly" {
          name         = "payment-service-prod-monthly"
          budget_type  = "COST"
          limit_amount = "5000"
          limit_unit   = "USD"
          time_unit    = "MONTHLY"
        
          notification {
            comparison_operator        = "GREATER_THAN"
            threshold                  = 80
            threshold_type             = "PERCENTAGE"
            notification_type          = "ACTUAL"
            subscriber_email_addresses = ["payments-team@company.com"]
          }
        
          notification {
            comparison_operator        = "GREATER_THAN"
            threshold                  = 100
            threshold_type             = "PERCENTAGE"
            notification_type          = "ACTUAL"
            subscriber_email_addresses = ["payments-team@company.com", "finops@company.com"]
          }
        }
        
      non_compliant: |
        # No aws_budgets_budget resource defined.
        # Budget was set manually in AWS Console – not reproducible, not version-controlled.
        
    scope:
      block_type: resource
      resource_types:
        - aws_budgets_budget
    assertions:
      - attribute: 'budget_type'
        op: 'equals'
        message: 'Budget must be of type COST for cloud spend tracking.'
      - attribute: 'time_unit'
        op: 'in'
        message: 'Budget time unit must be MONTHLY or QUARTERLY.'
    on_fail: violation
  - id: waf-cost-020.tf.azurerm.consumption-budget-defined
    engine: terraform
    automated: true
    title: 'Azure consumption budget must be defined as IaC resource'
    provider: azurerm
    description: 'An azurerm_consumption_budget_resource_group or azurerm_consumption_budget_subscription resource must exist in the Terraform configuration for Azure spending control.'
    expected: 'true'
    remediation: 'Add an azurerm_consumption_budget_resource_group or azurerm_consumption_budget_subscription resource to your Terraform configuration with appropriate notification thresholds.\n'
    example:
      compliant: |
        resource "azurerm_consumption_budget_resource_group" "main" {
          name              = "payment-service-monthly-budget"
          resource_group_id = azurerm_resource_group.main.id
          amount            = 5000
          time_grain        = "Monthly"
        
          time_period {
            start_date = "2025-01-01T00:00:00Z"
          }
        
          notification {
            enabled        = true
            threshold      = 80
            operator       = "GreaterThan"
            threshold_type = "Actual"
            contact_emails = ["payments-team@company.com"]
          }
        
          notification {
            enabled        = true
            threshold      = 100
            operator       = "GreaterThan"
            threshold_type = "Actual"
            contact_emails = ["payments-team@company.com", "finops@company.com"]
          }
        }
        
      non_compliant: |
        # No azurerm_consumption_budget_* resource defined.
        # No automated budget control for this Azure workload.
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_consumption_budget_resource_group
        - azurerm_consumption_budget_subscription
        - azurerm_consumption_budget_management_group
    assertions:
      - attribute: 'amount'
        op: 'greater_than_or_equal'
        message: 'Budget amount must be greater than 0.'
    on_fail: violation
