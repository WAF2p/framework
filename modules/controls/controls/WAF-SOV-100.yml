# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-SOV-100
id: WAF-SOV-100
pillar: sovereign
severity: medium
type:
  - governance
description: |
  A documented exit plan MUST exist covering data export procedures, IaC portability strategy, dependency replacement mapping, timeline, and cost estimates. Exit/restore drills MUST be performed at least annually to validate that the exit plan is executable. IaC must use open standards and provider-agnostic patterns where feasible to reduce proprietary lock-in. S3 bucket lifecycle policies MUST be configured to support data retention and deletion requirements.
regulatory_mapping:
  - framework: 'GDPR'
    controls:
      - 'Art. 17 – Right to erasure (must be able to delete data)'
      - 'Art. 20 – Right to data portability'
      - 'Art. 28 – Processor obligations including data return/deletion on termination'
  - framework: 'BSI C5:2020'
    controls:
      - 'PRO-01 – Portability and interoperability'
      - 'OPS-06 – Exit management'
  - framework: 'BSI C3A:2026'
    controls:
      - 'Dimension 7 – Technology: Source code backup and recovery'
      - 'Dimension 7 – Technology: EU-based backups within 24 hours'
  - framework: 'EUCS (ENISA)'
    controls:
      - 'PRO-01 – Portability'
      - 'PRO-02 – Interoperability'
  - framework: 'GAIA-X'
    controls:
      - 'Sovereign Cloud – Reversibility requirements'
  - framework: 'ISO 27001:2022'
    controls:
      - 'A.5.20 – Addressing information security in supplier agreements (including exit)'
      - 'A.8.10 – Information deletion'
checks:
  - id: waf-sov-100.tf.aws.s3-lifecycle-policy-defined
    engine: terraform
    automated: true
    title: 'S3 buckets storing sovereign data must have lifecycle policies'
    provider: aws
    description: 'S3 buckets containing sovereign data must have lifecycle rules defined to enforce data retention, transition to cheaper storage tiers, and scheduled deletion per the data residency policy.'
    expected: 'true'
    remediation: 'Create an aws_s3_bucket_lifecycle_configuration resource defining transition and expiration rules consistent with your data retention policy.\n'
    example:
      compliant: |
        resource "aws_s3_bucket_lifecycle_configuration" "sovereign_data" {
          bucket = aws_s3_bucket.data.id
          rule {
            id     = "sovereign-retention-policy"
            status = "Enabled"
            transition {
              days          = 90
              storage_class = "STANDARD_IA"
            }
            transition {
              days          = 365
              storage_class = "GLACIER"
            }
            expiration {
              days = 2555  # 7 years for financial data
            }
          }
        }
        
      non_compliant: |
        resource "aws_s3_bucket" "data" {
          bucket = "sovereign-data"
          # No lifecycle configuration
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_s3_bucket
    assertions:
      - attribute: 'id'
        op: 'has_associated_resource'
        message: 'S3 bucket has no lifecycle configuration. Data retention and deletion cannot be automated.'
    on_fail: warning
  - id: waf-sov-100.tf.aws.s3-versioning-for-data-portability
    engine: terraform
    automated: true
    title: 'S3 buckets with sovereign data should have versioning enabled'
    provider: aws
    description: 'S3 bucket versioning supports data portability by preserving historical versions of objects, enabling point-in-time exports during exit procedures.'
    expected: 'true'
    remediation: 'Enable versioning on S3 buckets containing sovereign data.\n'
    scope:
      block_type: resource
      resource_types:
        - aws_s3_bucket_versioning
    assertions:
      - attribute: 'versioning_configuration.status'
        op: 'equals'
        message: 'S3 bucket versioning must be Enabled for sovereign data portability.'
        expected: 'Enabled'
    on_fail: warning
  - id: waf-sov-100.tf.any.resource-tag-portability
    engine: terraform
    automated: true
    title: 'Data resources should have portability metadata tags'
    provider: any
    description: "Data resources should be tagged with 'portability-class' and 'data-export-enabled' to support automated export orchestration during exit procedures."
    expected: 'true'
    remediation: "Add 'portability-class' tag with values: portable | proprietary-limited | proprietary-locked. Aim to eliminate 'proprietary-locked' resources or document their alternatives.\n"
    example:
      compliant: |
        resource "aws_rds_instance" "app" {
          tags = {
            portability-class    = "portable"          # PostgreSQL – open standard
            data-export-enabled  = "true"
            data-residency       = "eu-only"
          }
        }
        
      non_compliant: |
        resource "aws_rds_instance" "app" {
          tags = {
            environment = "production"
            # No portability metadata
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_s3_bucket
        - aws_rds_instance
        - aws_rds_cluster
        - aws_dynamodb_table
        - azurerm_storage_account
        - azurerm_sql_database
        - google_storage_bucket
        - google_sql_database_instance
        - stackit_container_registry
        - stackit_mysql_instance
        - stackit_opensearch_instance
        - stackit_redis_instance
        - ovh_cloud_project
        - ovh_vps
        - hcloud_server
        - hcloud_volume
    assertions:
      - attribute: 'tags'
        op: 'key_exists'
        key: 'portability-class'
        message: "Resource is missing 'portability-class' tag needed for exit orchestration."
    on_fail: info
  - id: waf-sov-100.tf.any.no-proprietary-lock-in-patterns
    engine: terraform
    automated: true
    title: 'Flag use of high-lock-in proprietary data services'
    provider: aws
    description: 'Certain AWS services have limited or no export capability and represent high lock-in risk. Their use should be flagged for review and documented in the dependency replacement map.'
    expected: 'true'
    remediation: "Add an 'exit-strategy-documented' tag referencing the exit plan section covering this service. Maintain a documented replacement alternative.\n"
    scope:
      block_type: resource
      resource_types:
        - aws_cloudsearch_domain
        - aws_mq_broker
        - aws_redshift_cluster
    assertions:
      - attribute: 'tags'
        op: 'key_exists'
        key: 'exit-strategy-documented'
        message: "High-lock-in service used without documented exit strategy. Add 'exit-strategy-documented' tag."
    on_fail: info
  - id: waf-sov-100.tf.aws.rds-deletion-protection
    engine: terraform
    automated: true
    title: 'RDS production instances must have deletion protection enabled'
    provider: aws
    description: 'RDS instances tagged as production must have deletion_protection = true to prevent accidental destruction of sovereign data during exit procedures or infrastructure changes.'
    expected: 'true'
    remediation: 'Set deletion_protection = true on all production RDS instances and clusters.\n'
    example:
      compliant: |
        resource "aws_db_instance" "sovereign" {
          deletion_protection = true
          # ...
        }
        
      non_compliant: |
        resource "aws_db_instance" "sovereign" {
          deletion_protection = false  # Data can be deleted without confirmation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_db_instance
        - aws_rds_cluster
    assertions:
      - attribute: 'deletion_protection'
        op: 'is_true'
        message: 'RDS deletion_protection must be enabled to prevent accidental data loss.'
    on_fail: violation
