# ID: WAF-AGN-070
id: WAF-AGN-070
pillar: agentic
severity: medium
type:
  - governance
  - configuration
description: |
  Agent activities must be visible and measurable. Telemetry MUST be collected for all agents including tokens, latency, GPU utilization, and decision metrics. Metrics MUST be ingested into a monitoring system. Distributed tracing MUST link agent operations end-to-end.
regulatory_mapping:
  - framework: 'ISO 27001:2022'
    controls:
      - 'A.8.1 – Information security roles and responsibilities'
      - 'A.8.2 – Privileged access rights'
  - framework: 'ISO 27017'
    controls:
      - 'CLD.9.5 – Segregation in virtual computing environments'
  - framework: 'CIS Controls v8'
    controls:
      - 'CIS 13 – Content Filtering'
  - framework: 'SOC 2 Type II'
    controls:
      - 'CC4.1 – Monitoring activities'
      - 'CC7.1 – Infrastructure and software monitoring'
  - framework: 'NIST SP 800-53'
    controls:
      - 'AU-2 – Event logging'
      - 'AU-3 – Event content'
      - 'SI-4 – Information system monitoring'
  - framework: 'NIST CSF 2.0'
    controls:
      - 'DE.CM – Continuous monitoring'
      - 'DE.DP – Data protection'
  - framework: 'GDPR'
    controls:
      - 'Art. 32 – Security of processing'
      - 'Art. 5(1)(f) – Integrity and confidentiality'
  - framework: 'PCI DSS v4.0'
    controls:
      - 'Req 10 – Monitor and detect threats'
  - framework: 'CSA STAR'
    controls:
      - 'CCM Logging and Monitoring'
  - framework: 'BSI C5:2020'
    controls:
      - 'OPS-01 – Operational monitoring'
  - framework: 'TISAX'
    controls:
      - 'Information security – Monitoring and logging'
  - framework: 'ANSSI SecNumCloud'
    controls:
      - 'Domain – Logging and monitoring'
  - framework: 'BIO'
    controls:
      - 'BIO – Logboekhouding en monitoring'
  - framework: 'ENS High'
    controls:
      - 'op.exp.6 – Gestión de cambios'
  - framework: 'UK NCSC CAF'
    controls:
      - 'A4 – Policy and assurance'
  - framework: 'FedRAMP'
    controls:
      - 'AU-2, AU-3, SI-4 (Moderate baseline)'
  - framework: 'CMMC 2.0'
    controls:
      - 'AU.L2-3.8.1 – Flow audit logs to central log management'
  - framework: 'IT-Grundschutz'
    controls:
      - 'ORP.1 – Informationstechnisch-related Angriffsschutz'
  - framework: 'IRAP'
    controls:
      - 'ISM – Logging and monitoring'
  - framework: 'CCCS PBMM'
    controls:
      - 'AU-2, AU-3 – Logging and audit'
  - framework: 'MAS TRM'
    controls:
      - 'Ch.9 – Change management'
  - framework: 'ISMAP'
    controls:
      - 'Monitoring and logging controls'
  - framework: 'FISC'
    controls:
      - 'Technical measures – Logging and monitoring'
checks:
  - id: waf-agn-070.tf.aws.metrics-configured
    engine: terraform
    automated: true
    title: 'Agent metrics must be configured (tokens, latency, GPU)'
    provider: aws
    description: 'Agent telemetry must include token counts, inference latency, GPU utilization, and error rates. Metrics must be exported to CloudWatch or a third-party monitoring system.'
    expected: 'true'
    remediation: 'Configure Bedrock metrics export to CloudWatch. Use CloudWatch Insights to query agent metrics. Set up dashboards for token usage, latency, and error rates. Configure alarms for anomalies.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_metric_alarm" "agent_latency" {
          alarm_name          = "agent-latency-alarm"
          comparison_operator = "GreaterThanThreshold"
          evaluation_periods  = 2
          metric_name         = "Latency"
          namespace           = "AWS/Bedrock"
          period              = 60
          statistic           = "Average"
          threshold           = 5000
          unit                = "Milliseconds"
          alarm_description   = "Agent latency exceeds 5 seconds"
        }

        resource "aws_cloudwatch_metric_alarm" "agent_tokens" {
          alarm_name          = "agent-token-alarm"
          comparison_operator = "GreaterThanThreshold"
          evaluation_periods  = 1
          metric_name         = "TokenCount"
          namespace           = "AWS/Bedrock"
          period              = 300
          statistic           = "Sum"
          threshold           = 100000
          unit                = "Count"
          alarm_description   = "Agent token usage exceeds limit"
        }
      non_compliant: |
        # No metrics configured
        # WAF-AGN-070 Violation
        # No visibility into agent performance

    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_metric_alarm
        - aws_bedrockagent
    assertions:
      - attribute: 'alarm_name'
        op: 'not_empty'
        message: 'Metrics alarms must be configured for agent monitoring.'
    on_fail: violation
  - id: waf-agn-070.tf.aws.distributed-tracing-enabled
    engine: terraform
    automated: true
    title: 'Distributed tracing must be enabled for agent operations'
    provider: aws
    description: 'Agent operations must be traced using AWS X-Ray. Traces must include agent ID, operation type, latency, input/output size, and decision path. X-Ray must link to CloudWatch Logs for full context.'
    expected: 'true'
    remediation: 'Enable X-Ray tracing for Bedrock invocations. Use AWS SDK with X-Ray integration. Instrument agent code with X-Ray SDK for custom segments. Configure trace sampling.\n'
    example:
      compliant: |
        resource "aws_lambda_function" "agent_traced" {
          function_name = "agent-traced"
          environment {
            variables = {
              AWS_XRAY_TRACING_NAME = "agent-service"
              AWS_XRAY_DAEMON_ADDRESS = "127.0.0.1:2000"
            }
          }
        }

        resource "aws_cloudwatch_log_group" "agent_trace_logs" {
          name = "/aws/lambda/agent-traced"
        }
      non_compliant: |
        resource "aws_lambda_function" "agent_untraced" {
          function_name = "agent-untraced"
          # No X-Ray tracing
          # WAF-AGN-070 Violation
        }

    scope:
      block_type: resource
      resource_types:
        - aws_lambda_function
        - aws_bedrockagent
    assertions:
      - attribute: 'environment.variables.AWS_XRAY_TRACING_NAME'
        op: 'not_empty'
        message: 'Distributed tracing (X-Ray) must be enabled.'
    on_fail: violation
  - id: waf-agn-070.tf.aws.log-integration-configured
    engine: terraform
    automated: true
    title: 'Agent logs must be integrated with monitoring system'
    provider: aws
    description: 'Agent logs must be integrated with a centralized monitoring system. Logs must include agent ID, session ID, timestamp, operation type, input/output size, and result status.'
    expected: 'true'
    remediation: 'Configure CloudWatch Logs Insights queries for agent log analysis. Set up dashboards showing agent health, error rates, and performance trends. Configure alarms for error patterns.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_log_group" "agent_logs" {
          name = "/aws/bedrock/agent-logs"

          retention_in_days = 90
        }

        resource "aws_cloudwatch_log_metric_filter" "agent_errors" {
          name = "agent-error-metric"

          pattern = "{ $.level = \"error\" || $.error != null }"

          log_group_name = aws_cloudwatch_log_group.agent_logs.name

          metric_transformations {
            metric_name      = "AgentErrors"
            metric_namespace = "AgentMonitoring"
            metric_value     = "1"
          }
        }
      non_compliant: |
        resource "aws_cloudwatch_log_group" "agent_logs" {
          name = "/aws/bedrock/agent-logs"
          # No metric filter configured
          # WAF-AGN-070 Violation
        }

    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_log_group
        - aws_cloudwatch_log_metric_filter
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Log integration with monitoring must be configured.'
    on_fail: violation
