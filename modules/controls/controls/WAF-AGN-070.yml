checks:
  - id: waf-agn-070.tf.aws.metrics-configured
    engine: terraform
    automated: true
    title: 'Agenten-Metriken müssen konfiguriert sein (Tokens, Latenz, GPU)'
    provider: aws
    description: 'Agenten-Telemetrie muss Token-Anzahl, Inference-Latenz, GPU-Auslastung und Fehlerraten umfassen. Metriken müssen zu CloudWatch oder einem Drittanbieter-Monitoring-System exportiert werden.'
    expected: 'true'
    remediation: 'Konfigurieren Sie den Bedrock-Metrik-Export zu CloudWatch. Verwenden Sie CloudWatch Insights, um Agenten-Metriken abzufragen. Richten Sie Dashboards für Token-Usage, Latenz und Fehlerraten ein. Konfigurieren Sie Alarms für Anomalien.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_metric_alarm" "agent_latency" {
          alarm_name          = "agent-latency-alarm"
          comparison_operator = "GreaterThanThreshold"
          evaluation_periods  = 2
          metric_name         = "Latency"
          namespace           = "AWS/Bedrock"
          period              = 60
          statistic           = "Average"
          threshold           = 5000
          unit                = "Milliseconds"
          alarm_description   = "Agenten-Latenz überschreitet 5 Sekunden"
        }

        resource "aws_cloudwatch_metric_alarm" "agent_tokens" {
          alarm_name          = "agent-token-alarm"
          comparison_operator = "GreaterThanThreshold"
          evaluation_periods  = 1
          metric_name         = "TokenCount"
          namespace           = "AWS/Bedrock"
          period              = 300
          statistic           = "Sum"
          threshold           = 100000
          unit                = "Count"
          alarm_description   = "Agenten-Token-Verbrauch überschreitet Limit"
        }
      non_compliant: |
        # Keine Metriken konfiguriert
        # WAF-AGN-070 Verstoß
        # Keine Sichtbarkeit der Agenten-Performance

    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_metric_alarm
        - aws_bedrockagent
    assertions:
      - attribute: 'alarm_name'
        op: 'not_empty'
        message: 'Metrik-Alarms müssen für Agenten-Monitoring konfiguriert sein.'
    on_fail: violation
  - id: waf-agn-070.tf.aws.distributed-tracing-enabled
    engine: terraform
    automated: true
    title: 'Distributed Tracing muss für Agenten-Operationen aktiviert sein'
    provider: aws
    description: 'Agenten-Operationen müssen mittels AWS X-Ray nachvollzogen werden. Traces müssen Agenten-ID, Operationstyp, Latenz, Input/Output-Größe und Entscheidungspfad enthalten. X-Ray muss mit CloudWatch Logs für den vollständigen Kontext verknüpft sein.'
    expected: 'true'
    remediation: 'Aktivieren Sie X-Ray-Tracing für Bedrock-Aufrufe. Verwenden Sie das AWS SDK mit X-Ray-Integration. Instrumentieren Sie Agenten-Code mit dem X-Ray SDK für benutzerdefinierte Segmente. Konfigurieren Sie Trace-Sampling.\n'
    example:
      compliant: |
        resource "aws_lambda_function" "agent_traced" {
          function_name = "agent-traced"
          environment {
            variables = {
              AWS_XRAY_TRACING_NAME = "agent-service"
              AWS_XRAY_DAEMON_ADDRESS = "127.0.0.1:2000"
            }
          }
        }

        resource "aws_cloudwatch_log_group" "agent_trace_logs" {
          name = "/aws/lambda/agent-traced"
        }
      non_compliant: |
        resource "aws_lambda_function" "agent_untraced" {
          function_name = "agent-untraced"
          # Kein X-Ray-Tracing
          # WAF-AGN-070 Verstoß
        }

    scope:
      block_type: resource
      resource_types:
        - aws_lambda_function
        - aws_bedrockagent
    assertions:
      - attribute: 'environment.variables.AWS_XRAY_TRACING_NAME'
        op: 'not_empty'
        message: 'Distributed Tracing (X-Ray) muss aktiviert sein.'
    on_fail: violation
  - id: waf-agn-070.tf.aws.log-integration-configured
    engine: terraform
    automated: true
    title: 'Agenten-Logs müssen mit dem Monitoring-System integriert sein'
    provider: aws
    description: 'Agenten-Logs müssen in ein zentrales Monitoring-System integriert sein. Logs müssen Agenten-ID, Sitzungs-ID, Zeitstempel, Operationstyp, Input/Output-Größe und Ergebnisstatus enthalten.'
    expected: 'true'
    remediation: 'Konfigurieren Sie CloudWatch Logs Insights-Abfragen für Agenten-Log-Analysen. Richten Sie Dashboards ein, die Agenten-Health, Fehlerraten und Performance-Trends anzeigen. Konfigurieren Sie Alarms für Fehlermuster.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_log_group" "agent_logs" {
          name = "/aws/bedrock/agent-logs"

          retention_in_days = 90
        }

        resource "aws_cloudwatch_log_metric_filter" "agent_errors" {
          name = "agent-error-metric"

          pattern = "{ $.level = \"error\" || $.error != null }"

          log_group_name = aws_cloudwatch_log_group.agent_logs.name

          metric_transformations {
            metric_name      = "AgentErrors"
            metric_namespace = "AgentMonitoring"
            metric_value     = "1"
          }
        }
      non_compliant: |
        resource "aws_cloudwatch_log_group" "agent_logs" {
          name = "/aws/bedrock/agent-logs"
          # Kein Metrik-Filter konfiguriert
          # WAF-AGN-070 Verstoß
        }

    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_log_group
        - aws_cloudwatch_log_metric_filter
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Log-Integration mit Monitoring muss konfiguriert sein.'
    on_fail: violation
