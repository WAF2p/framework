# ID: WAF-AGN-070
id: WAF-AGN-070
pillar: agentic
severity: medium
type:
  - governance
  - configuration
description: |
  Agenten-Aktivitäten müssen sichtbar und messbar sein. Für alle Agenten MUSS Telemetrie erfasst werden, einschließlich Tokens, Latenz, GPU-Auslastung und Entscheidungsmetriken. Metriken MÜSSEN in ein Monitoring-System eingespeist werden. Distributed Tracing MUSS Agenten-Operationen end-to-end verknüpfen.
