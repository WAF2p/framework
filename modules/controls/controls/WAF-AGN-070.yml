checks:
- id: waf-agn-070.tf.aws.metrics-configured
  engine: terraform
  automated: true
  title: Agent metrics must be configured (tokens, latency, GPU)
  provider: aws
  description: Agent telemetry must include token counts, inference latency, GPU utilization, and error rates. Metrics must
    be exported to CloudWatch or a third-party monitoring system.
  expected: 'true'
  remediation: Configure Bedrock metrics export to CloudWatch. Use CloudWatch Insights to query agent metrics. Set up dashboards
    for token usage, latency, and error rates. Configure alarms for anomalies.\n
  example:
    compliant: "resource \"aws_cloudwatch_metric_alarm\" \"agent_latency\" {\n  alarm_name          = \"agent-latency-alarm\"\
      \n  comparison_operator = \"GreaterThanThreshold\"\n  evaluation_periods  = 2\n  metric_name         = \"Latency\"\n\
      \  namespace           = \"AWS/Bedrock\"\n  period              = 60\n  statistic           = \"Average\"\n  threshold\
      \           = 5000\n  unit                = \"Milliseconds\"\n  alarm_description   = \"Agent latency exceeds 5 seconds\"\
      \n}\n\nresource \"aws_cloudwatch_metric_alarm\" \"agent_tokens\" {\n  alarm_name          = \"agent-token-alarm\"\n\
      \  comparison_operator = \"GreaterThanThreshold\"\n  evaluation_periods  = 1\n  metric_name         = \"TokenCount\"\
      \n  namespace           = \"AWS/Bedrock\"\n  period              = 300\n  statistic           = \"Sum\"\n  threshold\
      \           = 100000\n  unit                = \"Count\"\n  alarm_description   = \"Agent token usage exceeds limit\"\
      \n}\n"
    non_compliant: '# No metrics configured

      # WAF-AGN-070 Violation

      # No visibility into agent performance

      '
  scope:
    block_type: resource
    resource_types:
    - aws_cloudwatch_metric_alarm
    - aws_bedrockagent
  assertions:
  - attribute: alarm_name
    op: not_empty
    message: Metrics alarms must be configured for agent monitoring.
  on_fail: violation
- id: waf-agn-070.tf.aws.distributed-tracing-enabled
  engine: terraform
  automated: true
  title: Distributed tracing must be enabled for agent operations
  provider: aws
  description: Agent operations must be traced using AWS X-Ray. Traces must include agent ID, operation type, latency, input/output
    size, and decision path. X-Ray must link to CloudWatch Logs for full context.
  expected: 'true'
  remediation: Enable X-Ray tracing for Bedrock invocations. Use AWS SDK with X-Ray integration. Instrument agent code with
    X-Ray SDK for custom segments. Configure trace sampling.\n
  example:
    compliant: "resource \"aws_lambda_function\" \"agent_traced\" {\n  function_name = \"agent-traced\"\n  environment {\n\
      \    variables = {\n      AWS_XRAY_TRACING_NAME = \"agent-service\"\n      AWS_XRAY_DAEMON_ADDRESS = \"127.0.0.1:2000\"\
      \n    }\n  }\n}\n\nresource \"aws_cloudwatch_log_group\" \"agent_trace_logs\" {\n  name = \"/aws/lambda/agent-traced\"\
      \n}\n"
    non_compliant: "resource \"aws_lambda_function\" \"agent_untraced\" {\n  function_name = \"agent-untraced\"\n  # No X-Ray\
      \ tracing\n  # WAF-AGN-070 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_lambda_function
    - aws_bedrockagent
  assertions:
  - attribute: environment.variables.AWS_XRAY_TRACING_NAME
    op: not_empty
    message: Distributed tracing (X-Ray) must be enabled.
  on_fail: violation
- id: waf-agn-070.tf.aws.log-integration-configured
  engine: terraform
  automated: true
  title: Agent logs must be integrated with monitoring system
  provider: aws
  description: Agent logs must be integrated with a centralized monitoring system. Logs must include agent ID, session ID,
    timestamp, operation type, input/output size, and result status.
  expected: 'true'
  remediation: Configure CloudWatch Logs Insights queries for agent log analysis. Set up dashboards showing agent health,
    error rates, and performance trends. Configure alarms for error patterns.\n
  example:
    compliant: "resource \"aws_cloudwatch_log_group\" \"agent_logs\" {\n  name = \"/aws/bedrock/agent-logs\"\n\n  retention_in_days\
      \ = 90\n}\n\nresource \"aws_cloudwatch_log_metric_filter\" \"agent_errors\" {\n  name = \"agent-error-metric\"\n\n \
      \ pattern = \"{ $.level = \\\"error\\\" || $.error != null }\"\n\n  log_group_name = aws_cloudwatch_log_group.agent_logs.name\n\
      \n  metric_transformations {\n    metric_name      = \"AgentErrors\"\n    metric_namespace = \"AgentMonitoring\"\n \
      \   metric_value     = \"1\"\n  }\n}\n"
    non_compliant: "resource \"aws_cloudwatch_log_group\" \"agent_logs\" {\n  name = \"/aws/bedrock/agent-logs\"\n  # No metric\
      \ filter configured\n  # WAF-AGN-070 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_cloudwatch_log_group
    - aws_cloudwatch_log_metric_filter
  assertions:
  - attribute: name
    op: not_empty
    message: Log integration with monitoring must be configured.
  on_fail: violation
- id: waf-agn-070.tf.azurerm.app-insights-agent
  engine: terraform
  automated: true
  title: Azure Application Insights must monitor agent operations
  provider: azurerm
  description: Azure AI agent components must be monitored via Application Insights to collect latency, token usage, error
    rates, and distributed traces.
  expected: 'true'
  remediation: 'Deploy azurerm_application_insights and connect it to agent hosting services (App Service, Container Apps,
    Functions).

    '
  example:
    compliant: "resource \"azurerm_application_insights\" \"agent_ai\" {\n  name                = \"agent-insights\"\n  location\
      \            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n  workspace_id\
      \        = azurerm_log_analytics_workspace.ai_logs.id\n  application_type    = \"web\"\n}\n\nresource \"azurerm_linux_function_app\"\
      \ \"agent_host\" {\n  name                = \"agent-function\"\n  location            = azurerm_resource_group.main.location\n\
      \  resource_group_name = azurerm_resource_group.main.name\n  service_plan_id     = azurerm_service_plan.agent_plan.id\n\
      \n  app_settings = {\n    \"APPINSIGHTS_INSTRUMENTATIONKEY\" = azurerm_application_insights.agent_ai.instrumentation_key\n\
      \  }\n}\n"
    non_compliant: "resource \"azurerm_linux_function_app\" \"agent_host\" {\n  name = \"agent-function\"\n  # No Application\
      \ Insights integration\n  # WAF-AGN-070 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_application_insights
    - azurerm_linux_function_app
  assertions:
  - attribute: workspace_id
    op: not_empty
    message: Application Insights must be linked to a Log Analytics workspace.
  - attribute: app_settings.APPINSIGHTS_INSTRUMENTATIONKEY
    op: attribute_exists
    message: Agent host must reference Application Insights instrumentation key.
  on_fail: violation
- id: waf-agn-070.tf.google.monitoring-agent
  engine: terraform
  automated: true
  title: GCP Cloud Monitoring must collect agent telemetry
  provider: google
  description: GCP Vertex AI / Cloud Run agent services must have monitoring dashboards and alerting policies for latency,
    errors, and token usage.
  expected: 'true'
  remediation: 'Configure google_monitoring_alert_policy resources for agent services and google_monitoring_dashboard for
    agent metrics.

    '
  example:
    compliant: "resource \"google_monitoring_alert_policy\" \"agent_latency\" {\n  display_name = \"Agent high latency\"\n\
      \  combiner     = \"OR\"\n\n  conditions {\n    display_name = \"Latency > 5s\"\n    condition_threshold {\n      filter\
      \          = \"resource.type=\"cloud_run_revision\" AND metric.type=\"run.googleapis.com/request_latencies\"\"\n   \
      \   duration        = \"60s\"\n      comparison      = \"COMPARISON_GT\"\n      threshold_value = 5000\n    }\n  }\n\
      \n  notification_channels = [google_monitoring_notification_channel.team.id]\n}\n"
    non_compliant: "resource \"google_cloud_run_service\" \"agent\" {\n  name     = \"agent-service\"\n  location = \"europe-west3\"\
      \n  # No Cloud Monitoring alert policies configured\n  # WAF-AGN-070 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_monitoring_alert_policy
  assertions:
  - attribute: conditions
    op: attribute_exists
    message: Cloud Monitoring alert policy must define conditions for agent metrics.
  - attribute: notification_channels
    op: attribute_exists
    message: Alert policy must route to notification channels.
  on_fail: violation
- id: waf-agn-070.tf.stackit.agentic-observability
  engine: terraform
  automated: true
  title: Agent activities must be visible and measurable for stackit
  provider: stackit
  description: Agent activities must be visible and measurable must be documented in IaC via a agentic-observability tag/label
    on stackit_project. This validates the control is tracked as code.
  expected: 'true'
  remediation: 'Add a agentic-observability tag/label to the stackit_project resource to show the stackit implementation of
    WAF-AGN-070 is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    agentic-observability = \"true\"\n  }\n}\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing agentic-observability labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: agentic-observability
    message: stackit_project is missing the agentic-observability tag/label.
  on_fail: violation
