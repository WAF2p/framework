# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-OPS-030
id: WAF-OPS-030
pillar: operational
severity: high
type:
  - governance
  - configuration
description: |
  Every production workload MUST emit structured logs, expose metrics, and support distributed tracing. An observability stack MUST be configured with centralized log aggregation, a metrics collection system, and distributed tracing. Logs MUST be structured (JSON), include trace IDs and request IDs, and be routed to a centralized platform with defined retention periods.
regulatory_mapping:
  - framework: 'ISO/IEC 20000-1'
    controls:
      - 'Monitoring, measurement, analysis, and evaluation'
      - 'Service availability management'
  - framework: 'ITIL 4'
    controls:
      - 'Monitoring and event management'
      - 'Service configuration management'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'Operational Excellence Pillar – OPS 7: How do you understand the health of your workload?'
  - framework: 'SOC 2 Type II'
    controls:
      - 'CC7.1 – Detect and Monitor – Vulnerability and Threat Detection'
  - framework: 'BSI C5:2020'
    controls:
      - 'OIS-10 Protokollierung und Monitoring'
checks:
  - id: waf-ops-030.tf.aws.cloudwatch-log-group-retention
    engine: terraform
    automated: true
    title: 'CloudWatch log groups must define retention period'
    provider: aws
    description: 'All AWS CloudWatch log groups MUST define a retention_in_days value. Log groups without retention will accumulate indefinitely, increasing costs and violating data governance requirements.'
    expected: 'true'
    remediation: 'Add retention_in_days to all aws_cloudwatch_log_group resources. Recommended: 90 days for application logs, 365 days for security/audit logs.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_log_group" "app_logs" {
          name              = "/aws/ecs/payment-service"
          retention_in_days = 90
          tags = {
            environment = "production"
            workload    = "payment-service"
          }
        }
        
      non_compliant: |
        resource "aws_cloudwatch_log_group" "app_logs" {
          name = "/aws/ecs/payment-service"
          # No retention_in_days – logs stored indefinitely
          # WAF-OPS-030 Violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_log_group
    assertions:
      - attribute: 'retention_in_days'
        op: 'attribute_exists'
        message: 'CloudWatch log group must define retention_in_days.'
      - attribute: 'retention_in_days'
        op: 'greater_than_or_equal'
        message: 'Log group retention must be at least 30 days.'
    on_fail: violation
  - id: waf-ops-030.tf.aws.xray-tracing-enabled
    engine: terraform
    automated: true
    title: 'AWS Lambda functions must have X-Ray tracing enabled'
    provider: aws
    description: 'AWS Lambda functions in production MUST have X-Ray tracing enabled to support distributed request tracing and latency analysis.'
    expected: 'true'
    remediation: 'Add tracing_config { mode = "Active" } to all aws_lambda_function resources.\n'
    example:
      compliant: |
        resource "aws_lambda_function" "processor" {
          function_name = "payment-processor"
          role          = aws_iam_role.lambda_exec.arn
          handler       = "index.handler"
          runtime       = "nodejs20.x"
        
          tracing_config {
            mode = "Active"
          }
        }
        
      non_compliant: |
        resource "aws_lambda_function" "processor" {
          function_name = "payment-processor"
          role          = aws_iam_role.lambda_exec.arn
          handler       = "index.handler"
          runtime       = "nodejs20.x"
          # No tracing_config – WAF-OPS-030 Violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_lambda_function
    assertions:
      - attribute: 'tracing_config.mode'
        op: 'not_in'
        message: 'Lambda tracing mode must be Active, not PassThrough.'
    on_fail: violation
  - id: waf-ops-030.tf.azurerm.log-analytics-workspace
    engine: terraform
    automated: true
    title: 'Azure Log Analytics workspace must be configured with retention'
    provider: azurerm
    description: 'Azure deployments MUST configure a Log Analytics workspace with an appropriate retention period for centralized log aggregation.'
    expected: 'true'
    remediation: 'Set retention_in_days to at least 90 for application logs in the azurerm_log_analytics_workspace resource.\n'
    example:
      compliant: |
        resource "azurerm_log_analytics_workspace" "main" {
          name                = "law-payment-service-prod"
          location            = var.location
          resource_group_name = azurerm_resource_group.main.name
          sku                 = "PerGB2018"
          retention_in_days   = 90
        }
        
      non_compliant: |
        resource "azurerm_log_analytics_workspace" "main" {
          name                = "law-payment-service-prod"
          location            = var.location
          resource_group_name = azurerm_resource_group.main.name
          sku                 = "PerGB2018"
          retention_in_days   = 7
          # 7 days is insufficient – WAF-OPS-030 Violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_log_analytics_workspace
    assertions:
      - attribute: 'retention_in_days'
        op: 'greater_than_or_equal'
        message: 'Log Analytics workspace retention must be at least 30 days.'
    on_fail: violation
