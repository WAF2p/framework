# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-SOV-090
id: WAF-SOV-090
pillar: sovereign
severity: high
type:
  - network
description: |
  Outbound network traffic MUST be controlled using a default-deny or strict allow-list policy. Security groups must not permit unrestricted egress (0.0.0.0/0) without explicit justification. VPC endpoints MUST be used for access to cloud provider APIs to keep traffic on the sovereign network. Data exfiltration detection MUST be established to alert on anomalous outbound data volumes or unexpected destinations.
regulatory_mapping:
  - framework: 'GDPR'
    controls:
      - 'Art. 32 – Security of processing (network security)'
      - 'Art. 44-46 – Transfers to third countries'
  - framework: 'BSI C5:2020'
    controls:
      - 'SIM-02 – Intrusion detection'
      - 'OPS-04 – Data management'
      - 'NET-01 – Network security'
  - framework: 'BSI C3A:2026'
    controls:
      - 'Dimension 5 – Operational: Network security and monitoring'
      - 'Dimension 5 – Operational: Disconnect and reconnect capability'
  - framework: 'EUCS (ENISA)'
    controls:
      - 'IVS-09 – Network security'
      - 'IVS-10 – Egress filtering'
  - framework: 'ISO 27001:2022'
    controls:
      - 'A.8.20 – Networks security'
      - 'A.8.21 – Security of network services'
      - 'A.8.22 – Segregation of networks'
checks:
  - id: waf-sov-090.tf.aws.no-unrestricted-egress
    engine: terraform
    automated: true
    title: 'Security groups must not allow unrestricted egress to 0.0.0.0/0'
    provider: aws
    description: 'AWS security group rules with type=egress and cidr_blocks containing 0.0.0.0/0 or ::/0 should not exist without documented justification. Unrestricted egress enables data exfiltration and violates the principle of least-privilege networking.'
    expected: 'true'
    remediation: 'Replace 0.0.0.0/0 egress rules with specific CIDR ranges or prefix lists. Use VPC endpoints for cloud service access to eliminate the need for internet egress.\n'
    example:
      compliant: |
        resource "aws_security_group" "app" {
          name   = "app-sg"
          vpc_id = aws_vpc.main.id
          egress {
            from_port   = 443
            to_port     = 443
            protocol    = "tcp"
            cidr_blocks = ["10.0.0.0/8"]  # Internal only
          }
          # Outbound internet requires Network Firewall / explicit destination
        }
        
      non_compliant: |
        resource "aws_security_group" "app" {
          name   = "app-sg"
          vpc_id = aws_vpc.main.id
          egress {
            from_port   = 0
            to_port     = 0
            protocol    = "-1"
            cidr_blocks = ["0.0.0.0/0"]  # Unrestricted outbound
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_security_group_rule
        - aws_security_group
    assertions:
      - attribute: 'egress.cidr_blocks'
        op: 'not_contains'
        message: 'Security group allows unrestricted outbound access to 0.0.0.0/0. Restrict to specific destinations.'
        expected: '0.0.0.0/0'
      - attribute: 'egress.ipv6_cidr_blocks'
        op: 'not_contains'
        message: 'Security group allows unrestricted outbound access to ::/0 (all IPv6).'
        expected: '::/0'
    on_fail: warning
  - id: waf-sov-090.tf.aws.vpc-endpoint-s3
    engine: terraform
    automated: true
    title: 'VPC must have a gateway endpoint for S3'
    provider: aws
    description: 'VPCs containing sovereign workloads should have a gateway endpoint for S3 to ensure S3 API traffic stays on the AWS network backbone, not the public internet. This is both a sovereignty and cost optimization control.'
    expected: 'true'
    remediation: 'Create an aws_vpc_endpoint resource for S3 (gateway type) in each VPC containing sovereign workloads.\n'
    example:
      compliant: |
        resource "aws_vpc_endpoint" "s3" {
          vpc_id            = aws_vpc.main.id
          service_name      = "com.amazonaws.${var.aws_region}.s3"
          vpc_endpoint_type = "Gateway"
          route_table_ids   = [aws_route_table.private.id]
          policy            = data.aws_iam_policy_document.s3_endpoint_policy.json
        }
        
      non_compliant: |
        resource "aws_vpc" "main" {
          cidr_block = "10.0.0.0/16"
          # No S3 VPC endpoint – all S3 traffic via public internet
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_vpc
    assertions:
      - attribute: 'id'
        op: 'has_associated_resource'
        message: 'VPC does not have an S3 VPC endpoint. S3 traffic traverses the public internet.'
    on_fail: violation
  - id: waf-sov-090.tf.aws.vpc-flow-logs-enabled
    engine: terraform
    automated: true
    title: 'VPC flow logs must be enabled for egress forensics'
    provider: aws
    description: 'Every aws_vpc must have VPC flow logs enabled to capture network traffic metadata. This is required for forensic investigation of data exfiltration events and for compliance with audit logging requirements.'
    expected: 'true'
    remediation: 'Create an aws_flow_log resource for each VPC targeting an approved log destination (S3 in sovereign region or CloudWatch with retention policy set).\n'
    scope:
      block_type: resource
      resource_types:
        - aws_vpc
    assertions:
      - attribute: 'id'
        op: 'has_associated_resource'
        message: 'VPC does not have flow logs enabled. Network traffic cannot be audited.'
    on_fail: violation
  - id: waf-sov-090.tf.aws.network-acl-no-open-egress
    engine: terraform
    automated: true
    title: 'Network ACLs should not have open egress rules on all ports'
    provider: aws
    description: 'Network ACL egress rules allowing all traffic (port 0-65535) to 0.0.0.0/0 provide no meaningful defense-in-depth for data exfiltration scenarios.'
    expected: 'true'
    remediation: 'Restrict network ACL egress rules to specific port ranges and destination CIDRs.\n'
    scope:
      block_type: resource
      resource_types:
        - aws_network_acl_rule
    assertions:
      - attribute: 'egress'
        op: 'not_all_true_with'
        message: 'Network ACL has unrestricted egress rule on all ports to 0.0.0.0/0.'
    on_fail: warning
  - id: waf-sov-090.tf.azurerm.nsg-no-open-outbound
    engine: terraform
    automated: true
    title: 'Azure NSG must not allow unrestricted outbound traffic'
    provider: azurerm
    description: "Azure Network Security Groups must not have outbound security rules allowing all traffic (Any/Any) to destination '*' (any destination)."
    expected: 'true'
    remediation: "Replace wildcard destination address prefix ('*') with specific CIDRs or service tags.\n"
    scope:
      block_type: resource
      resource_types:
        - azurerm_network_security_rule
    assertions:
      - attribute: 'direction'
        op: 'not_equals_with_sibling'
        message: 'Azure NSG has outbound rule allowing traffic to any destination (*).'
    on_fail: warning
  - id: waf-sov-090.tf.stackit.network-no-unrestricted-egress
    engine: terraform
    automated: true
    title: 'StackIT networks must not allow unrestricted egress'
    provider: stackit
    description: 'StackIT networks must not have unrestricted egress rules. Define specific CIDR ranges for outbound traffic.'
    expected: 'true'
    remediation: 'Replace wildcard egress rules with specific CIDR ranges in StackIT network configurations.\n'
    example:
      compliant: |
        resource "stackit_network" "main" {
          project_id = stackit_project.main.id
          name       = "sovereign-network"
          cidr       = "10.0.0.0/16"
          # Egress controlled via firewall rules
        }

      non_compliant: |
        resource "stackit_network" "main" {
          project_id = stackit_project.main.id
          name       = "network"
          # Unrestricted egress rules
        }

    scope:
      block_type: resource
      resource_types:
        - stackit_network
    assertions:
      - attribute: 'egress'
        op: 'not_equals'
        message: 'StackIT network has unrestricted egress. Define specific CIDR ranges.'
        expected: '0.0.0.0/0'
    on_fail: warning
  - id: waf-sov-090.tf.ovh.network-no-unrestricted-egress
    engine: terraform
    automated: true
    title: 'OVH networks must not allow unrestricted egress'
    provider: ovh
    description: 'OVH cloud networks must not have unrestricted egress rules. Define specific CIDR ranges for outbound traffic.'
    expected: 'true'
    remediation: 'Replace wildcard egress rules with specific CIDR ranges in OVH network configurations.\n'
    example:
      compliant: |
        # OVH networks with restricted egress defined

      non_compliant: |
        # OVH networks with unrestricted egress

    scope:
      block_type: resource
      resource_types:
        - ovh_cloud_project_network_private
    assertions:
      - attribute: 'egress'
        op: 'not_equals'
        message: 'OVH network has unrestricted egress. Define specific CIDR ranges.'
        expected: '0.0.0.0/0'
    on_fail: warning
  - id: waf-sov-090.tf.hcloud.network-no-unrestricted-egress
    engine: terraform
    automated: true
    title: 'Hetzner Cloud networks must not allow unrestricted egress'
    provider: hcloud
    description: 'Hetzner Cloud networks must not have unrestricted egress rules. Define specific destination CIDR ranges.'
    expected: 'true'
    remediation: 'Replace wildcard egress rules with specific CIDR ranges in Hetzner Cloud network configurations.\n'
    example:
      compliant: |
        resource "hcloud_network" "main" {
          name       = "sovereign-network"
          ip_range   = "10.0.0.0/16"
          # Egress controlled through firewall rules
        }

      non_compliant: |
        resource "hcloud_network" "main" {
          name       = "network"
          ip_range   = "10.0.0.0/16"
          # Unrestricted egress rules
        }

    scope:
      block_type: resource
      resource_types:
        - hcloud_network
    assertions:
      - attribute: 'ip_range'
        op: 'not_equals'
        message: 'Hetzner Cloud network has unrestricted egress. Define specific CIDR ranges.'
        expected: '0.0.0.0/0'
    on_fail: warning
