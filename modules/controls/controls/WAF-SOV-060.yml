id: WAF-SOV-060
title: Privileged roles MUST be minimized, time-bound, and subject to regular...
status: active
tags:
- sovereign
- critical
- governance
pillar: sovereign
severity: critical
type:
- governance
category: identity-access
rationale: Uncontrolled identities and excessive permissions enable data theft, lateral movement, and unauthorized changes
  to production systems. This control addresses the requirements of the 'Identity and Access Management' area and ensures
  that Privileged roles MUST be minimized, time-bound, and subject to regular access reviews.
threat:
- Permanent or far-reaching privileged roles increase insider risk and damage if compromised.
- Missing time-boxing for admin access prevents effective least-privilege reviews.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Implementation is regularly reviewed and evidenced in reviews.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-sovereign/pages/controls/WAF-SOV-060.adoc
  related_controls:
  - WAF-SOV-020
  - WAF-SOV-070
  - WAF-SOV-090
  - WAF-SOV-010
  - WAF-SEC-010
  - WAF-SEC-020
  - WAF-SEC-060
  - WAF-AGN-010
  - WAF-AGN-080
  - WAF-COST-040
  - WAF-COST-090
  - WAF-SEC-030
description: 'Privileged roles MUST be minimized, time-bound, and subject to regular access reviews. Separation of Duties
  MUST be enforced: no single principal should be able to create infrastructure, approve deployments, AND manage encryption
  keys simultaneously. Wildcard IAM permissions (''*'' on ''*'') are forbidden. Administrative access MUST use JIT (Just-In-Time)
  provisioning where technically feasible.

  '
regulatory_mapping:
- framework: GDPR
  controls:
  - Art. 32 – Security of processing (access control)
  - Art. 5(1)(f) – Integrity and confidentiality
- framework: BSI C5:2020
  controls:
  - IAM-01 – Identity and access management
  - IAM-03 – Privileged access management
  - IAM-05 – Separation of duties
- framework: BSI C3A:2026
  controls:
  - 'Dimension 5 – Operational: EU-based operational personnel'
  - 'Dimension 5 – Operational: Separation of duties'
  - 'Dimension 1 – Strategic: Effective control'
- framework: EUCS (ENISA)
  controls:
  - IAM-01 – Access control policy
  - IAM-03 – Privileged access
- framework: ISO 27001:2022
  controls:
  - A.8.2 – Privileged access rights
  - A.8.3 – Information access restriction
  - A.5.3 – Segregation of duties
- framework: SOC 2 Type II
  controls:
  - CC6.3 – Role-based access control
  - CC6.6 – Logical access
checks:
- id: waf-sov-060.tf.aws.no-wildcard-iam-policy
  engine: terraform
  automated: true
  title: IAM policies must not grant Action:* with Resource:*
  provider: aws
  description: Custom IAM policies must not combine wildcard actions ('*') with wildcard resources ('*') as this grants full
    administrative access. This is the most common over-privileged pattern in AWS environments.
  expected: 'true'
  remediation: Replace wildcard Action/Resource combinations with specific permissions and specific resource ARNs following
    the least-privilege principle.\n
  example:
    compliant: "data \"aws_iam_policy_document\" \"s3_read\" {\n  statement {\n    effect    = \"Allow\"\n    actions   =\
      \ [\"s3:GetObject\", \"s3:ListBucket\"]\n    resources = [\n      aws_s3_bucket.data.arn,\n      \"${aws_s3_bucket.data.arn}/*\"\
      \n    ]\n  }\n}\n"
    non_compliant: "data \"aws_iam_policy_document\" \"admin\" {\n  statement {\n    effect    = \"Allow\"\n    actions  \
      \ = [\"*\"]\n    resources = [\"*\"]\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_iam_policy
    - aws_iam_role_policy
    - aws_iam_user_policy
  assertions:
  - attribute: policy
    op: json_not_contains_pattern
    message: IAM policy grants Action:* with Resource:* (full admin). This is forbidden.
    pattern: '"Action":\\s*["\\[]*\\*["\\]]*.*"Resource":\\s*["\\[]*\\*["\\]]*'
  on_fail: violation
- id: waf-sov-060.tf.aws.no-administrator-access-managed-policy
  engine: terraform
  automated: true
  title: AWS managed AdministratorAccess policy must not be attached to regular roles
  provider: aws
  description: The AWS managed policy 'AdministratorAccess' must not be attached to regular IAM roles or users. It is permitted
    only for explicitly documented break-glass emergency roles.
  expected: 'true'
  remediation: Replace AdministratorAccess with a custom least-privilege policy. If needed for break-glass, document the use
    with a comment and restrict activation through JIT/approval workflow.\n
  example:
    compliant: "resource \"aws_iam_role_policy_attachment\" \"app\" {\n  role       = aws_iam_role.app.name\n  policy_arn\
      \ = aws_iam_policy.app_custom.arn\n  # Uses a custom least-privilege policy\n}\n"
    non_compliant: "resource \"aws_iam_role_policy_attachment\" \"admin\" {\n  role       = aws_iam_role.developer.name\n\
      \  policy_arn = \"arn:aws:iam::aws:policy/AdministratorAccess\"\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_iam_role_policy_attachment
    - aws_iam_user_policy_attachment
    - aws_iam_group_policy_attachment
  assertions:
  - attribute: policy_arn
    op: not_equals
    message: AdministratorAccess managed policy must not be attached to non-break-glass roles.
    expected: arn:aws:iam::aws:policy/AdministratorAccess
  on_fail: violation
- id: waf-sov-060.tf.aws.iam-password-policy-configured
  engine: terraform
  automated: true
  title: IAM account password policy must be configured
  provider: aws
  description: An aws_iam_account_password_policy resource must exist with minimum password length, complexity requirements,
    and password reuse prevention.
  expected: 'true'
  remediation: Configure an aws_iam_account_password_policy resource with strong password requirements.\n
  example:
    compliant: "resource \"aws_iam_account_password_policy\" \"strict\" {\n  minimum_password_length        = 16\n  require_uppercase_characters\
      \   = true\n  require_lowercase_characters   = true\n  require_numbers                = true\n  require_symbols    \
      \            = true\n  allow_users_to_change_password = true\n  max_password_age               = 90\n  password_reuse_prevention\
      \      = 24\n}\n"
    non_compliant: '# No aws_iam_account_password_policy resource defined

      '
  scope:
    block_type: resource
    resource_types:
    - aws_iam_account_password_policy
  assertions:
  - attribute: minimum_password_length
    op: greater_than_or_equal
    message: IAM password minimum length must be >= 14 characters.
    expected: 14
  - attribute: require_uppercase_characters
    op: is_true
    message: IAM password policy must require uppercase characters.
  - attribute: require_symbols
    op: is_true
    message: IAM password policy must require symbols.
  - attribute: password_reuse_prevention
    op: greater_than_or_equal
    message: IAM password policy must prevent reuse of at least 12 previous passwords.
    expected: 12
  - attribute: max_password_age
    op: less_than_or_equal
    message: IAM password max age must be <= 90 days.
    expected: 90
  on_fail: violation
- id: waf-sov-060.tf.aws.no-iam-user-direct-access-keys
  engine: terraform
  automated: true
  title: IAM users should not have long-lived access keys in Terraform
  provider: aws
  description: Creating aws_iam_access_key resources in Terraform creates long-lived static credentials that should be avoided.
    Use IAM roles, OIDC federation, or short-lived credentials instead.
  expected: 'true'
  remediation: 'Replace static IAM access keys with IAM roles and temporary credentials. For CI/CD: use OIDC provider to issue
    short-lived tokens. For applications: use EC2 instance profiles or ECS task roles.\n'
  scope:
    block_type: resource
    resource_types:
    - aws_iam_access_key
  assertions:
  - attribute: status
    op: not_equals
    message: Long-lived IAM access keys should not be created via Terraform. Use roles or OIDC.
    expected: Active
  on_fail: advisory
- id: waf-sov-060.tf.stackit.no-wildcard-iam-policy
  engine: terraform
  automated: true
  title: StackIT IAM policies must not grant wildcard permissions
  provider: stackit
  description: StackIT IAM policies must not grant wildcard actions and resources. Follow least-privilege principles for sovereign
    environments.
  expected: 'true'
  remediation: Replace wildcard permissions with specific actions and resource ARNs.\n
  example:
    compliant: '# Use specific permissions for StackIT resources

      '
    non_compliant: '# Wildcard permissions in StackIT IAM policies

      '
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: iam_policy
    op: json_not_contains_pattern
    message: StackIT IAM policy grants wildcard permissions.
    pattern: '"\\*":\\s*"\\*"'
  on_fail: violation
- id: waf-sov-060.config.azurerm.privileged-roles-policy
  engine: config
  automated: true
  title: Azure privileged role governance policy must be documented
  provider: azurerm
  description: A version-controlled policy document must exist at docs/sovereign/waf-sov-060-azurerm-privileged-roles.md and
    document the Azure implementation of privileged role minimization, time-bound access (PIM/Entra ID), and regular review.
  expected: 'true'
  remediation: 'Create or update docs/sovereign/waf-sov-060-azurerm-privileged-roles.md. State the requirement, Azure PIM/Conditional
    Access configuration, review cadence, and owner.

    '
  example:
    compliant: 'docs/sovereign/waf-sov-060-azurerm-privileged-roles.md:

      - Azure privileged roles are limited to Owner/Contributor only via PIM with time-bound activation.

      - Quarterly access reviews are scheduled.

      - Break-glass accounts are excluded from PIM and documented.

      '
    non_compliant: '# docs/sovereign/waf-sov-060-azurerm-privileged-roles.md is missing or does not contain a normative requirement.

      '
  scope:
    block_type: file
    path_pattern: docs/sovereign/waf-sov-060-azurerm-privileged-roles.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Azure privileged roles policy file must contain a normative requirement statement.
  on_fail: violation
- id: waf-sov-060.config.google.privileged-roles-policy
  engine: config
  automated: true
  title: GCP privileged role governance policy must be documented
  provider: google
  description: A version-controlled policy document must exist at docs/sovereign/waf-sov-060-google-privileged-roles.md and
    document the GCP implementation of privileged role minimization, time-bound access, and regular review.
  expected: 'true'
  remediation: 'Create or update docs/sovereign/waf-sov-060-google-privileged-roles.md. State the requirement, GCP IAM basic-role
    restrictions, custom roles, review cadence, and owner.

    '
  example:
    compliant: 'docs/sovereign/waf-sov-060-google-privileged-roles.md:

      - GCP basic roles (owner/editor/viewer) are prohibited at project and organization level.

      - Custom IAM roles are used with least privilege.

      - Quarterly access reviews are scheduled.

      '
    non_compliant: '# docs/sovereign/waf-sov-060-google-privileged-roles.md is missing or does not contain a normative requirement.

      '
  scope:
    block_type: file
    path_pattern: docs/sovereign/waf-sov-060-google-privileged-roles.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: GCP privileged roles policy file must contain a normative requirement statement.
  on_fail: violation
