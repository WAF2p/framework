# ID: WAF-SOV-060
id: WAF-SOV-060
pillar: sovereign
severity: critical
type:
  - governance
description: |
  Privileged roles MUST be minimized, time-bound, and subject to regular access reviews. Separation of Duties MUST be enforced: no single principal should be able to create infrastructure, approve deployments, AND manage encryption keys simultaneously. Wildcard IAM permissions ('*' on '*') are forbidden. Administrative access MUST use JIT (Just-In-Time) provisioning where technically feasible.
regulatory_mapping:
  - framework: 'GDPR'
    controls:
      - 'Art. 32 – Security of processing (access control)'
      - 'Art. 5(1)(f) – Integrity and confidentiality'
  - framework: 'BSI C5:2020'
    controls:
      - 'IAM-01 – Identity and access management'
      - 'IAM-03 – Privileged access management'
      - 'IAM-05 – Separation of duties'
  - framework: 'BSI C3A:2026'
    controls:
      - 'Dimension 5 – Operational: EU-based operational personnel'
      - 'Dimension 5 – Operational: Separation of duties'
      - 'Dimension 1 – Strategic: Effective control'
  - framework: 'EUCS (ENISA)'
    controls:
      - 'IAM-01 – Access control policy'
      - 'IAM-03 – Privileged access'
  - framework: 'ISO 27001:2022'
    controls:
      - 'A.8.2 – Privileged access rights'
      - 'A.8.3 – Information access restriction'
      - 'A.5.3 – Segregation of duties'
  - framework: 'SOC 2'
    controls:
      - 'CC6.3 – Role-based access control'
      - 'CC6.6 – Logical access'
checks:
  - id: waf-sov-060.tf.aws.no-wildcard-iam-policy
    engine: terraform
    automated: true
    title: 'IAM policies must not grant Action:* with Resource:*'
    provider: aws
    description: "Custom IAM policies must not combine wildcard actions ('*') with wildcard resources ('*') as this grants full administrative access. This is the most common over-privileged pattern in AWS environments."
    expected: 'true'
    remediation: 'Replace wildcard Action/Resource combinations with specific permissions and specific resource ARNs following the least-privilege principle.\n'
    example:
      compliant: |
        data "aws_iam_policy_document" "s3_read" {
          statement {
            effect    = "Allow"
            actions   = ["s3:GetObject", "s3:ListBucket"]
            resources = [
              aws_s3_bucket.data.arn,
              "${aws_s3_bucket.data.arn}/*"
            ]
          }
        }
        
      non_compliant: |
        data "aws_iam_policy_document" "admin" {
          statement {
            effect    = "Allow"
            actions   = ["*"]
            resources = ["*"]
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_iam_policy
        - aws_iam_role_policy
        - aws_iam_user_policy
    assertions:
      - attribute: 'policy'
        op: 'json_not_contains_pattern'
        message: 'IAM policy grants Action:* with Resource:* (full admin). This is forbidden.'
        pattern: '"Action":\\s*["\\[]*\\*["\\]]*.*"Resource":\\s*["\\[]*\\*["\\]]*'
    on_fail: violation
  - id: waf-sov-060.tf.aws.no-administrator-access-managed-policy
    engine: terraform
    automated: true
    title: 'AWS managed AdministratorAccess policy must not be attached to regular roles'
    provider: aws
    description: "The AWS managed policy 'AdministratorAccess' must not be attached to regular IAM roles or users. It is permitted only for explicitly documented break-glass emergency roles."
    expected: 'true'
    remediation: 'Replace AdministratorAccess with a custom least-privilege policy. If needed for break-glass, document the use with a comment and restrict activation through JIT/approval workflow.\n'
    example:
      compliant: |
        resource "aws_iam_role_policy_attachment" "app" {
          role       = aws_iam_role.app.name
          policy_arn = aws_iam_policy.app_custom.arn
          # Uses a custom least-privilege policy
        }
        
      non_compliant: |
        resource "aws_iam_role_policy_attachment" "admin" {
          role       = aws_iam_role.developer.name
          policy_arn = "arn:aws:iam::aws:policy/AdministratorAccess"
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_iam_role_policy_attachment
        - aws_iam_user_policy_attachment
        - aws_iam_group_policy_attachment
    assertions:
      - attribute: 'policy_arn'
        op: 'not_equals'
        message: 'AdministratorAccess managed policy must not be attached to non-break-glass roles.'
        expected: 'arn:aws:iam::aws:policy/AdministratorAccess'
    on_fail: violation
  - id: waf-sov-060.tf.aws.iam-password-policy-configured
    engine: terraform
    automated: true
    title: 'IAM account password policy must be configured'
    provider: aws
    description: 'An aws_iam_account_password_policy resource must exist with minimum password length, complexity requirements, and password reuse prevention.'
    expected: 'true'
    remediation: 'Configure an aws_iam_account_password_policy resource with strong password requirements.\n'
    example:
      compliant: |
        resource "aws_iam_account_password_policy" "strict" {
          minimum_password_length        = 16
          require_uppercase_characters   = true
          require_lowercase_characters   = true
          require_numbers                = true
          require_symbols                = true
          allow_users_to_change_password = true
          max_password_age               = 90
          password_reuse_prevention      = 24
        }
        
      non_compliant: |
        # No aws_iam_account_password_policy resource defined
        
    scope:
      block_type: resource
      resource_types:
        - aws_iam_account_password_policy
    assertions:
      - attribute: 'minimum_password_length'
        op: 'greater_than_or_equal'
        message: 'IAM password minimum length must be >= 14 characters.'
        expected: 14
      - attribute: 'require_uppercase_characters'
        op: 'is_true'
        message: 'IAM password policy must require uppercase characters.'
      - attribute: 'require_symbols'
        op: 'is_true'
        message: 'IAM password policy must require symbols.'
      - attribute: 'password_reuse_prevention'
        op: 'greater_than_or_equal'
        message: 'IAM password policy must prevent reuse of at least 12 previous passwords.'
        expected: 12
      - attribute: 'max_password_age'
        op: 'less_than_or_equal'
        message: 'IAM password max age must be <= 90 days.'
        expected: 90
    on_fail: violation
  - id: waf-sov-060.tf.aws.no-iam-user-direct-access-keys
    engine: terraform
    automated: true
    title: 'IAM users should not have long-lived access keys in Terraform'
    provider: aws
    description: 'Creating aws_iam_access_key resources in Terraform creates long-lived static credentials that should be avoided. Use IAM roles, OIDC federation, or short-lived credentials instead.'
    expected: 'true'
    remediation: 'Replace static IAM access keys with IAM roles and temporary credentials. For CI/CD: use OIDC provider to issue short-lived tokens. For applications: use EC2 instance profiles or ECS task roles.\n'
    scope:
      block_type: resource
      resource_types:
        - aws_iam_access_key
    assertions:
      - attribute: 'status'
        op: 'not_equals'
        message: 'Long-lived IAM access keys should not be created via Terraform. Use roles or OIDC.'
        expected: 'Active'
    on_fail: warning
