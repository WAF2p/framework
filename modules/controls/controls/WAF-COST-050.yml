      '
  scope:
    block_type: file
    path_pattern: docs/cost/waf-cost-050-gcp-cost-impact-assessment.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/cost/waf-cost-050-gcp-cost-impact-assessment.md` must contain a normative requirement statement.
  on_fail: finding
- id: waf-cost-050.tf.stackit.cost-impact-assessment
  engine: terraform
  automated: true
  title: Every Architecture Decision Record (ADR) covering infrastructure changes... for stackit
  provider: stackit
  description: Every Architecture Decision Record (ADR) covering infrastructure changes... must be documented in IaC via a
    cost-impact-assessment tag/label on stackit_project. This validates the control is tracked as code.
  expected: 'true'
  remediation: 'Add a cost-impact-assessment tag/label to the stackit_project resource to show the stackit implementation
    of WAF-COST-050 is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    cost-impact-assessment = \"true\"\n  }\n\
      }\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing cost-impact-assessment labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: cost-impact-assessment
    message: stackit_project is missing the cost-impact-assessment tag/label.
