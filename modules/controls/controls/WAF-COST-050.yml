# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-COST-050
id: WAF-COST-050
pillar: cost
severity: high
type:
  - governance
description: |
  Every Architecture Decision Record (ADR) covering infrastructure changes MUST include a structured Cost Impact Assessment section. The assessment MUST cover: TCO estimate (EUR/year), lock-in risk score (1-5), data transfer cost estimate, operational effort (FTE/year), exit cost estimate, and 3-year NPV. ADRs with lock-in risk score >= 4 require Architecture Board approval before implementation. This control is the primary prevention mechanism for Architectural Cost Debt.
regulatory_mapping:
  - framework: 'FinOps Foundation'
    controls:
      - 'Operate Phase – Architecture and Cost Governance'
      - 'FinOps Principles – Everyone Takes Ownership of Their Cloud Usage'
  - framework: 'Internal Governance'
    controls:
      - 'Architecture Governance – Economic Impact Documentation'
      - 'Cloud Cost Governance Policy – Lock-in Assessment Requirement'
checks:
  - id: waf-cost-050.tf.any.high-lockin-resource-tagged
    engine: terraform
    automated: true
    title: 'High lock-in resources must be tagged with lock-in risk score'
    provider: any
    description: "Resources from services with inherently high vendor lock-in (proprietary streaming, proprietary database services, complex managed services) should be tagged with 'lock-in-risk' to document that the lock-in was consciously evaluated. This check validates that the tag exists on known high-lock-in resource types."
    expected: 'true'
    remediation: "Add 'lock-in-risk' tag (value: 1-5) to document that vendor lock-in was consciously evaluated. Tag value 4 or 5 requires an ADR with Architecture Board approval. See docs/adr/ for the ADR template with Cost Impact Assessment section.\n"
    example:
      compliant: |
        resource "aws_kinesis_stream" "events" {
          name        = "payment-events"
          shard_count = 4
        
          tags = merge(module.mandatory_tags.tags, {
            lock-in-risk = "4"  # High lock-in; ADR-0042 documents cost impact assessment
            adr-reference = "ADR-0042"
          })
        }
        
      non_compliant: |
        resource "aws_kinesis_stream" "events" {
          name        = "payment-events"
          shard_count = 4
          tags = {
            cost-center = "data-team"
            # Missing lock-in-risk tag – no evidence of lock-in evaluation
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_kinesis_stream
        - aws_kinesis_firehose_delivery_stream
        - aws_redshift_cluster
        - aws_neptune_cluster
        - aws_msk_cluster
        - azurerm_service_bus_namespace
        - azurerm_eventhub_namespace
        - azurerm_synapse_workspace
        - google_spanner_instance
        - google_bigquery_dataset
    assertions:
      - attribute: 'tags'
        op: 'key_exists'
        key: 'lock-in-risk'
        message: "High lock-in resource must have 'lock-in-risk' tag (value: 1-5) documenting conscious evaluation."
    on_fail: violation
  - id: waf-cost-050.tf.any.adr-cost-section-present
    engine: terraform
    automated: true
    title: 'ADR documents must include Cost Impact Assessment section'
    provider: any
    description: 'This is a process control. ADR files in docs/adr/ must contain a Cost Impact Assessment section with: TCO estimate, lock-in risk score, data transfer costs, operational effort, exit costs, and 3-year NPV. Validated through CI pipeline ADR linting or manual audit.'
    expected: 'true'
    remediation: 'Update the ADR template (docs/adr/ADR-TEMPLATE.md) to include the Cost Impact Assessment section. Update all ADRs from the last 12 months that are missing this section.\n'
    example:
      compliant: |
        ## Cost Impact Assessment (WAF-COST-050)
        
        | Dimension            | Bewertung                     |
        |---------------------|-------------------------------|
        | Geschätzte TCO/Jahr | 48.000 EUR                    |
        | Lock-in-Risiko      | 4/5                           |
        | Datentransfer-Kosten | ~400 EUR/Monat               |
        | Betriebsaufwand     | 0.3 FTE/Jahr                  |
        | Exit-Kosten (est.)  | ~80.000 EUR                   |
        | 3-Jahres-NPV        | -224.000 EUR                  |
        
        **Kostenschuld-Risiko:** Hoch
        
      non_compliant: |
        # ADR without Cost Impact Assessment section
        # Economic evaluation missing – WAF-COST-050 process violation
        
    scope:
      block_type: resource
    on_fail: finding
