id: WAF-COST-050
title: Every Architecture Decision Record (ADR) covering infrastructure changes...
status: active
tags:
- cost
- high
- governance
pillar: cost
severity: high
type:
- governance
category: cost-governance
rationale: Lack of cost transparency and governance leads to budget overruns, cloud waste, and unaccountable spending. This
  control addresses the requirements of the 'Cost Governance' area and ensures that Every Architecture Decision Record (ADR)
  covering infrastructure changes MUST include a structured Cost Impact Assessment section.
threat:
- Architecture decisions without cost consideration lead to lock-in and unaccountable spending.
- Missing lock-in assessment complicates future contract negotiations and cloud migration.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Implementation is regularly reviewed and evidenced in reviews.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-cost/pages/controls/WAF-COST-050.adoc
  related_controls:
  - WAF-COST-060
  - WAF-COST-100
  - WAF-SUS-020
  - WAF-COST-020
  - WAF-PERF-100
  - WAF-COST-010
  - WAF-COST-070
  - WAF-COST-080
  - WAF-SUS-100
  - WAF-REL-010
  - WAF-AGN-040
  - WAF-AGN-050
description: 'Every Architecture Decision Record (ADR) covering infrastructure changes MUST include a structured Cost Impact
  Assessment section. The assessment MUST cover: TCO estimate (EUR/year), lock-in risk score (1-5), data transfer cost estimate,
  operational effort (FTE/year), exit cost estimate, and 3-year NPV. ADRs with lock-in risk score >= 4 require Architecture
  Board approval before implementation. This control is the primary prevention mechanism for Architectural Cost Debt.

  '
regulatory_mapping:
- framework: FinOps Foundation
  controls:
  - Operate Phase – Architecture and Cost Governance
  - FinOps Principles – Everyone Takes Ownership of Their Cloud Usage
checks:
- id: waf-cost-050.tf.any.high-lockin-resource-tagged
  engine: terraform
  automated: true
  title: High lock-in resources must be tagged with lock-in risk score
  provider: any
  description: 'Resources from services with inherently high vendor lock-in (proprietary streaming, proprietary database services,
    complex managed services) should be tagged with ''lock-in-risk'' to document that the lock-in was consciously evaluated.
    This check validates that the tag exists on known high-lock-in resource types.

    '
  expected: 'true'
  remediation: 'Add ''lock-in-risk'' tag (value: 1-5) to document that vendor lock-in was consciously evaluated. Tag value
    4 or 5 requires an ADR with Architecture Board approval. See docs/adr/ for the ADR template with Cost Impact Assessment
    section.

    '
  example:
    compliant: "resource \"aws_kinesis_stream\" \"events\" {\n  name        = \"payment-events\"\n  shard_count = 4\n\n  tags\
      \ = merge(module.mandatory_tags.tags, {\n    lock-in-risk = \"4\"  # High lock-in; ADR-0042 documents cost impact assessment\n\
      \    adr-reference = \"ADR-0042\"\n  })\n}\n"
    non_compliant: "resource \"aws_kinesis_stream\" \"events\" {\n  name        = \"payment-events\"\n  shard_count = 4\n\
      \  tags = {\n    cost-center = \"data-team\"\n    # Missing lock-in-risk tag – no evidence of lock-in evaluation\n \
      \ }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_kinesis_stream
    - aws_kinesis_firehose_delivery_stream
    - aws_redshift_cluster
    - aws_neptune_cluster
    - aws_msk_cluster
    - azurerm_service_bus_namespace
    - azurerm_eventhub_namespace
    - azurerm_synapse_workspace
    - google_spanner_instance
    - google_bigquery_dataset
    - stackit_opensearch_instance
    - stackit_redis_instance
    - stackit_mysql_instance
    - ovh_dedicated_server
    - hcloud_server
  assertions:
  - attribute: tags
    op: key_exists
    key: lock-in-risk
    message: 'High lock-in resource must have ''lock-in-risk'' tag (value: 1-5) documenting conscious evaluation.'
  on_fail: violation
- id: waf-cost-050.config.any.cost-governance
  engine: config
  automated: true
  title: ADR documents must include Cost Impact Assessment section
  provider: any
  description: A version-controlled policy document must exist at `docs/cost/waf-cost-050-cost-governance.md` and document
    the provider-agnostic implementation of this control. The checker validates that the file exists and contains a normative
    requirement statement (MUST/SHALL/required/mandatory).
  expected: 'true'
  remediation: 'Create or update `docs/cost/waf-cost-050-cost-governance.md`. State the requirement, how it is implemented
    for provider-agnostic, the review cadence, and the owner.

    '
  example:
    compliant: '|

      docs/cost/waf-cost-050-cost-governance.md:

      - The provider-agnostic implementation of WAF-COST-050 is documented.

      - Implementation status and owner are recorded.

      - Review cadence is defined (e.g. quarterly).

      '
    non_compliant: '|

      # `docs/cost/waf-cost-050-cost-governance.md` is missing or does not contain a normative requirement.

      # WAF-COST-050 violation: provider-agnostic control is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/cost/waf-cost-050-cost-governance.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/cost/waf-cost-050-cost-governance.md` must contain a normative requirement statement.
  on_fail: finding
- id: waf-cost-050.config.azurerm.cost-impact-assessment
  engine: config
  automated: true
  title: Azure-specific Cost Impact Assessment policy must exist
  provider: azurerm
  description: A version-controlled policy document must exist at `docs/cost/waf-cost-050-azure-cost-impact-assessment.md`
    and document how Azure-specific ADRs implement the Cost Impact Assessment requirement.
  expected: 'true'
  remediation: 'Create or update `docs/cost/waf-cost-050-azure-cost-impact-assessment.md`. Include TCO estimate (EUR/year),
    lock-in risk score (1-5), data transfer cost estimate, operational effort (FTE/year), exit cost estimate, and 3-year NPV.
    Lock-in risk >= 4 requires Architecture Board approval.

    '
  example:
    compliant: '|

      docs/cost/waf-cost-050-azure-cost-impact-assessment.md:

      - Azure ADRs MUST include Cost Impact Assessment section.

      - Lock-in risk >= 4 requires Architecture Board approval.

      - Owner and review cadence are documented.

      '
    non_compliant: '|

      # `docs/cost/waf-cost-050-azure-cost-impact-assessment.md` is missing or does not contain a normative requirement.

      # WAF-COST-050 violation: Azure Cost Impact Assessment policy is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/cost/waf-cost-050-azure-cost-impact-assessment.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/cost/waf-cost-050-azure-cost-impact-assessment.md` must contain a normative requirement statement.
  on_fail: finding
- id: waf-cost-050.config.google.cost-impact-assessment
  engine: config
  automated: true
  title: GCP-specific Cost Impact Assessment policy must exist
  provider: google
  description: A version-controlled policy document must exist at `docs/cost/waf-cost-050-gcp-cost-impact-assessment.md` and
    document how GCP-specific ADRs implement the Cost Impact Assessment requirement.
  expected: 'true'
  remediation: 'Create or update `docs/cost/waf-cost-050-gcp-cost-impact-assessment.md`. Include TCO estimate (EUR/year),
