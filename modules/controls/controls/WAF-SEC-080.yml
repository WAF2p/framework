checks:
- id: waf-sec-080.tf.aws.cloudtrail-multi-region
  engine: terraform
  automated: true
  title: CloudTrail must be enabled as a multi-region trail with log file validation
  provider: aws
  description: An aws_cloudtrail resource must exist with is_multi_region_trail = true, enable_log_file_validation = true, and include_global_service_events = true to ensure complete API activity coverage across all regions and global services.
  expected: 'true'
  remediation: Set is_multi_region_trail = true, enable_log_file_validation = true, and include_global_service_events = true on the aws_cloudtrail resource. Ensure the trail S3 bucket has SSE-KMS encryption and is not publicly accessible.\n
  example:
    compliant: "resource \"aws_cloudtrail\" \"main\" {\n  name                          = \"org-cloudtrail\"\n  s3_bucket_name                = aws_s3_bucket.cloudtrail_logs.id\n  is_multi_region_trail         = true\n  enable_log_file_validation    = true\n  include_global_service_events = true\n  kms_key_id                    = aws_kms_key.cloudtrail.arn\n  tags = {\n    owner       = \"security-team\"\n    environment = \"all\"\n  }\n}\n"
    non_compliant: "resource \"aws_cloudtrail\" \"main\" {\n  name                          = \"org-cloudtrail\"\n  s3_bucket_name                = aws_s3_bucket.cloudtrail_logs.id\n  is_multi_region_trail         = false  # WAF-SEC-080 violation\n  enable_log_file_validation    = false  # WAF-SEC-080 violation\n  include_global_service_events = false  # WAF-SEC-080 violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_cloudtrail
  assertions:
  - attribute: is_multi_region_trail
    op: is_true
    message: CloudTrail must be a multi-region trail to capture API activity in all regions.
  - attribute: enable_log_file_validation
    op: is_true
    message: CloudTrail log file validation must be enabled to detect log tampering.
  - attribute: include_global_service_events
    op: is_true
    message: CloudTrail must include global service events (e.g., IAM API calls).
  on_fail: violation
- id: waf-sec-080.tf.aws.guardduty-enabled
  engine: terraform
  automated: true
  title: GuardDuty must be enabled in all active regions
  provider: aws
  description: An aws_guardduty_detector resource must exist with enable = true in each active AWS region. GuardDuty provides continuous threat detection and is a foundational security detective control.
  expected: 'true'
  remediation: Create an aws_guardduty_detector resource with enable = true in each active AWS region. For multi-account environments, configure GuardDuty at the organization level using aws_guardduty_organization_configuration to automatically enable GuardDuty in all existing and future member accounts.\n
  example:
    compliant: "resource \"aws_guardduty_detector\" \"main\" {\n  enable = true\n  datasources {\n    s3_logs { enable = true }\n    kubernetes { audit_logs { enable = true } }\n    malware_protection { scan_ec2_instance_with_findings { ebs_volumes { enable = true } } }\n  }\n}\n"
    non_compliant: "resource \"aws_guardduty_detector\" \"main\" {\n  enable = false  # WAF-SEC-080 violation: GuardDuty must be enabled\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_guardduty_detector
  assertions:
  - attribute: enable
    op: is_true
    message: GuardDuty detector must be enabled (enable = true).
  on_fail: violation
- id: waf-sec-080.tf.aws.securityhub-enabled
  engine: terraform
  automated: true
  title: AWS Security Hub must be enabled
  provider: aws
  description: An aws_securityhub_account resource must exist to enable Security Hub in the account, providing centralized aggregation of security findings from GuardDuty, Amazon Inspector, AWS Config, Macie, and other integrated services.
  expected: 'true'
  remediation: 'Add an aws_securityhub_account resource to the Terraform configuration. After enabling Security Hub, activate standards using aws_securityhub_standards_subscription: - arn:aws:securityhub:::ruleset/cis-aws-foundations-benchmark/v/1.4.0 - arn:aws:securityhub:REGION::standards/aws-foundational-security-best-practices/v/1.0.0\n'
  example:
    compliant: "resource \"aws_securityhub_account\" \"main\" {}\nresource \"aws_securityhub_standards_subscription\" \"cis\" {\n  standards_arn = \"arn:aws:securityhub:::ruleset/cis-aws-foundations-benchmark/v/1.4.0\"\n  depends_on    = [aws_securityhub_account.main]\n}\nresource \"aws_securityhub_standards_subscription\" \"fsbp\" {\n  standards_arn = \"arn:aws:securityhub:${data.aws_region.current.name}::standards/aws-foundational-security-best-practices/v/1.0.0\"\n  depends_on    = [aws_securityhub_account.main]\n}\n"
    non_compliant: '# aws_securityhub_account resource absent – WAF-SEC-080 violation

      # Security Hub is not enabled in this account

      '
  scope:
    block_type: resource
    resource_types:
    - aws_securityhub_account
  assertions:
  - attribute: ''
    op: block_exists
    message: AWS Security Hub must be enabled (aws_securityhub_account resource must exist).
  on_fail: violation
- id: waf-sec-080.tf.azurerm.sentinel-enabled
  engine: terraform
  automated: true
  title: Azure Sentinel must be onboarded to a Log Analytics workspace
  provider: azurerm
  description: An azurerm_sentinel_log_analytics_workspace_onboarding resource must exist so that Azure Sentinel can centrally collect, detect, and investigate security events across the subscription.
  expected: 'true'
  remediation: Create a Log Analytics workspace and onboard it to Sentinel using azurerm_sentinel_log_analytics_workspace_onboarding. Configure data connectors for Azure Activity, Microsoft Entra ID, and any workload-specific sources.\n
  example:
    compliant: "resource \"azurerm_log_analytics_workspace\" \"sec\" {\n  name                = \"sec-workspace\"\n  location            = azurerm_resource_group.sec.location\n  resource_group_name = azurerm_resource_group.sec.name\n  sku                 = \"PerGB2018\"\n}\n\nresource \"azurerm_sentinel_log_analytics_workspace_onboarding\" \"sec\" {\n  workspace_id = azurerm_log_analytics_workspace.sec.id\n}\n"
    non_compliant: '# No azurerm_sentinel_log_analytics_workspace_onboarding resource exists.

      # WAF-SEC-080 violation: Azure Sentinel is not enabled for threat detection

      '
  scope:
    block_type: resource
    resource_types:
    - azurerm_sentinel_log_analytics_workspace_onboarding
  assertions:
  - attribute: workspace_id
    op: attribute_exists
    message: Azure Sentinel onboarding must reference a Log Analytics workspace ID.
  on_fail: violation
- id: waf-sec-080.tf.azurerm.security-center-standard
  engine: terraform
  automated: true
  title: Microsoft Defender for Cloud must be enabled at standard tier
  provider: azurerm
  description: An azurerm_security_center_subscription_pricing resource must exist with tier set to "Standard" to enable Microsoft Defender for Cloud threat detection and secure score recommendations.
  expected: 'true'
  remediation: Create azurerm_security_center_subscription_pricing with tier = "Standard" for the relevant resource types (e.g., VirtualMachines, SqlServers, ContainerRegistries). Ensure all active resource types are covered.\n
  example:
    compliant: "resource \"azurerm_security_center_subscription_pricing\" \"main\" {\n  tier = \"Standard\"\n}\n"
    non_compliant: "resource \"azurerm_security_center_subscription_pricing\" \"main\" {\n  tier = \"Free\"  # WAF-SEC-080 violation: Defender for Cloud standard tier required\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_security_center_subscription_pricing
  assertions:
  - attribute: tier
    op: equals
    message: Microsoft Defender for Cloud must be enabled at Standard tier.
    expected: Standard
  on_fail: violation
- id: waf-sec-080.tf.google.logging-project-sink
  engine: terraform
  automated: true
  title: GCP audit logs must be exported to a persistent destination
  provider: google
  description: A google_logging_project_sink resource must exist to route GCP audit logs to Cloud Logging, BigQuery, Cloud Storage, or Pub/Sub for long-term retention and analysis.
  expected: 'true'
  remediation: Create a google_logging_project_sink with filter including audit log events and destination pointing to a secure BigQuery dataset or Cloud Storage bucket. Ensure the sink service account has appropriate permissions.\n
  example:
    compliant: "resource \"google_logging_project_sink\" \"audit\" {\n  name        = \"audit-logs-to-bigquery\"\n  destination = \"bigquery.googleapis.com/projects/${var.project_id}/datasets/audit_logs\"\n  filter      = \"protoPayload.@type=\\\"type.googleapis.com/google.cloud.audit.AuditLog\\\"\"\n\n  unique_writer_identity = true\n}\n"
    non_compliant: '# No google_logging_project_sink routes audit logs to a persistent store.

      # WAF-SEC-080 violation: GCP audit logs lack central export

      '
  scope:
    block_type: resource
    resource_types:
    - google_logging_project_sink
  assertions:
  - attribute: destination
    op: attribute_exists
    message: GCP logging sink must define a persistent destination for audit logs.
  on_fail: violation
- id: waf-sec-080.tf.google.security-command-center
  engine: terraform
  automated: true
  title: Google Security Command Center must be enabled
  provider: google
  description: A google_security_center_notification_config or google_scc_notification_config resource must exist to enable Security Command Center findings and centralize threat detection across the GCP organization.
  expected: 'true'
  remediation: Enable Security Command Center at the organization level and create a google_security_center_notification_config or google_scc_notification_config to route HIGH/CRITICAL findings to a Pub/Sub topic and on-call channel.\n
  example:
    compliant: "resource \"google_security_center_notification_config\" \"high_critical\" {\n  config_id    = \"high-critical-findings\"\n  organization = var.org_id\n  pubsub_topic = google_pubsub_topic.scc.id\n\n  streaming_config {\n    filter = \"severity = \\\"HIGH\\\" OR severity = \\\"CRITICAL\\\"\"\n  }\n}\n"
    non_compliant: '# No Security Command Center notification config exists.

      # WAF-SEC-080 violation: GCP threat detection not centralized

      '
  scope:
    block_type: resource
    resource_types:
    - google_security_center_notification_config
    - google_scc_notification_config
  assertions:
  - attribute: pubsub_topic
    op: attribute_exists
    message: Security Command Center notification config must route findings to a Pub/Sub topic.
  on_fail: violation
- id: waf-sec-080.tf.stackit.log-service-enabled
  engine: terraform
  automated: true
  title: STACKIT Log Service must collect audit and security logs
  provider: stackit
  description: A stackit_log_service resource must be configured to centralise audit and security logs from STACKIT workloads. Logs must be retained and protected from tampering.
  expected: 'true'
  remediation: Create a stackit_log_service instance and configure workload integrations to forward security-relevant logs. Define retention and access controls.\n
  example:
    compliant: "resource \"stackit_log_service\" \"security\" {\n  project_id = var.stackit_project_id\n  name       = \"security-logs\"\n}\n"
    non_compliant: '# No stackit_log_service centralises STACKIT security logs.

      # WAF-SEC-080 violation: logging not centralised

      '
  scope:
    block_type: resource
    resource_types:
    - stackit_log_service
  assertions:
  - attribute: name
    op: attribute_exists
    message: STACKIT Log Service must be configured for security log collection.
  on_fail: violation
- id: waf-sec-080.config.ovh.ovh-identity-access
  engine: config
  automated: true
  title: OVHcloud workloads must centralise audit and security logs
  provider: ovh
  description: A version-controlled policy document must exist at `docs/security/waf-sec-080-ovh-identity-access.md` and document the OVHcloud implementation of this control. The checker validates that the file exists and contains a normative requirement statement (MUST/SHALL/required/mandatory).
  expected: 'true'
  remediation: 'Create or update `docs/security/waf-sec-080-ovh-identity-access.md`. State the requirement, how it is implemented for OVHcloud, the review cadence, and the owner.

    '
  example:
    compliant: '|

      docs/security/waf-sec-080-ovh-identity-access.md:

      - The OVHcloud implementation of WAF-SEC-080 is documented.

      - Implementation status and owner are recorded.

      - Review cadence is defined (e.g. quarterly).

      '
    non_compliant: '|

      # `docs/security/waf-sec-080-ovh-identity-access.md` is missing or does not contain a normative requirement.

      # WAF-SEC-080 violation: OVHcloud control is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/security/waf-sec-080-ovh-identity-access.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/security/waf-sec-080-ovh-identity-access.md` must contain a normative requirement statement.
  on_fail: violation
- id: waf-sec-080.tf.hcloud.server-backups-and-logs
  engine: terraform
  automated: true
  title: Hetzner Cloud servers must have backup and log forwarding enabled
  provider: hcloud
  description: Hetzner Cloud production servers must have backups enabled and forward security logs to a centralised store. Backup and log retention must be defined.
  expected: 'true'
  remediation: Enable backups on hcloud_server resources and configure log forwarding via cloud-init or configuration management. Document retention and alerting.\n
  example:
    compliant: "resource \"hcloud_server\" \"app\" {\n  name        = \"app-server\"\n  server_type = \"cx22\"\n  image       = \"ubuntu-22.04\"\n  backups     = true\n  # Log forwarding configured via cloud-init\n}\n"
    non_compliant: "resource \"hcloud_server\" \"app\" {\n  name        = \"app-server\"\n  server_type = \"cx22\"\n  image       = \"ubuntu-22.04\"\n  backups     = false  # WAF-SEC-080 violation: backups disabled\n}\n"
  scope:
    block_type: resource
    resource_types:
    - hcloud_server
  assertions:
  - attribute: backups
    op: is_true
    message: Hetzner Cloud production server must have backups enabled for log and state retention.
  on_fail: finding
