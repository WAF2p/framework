checks:
  - id: waf-sec-080.tf.aws.cloudtrail-multi-region
    engine: terraform
    automated: true
    title: 'CloudTrail must be enabled as a multi-region trail with log file validation'
    provider: aws
    description: 'An aws_cloudtrail resource must exist with is_multi_region_trail = true, enable_log_file_validation = true, and include_global_service_events = true to ensure complete API activity coverage across all regions and global services.'
    expected: 'true'
    remediation: 'Set is_multi_region_trail = true, enable_log_file_validation = true, and include_global_service_events = true on the aws_cloudtrail resource. Ensure the trail S3 bucket has SSE-KMS encryption and is not publicly accessible.\n'
    example:
      compliant: |
        resource "aws_cloudtrail" "main" {
          name                          = "org-cloudtrail"
          s3_bucket_name                = aws_s3_bucket.cloudtrail_logs.id
          is_multi_region_trail         = true
          enable_log_file_validation    = true
          include_global_service_events = true
          kms_key_id                    = aws_kms_key.cloudtrail.arn
          tags = {
            owner       = "security-team"
            environment = "all"
          }
        }
        
      non_compliant: |
        resource "aws_cloudtrail" "main" {
          name                          = "org-cloudtrail"
          s3_bucket_name                = aws_s3_bucket.cloudtrail_logs.id
          is_multi_region_trail         = false  # WAF-SEC-080 violation
          enable_log_file_validation    = false  # WAF-SEC-080 violation
          include_global_service_events = false  # WAF-SEC-080 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudtrail
    assertions:
      - attribute: 'is_multi_region_trail'
        op: 'is_true'
        message: 'CloudTrail must be a multi-region trail to capture API activity in all regions.'
      - attribute: 'enable_log_file_validation'
        op: 'is_true'
        message: 'CloudTrail log file validation must be enabled to detect log tampering.'
      - attribute: 'include_global_service_events'
        op: 'is_true'
        message: 'CloudTrail must include global service events (e.g., IAM API calls).'
    on_fail: violation
  - id: waf-sec-080.tf.aws.guardduty-enabled
    engine: terraform
    automated: true
    title: 'GuardDuty must be enabled in all active regions'
    provider: aws
    description: 'An aws_guardduty_detector resource must exist with enable = true in each active AWS region. GuardDuty provides continuous threat detection and is a foundational security detective control.'
    expected: 'true'
    remediation: 'Create an aws_guardduty_detector resource with enable = true in each active AWS region. For multi-account environments, configure GuardDuty at the organization level using aws_guardduty_organization_configuration to automatically enable GuardDuty in all existing and future member accounts.\n'
    example:
      compliant: |
        resource "aws_guardduty_detector" "main" {
          enable = true
          datasources {
            s3_logs { enable = true }
            kubernetes { audit_logs { enable = true } }
            malware_protection { scan_ec2_instance_with_findings { ebs_volumes { enable = true } } }
          }
        }
        
      non_compliant: |
        resource "aws_guardduty_detector" "main" {
          enable = false  # WAF-SEC-080 violation: GuardDuty must be enabled
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_guardduty_detector
    assertions:
      - attribute: 'enable'
        op: 'is_true'
        message: 'GuardDuty detector must be enabled (enable = true).'
    on_fail: violation
  - id: waf-sec-080.tf.aws.securityhub-enabled
    engine: terraform
    automated: true
    title: 'AWS Security Hub must be enabled'
    provider: aws
    description: 'An aws_securityhub_account resource must exist to enable Security Hub in the account, providing centralized aggregation of security findings from GuardDuty, Amazon Inspector, AWS Config, Macie, and other integrated services.'
    expected: 'true'
    remediation: 'Add an aws_securityhub_account resource to the Terraform configuration. After enabling Security Hub, activate standards using aws_securityhub_standards_subscription: - arn:aws:securityhub:::ruleset/cis-aws-foundations-benchmark/v/1.4.0 - arn:aws:securityhub:REGION::standards/aws-foundational-security-best-practices/v/1.0.0\n'
    example:
      compliant: |
        resource "aws_securityhub_account" "main" {}
        resource "aws_securityhub_standards_subscription" "cis" {
          standards_arn = "arn:aws:securityhub:::ruleset/cis-aws-foundations-benchmark/v/1.4.0"
          depends_on    = [aws_securityhub_account.main]
        }
        resource "aws_securityhub_standards_subscription" "fsbp" {
          standards_arn = "arn:aws:securityhub:${data.aws_region.current.name}::standards/aws-foundational-security-best-practices/v/1.0.0"
          depends_on    = [aws_securityhub_account.main]
        }
        
      non_compliant: |
        # aws_securityhub_account resource absent – WAF-SEC-080 violation
        # Security Hub is not enabled in this account
        
    scope:
      block_type: resource
      resource_types:
        - aws_securityhub_account
    assertions:
      - attribute: ''
        op: 'block_exists'
        message: 'AWS Security Hub must be enabled (aws_securityhub_account resource must exist).'
    on_fail: violation
