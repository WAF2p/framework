id: WAF-SOV-050
title: For all data classes, the key ownership model MUST be explicitly defined and...
status: active
tags:
- sovereign
- critical
- governance
pillar: sovereign
severity: critical
type:
- governance
category: encryption-key-management
rationale: 'Weak or centralized key management enables decryption by attackers, insider threats, and compliance violations. This control addresses the requirements of the ''Encryption Key Management'' area and ensures that For all data classes, the key ownership model MUST be explicitly defined and technically enforced: Provider-Managed Keys (PMK), Customer-Managed Keys (CMK),.'
threat:
- Sensitive data is exposed if storage or transport lacks strong encryption.
- Compromised keys or weak key rotation extend the blast radius of a breach.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Implementation is regularly reviewed and evidenced in reviews.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-sovereign/pages/controls/WAF-SOV-050.adoc
  related_controls:
  - WAF-SOV-060
  - WAF-SOV-020
  - WAF-SOV-070
  - WAF-SOV-010
  - WAF-SOV-090
  - WAF-SEC-010
  - WAF-SEC-020
  - WAF-SEC-060
  - WAF-AGN-010
  - WAF-AGN-080
  - WAF-COST-010
  - WAF-COST-040
description: 'For all data classes, the key ownership model MUST be explicitly defined and technically enforced: Provider-Managed Keys (PMK), Customer-Managed Keys (CMK), Bring Your Own Key (BYOK), or Hold Your Own Key (HYOK). Key rotation and deletion MUST be governed by documented procedures. All data at rest MUST be encrypted; encryption with default provider-managed keys requires explicit approval for sensitive data classes.

  '
regulatory_mapping:
- framework: GDPR
  controls:
  - Art. 32 – Security of processing (encryption as a technical measure)
  - Art. 17 – Right to erasure (cryptographic erasure via key deletion)
- framework: BSI C5:2020
  controls:
  - CRY-01 – Cryptography policy
  - CRY-02 – Key management
- framework: BSI C3A:2026
  controls:
  - 'Dimension 4 – Data: Key ownership model (CMK/BYOK/HYOK)'
  - 'Dimension 4 – Data: External key management'
  - 'Dimension 4 – Data: Client-side encryption'
- framework: EUCS (ENISA)
  controls:
  - CRY-01 – Encryption at rest
  - CRY-03 – Key management
  - SOV-03 – Customer key control
- framework: ISO 27001:2022
  controls:
  - A.8.24 – Use of cryptography
  - A.8.25 – Secure development life cycle
- framework: GAIA-X
  controls:
  - Sovereign Cloud – Cryptographic self-determination
checks:
- id: waf-sov-050.tf.aws.kms-key-rotation-enabled
  engine: terraform
  automated: true
  title: AWS KMS CMKs must have automatic key rotation enabled
  provider: aws
  description: All customer-managed KMS keys must have enable_key_rotation = true to ensure key material is automatically rotated annually, limiting the impact of key compromise.
  expected: 'true'
  remediation: Set enable_key_rotation = true on all aws_kms_key resources.\n
  example:
    compliant: "resource \"aws_kms_key\" \"sovereign\" {\n  description             = \"Sovereign data encryption key\"\n  enable_key_rotation     = true\n  deletion_window_in_days = 30\n  policy                  = data.aws_iam_policy_document.kms_policy.json\n}\n"
    non_compliant: "resource \"aws_kms_key\" \"data\" {\n  description = \"Data key\"\n  # enable_key_rotation defaults to false\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_kms_key
  assertions:
  - attribute: enable_key_rotation
    op: is_true
    message: KMS key must have enable_key_rotation = true.
  on_fail: violation
- id: waf-sov-050.tf.aws.kms-key-deletion-window
  engine: terraform
  automated: true
  title: KMS key deletion window must be explicitly set (>= 14 days)
  provider: aws
  description: KMS keys must have deletion_window_in_days explicitly set to at least 14 days to prevent accidental key destruction and allow time for review and cancellation.
  expected: 'true'
  remediation: Set deletion_window_in_days >= 14 on all KMS keys.\n
  example:
    compliant: "resource \"aws_kms_key\" \"sovereign\" {\n  deletion_window_in_days = 30\n}\n"
    non_compliant: "resource \"aws_kms_key\" \"sovereign\" {\n  deletion_window_in_days = 7  # Too short for safe review\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_kms_key
  assertions:
  - attribute: deletion_window_in_days
    op: attribute_exists
    message: KMS key is missing explicit deletion_window_in_days.
  - attribute: deletion_window_in_days
    op: greater_than_or_equal
    message: KMS key deletion_window_in_days must be >= 14 days.
    expected: 14
  on_fail: violation
- id: waf-sov-050.tf.aws.s3-bucket-kms-encryption
  engine: terraform
  automated: true
  title: S3 buckets must use KMS (CMK) encryption, not AES256
  provider: aws
  description: S3 buckets containing sovereign data must use aws:kms encryption with a customer-managed key, not the default AES256 (SSE-S3) which uses provider-managed keys.
  expected: 'true'
  remediation: Set sse_algorithm = "aws:kms" and specify kms_master_key_id pointing to a CMK.\n
  example:
    compliant: "resource \"aws_s3_bucket_server_side_encryption_configuration\" \"sovereign\" {\n  bucket = aws_s3_bucket.data.id\n  rule {\n    apply_server_side_encryption_by_default {\n      sse_algorithm     = \"aws:kms\"\n      kms_master_key_id = aws_kms_key.sovereign.arn\n    }\n    bucket_key_enabled = true\n  }\n}\n"
    non_compliant: "resource \"aws_s3_bucket_server_side_encryption_configuration\" \"data\" {\n  bucket = aws_s3_bucket.data.id\n  rule {\n    apply_server_side_encryption_by_default {\n      sse_algorithm = \"AES256\"  # Provider-managed key – not sovereign\n    }\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_s3_bucket_server_side_encryption_configuration
  assertions:
  - attribute: rule.apply_server_side_encryption_by_default.sse_algorithm
    op: equals
    message: S3 bucket must use 'aws:kms' encryption, not 'AES256' (provider-managed keys).
    expected: aws:kms
  - attribute: rule.apply_server_side_encryption_by_default.kms_master_key_id
    op: attribute_exists
    message: S3 KMS encryption must reference a specific CMK, not the default AWS managed key.
  on_fail: violation
- id: waf-sov-050.tf.aws.ebs-volume-encrypted
  engine: terraform
  automated: true
  title: EBS volumes must be encrypted
  provider: aws
  description: All EBS volumes must have encrypted = true. This should reference a CMK for sovereign workloads rather than using the default AWS managed key.
  expected: 'true'
  remediation: Set encrypted = true and optionally kms_key_id = <cmk_arn> on EBS volumes.\n
  example:
    compliant: "resource \"aws_ebs_volume\" \"data\" {\n  availability_zone = \"eu-central-1a\"\n  size              = 100\n  encrypted         = true\n  kms_key_id        = aws_kms_key.sovereign.arn\n}\n"
    non_compliant: "resource \"aws_ebs_volume\" \"data\" {\n  availability_zone = \"eu-central-1a\"\n  size              = 100\n  # encrypted defaults to false\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_ebs_volume
    - aws_instance
  assertions:
  - attribute: encrypted
    op: is_true
    message: EBS volume must have encrypted = true.
  on_fail: violation
- id: waf-sov-050.tf.aws.rds-storage-encrypted
  engine: terraform
  automated: true
  title: RDS instances must have storage encryption enabled
  provider: aws
  description: All RDS instances and Aurora clusters must have storage_encrypted = true. KMS key ID should reference a CMK for sovereign workloads.
  expected: 'true'
  remediation: Set storage_encrypted = true and optionally kms_key_id on all RDS resources.\n
  example:
    compliant: "resource \"aws_db_instance\" \"sovereign\" {\n  storage_encrypted = true\n  kms_key_id        = aws_kms_key.rds.arn\n}\n"
    non_compliant: "resource \"aws_db_instance\" \"db\" {\n  # storage_encrypted defaults to false\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_db_instance
    - aws_rds_cluster
  assertions:
  - attribute: storage_encrypted
    op: is_true
    message: RDS storage_encrypted must be true.
  on_fail: violation
- id: waf-sov-050.tf.azurerm.key-vault-soft-delete
  engine: terraform
  automated: true
  title: Azure Key Vault must have soft delete and purge protection enabled
  provider: azurerm
  description: Azure Key Vaults used for CMK storage must have soft_delete_retention_days >= 7 and purge_protection_enabled = true to prevent accidental key destruction.
  expected: 'true'
  remediation: Enable purge_protection_enabled = true and set soft_delete_retention_days >= 14.\n
  example:
    compliant: "resource \"azurerm_key_vault\" \"sovereign\" {\n  name                       = \"kv-sovereign-prod\"\n  location                   = var.azure_location\n  resource_group_name        = azurerm_resource_group.main.name\n  sku_name                   = \"premium\"\n  soft_delete_retention_days = 90\n  purge_protection_enabled   = true\n}\n"
    non_compliant: "resource \"azurerm_key_vault\" \"kv\" {\n  name     = \"kv-prod\"\n  sku_name = \"standard\"\n  # purge_protection_enabled defaults to false\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_key_vault
  assertions:
  - attribute: purge_protection_enabled
    op: is_true
    message: Azure Key Vault must have purge_protection_enabled = true.
  - attribute: soft_delete_retention_days
    op: greater_than_or_equal
    message: Key Vault soft_delete_retention_days must be >= 14.
    expected: 14
  on_fail: violation
- id: waf-sov-050.tf.stackit.key-rotation-enabled
  engine: terraform
  automated: true
  title: StackIT secret manager keys must have automatic rotation enabled
  provider: stackit
  description: StackIT Secret Manager secrets must have rotation policies configured. Automatic key rotation limits the impact of key compromise.
  expected: 'true'
  remediation: Configure rotation policies on all StackIT Secret Manager resources with enable_key_rotation = true.\n
  example:
    compliant: "resource \"stackit_secret_manager\" \"sovereign\" {\n  project_id = stackit_project.main.id\n  name       = \"sovereign-secrets\"\n  rotation {\n    enabled = true\n    interval_days = 90\n  }\n}\n"
    non_compliant: "resource \"stackit_secret_manager\" \"secrets\" {\n  project_id = stackit_project.main.id\n  name       = \"secrets\"\n  # No rotation configured\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_secret_manager
  assertions:
  - attribute: rotation.enabled
    op: is_true
    message: StackIT Secret Manager must have rotation.enabled = true.
  on_fail: violation
- id: waf-sov-050.tf.ovh.key-rotation-enabled
  engine: terraform
  automated: true
  title: OVH secret manager keys must have rotation configured
  provider: ovh
  description: OVH secret manager secrets must have rotation policies configured for sovereign compliance.
  expected: 'true'
  remediation: Configure rotation policies on all OVH secret manager resources.\n
  example:
    compliant: '# OVH secret manager with rotation enabled

      '
    non_compliant: '# No rotation policy configured

      '
  scope:
    block_type: resource
    resource_types:
    - ovh_secret_manager_secret
  assertions:
  - attribute: rotation
    op: block_exists
    message: OVH secret manager must have rotation policy configured.
  on_fail: violation
- id: waf-sov-050.tf.hcloud.key-rotation-enabled
  engine: terraform
  automated: true
  title: Hetzner Cloud secret store keys must have rotation configured
  provider: hcloud
  description: Hetzner Cloud secret manager must have rotation policies configured for sovereign compliance.
  expected: 'true'
  remediation: Configure rotation policies on all Hetzner Cloud secret resources.\n
  example:
    compliant: '# Hetzner Cloud secret store with rotation enabled

      '
    non_compliant: '# No rotation policy configured

      '
  scope:
    block_type: resource
    resource_types:
    - hcloud_server
  assertions:
  - attribute: labels
    op: key_exists
    key: rotation-enabled
    message: Hetzner Cloud secrets must have rotation policy configured (add rotation-enabled label).
  on_fail: advisory
- id: waf-sov-050.tf.google.kms-key-location-and-rotation
  engine: terraform
  automated: true
  title: GCP KMS keys must be in approved sovereign locations with rotation enabled
  provider: google
  description: GCP Cloud KMS key rings and crypto keys used for sovereign data must be located in approved regions and have rotation periods configured. Customer-managed keys must be used for sensitive data classes.
  expected: 'true'
  remediation: 'Create google_kms_key_ring in an approved sovereign location, set google_kms_crypto_key.rotation_period to at most 7776000 seconds (90 days), and use customer-managed keys for storage and database resources.

    '
  example:
    compliant: "resource \"google_kms_key_ring\" \"sovereign\" {\n  name     = \"sovereign-keyring\"\n  location = \"europe-west3\"\n}\n\nresource \"google_kms_crypto_key\" \"data\" {\n  name            = \"data-encryption-key\"\n  key_ring        = google_kms_key_ring.sovereign.id\n  rotation_period = \"7776000s\"\n}\n"
    non_compliant: "resource \"google_kms_key_ring\" \"sovereign\" {\n  name     = \"sovereign-keyring\"\n  location = \"us-central1\"\n}\n\nresource \"google_kms_crypto_key\" \"data\" {\n  name            = \"data-encryption-key\"\n  key_ring        = google_kms_key_ring.sovereign.id\n  # rotation_period not set\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_kms_crypto_key
  assertions:
  - attribute: key_ring
    op: matches
    pattern: europe-(west3|west1|north1|central2)
    message: KMS crypto key must belong to a key ring in an approved sovereign location.
  - attribute: rotation_period
    op: attribute_exists
    message: KMS crypto key must have a rotation_period configured.
  on_fail: violation
