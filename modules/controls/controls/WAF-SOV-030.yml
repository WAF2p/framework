id: WAF-SOV-030
title: Backup policies MUST explicitly define region/location constraints, minimum...
status: active
tags:
- sovereign
- high
- configuration
pillar: sovereign
severity: high
type:
- configuration
category: logging-monitoring
rationale: Unzureichende Beobachtbarkeit verzögert die Erkennung von Incidents, erschwert die Fehleranalyse und verhindert wirksame Audit-Nachweise. Dieses Control adressiert die Anforderungen des Bereichs 'Logging und Monitoring' und stellt sicher, dass Backup policies MUST explicitly define region/location constraints, minimum retention periods, and restore-test schedules.
threat:
- Data loss or ransomware impact is magnified when recovery points are absent.
- Regulatory recovery-time requirements may be missed without tested backups.
implementation_guidance:
- Implement the required configuration as code in Terraform or equivalent IaC.
- Add an automated check to CI/CD so deviations are caught before deployment.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - Die Anforderung ist nicht einheitlich umgesetzt; Nachweis existiert nur punktuell oder fehlt.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - Die Anforderung ist dokumentiert; erste Ressourcen zeigen die gewünschte Konfiguration.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform-Checks oder IaC-Gates prüfen die Anforderung automatisch in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Abdeckung, Ausnahmen und Qualitätsmetriken werden quartalsweise berichtet.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Die Effektivität wird kontinuierlich gemessen und automatisch optimiert.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-sovereign/pages/controls/WAF-SOV-030.adoc
  related_controls:
  - WAF-SOV-080
  - WAF-SOV-100
  - WAF-REL-010
  - WAF-SOV-020
  - WAF-AGN-040
  - WAF-AGN-050
  - WAF-COST-020
  - WAF-OPS-030
  - WAF-OPS-040
  - WAF-OPS-090
  - WAF-PERF-020
  - WAF-PERF-040
description: 'Backup policies MUST explicitly define region/location constraints, minimum retention periods, and restore-test schedules. Cross-region replication MUST be explicitly configured and documented with an approved sovereign destination. Backup storage MUST remain within the same jurisdictional boundary as primary data unless explicitly approved and documented.

  '
regulatory_mapping:
- framework: GDPR
  controls:
  - Art. 5(1)(e) – Storage limitation
  - Art. 32 – Security of processing (availability and resilience)
  - Art. 44-46 – Transfers to third countries
- framework: BSI C5:2020
  controls:
  - OPS-04 – Data management
  - BCM-01 – Business continuity
- framework: BSI C3A:2026
  controls:
  - 'Dimension 4 – Data: Backup location and residency'
  - 'Dimension 6 – Supply Chain: Backup provider inventory'
- framework: EUCS (ENISA)
  controls:
  - BCR-01 – Backup policy
  - DSP-04 – Data portability
- framework: ISO 27001:2022
  controls:
  - A.8.13 – Information backup
  - A.5.29 – Information security during disruption
checks:
- id: waf-sov-030.tf.aws.db-instance-backup-retention
  engine: terraform
  automated: true
  title: RDS instance backup retention must be >= 7 days
  provider: aws
  description: AWS RDS instances must have backup_retention_period set to at least 7 days to meet minimum recovery requirements for sovereign data stores.
  expected: 'true'
  remediation: Set backup_retention_period to at least 7 (days) on all production RDS instances and 30 days for instances processing PII or financial data.\n
  example:
    compliant: "resource \"aws_db_instance\" \"main\" {\n  identifier             = \"prod-db\"\n  engine                 = \"postgres\"\n  backup_retention_period = 30\n  backup_window          = \"03:00-04:00\"\n  # ...\n}\n"
    non_compliant: "resource \"aws_db_instance\" \"main\" {\n  identifier             = \"prod-db\"\n  engine                 = \"postgres\"\n  backup_retention_period = 0  # Backups disabled\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_db_instance
  assertions:
  - attribute: backup_retention_period
    op: attribute_exists
    message: aws_db_instance is missing 'backup_retention_period' attribute.
  - attribute: backup_retention_period
    op: greater_than_or_equal
    message: RDS backup_retention_period must be >= 7 days for sovereign compliance.
    expected: 7
  on_fail: violation
- id: waf-sov-030.tf.aws.rds-cluster-backup-retention
  engine: terraform
  automated: true
  title: Aurora cluster backup retention must be >= 7 days
  provider: aws
  description: AWS RDS Aurora clusters must have backup_retention_period set to at least 7 days.
  expected: 'true'
  remediation: Set backup_retention_period >= 7 on all Aurora clusters.\n
  example:
    compliant: "resource \"aws_rds_cluster\" \"main\" {\n  backup_retention_period = 14\n  preferred_backup_window = \"02:00-03:00\"\n}\n"
    non_compliant: "resource \"aws_rds_cluster\" \"main\" {\n  backup_retention_period = 1\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_rds_cluster
  assertions:
  - attribute: backup_retention_period
    op: greater_than_or_equal
    message: Aurora cluster backup_retention_period must be >= 7 days.
    expected: 7
  on_fail: violation
- id: waf-sov-030.tf.aws.dynamodb-pitr-enabled
  engine: terraform
  automated: true
  title: DynamoDB tables must have point-in-time recovery enabled
  provider: aws
  description: DynamoDB tables storing sovereign data must have point_in_time_recovery enabled to allow restoration to any point in the last 35 days.
  expected: 'true'
  remediation: Add a point_in_time_recovery block with enabled = true to all DynamoDB tables.\n
  example:
    compliant: "resource \"aws_dynamodb_table\" \"sovereign\" {\n  name = \"sovereign-table\"\n  point_in_time_recovery {\n    enabled = true\n  }\n}\n"
    non_compliant: "resource \"aws_dynamodb_table\" \"sovereign\" {\n  name = \"sovereign-table\"\n  # No PITR configured\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_dynamodb_table
  assertions:
  - attribute: point_in_time_recovery.enabled
    op: is_true
    message: DynamoDB table must have point_in_time_recovery.enabled = true.
  on_fail: violation
- id: waf-sov-030.tf.aws.backup-vault-in-approved-region
  engine: terraform
  automated: true
  title: AWS Backup vault must be in an approved sovereign region
  provider: aws
  description: AWS Backup vault configurations must not target non-sovereign regions. Any aws_backup_copy_action destination vault must be verified against the approved region list.
  expected: 'true'
  remediation: Ensure all backup copy action destination vaults reference backup vaults in approved sovereign regions only.\n
  scope:
    block_type: resource
    resource_types:
    - aws_backup_plan
  assertions:
  - attribute: rule.copy_action.destination_vault_arn
    op: matches
    message: Backup copy action destination vault is in a non-approved region.
    pattern: arn:aws:[^:]*:([a-z0-9-]+):.*
  on_fail: violation
- id: waf-sov-030.tf.azurerm.recovery-vault-location
  engine: terraform
  automated: true
  title: Azure Recovery Services vault must be in approved location
  provider: azurerm
  description: Azure Recovery Services vaults used for backups must have their 'location' set to an approved sovereign region.
  expected: 'true'
  remediation: Move the Recovery Services vault to an approved sovereign Azure location.\n
  example:
    compliant: "resource \"azurerm_recovery_services_vault\" \"backup\" {\n  name                = \"rsv-sovereign-prod\"\n  location            = \"germanywestcentral\"\n  resource_group_name = azurerm_resource_group.main.name\n  sku                 = \"Standard\"\n  soft_delete_enabled = true\n}\n"
    non_compliant: "resource \"azurerm_recovery_services_vault\" \"backup\" {\n  name     = \"rsv-prod\"\n  location = \"eastus\"  # Non-sovereign location\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_recovery_services_vault
  assertions:
  - attribute: location
    op: in
    expected:
    - germanywestcentral
    - westeurope
    - northeurope
    - switzerlandnorth
    - francecentral
    message: Azure Recovery Services vault location is not in the approved sovereign locations list.
  on_fail: violation
- id: waf-sov-030.tf.aws.s3-versioning-enabled
  engine: terraform
  automated: true
  title: S3 buckets storing backup data should have versioning enabled
  provider: aws
  description: S3 buckets used as backup destinations must have versioning enabled to protect against accidental deletion and support point-in-time recovery.
  expected: 'true'
  remediation: Enable versioning on S3 buckets used for backup or sovereign data storage.\n
  example:
    compliant: "resource \"aws_s3_bucket_versioning\" \"backup\" {\n  bucket = aws_s3_bucket.backup.id\n  versioning_configuration {\n    status = \"Enabled\"\n  }\n}\n"
    non_compliant: "resource \"aws_s3_bucket_versioning\" \"backup\" {\n  bucket = aws_s3_bucket.backup.id\n  versioning_configuration {\n    status = \"Suspended\"\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_s3_bucket_versioning
  assertions:
  - attribute: versioning_configuration.status
    op: equals
    message: S3 bucket versioning must be Enabled for backup/sovereign data stores.
    expected: Enabled
  on_fail: advisory
- id: waf-sov-030.tf.stackit.backup-retention
  engine: terraform
  automated: true
  title: StackIT database instances must have backup retention enabled
  provider: stackit
  description: StackIT MySQL, Redis, OpenSearch instances must have backup retention configured. Backups must remain within approved sovereign regions.
  expected: 'true'
  remediation: Configure backup_retention_period on all StackIT database resources and ensure backups are stored in approved sovereign regions (eu-central-1, eu-west-1).\n
  example:
    compliant: "resource \"stackit_mysql_instance\" \"main\" {\n  project_id     = stackit_project.main.id\n  name           = \"sovereign-mysql\"\n  backup_retention_period = 14\n  # backups stored in eu-central-1\n}\n"
    non_compliant: "resource \"stackit_mysql_instance\" \"main\" {\n  project_id = stackit_project.main.id\n  name       = \"mysql\"\n  # No backup retention configured\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_mysql_instance
    - stackit_redis_instance
    - stackit_opensearch_instance
  assertions:
  - attribute: backup_retention_period
    op: attribute_exists
    message: StackIT database instance is missing backup_retention_period.
  - attribute: backup_retention_period
    op: greater_than_or_equal
    message: StackIT backup_retention_period must be >= 7 days.
    expected: 7
  on_fail: violation
- id: waf-sov-030.tf.ovh.backup-location-sovereign
  engine: terraform
  automated: true
  title: OVH backups must remain in sovereign regions
  provider: ovh
  description: OVH cloud backups, VPS snapshots, and dedicated server backups must not be exported outside approved sovereign regions (DE, EU).
  expected: 'true'
  remediation: Configure OVH backup policies to restrict backup locations to sovereign regions and prevent cross-border data transfers.\n
  example:
    compliant: '# OVH backups configured to stay within DE-FRA and EU-CY regions

      # No export to non-sovereign regions like US-CA, SG, etc.

      '
    non_compliant: '# Backup exported to US region - GDPR violation

      '
  scope:
    block_type: resource
    resource_types:
    - ovh_cloud_project
    - ovh_vps
    - ovh_dedicated_server
  assertions:
  - attribute: backup_location
    op: in
    message: OVH backup location must be in approved sovereign regions only.
    expected:
    - eu-central-1
    - eu-west-1
    - eu-west-3
    - germanywestcentral
    - westeurope
    - northeurope
    - europe-west3
    - europe-west1
    - fsn1
    - hel1
    - de
    - fi
  on_fail: violation
- id: waf-sov-030.tf.hcloud.backup-location-sovereign
  engine: terraform
  automated: true
  title: Hetzner Cloud backups must remain in sovereign regions
  provider: hcloud
  description: Hetzner Cloud server backups, volume snapshots, and image exports must not be exported outside approved sovereign regions (DE, FI).
  expected: 'true'
  remediation: Configure Hetzner Cloud backup and snapshot policies to restrict locations to sovereign regions and prevent cross-border data transfers.\n
  example:
    compliant: '# Hetzner backups configured to stay within fsn1 (DE) and hel1 (FI) regions

      '
    non_compliant: '# Backup exported to non-sovereign region

      '
  scope:
    block_type: resource
    resource_types:
    - hcloud_server
    - hcloud_volume
    - hcloud_image
  assertions:
  - attribute: location
    op: in
    message: Hetzner Cloud backup location must be in approved sovereign regions only.
    expected:
    - eu-central-1
    - eu-west-1
    - eu-west-3
    - germanywestcentral
    - westeurope
    - northeurope
    - europe-west3
    - europe-west1
    - fsn1
    - hel1
    - de
    - fi
  on_fail: violation
- id: waf-sov-030.tf.google.sql-backup-location
  engine: terraform
  automated: true
  title: GCP Cloud SQL backups must be enabled and stored in approved sovereign locations
  provider: google
  description: GCP Cloud SQL instances storing sovereign data must have backup configuration enabled and the instance located in an approved sovereign region. Backup geo-redundancy must be disabled or explicitly approved for cross-border transfers.
  expected: 'true'
  remediation: 'Set settings.backup_configuration.enabled = true on google_sql_database_instance, choose an approved location (e.g., europe-west3), and disable settings.backup_configuration.geo_redundancy_enabled unless explicitly approved.

    '
  example:
    compliant: "resource \"google_sql_database_instance\" \"sovereign\" {\n  name             = \"sovereign-db\"\n  region           = \"europe-west3\"\n  database_version = \"POSTGRES_15\"\n  settings {\n    backup_configuration {\n      enabled                   = true\n      start_time                = \"03:00\"\n      geo_redundancy_enabled    = false\n    }\n  }\n}\n"
    non_compliant: "resource \"google_sql_database_instance\" \"sovereign\" {\n  name             = \"sovereign-db\"\n  region           = \"us-central1\"\n  database_version = \"POSTGRES_15\"\n  settings {\n    backup_configuration {\n      enabled = false\n    }\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_sql_database_instance
  assertions:
  - attribute: region
    op: in
    expected:
    - europe-west3
    - europe-west1
    - europe-north1
    - europe-central2
    message: Cloud SQL instance must be in an approved sovereign region.
  - attribute: settings.backup_configuration.enabled
    op: is_true
    message: Cloud SQL backup configuration must be enabled.
  - attribute: settings.backup_configuration.geo_redundancy_enabled
    op: is_false
    message: Cloud SQL backup geo-redundancy must be disabled unless explicitly approved for cross-border transfer.
  on_fail: violation
