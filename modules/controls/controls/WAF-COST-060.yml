id: WAF-COST-060
title: Monthly engineering-level FinOps reviews MUST take place for all production...
status: active
tags:
- cost
- medium
- governance
pillar: cost
severity: medium
type:
- governance
category: cost-governance
rationale: Lack of cost transparency and governance leads to budget overruns, cloud waste, and unaccountable spending. This
  control addresses the requirements of the 'Cost Governance' area and ensures that Monthly engineering-level FinOps reviews
  MUST take place for all production workloads.
threat:
- Uncontrolled cloud spend erodes budget and project viability.
- High lock-in or debt decisions are made without financial impact visibility.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Implementation is regularly reviewed and evidenced in reviews.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-cost/pages/controls/WAF-COST-060.adoc
  related_controls:
  - WAF-COST-050
  - WAF-COST-100
  - WAF-SUS-020
  - WAF-PERF-100
  - WAF-COST-020
  - WAF-COST-070
  - WAF-COST-010
  - WAF-COST-080
  - WAF-SUS-100
  - WAF-REL-010
  - WAF-AGN-040
  - WAF-AGN-050
description: 'Monthly engineering-level FinOps reviews MUST take place for all production workloads. Quarterly Architecture
  Board reviews covering cost debt and strategic cost decisions MUST occur. Review outputs (action items with owner and due
  date) MUST be documented in writing and accessible in the team''s task tracking system. Reviews are mandatory, not optional
  – absence of reviews is a control failure.

  '
regulatory_mapping:
- framework: FinOps Foundation
  controls:
  - Operate Phase – Review Cadence and Continuous Improvement
  - FinOps Principles – Teams Need Timely and Accurate Data
checks:
- id: waf-cost-060.tf.any.finops-review-tag-current
  engine: terraform
  automated: true
  title: Workload resources should have current 'last-finops-review' tag
  provider: any
  description: 'Workload infrastructure resources should carry a ''last-finops-review'' tag with the date (YYYY-MM-DD) of
    the last FinOps review. A stale review tag (> 45 days old) indicates the review cadence is not being maintained. This
    tag is a lightweight operational proof of an active review process.

    '
  expected: 'true'
  remediation: 'After each monthly FinOps review, update the ''last-finops-review'' tag on workload resources to the current
    date. This can be automated in CI as part of the review process. Value format: YYYY-MM-DD.

    '
  example:
    compliant: "resource \"aws_eks_cluster\" \"main\" {\n  name     = \"payment-service-prod\"\n  role_arn = aws_iam_role.eks.arn\n\
      \n  tags = merge(module.mandatory_tags.tags, {\n    last-finops-review   = \"2025-03-01\"\n    rightsizing-reviewed\
      \ = \"2025-03-01\"\n  })\n\n  version = \"1.29\"\n}\n"
    non_compliant: "resource \"aws_eks_cluster\" \"main\" {\n  name     = \"payment-service-prod\"\n  role_arn = aws_iam_role.eks.arn\n\
      \  # Missing last-finops-review tag – no evidence of review process\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_instance
    - aws_eks_cluster
    - aws_rds_cluster
    - azurerm_kubernetes_cluster
    - azurerm_virtual_machine_scale_set
    - google_container_cluster
    - stackit_project
    - ovh_cloud_project
    - hcloud_server
  assertions:
  - attribute: tags
    op: key_exists
    key: last-finops-review
    message: Resource is missing 'last-finops-review' tag. Monthly FinOps reviews required.
  on_fail: finding
- id: waf-cost-060.config.any.cost-governance
  engine: config
  automated: true
  title: Cost Debt Register file must exist in repository
  provider: any
  description: A version-controlled policy document must exist at `docs/cost/waf-cost-060-cost-governance.md` and document
    the provider-agnostic implementation of this control. The checker validates that the file exists and contains a normative
    requirement statement (MUST/SHALL/required/mandatory).
  expected: 'true'
  remediation: 'Create or update `docs/cost/waf-cost-060-cost-governance.md`. State the requirement, how it is implemented
    for provider-agnostic, the review cadence, and the owner.

    '
  example:
    compliant: '|

      docs/cost/waf-cost-060-cost-governance.md:

      - The provider-agnostic implementation of WAF-COST-060 is documented.

      - Implementation status and owner are recorded.

      - Review cadence is defined (e.g. quarterly).

      '
    non_compliant: '|

      # `docs/cost/waf-cost-060-cost-governance.md` is missing or does not contain a normative requirement.

      # WAF-COST-060 violation: provider-agnostic control is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/cost/waf-cost-060-cost-governance.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/cost/waf-cost-060-cost-governance.md` must contain a normative requirement statement.
  on_fail: finding
- id: waf-cost-060.config.azurerm.finops-review-cadence
  engine: config
  automated: true
  title: Azure-specific FinOps review cadence policy must exist
  provider: azurerm
  description: A version-controlled policy document must exist at `docs/cost/waf-cost-060-azure-finops-review-cadence.md`
    and document how Azure production workloads receive monthly engineering-level FinOps reviews and quarterly Architecture
    Board cost debt reviews.
  expected: 'true'
  remediation: 'Create or update `docs/cost/waf-cost-060-azure-finops-review-cadence.md`. Define monthly review schedule,
    attendees, required outputs (action items with owner and due date), and quarterly Architecture Board review entry.

    '
  example:
    compliant: '|

      docs/cost/waf-cost-060-azure-finops-review-cadence.md:

      - Azure workloads MUST be reviewed monthly by the engineering team.

      - Architecture Board reviews cost debt quarterly.

      - Action items have owner and due date recorded in the task tracker.

      '
    non_compliant: '|

      # `docs/cost/waf-cost-060-azure-finops-review-cadence.md` is missing or does not contain a normative requirement.

      # WAF-COST-060 violation: Azure FinOps review cadence is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/cost/waf-cost-060-azure-finops-review-cadence.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/cost/waf-cost-060-azure-finops-review-cadence.md` must contain a normative requirement statement.
  on_fail: finding
- id: waf-cost-060.config.google.finops-review-cadence
  engine: config
  automated: true
  title: GCP-specific FinOps review cadence policy must exist
  provider: google
  description: A version-controlled policy document must exist at `docs/cost/waf-cost-060-gcp-finops-review-cadence.md` and
    document how GCP production workloads receive monthly engineering-level FinOps reviews and quarterly Architecture Board
    cost debt reviews.
  expected: 'true'
  remediation: 'Create or update `docs/cost/waf-cost-060-gcp-finops-review-cadence.md`. Define monthly review schedule, attendees,
    required outputs (action items with owner and due date), and quarterly Architecture Board review entry.

    '
  example:
    compliant: '|

      docs/cost/waf-cost-060-gcp-finops-review-cadence.md:

      - GCP workloads MUST be reviewed monthly by the engineering team.

      - Architecture Board reviews cost debt quarterly.

      - Action items have owner and due date recorded in the task tracker.

      '
    non_compliant: '|

      # `docs/cost/waf-cost-060-gcp-finops-review-cadence.md` is missing or does not contain a normative requirement.

      # WAF-COST-060 violation: GCP FinOps review cadence is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/cost/waf-cost-060-gcp-finops-review-cadence.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/cost/waf-cost-060-gcp-finops-review-cadence.md` must contain a normative requirement statement.
  on_fail: finding
