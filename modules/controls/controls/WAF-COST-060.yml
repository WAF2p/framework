# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-COST-060
id: WAF-COST-060
pillar: cost
severity: medium
type:
  - governance
description: |
  Monthly engineering-level FinOps reviews MUST take place for all production workloads. Quarterly Architecture Board reviews covering cost debt and strategic cost decisions MUST occur. Review outputs (action items with owner and due date) MUST be documented in writing and accessible in the team's task tracking system. Reviews are mandatory, not optional – absence of reviews is a control failure.
regulatory_mapping:
  - framework: 'FinOps Foundation'
    controls:
      - 'Operate Phase – Review Cadence and Continuous Improvement'
      - 'FinOps Principles – Teams Need Timely and Accurate Data'
  - framework: 'Internal Governance'
    controls:
      - 'Cloud Cost Governance Policy – Mandatory Review Cadence'
      - 'Architecture Governance – Quarterly Cost Debt Review'
checks:
  - id: waf-cost-060.tf.any.finops-review-tag-current
    engine: terraform
    automated: true
    title: "Workload resources should have current 'last-finops-review' tag"
    provider: any
    description: "Workload infrastructure resources should carry a 'last-finops-review' tag with the date (YYYY-MM-DD) of the last FinOps review. A stale review tag (> 45 days old) indicates the review cadence is not being maintained. This tag is a lightweight operational proof of an active review process."
    expected: 'true'
    remediation: "After each monthly FinOps review, update the 'last-finops-review' tag on workload resources to the current date. This can be automated in CI as part of the review process. Value format: YYYY-MM-DD.\n"
    example:
      compliant: |
        resource "aws_eks_cluster" "main" {
          name     = "payment-service-prod"
          role_arn = aws_iam_role.eks.arn
        
          tags = merge(module.mandatory_tags.tags, {
            last-finops-review   = "2025-03-01"
            rightsizing-reviewed = "2025-03-01"
          })
        
          version = "1.29"
        }
        
      non_compliant: |
        resource "aws_eks_cluster" "main" {
          name     = "payment-service-prod"
          role_arn = aws_iam_role.eks.arn
          # Missing last-finops-review tag – no evidence of review process
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_instance
        - aws_eks_cluster
        - aws_rds_cluster
        - azurerm_kubernetes_cluster
        - azurerm_virtual_machine_scale_set
        - google_container_cluster
    assertions:
      - attribute: 'tags'
        op: 'key_exists'
        key: 'last-finops-review'
        message: "Resource is missing 'last-finops-review' tag. Monthly FinOps reviews required."
    on_fail: finding
  - id: waf-cost-060.tf.any.cost-debt-register-exists
    engine: terraform
    automated: true
    title: 'Cost Debt Register file must exist in repository'
    provider: any
    description: 'A cost-debt-register.yml (or equivalent) file must exist in the repository docs/ directory. This is a process control validated through CI pipeline file existence check or manual audit. An empty or minimal register is acceptable initially; the important requirement is that the file exists and is actively updated.'
    expected: 'true'
    remediation: 'Create docs/cost-debt-register.yml in the repository. See WAF-COST-100 and bp-cost-debt.adoc for the required format. Initialize with any known cost debt items from the brownfield discovery or recent ADR reviews.\n'
    example:
      compliant: |
        # docs/cost-debt-register.yml exists with at minimum:
        version: "1.0"
        last_reviewed: "2025-03-01"
        entries: []  # Even empty is acceptable as starting point
        
      non_compliant: |
        # docs/cost-debt-register.yml does not exist in repository
        # No structured cost debt tracking – WAF-COST-060 process violation
        
    scope:
      block_type: resource
    on_fail: finding
