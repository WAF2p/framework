# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-COST-090
id: WAF-COST-090
pillar: cost
severity: high
type:
  - configuration
  - network
  - governance
description: |
  VPC endpoints MUST be deployed for S3, KMS, and other heavily-used internal cloud services to eliminate unnecessary internet egress costs. Public IP addresses on internal compute resources (that do not serve public traffic) are prohibited. CDN MUST be configured for all publicly accessible static assets. An egress cost budget alert MUST exist. Cross-region data transfer MUST be minimized and documented when necessary.
regulatory_mapping:
  - framework: 'FinOps Foundation'
    controls:
      - 'Optimize Phase – Network Cost Optimization'
      - 'Optimize Phase – Data Transfer Cost Reduction'
  - framework: 'Internal Governance'
    controls:
      - 'Cloud Cost Governance Policy – Egress Cost Target'
      - 'Network Architecture Standard – VPC Endpoints Mandatory'
checks:
  - id: waf-cost-090.tf.aws.vpc-endpoint-s3-exists
    engine: terraform
    automated: true
    title: 'VPC endpoint for S3 must exist in each production VPC'
    provider: aws
    description: 'An aws_vpc_endpoint resource with service_name matching S3 must exist for each production VPC. Without S3 VPC endpoints, all S3 traffic from EC2 instances flows through the internet gateway, generating unnecessary egress and data processing charges.'
    expected: 'true'
    remediation: 'Add an aws_vpc_endpoint resource for S3 to each production VPC. For S3: use vpc_endpoint_type = "Gateway" (free of charge). For interface endpoints (KMS, ECR, STS): vpc_endpoint_type = "Interface" (hourly charge but saves on data processing and egress from NAT gateway).\n'
    example:
      compliant: |
        resource "aws_vpc_endpoint" "s3" {
          vpc_id            = aws_vpc.main.id
          service_name      = "com.amazonaws.${var.region}.s3"
          vpc_endpoint_type = "Gateway"
          route_table_ids   = [aws_route_table.private.id]
        
          tags = merge(module.mandatory_tags.tags, {
            Name = "vpce-s3-${var.environment}"
          })
        }
        
        resource "aws_vpc_endpoint" "kms" {
          vpc_id              = aws_vpc.main.id
          service_name        = "com.amazonaws.${var.region}.kms"
          vpc_endpoint_type   = "Interface"
          subnet_ids          = aws_subnet.private[*].id
          security_group_ids  = [aws_security_group.vpc_endpoint.id]
          private_dns_enabled = true
        
          tags = merge(module.mandatory_tags.tags, {
            Name = "vpce-kms-${var.environment}"
          })
        }
        
      non_compliant: |
        resource "aws_vpc" "main" {
          cidr_block = "10.0.0.0/16"
          # No VPC endpoints defined – all S3/KMS traffic via internet gateway
          # WAF-COST-090 violation: unnecessary egress charges
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_vpc_endpoint
    assertions:
      - attribute: 'service_name'
        op: 'matches'
        message: 'VPC endpoint for S3 (service_name ending in .s3) must exist.'
        pattern: '.*\\.s3$'
      - attribute: 'vpc_endpoint_type'
        op: 'in'
        message: 'VPC endpoint type must be Gateway or Interface.'
    on_fail: violation
  - id: waf-cost-090.tf.aws.no-public-ip-internal-compute
    engine: terraform
    automated: true
    title: 'Internal compute resources must not have public IPs'
    provider: aws
    description: 'EC2 instances used for internal application workloads (not serving public traffic directly) must not have associate_public_ip_address = true. Internal compute should use private IPs with NAT Gateway for outbound internet access where needed.'
    expected: 'true'
    remediation: 'Set associate_public_ip_address = false on internal EC2 instances. Place instances in private subnets. Use NAT Gateway for outbound internet access. Use ALB/NLB with public IPs for load balancing inbound public traffic.\n'
    example:
      compliant: |
        resource "aws_instance" "app" {
          ami                         = data.aws_ami.ubuntu.id
          instance_type               = "t3.medium"
          subnet_id                   = aws_subnet.private.id
          associate_public_ip_address = false  # Internal compute, no public IP
          tags                        = module.mandatory_tags.tags
        }
        
      non_compliant: |
        resource "aws_instance" "app" {
          ami                         = data.aws_ami.ubuntu.id
          instance_type               = "t3.medium"
          subnet_id                   = aws_subnet.public.id
          associate_public_ip_address = true  # Unnecessary public IP for internal app server
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_instance
        - aws_launch_template
    assertions:
      - attribute: 'associate_public_ip_address'
        op: 'is_false'
        message: 'Internal compute must not have public IP addresses. Use private subnets with NAT Gateway.'
    on_fail: finding
