# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-SOV-020
id: WAF-SOV-020
pillar: sovereign
severity: critical
type:
  - configuration
description: |
  Deployments MUST be restricted to approved sovereign regions through policy-as-code and IaC guardrails. Region constraints must be technically enforced—not merely documented. Violations must be blocked in CI or flagged as critical policy exceptions requiring explicit documented approval.
regulatory_mapping:
  - framework: 'GDPR'
    controls:
      - 'Art. 44 – General principle for transfers'
      - 'Art. 46 – Transfers to third countries'
  - framework: 'BSI C5:2020'
    controls:
      - 'OPS-04 – Data management'
      - 'INF-01 – Physical location'
  - framework: 'BSI C3A:2026'
    controls:
      - 'Dimension 4 – Data: Location of data processing'
      - 'Dimension 1 – Strategic: Jurisdictional alignment'
  - framework: 'EUCS (ENISA)'
    controls:
      - 'SOV-01 – Data location'
      - 'SOV-02 – Jurisdiction control'
  - framework: 'GAIA-X'
    controls:
      - 'Data Sovereignty – Location transparency'
  - framework: 'ISO 27001:2022'
    controls:
      - 'A.8.10 – Information deletion'
      - 'A.5.29 – Information security during disruption'
checks:
  - id: waf-sov-020.tf.aws.provider-region-in-allowed-list
    engine: terraform
    automated: true
    title: 'AWS provider region must be explicitly set'
    provider: aws
    description: "Every AWS provider block must have a 'region' attribute explicitly set. Relying on AWS_DEFAULT_REGION environment variables or provider defaults is prohibited for sovereign workloads."
    expected: 'true'
    remediation: "Add 'region = var.aws_region' to all AWS provider blocks.\n"
    example:
      compliant: |
        provider "aws" {
          region = var.aws_region
        }
        
      non_compliant: |
        provider "aws" {
          # region sourced from AWS_DEFAULT_REGION – not sovereign-safe
        }
        
    scope:
      block_type: provider
    assertions:
      - attribute: 'region'
        op: 'attribute_exists'
        message: "AWS provider block is missing an explicit 'region' attribute."
    on_fail: violation
  - id: waf-sov-020.tf.aws.region-variable-validation
    engine: terraform
    automated: true
    title: 'AWS region variable must have a validation constraint'
    provider: aws
    description: "Any Terraform variable whose name contains 'region' or 'location' must have a validation block to restrict values to the organization's approved region list."
    expected: 'true'
    remediation: "Add a validation block to region variables that uses 'contains()' or 'startswith()' to restrict values to the approved list.\n"
    example:
      compliant: |
        variable "aws_region" {
          type        = string
          description = "AWS region for sovereign deployments"
          default     = "eu-central-1"
          validation {
            condition     = contains(["eu-central-1", "eu-west-1", "eu-north-1"], var.aws_region)
            error_message = "Must be an approved sovereign EU region."
          }
        }
        
      non_compliant: |
        variable "aws_region" {
          type        = string
          default     = "us-east-1"
          # No validation – any region is accepted
        }
        
    scope:
      block_type: variable
    assertions:
      - attribute: 'validation'
        op: 'block_exists'
        message: "Region/location variable is missing a 'validation' block to restrict to approved values."
    on_fail: violation
  - id: waf-sov-020.tf.azurerm.location-variable-validation
    engine: terraform
    automated: true
    title: 'Azure location variable must have a validation constraint'
    provider: azurerm
    description: "Any Terraform variable whose name contains 'location' or 'region' for Azure must have a validation block restricting to approved Azure regions."
    expected: 'true'
    remediation: 'Add a validation block restricting location to approved Azure sovereign regions.\n'
    example:
      compliant: |
        variable "azure_location" {
          type    = string
          default = "germanywestcentral"
          validation {
            condition = contains(
              ["germanywestcentral", "germanynorth", "westeurope", "northeurope", "switzerlandnorth"],
              var.azure_location
            )
            error_message = "Azure location must be an approved sovereign region."
          }
        }
        
      non_compliant: |
        variable "azure_location" {
          type    = string
          default = "eastus"
          # No validation block
        }
        
    scope:
      block_type: variable
    assertions:
      - attribute: 'validation'
        op: 'block_exists'
        message: "Azure location variable is missing a 'validation' block."
    on_fail: violation
  - id: waf-sov-020.tf.google.region-variable-validation
    engine: terraform
    automated: true
    title: 'GCP region variable must have a validation constraint'
    provider: google
    description: 'GCP region and location variables must have validation blocks restricting to approved European or sovereign GCP regions.'
    expected: 'true'
    remediation: 'Add a validation block restricting GCP region to approved sovereign values.\n'
    example:
      compliant: |
        variable "gcp_region" {
          type    = string
          default = "europe-west3"
          validation {
            condition     = startswith(var.gcp_region, "europe-")
            error_message = "Only European GCP regions are approved for sovereign workloads."
          }
        }
        
      non_compliant: |
        variable "gcp_region" {
          type    = string
          default = "us-central1"
          # No validation
        }
        
    scope:
      block_type: variable
    assertions:
      - attribute: 'validation'
        op: 'block_exists'
        message: "GCP region/location variable is missing a 'validation' block."
    on_fail: violation
  - id: waf-sov-020.tf.aws.no-hardcoded-non-sovereign-region
    engine: terraform
    automated: true
    title: 'No hardcoded non-sovereign AWS region in resource or provider blocks'
    provider: aws
    description: 'Hardcoded AWS region strings referencing non-sovereign regions (e.g., us-east-1, ap-southeast-1) are forbidden in provider, resource, and data source blocks.'
    expected: 'true'
    remediation: 'Replace hardcoded region values with variable references that have validation constraints.\n'
    example:
      compliant: |
        provider "aws" {
          region = var.aws_region  # validated to eu-central-1 or eu-west-1
        }
        
      non_compliant: |
        provider "aws" {
          region = "us-east-1"  # Non-sovereign region hardcoded
        }
        
    scope:
      block_type: any
    assertions:
      - attribute: 'region'
        op: 'not_matches'
        message: 'Hardcoded non-sovereign AWS region detected. Only EU/approved regions are permitted.'
        pattern: '^(us-|ap-|sa-|ca-|me-|af-)'
    on_fail: violation
