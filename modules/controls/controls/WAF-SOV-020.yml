id: WAF-SOV-020
title: Deployments MUST be restricted to approved sovereign regions through...
status: active
tags:
- sovereign
- critical
- configuration
pillar: sovereign
severity: critical
type:
- configuration
category: identity-access
rationale: Uncontrolled identities and excessive permissions enable data theft, lateral movement, and unauthorized changes to production systems. This control addresses the requirements of the 'Identity and Access Management' area and ensures that Deployments MUST be restricted to approved sovereign regions through policy-as-code and IaC guardrails.
threat:
- Data may leave approved jurisdictions and violate regulatory requirements.
- Vendor lock-in reduces future portability and sovereignty options.
implementation_guidance:
- Implement the required configuration as code in Terraform or equivalent IaC.
- Add an automated check to CI/CD so deviations are caught before deployment.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - The requirement is documented; initial resources show the intended configuration.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform checks or IaC gates automatically validate the requirement in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-sovereign/pages/controls/WAF-SOV-020.adoc
  related_controls:
  - WAF-SOV-010
  - WAF-SOV-060
  - WAF-SOV-070
  - WAF-SOV-090
  - WAF-SEC-010
  - WAF-SEC-020
  - WAF-SEC-060
  - WAF-AGN-010
  - WAF-AGN-080
  - WAF-COST-040
  - WAF-COST-090
  - WAF-SEC-030
description: 'Deployments MUST be restricted to approved sovereign regions through policy-as-code and IaC guardrails. Region constraints must be technically enforced—not merely documented. Violations must be blocked in CI or flagged as critical policy exceptions requiring explicit documented approval.

  '
regulatory_mapping:
- framework: GDPR
  controls:
  - Art. 44 – General principle for transfers
  - Art. 46 – Transfers to third countries
- framework: BSI C5:2020
  controls:
  - OPS-04 – Data management
  - INF-01 – Physical location
- framework: BSI C3A:2026
  controls:
  - 'Dimension 4 – Data: Location of data processing'
  - 'Dimension 1 – Strategic: Jurisdictional alignment'
- framework: EUCS (ENISA)
  controls:
  - SOV-01 – Data location
  - SOV-02 – Jurisdiction control
- framework: GAIA-X
  controls:
  - Data Sovereignty – Location transparency
- framework: ISO 27001:2022
  controls:
  - A.8.10 – Information deletion
  - A.5.29 – Information security during disruption
checks:
- id: waf-sov-020.tf.aws.provider-region-in-allowed-list
  engine: terraform
  automated: true
  title: AWS provider region must be explicitly set
  provider: aws
  description: Every AWS provider block must have a 'region' attribute explicitly set. Relying on AWS_DEFAULT_REGION environment variables or provider defaults is prohibited for sovereign workloads.
  expected: 'true'
  remediation: 'Add ''region = var.aws_region'' to all AWS provider blocks.

    '
  example:
    compliant: "provider \"aws\" {\n  region = var.aws_region\n}\n"
    non_compliant: "provider \"aws\" {\n  # region sourced from AWS_DEFAULT_REGION – not sovereign-safe\n}\n"
  scope:
    block_type: provider
    provider_name: aws
  assertions:
  - attribute: region
    op: attribute_exists
    message: AWS provider block is missing an explicit 'region' attribute.
  on_fail: violation
- id: waf-sov-020.tf.aws.region-variable-validation
  engine: terraform
  automated: true
  title: AWS region variable must have a validation constraint
  provider: aws
  description: Any Terraform variable whose name contains 'region' or 'location' must have a validation block to restrict values to the organization's approved region list.
  expected: 'true'
  remediation: 'Add a validation block to region variables that uses ''contains()'' or ''startswith()'' to restrict values to the approved list.

    '
  example:
    compliant: "variable \"aws_region\" {\n  type        = string\n  description = \"AWS region for sovereign deployments\"\n  default     = \"eu-central-1\"\n  validation {\n    condition     = contains([\"eu-central-1\", \"eu-west-1\", \"eu-north-1\"], var.aws_region)\n    error_message = \"Must be an approved sovereign EU region.\"\n  }\n}\n"
    non_compliant: "variable \"aws_region\" {\n  type        = string\n  default     = \"us-east-1\"\n  # No validation – any region is accepted\n}\n"
  scope:
    block_type: variable
  assertions:
  - attribute: validation
    op: block_exists
    message: Region/location variable is missing a 'validation' block to restrict to approved values.
  on_fail: violation
- id: waf-sov-020.tf.azurerm.location-variable-validation
  engine: terraform
  automated: true
  title: Azure location variable must have a validation constraint
  provider: azurerm
  description: Any Terraform variable whose name contains 'location' or 'region' for Azure must have a validation block restricting to approved Azure regions.
  expected: 'true'
  remediation: Add a validation block restricting location to approved Azure sovereign regions.\n
  example:
    compliant: "variable \"azure_location\" {\n  type    = string\n  default = \"germanywestcentral\"\n  validation {\n    condition = contains(\n      [\"germanywestcentral\", \"germanynorth\", \"westeurope\", \"northeurope\", \"switzerlandnorth\"],\n      var.azure_location\n    )\n    error_message = \"Azure location must be an approved sovereign region.\"\n  }\n}\n"
    non_compliant: "variable \"azure_location\" {\n  type    = string\n  default = \"eastus\"\n  # No validation block\n}\n"
  scope:
    block_type: variable
  assertions:
  - attribute: validation
    op: block_exists
    message: Azure location variable is missing a 'validation' block.
  on_fail: violation
- id: waf-sov-020.tf.google.region-variable-validation
  engine: terraform
  automated: true
  title: GCP region variable must have a validation constraint
  provider: google
  description: GCP region and location variables must have validation blocks restricting to approved European or sovereign GCP regions.
  expected: 'true'
  remediation: Add a validation block restricting GCP region to approved sovereign values.\n
  example:
    compliant: "variable \"gcp_region\" {\n  type    = string\n  default = \"europe-west3\"\n  validation {\n    condition     = startswith(var.gcp_region, \"europe-\")\n    error_message = \"Only European GCP regions are approved for sovereign workloads.\"\n  }\n}\n"
    non_compliant: "variable \"gcp_region\" {\n  type    = string\n  default = \"us-central1\"\n  # No validation\n}\n"
  scope:
    block_type: variable
  assertions:
  - attribute: validation
    op: block_exists
    message: GCP region/location variable is missing a 'validation' block.
  on_fail: violation
- id: waf-sov-020.tf.aws.no-hardcoded-non-sovereign-region
  engine: terraform
  automated: true
  title: No hardcoded non-sovereign AWS region in resource or provider blocks
  provider: aws
  description: Hardcoded AWS region strings referencing non-sovereign regions (e.g., us-east-1, ap-southeast-1) are forbidden in provider, resource, and data source blocks.
  expected: 'true'
  remediation: Replace hardcoded region values with variable references that have validation constraints.\n
  example:
    compliant: "provider \"aws\" {\n  region = var.aws_region  # validated to eu-central-1 or eu-west-1\n}\n"
    non_compliant: "provider \"aws\" {\n  region = \"us-east-1\"  # Non-sovereign region hardcoded\n}\n"
  scope:
    block_type: any
  assertions:
  - attribute: region
    op: not_matches
    message: Hardcoded non-sovereign AWS region detected. Only EU/approved regions are permitted.
    pattern: ^(us-|ap-|sa-|ca-|me-|af-)
  on_fail: violation
- id: waf-sov-020.tf.stackit.region-validation
  engine: terraform
  automated: true
  title: StackIT region variable must have a validation constraint
  provider: stackit
  description: 'StackIT project region variables must have validation blocks restricting to approved sovereign regions. StackIT regions include: eu-central-1 (Karlsruhe), eu-west-1 (Strasbourg).'
  expected: 'true'
  remediation: Add a validation block restricting the StackIT region to approved sovereign values.\n
  example:
    compliant: "variable \"stackit_region\" {\n  type    = string\n  default = \"eu-central-1\"\n  validation {\n    condition     = contains([\"eu-central-1\", \"eu-west-1\"], var.stackit_region)\n    error_message = \"StackIT region must be an approved sovereign region.\"\n  }\n}\nprovider \"stackit\" {\n  region = var.stackit_region\n}\n"
    non_compliant: "variable \"stackit_region\" {\n  type    = string\n  default = \"us-east-1\"\n  # No validation block\n}\n"
  scope:
    block_type: variable
  assertions:
  - attribute: validation
    op: block_exists
    message: StackIT region/location variable is missing a 'validation' block.
  on_fail: violation
- id: waf-sov-020.tf.ovh.location-validation
  engine: terraform
  automated: true
  title: OVH location variable must have a validation constraint
  provider: ovh
  description: 'OVH project location variables must have validation blocks restricting to approved sovereign regions. OVH regions include: DE-FRA (Frankfurt), DE-EDE (Ede), EU-CY (Cyprus).'
  expected: 'true'
  remediation: Add a validation block restricting OVH location to approved sovereign regions.\n
  example:
    compliant: "variable \"ovh_location\" {\n  type    = string\n  default = \"DE-FRA\"\n  validation {\n    condition     = contains([\"DE-FRA\", \"DE-EDE\", \"EU-CY\"], var.ovh_location)\n    error_message = \"OVH location must be an approved sovereign region.\"\n  }\n}\nprovider \"ovh\" {\n  endpoint = \"ovh-eu\"\n}\n"
    non_compliant: "variable \"ovh_location\" {\n  type    = string\n  default = \"US-CA\"\n  # No validation block\n}\n"
  scope:
    block_type: variable
  assertions:
  - attribute: validation
    op: block_exists
    message: OVH location variable is missing a 'validation' block.
  on_fail: violation
- id: waf-sov-020.tf.hcloud.location-validation
  engine: terraform
  automated: true
  title: Hetzner Cloud location variable must have a validation constraint
  provider: hcloud
  description: 'Hetzner Cloud location variables must have validation blocks restricting to approved sovereign regions. Hetzner regions include: fsn1 (Frankfurt), nbg1 (Nuremberg), hel1 (Helsinki).'
  expected: 'true'
  remediation: Add a validation block restricting Hetzner Cloud location to approved sovereign regions.\n
  example:
    compliant: "variable \"hcloud_location\" {\n  type    = string\n  default = \"fsn1\"\n  validation {\n    condition     = contains([\"fsn1\", \"nbg1\", \"hel1\"], var.hcloud_location)\n    error_message = \"Hetzner Cloud location must be an approved sovereign region.\"\n  }\n}\nresource \"hcloud_server\" \"main\" {\n  name        = \"sovereign-server\"\n  server_type = \"cx22\"\n  location    = var.hcloud_location\n}\n"
    non_compliant: "variable \"hcloud_location\" {\n  type    = string\n  default = \"us-ca\"\n  # No validation block\n}\n"
  scope:
    block_type: variable
  assertions:
  - attribute: validation
    op: block_exists
    message: Hetzner Cloud location variable is missing a 'validation' block.
  on_fail: violation
