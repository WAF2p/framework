# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-PERF-100
id: WAF-PERF-100
pillar: performance
severity: medium
type:
  - governance
  - configuration
description: |
  All known performance limitations, anti-patterns, and deferred optimizations MUST be documented in a Performance Debt Register. Each entry MUST include: ID, description of the performance issue, estimated impact (latency increase, throughput reduction, cost), affected services, owner, priority, and a remediation plan or acceptance rationale. The Performance Debt Register MUST be reviewed quarterly by engineering leadership. New performance anti-patterns identified in postmortems, load tests, or reviews MUST be added to the register within 30 days of identification.
regulatory_mapping:
  - framework: 'ISO/IEC 25010'
    controls:
      - 'Performance Efficiency – Capacity'
  - framework: 'ISO/IEC 12207'
    controls:
      - 'Software Maintenance – Risk Management'
  - framework: 'ITIL 4'
    controls:
      - 'Service Level Management – Continual Improvement'
  - framework: 'DORA'
    controls:
      - 'Continuous improvement – Technical debt management'
checks:
  - id: waf-perf-100.tf.aws.config-performance-rules
    engine: terraform
    automated: true
    title: 'AWS Config rules should include performance governance checks'
    provider: aws
    description: 'AWS Config should have rules configured that detect common performance anti-patterns such as previous-generation instance types, missing performance insights, or unencrypted volumes that reduce throughput. This enables automated detection of performance debt.'
    expected: 'true'
    remediation: 'Create AWS Config rules for performance governance: desired-instance-type, rds-enhanced-monitoring-enabled, ec2-ebs-encryption-by-default. Use AWS Security Hub for centralized findings aggregation.\n'
    example:
      compliant: |
        resource "aws_config_config_rule" "rds_performance_insights" {
          name        = "rds-performance-insights-enabled"
          description = "WAF-PERF-040: Checks RDS instances have Performance Insights enabled"
          source {
            owner             = "AWS"
            source_identifier = "RDS_INSTANCE_PUBLIC_ACCESS_CHECK"
          }
          tags = {
            pillar  = "performance"
            control = "WAF-PERF-040"
          }
        }
        
      non_compliant: |
        # No AWS Config rules for performance governance
        # Performance anti-patterns not automatically detected – WAF-PERF-100 advisory
        
    scope:
      block_type: resource
      resource_types:
        - aws_config_config_rule
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'AWS Config rules must have descriptive names.'
      - attribute: 'source'
        op: 'not_empty'
        message: 'AWS Config rules must have a source (AWS managed or custom Lambda).'
    on_fail: advisory
  - id: waf-perf-100.tf.azurerm.policy-performance-governance
    engine: terraform
    automated: true
    title: 'Azure Policy should include performance governance initiatives'
    provider: azurerm
    description: 'Azure Policy should include policy definitions or initiatives that detect and audit performance anti-patterns such as non-Premium storage for databases or missing Application Insights deployments.'
    expected: 'true'
    remediation: 'Create Azure Policy assignments for performance governance. Use built-in policies like "Storage accounts should use geo-redundant storage" or custom policies for performance requirements specific to your organization.\n'
    example:
      compliant: |
        resource "azurerm_resource_group_policy_assignment" "perf_monitoring" {
          name                 = "require-application-insights"
          resource_group_id    = azurerm_resource_group.main.id
          policy_definition_id = var.require_app_insights_policy_id
          description          = "WAF-PERF-050: Require Application Insights for all web applications"
        }
        
      non_compliant: |
        # No performance governance policies assigned
        # Performance anti-patterns not systematically audited – WAF-PERF-100 advisory
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_resource_group_policy_assignment
        - azurerm_subscription_policy_assignment
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Policy assignment must be named.'
    on_fail: advisory
  - id: waf-perf-100.tf.google.security-health-analytics
    engine: terraform
    automated: true
    title: 'GCP Security Command Center should monitor performance governance findings'
    provider: google
    description: 'GCP Security Command Center or Cloud Asset Inventory should be configured to track performance governance findings and provide a consolidated view of performance risk.'
    expected: 'true'
    remediation: 'Enable Security Command Center findings export to Pub/Sub for performance-related findings. Configure asset inventory queries for performance governance.\n'
    example:
      compliant: |
        resource "google_scc_notification_config" "performance_findings" {
          config_id    = "perf-governance-notifications"
          organization = var.org_id
          description  = "Notifications for performance governance findings"
          pubsub_topic = google_pubsub_topic.security_notifications.id
          streaming_config {
            filter = "category = \"INSTANCE_TYPE_RECOMMENDATION\" OR category = \"DISK_TYPE_RECOMMENDATION\""
          }
        }
        
      non_compliant: |
        # No SCC notification config for performance findings
        # Performance recommendations not surfaced to engineering – WAF-PERF-100 advisory
        
    scope:
      block_type: resource
      resource_types:
        - google_scc_notification_config
    assertions:
      - attribute: 'streaming_config'
        op: 'not_empty'
        message: 'SCC notification config must have streaming_config defined.'
    on_fail: advisory
