# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-PERF-010
id: WAF-PERF-010
pillar: performance
severity: high
type:
  - governance
  - configuration
description: |
  All compute resources (virtual machines, container workloads, managed compute services) MUST be sized based on measured workload requirements and validated performance baselines. Instance type selection MUST be documented in architecture records or sizing sheets. Oversized resources (utilization < 20% sustained) and undersized resources (sustained CPU/memory > 80% for non-autoscaling workloads) MUST be flagged and reviewed on a quarterly basis.
regulatory_mapping:
  - framework: 'ISO/IEC 25010'
    controls:
      - 'Performance Efficiency – Time Behavior'
      - 'Performance Efficiency – Resource Utilization'
      - 'Performance Efficiency – Capacity'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'Performance Efficiency Pillar – Select the right resource types and sizes'
      - 'PERF 1 – How do you select the best performing architecture?'
  - framework: 'Azure Well-Architected Framework'
    controls:
      - 'Performance Efficiency – Choose the right resources'
  - framework: 'Google Cloud Architecture Framework'
    controls:
      - 'Performance optimization – Right-size your instances'
checks:
  - id: waf-perf-010.tf.aws.ec2-current-generation
    engine: terraform
    automated: true
    title: 'AWS EC2 instances must use current-generation instance types'
    provider: aws
    description: 'EC2 instances must not use previous-generation instance types (t2, m4, c4, r4, i2, d2, etc.). Current-generation instance types provide significantly better price-performance. All instances must be documented with a sizing rationale.'
    expected: 'true'
    remediation: 'Replace previous-generation instance types with current-generation equivalents. t2.* → t3.* or t4g.*; m4.* → m6i.*; c4.* → c6i.*; r4.* → r6i.*. Run AWS Compute Optimizer to get right-sizing recommendations before migrating.\n'
    example:
      compliant: |
        resource "aws_instance" "app" {
          ami           = data.aws_ami.ubuntu.id
          instance_type = "t3.medium"  # Current-generation, validated with Compute Optimizer
          tags = {
            sizing-reviewed = "2026-01-15"
            workload        = "payment-api"
          }
        }
        
      non_compliant: |
        resource "aws_instance" "app" {
          ami           = data.aws_ami.ubuntu.id
          instance_type = "t2.medium"  # Previous-generation – WAF-PERF-010 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_instance
        - aws_launch_template
        - aws_launch_configuration
    assertions:
      - attribute: 'instance_type'
        op: 'not_matches'
        message: 'Instance is using a previous-generation type. Migrate to t3/t4g, m5/m6i, c5/c6i, or r5/r6i.'
        pattern: '^(t2|m4|c4|r4|i2|d2|hs1|m3|c3|cr1|cc2|g2|hi1)\\..*'
      - attribute: 'instance_type'
        op: 'attribute_exists'
        message: 'Instance type must be explicitly declared; no default allowed.'
    on_fail: violation
  - id: waf-perf-010.tf.azurerm.vm-sizing-documented
    engine: terraform
    automated: true
    title: 'Azure VMs must use current-generation sizes and have sizing metadata'
    provider: azurerm
    description: 'Azure virtual machines must not use deprecated or previous-generation VM sizes. Sizing metadata must be present as tags on the resource.'
    expected: 'true'
    remediation: "Replace deprecated VM sizes with current-generation equivalents (Dv5, Ev5, Bsv2, Dsv5). Use Azure Advisor recommendations for right-sizing guidance. Add a 'sizing-reviewed' tag with the review date.\n"
    example:
      compliant: |
        resource "azurerm_linux_virtual_machine" "app" {
          name                = "vm-payment-api"
          resource_group_name = azurerm_resource_group.main.name
          location            = azurerm_resource_group.main.location
          size                = "Standard_D2s_v5"
          tags = {
            sizing-reviewed = "2026-01-15"
            workload        = "payment-api"
          }
        }
        
      non_compliant: |
        resource "azurerm_linux_virtual_machine" "app" {
          name                = "vm-payment-api"
          resource_group_name = azurerm_resource_group.main.name
          location            = azurerm_resource_group.main.location
          size                = "Standard_D2"  # Deprecated size – WAF-PERF-010 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_linux_virtual_machine
        - azurerm_windows_virtual_machine
        - azurerm_virtual_machine_scale_set
    assertions:
      - attribute: 'size'
        op: 'not_matches'
        message: 'VM is using a deprecated or previous-generation size. Upgrade to Dv5 or Ev5 series.'
        pattern: '^Standard_(A|D1$|D2$|D3$|D4$|DS1$|DS2$|DS3$|DS4$)$'
      - attribute: 'tags'
        op: 'key_exists'
        key: 'sizing-reviewed'
        message: "VM must have a 'sizing-reviewed' tag with the date of the last sizing review."
    on_fail: violation
  - id: waf-perf-010.tf.google.gce-machine-type-validated
    engine: terraform
    automated: true
    title: 'GCP Compute Engine instances must use N2 or C2 series machine types'
    provider: google
    description: 'GCP VM instances must not use first-generation N1 machine types for production workloads. N2, N2D, C2, E2, or C3 series offer better performance and price-performance ratios.'
    expected: 'true'
    remediation: 'Replace N1 machine types with current-generation equivalents. n1-standard-* → n2-standard-*; n1-highmem-* → n2-highmem-*; n1-highcpu-* → c2-standard-*. Use GCP Recommender for right-sizing analysis.\n'
    example:
      compliant: |
        resource "google_compute_instance" "app" {
          name         = "payment-api"
          machine_type = "n2-standard-2"
          zone         = "europe-west3-a"
          boot_disk {
            initialize_params { image = "debian-cloud/debian-11" }
          }
        }
        
      non_compliant: |
        resource "google_compute_instance" "app" {
          name         = "payment-api"
          machine_type = "n1-standard-2"  # N1 series – WAF-PERF-010 violation
          zone         = "europe-west3-a"
        }
        
    scope:
      block_type: resource
      resource_types:
        - google_compute_instance
        - google_compute_instance_template
    assertions:
      - attribute: 'machine_type'
        op: 'not_matches'
        message: 'GCP instance uses N1 machine type. Migrate to N2, N2D, C2, or E2 series for better performance.'
        pattern: '^n1-(standard|highmem|highcpu)-.*'
    on_fail: violation
