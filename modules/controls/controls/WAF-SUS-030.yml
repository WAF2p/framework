# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-SUS-030
id: WAF-SUS-030
pillar: sustainability
severity: medium
type:
  - governance
  - configuration
description: |
  Workloads without strict data-residency requirements MUST consider carbon intensity of cloud regions in placement decisions. When architectural and regulatory constraints allow, workloads SHOULD be placed in regions with high renewable energy mix or low grid carbon intensity. Region selection decisions MUST document sustainability considerations alongside latency and cost factors. Batch workloads with flexible placement MUST evaluate green region alternatives.
regulatory_mapping:
  - framework: 'EU CSRD (Corporate Sustainability Reporting Directive)'
    controls:
      - 'ESRS E1 – Climate Change – Scope 3 reduction actions'
  - framework: 'GHG Protocol'
    controls:
      - 'Scope 2 – Market-based method (renewable energy certificates, PPAs)'
      - 'Scope 3 – Category 11: purchased cloud services location factor'
  - framework: 'Green Software Foundation'
    controls:
      - 'Carbon Aware Computing – location-based optimization'
      - 'Software Carbon Intensity (SCI) – location component'
  - framework: 'ISO 14001'
    controls:
      - '6.1.2 – Environmental aspects: procurement and infrastructure decisions'
checks:
  - id: waf-sus-030.tf.aws.preferred-regions
    engine: terraform
    automated: true
    title: 'AWS provider region should be a low-carbon-intensity region'
    provider: aws
    description: 'This check validates that the AWS provider is configured to use a region with known high renewable energy mix. High-carbon regions are flagged as warnings to trigger documentation of the sustainability justification.'
    expected: 'true'
    remediation: "If workloads can be placed in a lower-carbon region without violating data residency, latency, or compliance requirements, prefer: us-west-2 (Oregon, ~89% renewable), eu-north-1 (Stockholm, ~95% renewable), eu-west-1 (Ireland, ~80% renewable). If high-carbon region is required, document the justification in an ADR and offset through RECs for that region's workload footprint.\n"
    example:
      compliant: |
        provider "aws" {
          region = "eu-north-1"  # Stockholm – ~95% renewable energy
          # Sustainability justification: low carbon intensity region selected per WAF-SUS-030
        }
        
      non_compliant: |
        provider "aws" {
          region = "ap-east-1"  # Hong Kong – high carbon intensity grid
          # WAF-SUS-030 Warning: document carbon justification or migrate to lower-carbon region
        }
        
    scope:
      block_type: provider
      resource_types:
        - aws
    assertions:
      - attribute: 'region'
        op: 'in'
        message: 'AWS region has a high carbon intensity. Consider us-west-2, eu-north-1, eu-west-1 for lower emissions.'
    on_fail: warning
  - id: waf-sus-030.tf.google.preferred-regions
    engine: terraform
    automated: true
    title: 'GCP provider region should be a low-carbon-intensity region'
    provider: google
    description: 'GCP regions vary significantly in carbon intensity. europe-north1 (Finland) and europe-west1 (Belgium) are among the lowest carbon-intensity regions globally.'
    expected: 'true'
    remediation: 'For GCP workloads, prefer europe-north1 (Finland, ~97% renewable), europe-west1 (Belgium), or us-west1 (Oregon). GCP Carbon Footprint dashboard shows per-project emissions by region. Use carbon-free energy percentage (CFE%) metric available in GCP Sustainability console.\n'
    example:
      compliant: |
        provider "google" {
          project = var.project_id
          region  = "europe-north1"  # Finland – 97% carbon-free energy
        }
        
      non_compliant: |
        provider "google" {
          project = var.project_id
          region  = "asia-east1"  # Taiwan – lower renewable energy share
          # WAF-SUS-030 Warning: document carbon justification
        }
        
    scope:
      block_type: provider
      resource_types:
        - google
    assertions:
      - attribute: 'region'
        op: 'in'
        message: 'GCP region has elevated carbon intensity. Consider europe-north1, europe-west1, or us-west1.'
    on_fail: warning
  - id: waf-sus-030.tf.azurerm.preferred-regions
    engine: terraform
    automated: true
    title: 'Azure provider location should be a low-carbon-intensity region'
    provider: azurerm
    description: "Azure regions differ in their carbon intensity. Sweden Central, Norway East, and North Europe (Ireland) consistently show the lowest carbon intensity in Azure's Emissions Impact Dashboard."
    expected: 'true'
    remediation: 'For Azure, prefer swedencentral (Sweden, ~95% renewable), norwayeast (Norway, hydro-powered), or northeurope (Ireland). Review Azure Emissions Impact Dashboard for current carbon intensity by region. Document sustainability rationale when using other regions.\n'
    example:
      compliant: |
        resource "azurerm_resource_group" "main" {
          name     = "rg-app-prod"
          location = "swedencentral"  # Sweden – ~95% renewable energy
          tags = {
            sustainability-region = "green"
          }
        }
        
      non_compliant: |
        resource "azurerm_resource_group" "main" {
          name     = "rg-app-prod"
          location = "eastasia"
          # WAF-SUS-030 Warning: high carbon intensity region, document justification
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_resource_group
    assertions:
      - attribute: 'location'
        op: 'in'
        message: 'Azure region may have elevated carbon intensity. Consider swedencentral, norwayeast, or northeurope.'
    on_fail: warning
