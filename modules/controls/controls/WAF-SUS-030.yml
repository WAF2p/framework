id: WAF-SUS-030
title: Workloads without strict data-residency requirements MUST consider carbon...
status: active
tags:
- sustainability
- medium
- governance
- configuration
pillar: sustainability
severity: medium
type:
- governance
- configuration
category: data-governance
rationale: Missing data classification, ownership, and lifecycle control increase compliance risk, cost, and the likelihood of data loss. This control addresses the requirements of the 'Data Governance' area and ensures that Workloads without strict data-residency requirements MUST consider carbon intensity of cloud regions in placement decisions.
threat:
- Data may leave approved jurisdictions and violate regulatory requirements.
- Vendor lock-in reduces future portability and sovereignty options.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform checks or IaC gates automatically validate the requirement in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-sustainability/pages/controls/WAF-SUS-030.adoc
  related_controls:
  - WAF-SUS-010
  - WAF-COST-010
  - WAF-OPS-020
  - WAF-REL-050
  - WAF-SUS-020
  - WAF-SUS-040
  - WAF-COST-080
  - WAF-OPS-070
  - WAF-OPS-100
  - WAF-SUS-100
  - WAF-REL-010
  - WAF-REL-040
description: 'Workloads without strict data-residency requirements MUST consider carbon intensity of cloud regions in placement decisions. When architectural and regulatory constraints allow, workloads SHOULD be placed in regions with high renewable energy mix or low grid carbon intensity. Region selection decisions MUST document sustainability considerations alongside latency and cost factors. Batch workloads with flexible placement MUST evaluate green region alternatives.

  '
regulatory_mapping:
- framework: EU CSRD (Corporate Sustainability Reporting Directive)
  controls:
  - ESRS E1 – Climate Change – Scope 3 reduction actions
- framework: GHG Protocol
  controls:
  - Scope 2 – Market-based method (renewable energy certificates, PPAs)
  - 'Scope 3 – Category 11: purchased cloud services location factor'
- framework: Green Software Foundation
  controls:
  - Carbon Aware Computing – location-based optimization
  - Software Carbon Intensity (SCI) – location component
- framework: ISO 14001
  controls:
  - '6.1.2 – Environmental aspects: procurement and infrastructure decisions'
checks:
- id: waf-sus-030.tf.aws.preferred-regions
  engine: terraform
  automated: true
  title: AWS provider region should be a low-carbon-intensity region
  provider: aws
  description: This check validates that the AWS provider is configured to use a region with known high renewable energy mix. High-carbon regions are flagged as warnings to trigger documentation of the sustainability justification.
  expected: 'true'
  remediation: 'If workloads can be placed in a lower-carbon region without violating data residency, latency, or compliance requirements, prefer: us-west-2 (Oregon, ~89% renewable), eu-north-1 (Stockholm, ~95% renewable), eu-west-1 (Ireland, ~80% renewable). If high-carbon region is required, document the justification in an ADR and offset through RECs for that region''s workload footprint.

    '
  example:
    compliant: "provider \"aws\" {\n  region = \"eu-north-1\"  # Stockholm – ~95% renewable energy\n  # Sustainability justification: low carbon intensity region selected per WAF-SUS-030\n}\n"
    non_compliant: "provider \"aws\" {\n  region = \"ap-east-1\"  # Hong Kong – high carbon intensity grid\n  # WAF-SUS-030 Warning: document carbon justification or migrate to lower-carbon region\n}\n"
  scope:
    block_type: provider
    provider_name: aws
  assertions:
  - attribute: region
    op: in
    message: AWS region has a high carbon intensity. Consider us-west-2, eu-north-1, eu-west-1 for lower emissions.
    expected:
    - us-west-2
    - eu-north-1
    - eu-west-1
  on_fail: advisory
- id: waf-sus-030.tf.google.preferred-regions
  engine: terraform
  automated: true
  title: GCP provider region should be a low-carbon-intensity region
  provider: google
  description: GCP regions vary significantly in carbon intensity. europe-north1 (Finland) and europe-west1 (Belgium) are among the lowest carbon-intensity regions globally.
  expected: 'true'
  remediation: For GCP workloads, prefer europe-north1 (Finland, ~97% renewable), europe-west1 (Belgium), or us-west1 (Oregon). GCP Carbon Footprint dashboard shows per-project emissions by region. Use carbon-free energy percentage (CFE%) metric available in GCP Sustainability console.\n
  example:
    compliant: "provider \"google\" {\n  project = var.project_id\n  region  = \"europe-north1\"  # Finland – 97% carbon-free energy\n}\n"
    non_compliant: "provider \"google\" {\n  project = var.project_id\n  region  = \"asia-east1\"  # Taiwan – lower renewable energy share\n  # WAF-SUS-030 Warning: document carbon justification\n}\n"
  scope:
    block_type: provider
    provider_name: google
  assertions:
  - attribute: region
    op: in
    message: GCP region has elevated carbon intensity. Consider europe-north1, europe-west1, or us-west1.
    expected:
    - europe-north1
    - europe-west1
    - us-west1
  on_fail: advisory
- id: waf-sus-030.tf.azurerm.preferred-regions
  engine: terraform
  automated: true
  title: Azure provider location should be a low-carbon-intensity region
  provider: azurerm
  description: Azure regions differ in their carbon intensity. Sweden Central, Norway East, and North Europe (Ireland) consistently show the lowest carbon intensity in Azure's Emissions Impact Dashboard.
  expected: 'true'
  remediation: For Azure, prefer swedencentral (Sweden, ~95% renewable), norwayeast (Norway, hydro-powered), or northeurope (Ireland). Review Azure Emissions Impact Dashboard for current carbon intensity by region. Document sustainability rationale when using other regions.\n
  example:
    compliant: "resource \"azurerm_resource_group\" \"main\" {\n  name     = \"rg-app-prod\"\n  location = \"swedencentral\"  # Sweden – ~95% renewable energy\n  tags = {\n    sustainability-region = \"green\"\n  }\n}\n"
    non_compliant: "resource \"azurerm_resource_group\" \"main\" {\n  name     = \"rg-app-prod\"\n  location = \"eastasia\"\n  # WAF-SUS-030 Warning: high carbon intensity region, document justification\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_resource_group
  assertions:
  - attribute: location
    op: in
    message: Azure region may have elevated carbon intensity. Consider swedencentral, norwayeast, or northeurope.
    expected:
    - swedencentral
    - norwayeast
    - northeurope
  on_fail: advisory
- id: waf-sus-030.tf.stackit.renewable-energy-used
  engine: terraform
  automated: true
  title: Workloads without strict data-residency requirements for stackit
  provider: stackit
  description: Workloads without strict data-residency requirements must be documented in IaC via a renewable-energy-used tag/label on stackit_project. This validates the control is tracked as code.
  expected: 'true'
  remediation: 'Add a renewable-energy-used tag/label to the stackit_project resource to show the stackit implementation of WAF-SUS-030 is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    renewable-energy-used = \"true\"\n  }\n}\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing renewable-energy-used labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: renewable-energy-used
    message: stackit_project is missing the renewable-energy-used tag/label.
  on_fail: violation
