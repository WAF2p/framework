id: WAF-OPS-010
title: Every production workload MUST have a defined, version-controlled CI/CD...
status: active
tags:
- operational
- high
- governance
- configuration
pillar: excellence
severity: high
type:
- governance
- configuration
category: deployment-automation
rationale: Manual deployments and missing quality gates increase the risk of outages, human error, and non-reproducible environments.
  This control addresses the requirements of the 'Deployment Automation' area and ensures that Every production workload MUST
  have a defined, version-controlled CI/CD pipeline that automates build, test, and deployment steps.
threat:
- Missing CI/CD pipelines force manual deployments and increase the risk of human error.
- Undocumented deployment processes lead to non-reproducible environments and longer outages.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform checks or IaC gates automatically validate the requirement in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-excellence/pages/controls/WAF-OPS-010.adoc
  related_controls:
  - WAF-OPS-050
  - WAF-OPS-080
  - WAF-OPS-020
  - WAF-OPS-030
  - WAF-OPS-040
  - WAF-SUS-060
  - WAF-OPS-090
  - WAF-OPS-070
  - WAF-OPS-100
  - WAF-REL-010
  - WAF-AGN-040
  - WAF-AGN-050
description: 'Every production workload MUST have a defined, version-controlled CI/CD pipeline that automates build, test,
  and deployment steps. Manual deployments to production MUST NOT be permitted. All pipeline definitions MUST be stored as
  code in the same repository as the application or infrastructure they deploy.

  '
regulatory_mapping:
- framework: ISO/IEC 20000-1
  controls:
  - Change and deployment management
  - Release and deployment management
- framework: ITIL 4
  controls:
  - Change enablement
  - Deployment management
- framework: CIS Controls v8
  controls:
  - 'CIS-4.1: Establish and Maintain a Secure Configuration Process'
checks:
- id: waf-ops-010.tf.aws.codepipeline-exists
  engine: terraform
  automated: true
  title: AWS CodePipeline must be defined for application deployments
  provider: aws
  description: Production workloads deployed to AWS MUST use CodePipeline or equivalent IaC-defined pipeline. The pipeline
    must include at least source, build, and deploy stages.
  expected: 'true'
  remediation: Define an aws_codepipeline resource with source, build, and deploy stages. Reference CodeBuild projects and
    S3 artifact buckets explicitly.\n
  example:
    compliant: "resource \"aws_codepipeline\" \"app_pipeline\" {\n  name     = \"payment-service-pipeline\"\n  role_arn =\
      \ aws_iam_role.codepipeline_role.arn\n\n  artifact_store {\n    location = aws_s3_bucket.artifacts.bucket\n    type\
      \     = \"S3\"\n  }\n\n  stage {\n    name = \"Source\"\n    action {\n      name             = \"Source\"\n      category\
      \         = \"Source\"\n      owner            = \"AWS\"\n      provider         = \"CodeStarSourceConnection\"\n  \
      \    version          = \"1\"\n      output_artifacts = [\"source_output\"]\n      configuration = {\n        ConnectionArn\
      \    = aws_codestarconnections_connection.github.arn\n        FullRepositoryId = \"myorg/payment-service\"\n       \
      \ BranchName       = \"main\"\n      }\n    }\n  }\n\n  stage {\n    name = \"Build\"\n    action {\n      name    \
      \         = \"Build\"\n      category         = \"Build\"\n      owner            = \"AWS\"\n      provider        \
      \ = \"CodeBuild\"\n      version          = \"1\"\n      input_artifacts  = [\"source_output\"]\n      output_artifacts\
      \ = [\"build_output\"]\n      configuration = {\n        ProjectName = aws_codebuild_project.build.name\n      }\n \
      \   }\n  }\n\n  stage {\n    name = \"Deploy\"\n    action {\n      name            = \"Deploy\"\n      category   \
      \     = \"Deploy\"\n      owner           = \"AWS\"\n      provider        = \"ECS\"\n      version         = \"1\"\n\
      \      input_artifacts = [\"build_output\"]\n      configuration = {\n        ClusterName = aws_ecs_cluster.main.name\n\
      \        ServiceName = aws_ecs_service.app.name\n      }\n    }\n  }\n}\n"
    non_compliant: '# No pipeline defined – deployments performed manually

      # WAF-OPS-010 Violation: manual deployment without pipeline

      '
  scope:
    block_type: resource
    resource_types:
    - aws_codepipeline
  assertions:
  - attribute: name
    op: not_empty
    message: CodePipeline must have a non-empty name.
  - attribute: stage
    op: attribute_exists
    message: CodePipeline must define at least one stage.
  on_fail: violation
- id: waf-ops-010.tf.azurerm.devops-pipeline-exists
  engine: terraform
  automated: true
  title: Azure DevOps pipeline must be defined for application workloads
  provider: azurerm
  description: Applications deployed to Azure MUST have an Azure DevOps pipeline defined as code. The pipeline definition
    must be stored in the application repository.
  expected: 'true'
  remediation: Define an azuredevops_build_definition resource linking to your repository and a YAML pipeline definition file
    (azure-pipelines.yml).\n
  example:
    compliant: "resource \"azuredevops_build_definition\" \"app_pipeline\" {\n  project_id = azuredevops_project.main.id\n\
      \  name       = \"payment-service-ci-cd\"\n\n  repository {\n    repo_type   = \"TfsGit\"\n    repo_id     = azuredevops_git_repository.app.id\n\
      \    branch_name = \"refs/heads/main\"\n    yml_path    = \"azure-pipelines.yml\"\n  }\n}\n"
    non_compliant: '# No pipeline definition in Terraform

      # Deployments done manually via Azure Portal – WAF-OPS-010 Violation

      '
  scope:
    block_type: resource
    resource_types:
    - azuredevops_build_definition
  assertions:
  - attribute: name
    op: not_empty
    message: Azure DevOps pipeline must have a non-empty name.
  - attribute: repository
    op: attribute_exists
    message: Pipeline must reference a source repository.
  on_fail: violation
- id: waf-ops-010.tf.google.cloudbuild-trigger-exists
  engine: terraform
  automated: true
  title: Google Cloud Build trigger must be defined for CI/CD
  provider: google
  description: GCP workloads MUST use Cloud Build triggers connected to source repositories. Build configuration must be stored
    as cloudbuild.yaml in the repository.
  expected: 'true'
  remediation: Define a google_cloudbuild_trigger resource that references a cloudbuild.yaml file and connects to the application
    source repository.\n
  example:
    compliant: "resource \"google_cloudbuild_trigger\" \"app_trigger\" {\n  name        = \"payment-service-trigger\"\n  description\
      \ = \"CI/CD trigger for payment service\"\n\n  github {\n    owner = \"myorg\"\n    name  = \"payment-service\"\n  \
      \  push {\n      branch = \"^main$\"\n    }\n  }\n\n  filename = \"cloudbuild.yaml\"\n}\n"
    non_compliant: '# No Cloud Build trigger defined

      # WAF-OPS-010 Violation: no automated pipeline for GCP deployment

      '
  scope:
    block_type: resource
    resource_types:
    - google_cloudbuild_trigger
  assertions:
  - attribute: name
    op: not_empty
    message: Cloud Build trigger must have a non-empty name.
  - attribute: filename
    op: not_empty
    message: Cloud Build trigger must reference a build configuration file.
  on_fail: violation
- id: waf-ops-010.tf.stackit.infrastructure-as-code
  engine: terraform
  automated: true
  title: Every production workload for stackit
  provider: stackit
  description: Every production workload must be documented in IaC via a infrastructure-as-code tag/label on stackit_project.
    This validates the control is tracked as code.
  expected: 'true'
  remediation: 'Add a infrastructure-as-code tag/label to the stackit_project resource to show the stackit implementation
    of WAF-OPS-010 is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    infrastructure-as-code = \"true\"\n  }\n\
      }\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing infrastructure-as-code labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: infrastructure-as-code
    message: stackit_project is missing the infrastructure-as-code tag/label.
  on_fail: violation
