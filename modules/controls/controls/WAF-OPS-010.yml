# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-OPS-010
id: WAF-OPS-010
pillar: operational
severity: high
type:
  - governance
  - configuration
description: |
  Every production workload MUST have a defined, version-controlled CI/CD pipeline that automates build, test, and deployment steps. Manual deployments to production MUST NOT be permitted. All pipeline definitions MUST be stored as code in the same repository as the application or infrastructure they deploy.
regulatory_mapping:
  - framework: 'ISO/IEC 20000-1'
    controls:
      - 'Change and deployment management'
      - 'Release and deployment management'
  - framework: 'ITIL 4'
    controls:
      - 'Change enablement'
      - 'Deployment management'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'Operational Excellence Pillar – OPS 4: How do you implement observability in your workload?'
      - 'Operational Excellence Pillar – OPS 6: How do you deploy your workload?'
  - framework: 'DevOps Research and Assessment (DORA)'
    controls:
      - 'Deployment Frequency'
      - 'Lead Time for Changes'
  - framework: 'CIS Controls v8'
    controls:
      - 'CIS-4.1: Establish and Maintain a Secure Configuration Process'
checks:
  - id: waf-ops-010.tf.aws.codepipeline-exists
    engine: terraform
    automated: true
    title: 'AWS CodePipeline must be defined for application deployments'
    provider: aws
    description: 'Production workloads deployed to AWS MUST use CodePipeline or equivalent IaC-defined pipeline. The pipeline must include at least source, build, and deploy stages.'
    expected: 'true'
    remediation: 'Define an aws_codepipeline resource with source, build, and deploy stages. Reference CodeBuild projects and S3 artifact buckets explicitly.\n'
    example:
      compliant: |
        resource "aws_codepipeline" "app_pipeline" {
          name     = "payment-service-pipeline"
          role_arn = aws_iam_role.codepipeline_role.arn
        
          artifact_store {
            location = aws_s3_bucket.artifacts.bucket
            type     = "S3"
          }
        
          stage {
            name = "Source"
            action {
              name             = "Source"
              category         = "Source"
              owner            = "AWS"
              provider         = "CodeStarSourceConnection"
              version          = "1"
              output_artifacts = ["source_output"]
              configuration = {
                ConnectionArn    = aws_codestarconnections_connection.github.arn
                FullRepositoryId = "myorg/payment-service"
                BranchName       = "main"
              }
            }
          }
        
          stage {
            name = "Build"
            action {
              name             = "Build"
              category         = "Build"
              owner            = "AWS"
              provider         = "CodeBuild"
              version          = "1"
              input_artifacts  = ["source_output"]
              output_artifacts = ["build_output"]
              configuration = {
                ProjectName = aws_codebuild_project.build.name
              }
            }
          }
        
          stage {
            name = "Deploy"
            action {
              name            = "Deploy"
              category        = "Deploy"
              owner           = "AWS"
              provider        = "ECS"
              version         = "1"
              input_artifacts = ["build_output"]
              configuration = {
                ClusterName = aws_ecs_cluster.main.name
                ServiceName = aws_ecs_service.app.name
              }
            }
          }
        }
        
      non_compliant: |
        # No pipeline defined – deployments performed manually
        # WAF-OPS-010 Violation: manual deployment without pipeline
        
    scope:
      block_type: resource
      resource_types:
        - aws_codepipeline
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'CodePipeline must have a non-empty name.'
      - attribute: 'stage'
        op: 'attribute_exists'
        message: 'CodePipeline must define at least one stage.'
    on_fail: violation
  - id: waf-ops-010.tf.azurerm.devops-pipeline-exists
    engine: terraform
    automated: true
    title: 'Azure DevOps pipeline must be defined for application workloads'
    provider: azurerm
    description: 'Applications deployed to Azure MUST have an Azure DevOps pipeline defined as code. The pipeline definition must be stored in the application repository.'
    expected: 'true'
    remediation: 'Define an azuredevops_build_definition resource linking to your repository and a YAML pipeline definition file (azure-pipelines.yml).\n'
    example:
      compliant: |
        resource "azuredevops_build_definition" "app_pipeline" {
          project_id = azuredevops_project.main.id
          name       = "payment-service-ci-cd"
        
          repository {
            repo_type   = "TfsGit"
            repo_id     = azuredevops_git_repository.app.id
            branch_name = "refs/heads/main"
            yml_path    = "azure-pipelines.yml"
          }
        }
        
      non_compliant: |
        # No pipeline definition in Terraform
        # Deployments done manually via Azure Portal – WAF-OPS-010 Violation
        
    scope:
      block_type: resource
      resource_types:
        - azuredevops_build_definition
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Azure DevOps pipeline must have a non-empty name.'
      - attribute: 'repository'
        op: 'attribute_exists'
        message: 'Pipeline must reference a source repository.'
    on_fail: violation
  - id: waf-ops-010.tf.google.cloudbuild-trigger-exists
    engine: terraform
    automated: true
    title: 'Google Cloud Build trigger must be defined for CI/CD'
    provider: google
    description: 'GCP workloads MUST use Cloud Build triggers connected to source repositories. Build configuration must be stored as cloudbuild.yaml in the repository.'
    expected: 'true'
    remediation: 'Define a google_cloudbuild_trigger resource that references a cloudbuild.yaml file and connects to the application source repository.\n'
    example:
      compliant: |
        resource "google_cloudbuild_trigger" "app_trigger" {
          name        = "payment-service-trigger"
          description = "CI/CD trigger for payment service"
        
          github {
            owner = "myorg"
            name  = "payment-service"
            push {
              branch = "^main$"
            }
          }
        
          filename = "cloudbuild.yaml"
        }
        
      non_compliant: |
        # No Cloud Build trigger defined
        # WAF-OPS-010 Violation: no automated pipeline for GCP deployment
        
    scope:
      block_type: resource
      resource_types:
        - google_cloudbuild_trigger
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Cloud Build trigger must have a non-empty name.'
      - attribute: 'filename'
        op: 'not_empty'
        message: 'Cloud Build trigger must reference a build configuration file.'
    on_fail: violation
