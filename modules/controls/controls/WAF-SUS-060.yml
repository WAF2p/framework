# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-SUS-060
id: WAF-SUS-060
pillar: sustainability
severity: low
type:
  - configuration
description: |
  Batch workloads, report generation, data processing pipelines, and other non-latency-sensitive jobs MUST be scheduled during off-peak hours (22:00–06:00 local grid time) when carbon intensity of the electricity grid is typically lower. Workloads with flexible execution windows SHOULD integrate carbon intensity APIs (WattTime, electricityMaps) to execute during low-carbon windows. All EventBridge scheduled jobs and cron-based workloads MUST document their scheduling rationale including whether carbon-aware timing was considered.
regulatory_mapping:
  - framework: 'Green Software Foundation'
    controls:
      - 'Carbon Aware Computing – Temporal Shifting'
      - 'Software Carbon Intensity (SCI) – time-based carbon optimization'
  - framework: 'EU CSRD (Corporate Sustainability Reporting Directive)'
    controls:
      - 'ESRS E1 – Climate Change – operational energy optimization'
  - framework: 'GHG Protocol'
    controls:
      - 'Scope 2 – Market-based method – time-of-use carbon intensity'
checks:
  - id: waf-sus-060.tf.aws.eventbridge-flexible-window
    engine: terraform
    automated: true
    title: 'EventBridge Scheduler schedules should use flexible time windows for batch workloads'
    provider: aws
    description: 'EventBridge Scheduler supports a flexible_time_window that allows AWS to execute the schedule within a defined window around the target time. This enables carbon-aware execution: the job can be deferred to a lower-carbon window within the allowed range.'
    expected: 'true'
    remediation: 'Set flexible_time_window { mode = "FLEXIBLE"; maximum_window_in_minutes = 120 } on all non-latency-sensitive batch schedules. This allows AWS to execute the job within a 2-hour window, enabling carbon-aware timing without missing SLAs.\n'
    example:
      compliant: |
        resource "aws_scheduler_schedule" "nightly_report" {
          name = "nightly-report-generator"
        
          schedule_expression = "cron(0 22 * * ? *)"  # 22:00 UTC – off-peak window
        
          flexible_time_window {
            mode                      = "FLEXIBLE"
            maximum_window_in_minutes = 120  # allow up to 2h window for carbon-aware exec
          }
        
          target {
            arn      = aws_lambda_function.report_generator.arn
            role_arn = aws_iam_role.scheduler.arn
          }
        }
        
      non_compliant: |
        resource "aws_scheduler_schedule" "nightly_report" {
          name = "nightly-report-generator"
        
          schedule_expression = "cron(9 9 * * ? *)"  # 09:00 – peak hours, no reason documented
        
          flexible_time_window {
            mode = "OFF"  # WAF-SUS-060 Warning: no flexible window, fixed peak-time execution
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_scheduler_schedule
    assertions:
      - attribute: 'flexible_time_window.mode'
        op: 'not_equals'
        message: 'EventBridge schedule uses no flexible window – enable FLEXIBLE mode to allow carbon-aware execution.'
    on_fail: warning
  - id: waf-sus-060.tf.aws.batch-compute-spot
    engine: terraform
    automated: true
    title: 'AWS Batch compute environments should use SPOT allocation strategy'
    provider: aws
    description: 'AWS Batch jobs are by definition batch/asynchronous workloads that can tolerate spot interruption. Using SPOT allocation strategy reduces energy consumption from dedicated on-demand capacity and improves overall data center utilization efficiency.'
    expected: 'true'
    remediation: 'Change compute_resources.type to "SPOT" for AWS Batch compute environments. Configure spot_iam_fleet_role and bid_percentage = 100 to maximize spot usage. Implement retry policies on batch jobs to handle spot interruptions gracefully.\n'
    example:
      compliant: |
        resource "aws_batch_compute_environment" "processing" {
          compute_environment_name = "data-processing"
          type                     = "MANAGED"
        
          compute_resources {
            type                = "SPOT"
            allocation_strategy = "SPOT_CAPACITY_OPTIMIZED"
            instance_role       = aws_iam_instance_profile.batch.arn
            spot_iam_fleet_role = aws_iam_role.spot_fleet.arn
        
            min_vcpus     = 0
            max_vcpus     = 256
            desired_vcpus = 0
        
            instance_type = ["m7g", "c7g", "r7g"]  # Graviton3 spot instances
          }
        }
        
      non_compliant: |
        resource "aws_batch_compute_environment" "processing" {
          compute_environment_name = "data-processing"
          type                     = "MANAGED"
        
          compute_resources {
            type      = "ON_DEMAND"  # WAF-SUS-060 Warning: batch workload on on-demand
            min_vcpus = 4  # always-on capacity
            max_vcpus = 64
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_batch_compute_environment
    assertions:
      - attribute: 'compute_resources.type'
        op: 'in'
        message: 'Batch compute environment uses ON_DEMAND – consider SPOT for batch workloads to reduce energy overhead.'
    on_fail: warning
  - id: waf-sus-060.tf.google.cloud-scheduler-timezone
    engine: terraform
    automated: true
    title: 'GCP Cloud Scheduler jobs should use UTC timezone and off-peak scheduling'
    provider: google
    description: 'GCP Cloud Scheduler jobs should be scheduled in UTC timezone to enable consistent off-peak scheduling aligned with grid carbon intensity data.'
    expected: 'true'
    remediation: 'Set time_zone = "Etc/UTC" on all Cloud Scheduler jobs and adjust schedule expressions to target off-peak UTC hours (22:00-06:00 UTC). This ensures consistency with carbon intensity data which is typically published in UTC.\n'
    example:
      compliant: |
        resource "google_cloud_scheduler_job" "data_export" {
          name      = "nightly-data-export"
          schedule  = "0 23 * * *"  # 23:00 UTC – off-peak hours
          time_zone = "Etc/UTC"
        
          http_target {
            uri         = var.export_endpoint
            http_method = "POST"
          }
        }
        
      non_compliant: |
        resource "google_cloud_scheduler_job" "data_export" {
          name      = "data-export"
          schedule  = "0 9 * * *"  # 09:00 – peak hours
          time_zone = "Europe/Berlin"  # WAF-SUS-060 Warning: local timezone, peak hours
        }
        
    scope:
      block_type: resource
      resource_types:
        - google_cloud_scheduler_job
    assertions:
      - attribute: 'time_zone'
        op: 'equals'
        message: 'Cloud Scheduler job uses local timezone – use UTC for consistent carbon-aware scheduling.'
    on_fail: warning
