id: WAF-SUS-060
title: Batch workloads, report generation, data processing pipelines, and other...
status: active
tags:
- sustainability
- low
- configuration
pillar: sustainability
severity: low
type:
- configuration
category: deployment-automation
rationale: Manual deployments and missing quality gates increase the risk of outages, human error, and non-reproducible environments.
  This control addresses the requirements of the 'Deployment Automation' area and ensures that Batch workloads, report generation,
  data processing pipelines, and other non-latency-sensitive jobs MUST be scheduled during off-peak hours (22:00–06:00 local.
threat:
- Batch jobs without flexible time windows consume peak-load capacity and miss renewable-energy potential.
- Missing spot or scheduler optimization leads to expensive and carbon-intensive processing.
implementation_guidance:
- Implement the required configuration as code in Terraform or equivalent IaC.
- Add an automated check to CI/CD so deviations are caught before deployment.
