checks:
- id: waf-agn-030.tf.aws.bedrock-agent-logging-enabled
  engine: terraform
  automated: true
  title: AWS Bedrock agent reasoning must be logged
  provider: aws
  description: AWS Bedrock agents must have inference logging enabled to capture chain of thought, reasoning steps, and decision
    outcomes. Logs must include prompt, model response, and metadata.
  expected: 'true'
  remediation: Enable inference logging in AWS Bedrock console or via API. Configure CloudWatch log group for agent inference
    logs. Set log level to INCLUDE_INFERENCES for full chain of thought.\n
  example:
    compliant: "resource \"aws_cloudwatch_log_group\" \"agent_reasoning\" {\n  name = \"/aws/bedrock/inference-logs/reasoning\"\
      \n}\n\nresource \"aws_bedrockagent\" \"reasoning_agent\" {\n  agent_name = \"reasoning-enabled-agent\"\n  # Logging\
      \ enabled via CloudWatch configuration\n}\n"
    non_compliant: "resource \"aws_bedrockagent\" \"no_reasoning_log\" {\n  agent_name = \"black-box-agent\"\n  # No reasoning\
      \ logging configured\n  # WAF-AGN-030 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_bedrockagent
    - aws_cloudwatch_log_group
  assertions:
  - attribute: name
    op: not_empty
    message: Agent reasoning logging must be configured.
  on_fail: violation
- id: waf-agn-030.tf.azurerm.diagnostic-setting-enabled
  engine: terraform
  automated: true
  title: Azure AI services must have diagnostic settings enabled for traceability
  provider: azurerm
  description: Azure Cognitive Services / AI services accounts must have diagnostic settings enabled to capture audit logs
    including requests, responses, and token usage.
  expected: 'true'
  remediation: 'Add azurerm_monitor_diagnostic_setting for the azurerm_cognitive_account to forward audit logs to a Log Analytics
    workspace.

    '
  example:
    compliant: "resource \"azurerm_log_analytics_workspace\" \"ai_logs\" {\n  name                = \"ai-logs\"\n  location\
      \            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n  sku\
      \                 = \"PerGB2018\"\n  retention_in_days   = 90\n}\n\nresource \"azurerm_monitor_diagnostic_setting\"\
      \ \"ai_audit\" {\n  name                       = \"ai-audit-logs\"\n  target_resource_id         = azurerm_cognitive_account.ai.id\n\
      \  log_analytics_workspace_id = azurerm_log_analytics_workspace.ai_logs.id\n\n  enabled_log {\n    category = \"Audit\"\
      \n  }\n\n  metric {\n    category = \"AllMetrics\"\n  }\n}\n"
    non_compliant: "resource \"azurerm_cognitive_account\" \"ai\" {\n  name = \"ai-services-account\"\n  # No diagnostic setting\
      \ configured\n  # WAF-AGN-030 Violation: agent decisions are not traceable\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_monitor_diagnostic_setting
  assertions:
  - attribute: target_resource_id
    op: not_empty
    message: Diagnostic setting must target an AI services account.
  - attribute: log_analytics_workspace_id
    op: not_empty
    message: Diagnostic setting must forward logs to a Log Analytics workspace.
  - attribute: enabled_log
    op: attribute_exists
    message: Diagnostic setting must enable audit logs.
  on_fail: violation
- id: waf-agn-030.tf.google.vertex-agent-logging-enabled
  engine: terraform
  automated: true
  title: Google Vertex AI agent reasoning must be logged
  provider: google
  description: Google Vertex AI agents must have debugging and reasoning logs enabled. Logs must capture chain of thought,
    tool calls, and decision paths.
  expected: 'true'
  remediation: Enable Cloud Logging for Vertex AI. Configure log include patterns to capture agent reasoning. Set log level
    to DEBUG for full visibility.\n
  example:
    compliant: "resource \"google_logging_project_sink\" \"vertex_reasoning\" {\n  name = \"vertex-reasoning-logs\"\n  destination\
      \ = \"logging.googleapis.com/projects/${data.google_project.project.id}/logs/vertex-ai-reasoning\"\n  filter = \"resource.type=vertex_ai.custom_model\
      \ OR resource.type=vertex_ai.endpoint\"\n}\n\nresource \"google_vertex_ai_agent\" \"logging_agent\" {\n  display_name\
      \ = \"reasoning-logged\"\n}\n"
    non_compliant: "resource \"google_vertex_ai_agent\" \"no_logging\" {\n  display_name = \"black-box\"\n  # No reasoning\
      \ logging\n  # WAF-AGN-030 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_vertex_ai_agent
    - google_logging_project_sink
  assertions:
  - attribute: name
    op: not_empty
    message: Agent reasoning logging must be configured.
  on_fail: violation
- id: waf-agn-030.tf.aws.tracing-enabled
  engine: terraform
  automated: true
  title: Distributed tracing must be enabled for agents
  provider: aws
  description: Agent operations must be traced using AWS X-Ray or similar distributed tracing. Traces must include agent ID,
    operation type, latency, and decision points.
  expected: 'true'
  remediation: Enable X-Ray tracing for Bedrock agent invocations. Use AWS SDK with tracing enabled (AWS_XRAY_TRACING_NAME
    environment variable). Instrument agent code with X-Ray SDK.\n
  example:
    compliant: "resource \"aws_lambda_function\" \"agent_handler\" {\n  function_name = \"agent-handler\"\n  # Tracing enabled\
      \ via environment variable\n  environment {\n    variables = {\n      AWS_XRAY_TRACING_NAME = \"agent-service\"\n  \
      \  }\n  }\n}\n"
    non_compliant: "resource \"aws_lambda_function\" \"untraced\" {\n  function_name = \"untraced-agent\"\n  # No X-Ray tracing\
      \ enabled\n  # WAF-AGN-030 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_lambda_function
    - aws_bedrockagent
  assertions:
  - attribute: environment.variables.AWS_XRAY_TRACING_NAME
    op: not_empty
    message: Distributed tracing must be enabled via X-Ray.
  on_fail: violation
- id: waf-agn-030.tf.stackit.agentic-decisions-traceable
  engine: terraform
  automated: true
  title: Agent decisions must be traceable – not a black box for stackit
  provider: stackit
  description: Agent decisions must be traceable – not a black box must be documented in IaC via a agentic-decisions-traceable
    tag/label on stackit_project. This validates the control is tracked as code.
  expected: 'true'
  remediation: 'Add a agentic-decisions-traceable tag/label to the stackit_project resource to show the stackit implementation
    of WAF-AGN-030 is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    agentic-decisions-traceable = \"true\"\n\
      \  }\n}\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing agentic-decisions-traceable labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: agentic-decisions-traceable
    message: stackit_project is missing the agentic-decisions-traceable tag/label.
  on_fail: violation
