id: WAF-AGN-030
title: Agent decisions must be traceable – not a black box
status: active
tags:
- agentic
- medium
- governance
- configuration
pillar: agentic
severity: medium
type:
- governance
- configuration
category: logging-monitoring
rationale: Insufficient observability delays incident detection, complicates troubleshooting, and prevents effective audit
  evidence. This control addresses the requirements of the 'Logging and Monitoring' area and ensures that Agent decisions
  must be traceable – not a black box. Every decision step MUST be logged including chain of thought, reasoning, and decision
  outcome.
threat:
- Opaque agent decisions prevent root-cause analysis and regulatory audits.
- Missing reasoning chains make it impossible to demonstrate compliance with business rules.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform checks or IaC gates automatically validate the requirement in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
