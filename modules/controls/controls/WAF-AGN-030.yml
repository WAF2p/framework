# ID: WAF-AGN-030
id: WAF-AGN-030
pillar: agentic
severity: medium
type:
  - governance
  - configuration
description: |
  Agenten-Entscheidungen müssen nachvollziehbar sein – keine Black Box. Jeder Entscheidungsschritt MUSS protokolliert werden, einschließlich Chain of Thought, Begründung und Entscheidungsergebnis. Audit-Trails MÜSSEN den vollständigen Kontext der agenten-gestützten Entscheidungsfindung für Compliance und Debugging bewahren.
