checks:
- id: waf-sec-090.tf.aws.config-recorder-enabled
  engine: terraform
  automated: true
  title: AWS Config configuration recorder must be enabled for all resource types
  provider: aws
  description: An aws_config_configuration_recorder resource must exist with a recording_group block that records all supported
    resource types. This ensures continuous tracking of configuration changes across all AWS resources in the account.
  expected: 'true'
  remediation: Create an aws_config_configuration_recorder resource with a recording_group block setting all_supported = true
    and include_global_resource_types = true. Create an IAM role with the AWS managed policy AWSConfigRole and reference it
    via the role_arn attribute.\n
  example:
    compliant: "resource \"aws_iam_role\" \"config\" {\n  name               = \"aws-config-role\"\n  assume_role_policy =\
      \ data.aws_iam_policy_document.config_assume.json\n}\nresource \"aws_iam_role_policy_attachment\" \"config\" {\n  role\
      \       = aws_iam_role.config.name\n  policy_arn = \"arn:aws:iam::aws:policy/service-role/AWS_ConfigRole\"\n}\nresource\
      \ \"aws_config_configuration_recorder\" \"main\" {\n  name     = \"default\"\n  role_arn = aws_iam_role.config.arn\n\
      \  recording_group {\n    all_supported                 = true\n    include_global_resource_types = true\n  }\n}\nresource\
      \ \"aws_config_configuration_recorder_status\" \"main\" {\n  name       = aws_config_configuration_recorder.main.name\n\
      \  is_enabled = true\n  depends_on = [aws_config_delivery_channel.main]\n}\n"
    non_compliant: '# aws_config_configuration_recorder absent from Terraform configuration

      # WAF-SEC-090 violation: AWS Config is not deployed in this account

      '
  scope:
    block_type: resource
    resource_types:
    - aws_config_configuration_recorder
  assertions:
  - attribute: name
    op: attribute_exists
    message: AWS Config configuration recorder must have a name attribute defined.
  - attribute: recording_group
    op: attribute_exists
    message: AWS Config configuration recorder must have a recording_group block specifying which resources to record.
  on_fail: violation
- id: waf-sec-090.tf.aws.config-delivery-channel
  engine: terraform
  automated: true
  title: AWS Config delivery channel must be configured
  provider: aws
  description: An aws_config_delivery_channel resource must exist pointing to a valid S3 bucket for configuration snapshot
    delivery. This ensures compliance history is persisted and available for audit.
  expected: 'true'
  remediation: Create an aws_config_delivery_channel resource with s3_bucket_name pointing to a dedicated logging bucket.
    Optionally configure sns_topic_arn to receive configuration change notifications and compliance state change notifications.\n
  example:
    compliant: "resource \"aws_config_delivery_channel\" \"main\" {\n  name           = \"default\"\n  s3_bucket_name = aws_s3_bucket.config_logs.bucket\n\
      \  sns_topic_arn  = aws_sns_topic.config_notifications.arn\n  snapshot_delivery_properties {\n    delivery_frequency\
      \ = \"TwentyFour_Hours\"\n  }\n  depends_on = [aws_config_configuration_recorder.main]\n}\n"
    non_compliant: '# aws_config_delivery_channel resource absent

      # WAF-SEC-090 violation: Config findings not delivered to any persistent destination

      '
  scope:
    block_type: resource
    resource_types:
    - aws_config_delivery_channel
  assertions:
  - attribute: name
    op: attribute_exists
    message: AWS Config delivery channel must have a name attribute.
  on_fail: violation
- id: waf-sec-090.tf.azurerm.policy-assignment-audit
  engine: terraform
  automated: true
  title: Azure Policy assignments must enforce or audit compliance controls
  provider: azurerm
  description: At least one azurerm_policy_assignment resource must exist with a non-empty policy_definition_id and enforcement_mode
    set to "Default" so that compliance controls are expressed as machine-readable policies.
  expected: 'true'
  remediation: Create azurerm_policy_assignment resources using built-in or custom azurerm_policy_definition definitions that
    audit/enforce required controls (e.g., allowed locations, required tags, encryption). Set enforcement_mode to "Default".\n
  example:
    compliant: "resource \"azurerm_policy_definition\" \"require_tag\" {\n  name         = \"require-owner-tag\"\n  policy_type\
      \  = \"Custom\"\n  mode         = \"Indexed\"\n  display_name = \"Require owner tag on resources\"\n  policy_rule  =\
      \ jsonencode({})\n}\n\nresource \"azurerm_policy_assignment\" \"require_tag\" {\n  name                 = \"require-owner-tag\"\
      \n  scope                = data.azurerm_subscription.current.id\n  policy_definition_id = azurerm_policy_definition.require_tag.id\n\
      \  enforcement_mode     = \"Default\"\n}\n"
    non_compliant: '# No azurerm_policy_assignment resources exist.

      # WAF-SEC-090 violation: Azure Policy not used to enforce compliance controls

      '
  scope:
    block_type: resource
    resource_types:
    - azurerm_policy_assignment
  assertions:
  - attribute: policy_definition_id
    op: attribute_exists
    message: Azure Policy assignment must reference a policy definition.
  - attribute: enforcement_mode
    op: equals
    message: Azure Policy assignment must be in Default enforcement mode.
    expected: Default
  on_fail: violation
- id: waf-sec-090.tf.google.org-policy-constraint
  engine: terraform
  automated: true
  title: GCP organization policies must express compliance constraints
  provider: google
  description: A google_org_policy_policy resource must exist with at least one rule enforcing a constraint (e.g., restricted
    locations, disable service account key creation) so that compliance controls are machine-readable.
  expected: 'true'
  remediation: Create google_org_policy_policy resources for constraints relevant to the workload (e.g., iam.disableServiceAccountKeyCreation,
    gcp.resourceLocations). Use enforce = true for mandatory controls.\n
  example:
    compliant: "resource \"google_org_policy_policy\" \"disable_sa_keys\" {\n  name   = \"projects/${var.project_id}/policies/iam.disableServiceAccountKeyCreation\"\
      \n  parent = \"projects/${var.project_id}\"\n\n  spec {\n    rules {\n      enforce = \"TRUE\"\n    }\n  }\n}\n"
    non_compliant: '# No google_org_policy_policy resources enforce compliance constraints.

      # WAF-SEC-090 violation: GCP organization policy constraints missing

      '
  scope:
    block_type: resource
    resource_types:
    - google_org_policy_policy
  assertions:
  - attribute: spec
    op: attribute_exists
    message: GCP organization policy must define a spec with enforcement rules.
  on_fail: violation
- id: waf-sec-090.config.stackit.stackit-identity-access
  engine: config
  automated: true
  title: STACKIT compliance controls must be expressed as documented policies
  provider: stackit
  description: A version-controlled policy document must exist at `docs/security/waf-sec-090-stackit-identity-access.md` and
    document the STACKIT implementation of this control. The checker validates that the file exists and contains a normative
    requirement statement (MUST/SHALL/required/mandatory).
  expected: 'true'
  remediation: 'Create or update `docs/security/waf-sec-090-stackit-identity-access.md`. State the requirement, how it is
    implemented for STACKIT, the review cadence, and the owner.

    '
  example:
    compliant: '|

      docs/security/waf-sec-090-stackit-identity-access.md:

      - The STACKIT implementation of WAF-SEC-090 is documented.

      - Implementation status and owner are recorded.

      - Review cadence is defined (e.g. quarterly).

      '
    non_compliant: '|

      # `docs/security/waf-sec-090-stackit-identity-access.md` is missing or does not contain a normative requirement.

      # WAF-SEC-090 violation: STACKIT control is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/security/waf-sec-090-stackit-identity-access.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/security/waf-sec-090-stackit-identity-access.md` must contain a normative requirement statement.
  on_fail: violation
