id: WAF-PERF-070
title: All production workloads MUST be deployed with network topology optimized...
status: active
tags:
- performance
- medium
- configuration
- governance
pillar: efficiancy
severity: medium
type:
- configuration
- governance
category: network-encryption
rationale: Unencrypted data transfer enables eavesdropping, man-in-the-middle attacks, and violations of data-protection and
  compliance requirements. This control addresses the requirements of the 'Network Encryption' area and ensures that All production
  workloads MUST be deployed with network topology optimized for latency.
threat:
- Internet-facing resources or open management ports become direct attack vectors.
- Lateral movement is easier when network segmentation and access rules are missing.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform checks or IaC gates automatically validate the requirement in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-efficiancy/pages/controls/WAF-PERF-070.adoc
  related_controls:
  - WAF-REL-020
  - WAF-REL-030
  - WAF-SUS-080
  - WAF-PERF-060
  - WAF-PERF-030
  - WAF-SEC-010
  - WAF-SEC-020
  - WAF-SEC-060
  - WAF-SOV-020
  - WAF-SOV-060
  - WAF-AGN-010
  - WAF-AGN-080
description: 'All production workloads MUST be deployed with network topology optimized for latency. Services that communicate
  frequently MUST be co-located in the same availability zone or use VPC peering to avoid cross-region traversal. Content
  Delivery Networks (CDN) MUST be used for all public-facing static and cacheable content. VPC Endpoints MUST be used for
  internal AWS service traffic to avoid internet routing. Cross-AZ data transfer costs and latency MUST be evaluated and minimized
  in service topology design.

  '
regulatory_mapping:
- framework: ISO/IEC 25010
  controls:
  - Performance Efficiency – Time Behavior
checks:
- id: waf-perf-070.tf.aws.vpc-endpoint-s3
  engine: terraform
  automated: true
  title: AWS VPCs with private subnets must have S3 Gateway VPC Endpoints
  provider: aws
  description: VPCs containing private subnets that access S3 must use Gateway VPC Endpoints to avoid internet routing and
    reduce latency and data transfer costs.
  expected: 'true'
  remediation: Create an aws_vpc_endpoint resource for S3 with vpc_endpoint_type = "Gateway" and associate it with private
    route tables. This routes S3 traffic via AWS backbone.\n
  example:
    compliant: "resource \"aws_vpc_endpoint\" \"s3\" {\n  vpc_id            = aws_vpc.main.id\n  service_name      = \"com.amazonaws.${var.region}.s3\"\
      \n  vpc_endpoint_type = \"Gateway\"\n  route_table_ids   = [aws_route_table.private.id]\n  tags = { Name = \"vpce-s3-${var.environment}\"\
      \ }\n}\nresource \"aws_vpc_endpoint\" \"dynamodb\" {\n  vpc_id            = aws_vpc.main.id\n  service_name      = \"\
      com.amazonaws.${var.region}.dynamodb\"\n  vpc_endpoint_type = \"Gateway\"\n  route_table_ids   = [aws_route_table.private.id]\n\
      }\n"
    non_compliant: "# No VPC Endpoints defined\n# S3 and DynamoDB traffic routes via internet gateway\nresource \"aws_vpc\"\
      \ \"main\" {\n  cidr_block = \"10.0.0.0/16\"\n  # All service traffic exits to internet – WAF-PERF-070 violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_vpc_endpoint
  assertions:
  - attribute: service_name
    op: matches
    message: VPC Endpoint should be configured for S3 service.
    pattern: .*\\.s3$
  - attribute: vpc_endpoint_type
    op: equals
    message: S3 VPC Endpoint must be Gateway type.
    expected: Gateway
  on_fail: advisory
- id: waf-perf-070.tf.azurerm.cdn-profile-configured
  engine: terraform
  automated: true
  title: Azure applications with public endpoints should use CDN or Front Door
  provider: azurerm
  description: Public-facing Azure applications should use Azure CDN or Azure Front Door to cache static content and reduce
    origin load and end-user latency.
  expected: 'true'
  remediation: Deploy azurerm_cdn_profile with endpoints for static content delivery. For global applications, use Azure Front
    Door for routing and caching.\n
  example:
    compliant: "resource \"azurerm_cdn_profile\" \"main\" {\n  name                = \"cdn-payment-frontend\"\n  resource_group_name\
      \ = azurerm_resource_group.main.name\n  location            = \"global\"\n  sku                 = \"Standard_Microsoft\"\
      \n}\nresource \"azurerm_cdn_endpoint\" \"static\" {\n  name                = \"static-assets\"\n  profile_name     \
      \   = azurerm_cdn_profile.main.name\n  resource_group_name = azurerm_resource_group.main.name\n  location          \
      \  = \"global\"\n  origin {\n    name      = \"storage-origin\"\n    host_name = azurerm_storage_account.static.primary_blob_host\n\
      \  }\n}\n"
    non_compliant: '# No CDN or Front Door configured

      # All static content served directly from Storage Account or App Service

      # – WAF-PERF-070 violation

      '
  scope:
    block_type: resource
    resource_types:
    - azurerm_cdn_profile
    - azurerm_frontdoor
    - azurerm_cdn_frontdoor_profile
  assertions:
  - attribute: sku
    op: not_empty
    message: CDN profile must have SKU defined.
  on_fail: advisory
- id: waf-perf-070.tf.google.cloud-cdn-enabled
  engine: terraform
  automated: true
  title: GCP backends with public traffic should have Cloud CDN enabled
  provider: google
  description: GCP HTTP(S) Load Balancer backend services serving public content should have Cloud CDN enabled to reduce origin
    latency and improve user experience.
  expected: 'true'
  remediation: Set enable_cdn = true on google_compute_backend_service for external load balancers. Configure cdn_policy with
    appropriate cache mode and TTL settings.\n
  example:
    compliant: "resource \"google_compute_backend_service\" \"frontend\" {\n  name                  = \"backend-payment-frontend\"\
      \n  protocol              = \"HTTP\"\n  load_balancing_scheme = \"EXTERNAL\"\n  enable_cdn            = true\n  cdn_policy\
      \ {\n    cache_mode                   = \"CACHE_ALL_STATIC\"\n    default_ttl                  = 3600\n    client_ttl\
      \                   = 3600\n    negative_caching             = true\n    serve_while_stale            = 86400\n  }\n\
      \  backend {\n    group = google_compute_instance_group.frontend.id\n  }\n}\n"
    non_compliant: "resource \"google_compute_backend_service\" \"frontend\" {\n  name                  = \"backend-payment-frontend\"\
      \n  protocol              = \"HTTP\"\n  load_balancing_scheme = \"EXTERNAL\"\n  enable_cdn            = false  # CDN\
      \ disabled – WAF-PERF-070 violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_compute_backend_service
  assertions:
  - attribute: enable_cdn
    op: is_true
    message: External backend service should have Cloud CDN enabled.
  on_fail: advisory
- id: waf-perf-070.tf.stackit.database-performance-reviewed
  engine: terraform
  automated: true
  title: All production workloads for stackit
  provider: stackit
  description: All production workloads must be documented in IaC via a database-performance-reviewed tag/label on stackit_project.
    This validates the control is tracked as code.
  expected: 'true'
  remediation: 'Add a database-performance-reviewed tag/label to the stackit_project resource to show the stackit implementation
    of WAF-PERF-070 is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    database-performance-reviewed = \"true\"\n\
      \  }\n}\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing database-performance-reviewed labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: database-performance-reviewed
    message: stackit_project is missing the database-performance-reviewed tag/label.
  on_fail: violation
