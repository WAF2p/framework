# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-PERF-070
id: WAF-PERF-070
pillar: performance
severity: medium
type:
  - configuration
  - governance
description: |
  All production workloads MUST be deployed with network topology optimized for latency. Services that communicate frequently MUST be co-located in the same availability zone or use VPC peering to avoid cross-region traversal. Content Delivery Networks (CDN) MUST be used for all public-facing static and cacheable content. VPC Endpoints MUST be used for internal AWS service traffic to avoid internet routing. Cross-AZ data transfer costs and latency MUST be evaluated and minimized in service topology design.
regulatory_mapping:
  - framework: 'ISO/IEC 25010'
    controls:
      - 'Performance Efficiency – Time Behavior'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'PERF 3 – How do you select your networking solution?'
      - 'COST 9 – How do you manage demand and supply resources?'
  - framework: 'Azure Well-Architected Framework'
    controls:
      - 'Performance Efficiency – Optimize network performance'
  - framework: 'Google Cloud Architecture Framework'
    controls:
      - 'Network design – Optimize for latency'
checks:
  - id: waf-perf-070.tf.aws.vpc-endpoint-s3
    engine: terraform
    automated: true
    title: 'AWS VPCs with private subnets must have S3 Gateway VPC Endpoints'
    provider: aws
    description: 'VPCs containing private subnets that access S3 must use Gateway VPC Endpoints to avoid internet routing and reduce latency and data transfer costs.'
    expected: 'true'
    remediation: 'Create an aws_vpc_endpoint resource for S3 with vpc_endpoint_type = "Gateway" and associate it with private route tables. This routes S3 traffic via AWS backbone.\n'
    example:
      compliant: |
        resource "aws_vpc_endpoint" "s3" {
          vpc_id            = aws_vpc.main.id
          service_name      = "com.amazonaws.${var.region}.s3"
          vpc_endpoint_type = "Gateway"
          route_table_ids   = [aws_route_table.private.id]
          tags = { Name = "vpce-s3-${var.environment}" }
        }
        resource "aws_vpc_endpoint" "dynamodb" {
          vpc_id            = aws_vpc.main.id
          service_name      = "com.amazonaws.${var.region}.dynamodb"
          vpc_endpoint_type = "Gateway"
          route_table_ids   = [aws_route_table.private.id]
        }
        
      non_compliant: |
        # No VPC Endpoints defined
        # S3 and DynamoDB traffic routes via internet gateway
        resource "aws_vpc" "main" {
          cidr_block = "10.0.0.0/16"
          # All service traffic exits to internet – WAF-PERF-070 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_vpc_endpoint
    assertions:
      - attribute: 'service_name'
        op: 'matches'
        message: 'VPC Endpoint should be configured for S3 service.'
        pattern: '.*\\.s3$'
      - attribute: 'vpc_endpoint_type'
        op: 'equals'
        message: 'S3 VPC Endpoint must be Gateway type.'
    on_fail: advisory
  - id: waf-perf-070.tf.azurerm.cdn-profile-configured
    engine: terraform
    automated: true
    title: 'Azure applications with public endpoints should use CDN or Front Door'
    provider: azurerm
    description: 'Public-facing Azure applications should use Azure CDN or Azure Front Door to cache static content and reduce origin load and end-user latency.'
    expected: 'true'
    remediation: 'Deploy azurerm_cdn_profile with endpoints for static content delivery. For global applications, use Azure Front Door for routing and caching.\n'
    example:
      compliant: |
        resource "azurerm_cdn_profile" "main" {
          name                = "cdn-payment-frontend"
          resource_group_name = azurerm_resource_group.main.name
          location            = "global"
          sku                 = "Standard_Microsoft"
        }
        resource "azurerm_cdn_endpoint" "static" {
          name                = "static-assets"
          profile_name        = azurerm_cdn_profile.main.name
          resource_group_name = azurerm_resource_group.main.name
          location            = "global"
          origin {
            name      = "storage-origin"
            host_name = azurerm_storage_account.static.primary_blob_host
          }
        }
        
      non_compliant: |
        # No CDN or Front Door configured
        # All static content served directly from Storage Account or App Service
        # – WAF-PERF-070 violation
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_cdn_profile
        - azurerm_frontdoor
        - azurerm_cdn_frontdoor_profile
    assertions:
      - attribute: 'sku'
        op: 'not_empty'
        message: 'CDN profile must have SKU defined.'
    on_fail: advisory
  - id: waf-perf-070.tf.google.cloud-cdn-enabled
    engine: terraform
    automated: true
    title: 'GCP backends with public traffic should have Cloud CDN enabled'
    provider: google
    description: 'GCP HTTP(S) Load Balancer backend services serving public content should have Cloud CDN enabled to reduce origin latency and improve user experience.'
    expected: 'true'
    remediation: 'Set enable_cdn = true on google_compute_backend_service for external load balancers. Configure cdn_policy with appropriate cache mode and TTL settings.\n'
    example:
      compliant: |
        resource "google_compute_backend_service" "frontend" {
          name                  = "backend-payment-frontend"
          protocol              = "HTTP"
          load_balancing_scheme = "EXTERNAL"
          enable_cdn            = true
          cdn_policy {
            cache_mode                   = "CACHE_ALL_STATIC"
            default_ttl                  = 3600
            client_ttl                   = 3600
            negative_caching             = true
            serve_while_stale            = 86400
          }
          backend {
            group = google_compute_instance_group.frontend.id
          }
        }
        
      non_compliant: |
        resource "google_compute_backend_service" "frontend" {
          name                  = "backend-payment-frontend"
          protocol              = "HTTP"
          load_balancing_scheme = "EXTERNAL"
          enable_cdn            = false  # CDN disabled – WAF-PERF-070 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - google_compute_backend_service
    assertions:
      - attribute: 'enable_cdn'
        op: 'is_true'
        message: 'External backend service should have Cloud CDN enabled.'
    on_fail: advisory
