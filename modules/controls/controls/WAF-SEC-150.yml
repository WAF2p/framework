id: WAF-SEC-150
title: Vulnerability and patch management MUST cover compute instances, operating systems, and endpoints
status: active
tags:
- configuration
- governance
- high
- security
pillar: security
severity: high
type:
- governance
- configuration
category: container-security
rationale: Ungepatchte Systeme und fehlende Endpunkterkennung erweitern die Angriffsfläche und verlängern die Zeit bis zur
  Incident-Erkennung. Dieses Control adressiert die Anforderungen des Bereichs 'Container Security' und stellt sicher, dass
  All virtual machines, bare-metal servers, and container hosts MUST receive automated security patche...
threat:
- Unpatched operating systems and endpoints are primary entry points for malware and lateral movement.
- Missing EDR delays detection of compromised instances and impedes incident response.
implementation_guidance:
- Document the requirement in a version-controlled policy, ADR, or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - Die Anforderung ist nicht einheitlich umgesetzt; Nachweis existiert nur punktuell oder fehlt.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - Eine dokumentierte Policy oder ein Standard beschreibt die Anforderung.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform-Checks oder IaC-Gates prüfen die Anforderung automatisch in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Abdeckung, Ausnahmen und Qualitätsmetriken werden quartalsweise berichtet.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Die Effektivität wird kontinuierlich gemessen und automatisch optimiert.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-security/pages/controls/WAF-SEC-150.adoc
  related_controls:
  - WAF-SEC-070
  - WAF-SEC-120
  - WAF-SEC-130
  - WAF-SEC-010
  - WAF-SEC-100
  - WAF-OPS-030
  - WAF-SOV-120
description: All virtual machines, bare-metal servers, and container hosts MUST receive automated security patches within
  defined SLAs. Critical vulnerabilities MUST be remediated within 7 days and high vulnerabilities within 30 days. Endpoint
  Detection and Response (EDR) MUST be deployed on all production instances. Patch compliance and scan results MUST be centrally
  reported and reviewed.
regulatory_mapping:
- framework: ISO 27001:2022
  controls:
  - A.8.7 – Protection against malware
  - A.8.8 – Management of technical vulnerabilities
- framework: CIS Controls v8
  controls:
  - CIS 7 – Continuous Vulnerability Management
- framework: PCI DSS v4.0
  controls:
  - Req 6 – Develop and maintain secure systems and software
- framework: SOC 2 Type II
  controls:
  - CC7.1 – Vulnerability detection
- framework: GDPR
  controls:
  - Art. 32 – Security of processing
- framework: NIS2
  controls:
  - Art. 21(2)(g) – Vulnerability handling and disclosure
- framework: DORA
  controls:
  - Art. 9 – Protection and prevention
- framework: BSI C5:2020
  controls:
  - INF-07 – Vulnerability management
- framework: NIST SP 800-53
  controls:
  - RA-5 – Vulnerability Scanning
  - SI-2 – Flaw Remediation
- framework: NIST CSF 2.0
  controls:
  - RS.MA-01 – Vulnerability management
checks:
- id: waf-sec-150.config.patch-policy-documented
  engine: config
  provider: any
  automated: false
  title: OS patch policy and EDR coverage must be documented
  description: OS patch policy and EDR coverage must be documented
  expected: 'true'
  remediation: OS patch policy and EDR coverage must be documented
  scope:
    block_type: file
    path_pattern: docs/security/patch-management.md
  assertions:
  - attribute: exists
    op: attribute_exists
    message: Patch management policy must exist and cover SLA and EDR.
  on_fail: finding
- id: waf-sec-150.tf.aws.ssm-patch-manager
  engine: terraform
  provider: aws
  automated: true
  title: AWS SSM Patch Manager must be configured for managed instances
  description: AWS SSM Patch Manager must be configured for managed instances
  expected: 'true'
  remediation: AWS SSM Patch Manager must be configured for managed instances
  scope:
    block_type: resource
    resource_types:
    - aws_ssm_patch_baseline
    - aws_ssm_association
  assertions:
  - attribute: name
    op: attribute_exists
    message: Patch baseline must be defined.
  on_fail: finding
- id: waf-sec-150.tf.azurerm.mde-deployed
  engine: terraform
  provider: azurerm
  automated: true
  title: Azure VMs must have Microsoft Defender for Endpoint extension deployed
  description: Azure VMs must have Microsoft Defender for Endpoint extension deployed
  expected: 'true'
  remediation: Azure VMs must have Microsoft Defender for Endpoint extension deployed
  scope:
    block_type: resource
    resource_types:
    - azurerm_virtual_machine_extension
  assertions:
  - attribute: type
    op: in
    expected:
    - MicrosoftMonitoringAgent
    - MDE.Windows
    - MDE.Linux
    message: VM must have Defender for Endpoint or monitoring extension.
  on_fail: finding
