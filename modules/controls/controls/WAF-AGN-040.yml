checks:
- id: waf-agn-040.tf.aws.memory-versioning-enabled
  engine: terraform
  automated: true
  title: Agent memory must be versioned
  provider: aws
  description: AWS Bedrock agent memory (sessions, context) must be versioned using DynamoDB versioned tables or S3 versioned
    buckets. Memory changes must be tracked with timestamps and version IDs.
  expected: 'true'
  remediation: Configure versioning on DynamoDB tables or S3 buckets used for agent memory. Use AWS SDK to track memory version
    IDs with each agent interaction.\n
  example:
    compliant: "resource \"aws_dynamodb_table\" \"agent_memory\" {\n  name         = \"agent-memory\"\n  billing_mode = \"\
      PAY_PER_REQUEST\"\n  hash_key     = \"session_id\"\n\n  attribute {\n    name = \"session_id\"\n    type = \"S\"\n \
      \ }\n\n  attribute {\n    name = \"version\"\n    type = \"S\"\n  }\n\n  global_secondary_index {\n    name = \"version-index\"\
      \n    hash_key = \"session_id\"\n    range_key = \"version\"\n  }\n\n  # Versioning enabled via application logic\n\
      }\n"
    non_compliant: "resource \"aws_dynamodb_table\" \"agent-memory\" {\n  name         = \"agent-memory\"\n  billing_mode\
      \ = \"PAY_PER_REQUEST\"\n  # No versioning tracking\n  # WAF-AGN-040 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_dynamodb_table
    - aws_s3_bucket
  assertions:
  - attribute: name
    op: not_empty
    message: Memory table must have versioning configuration.
  on_fail: violation
- id: waf-agn-040.tf.aws.state-persistence-enabled
  engine: terraform
  automated: true
  title: Agent state must be persistently stored
  provider: aws
  description: Agent state (conversation history, context, preferences) must be persistently stored in DynamoDB, S3, or RDS.
    In-memory state (Redis/ElastiCache) must have replication and automatic backup configured.
  expected: 'true'
  remediation: Configure persistent storage for agent state. Use DynamoDB tables with point-in-time recovery enabled, or S3
    buckets with versioning. Configure backup policies for all state storage.\n
  example:
    compliant: "resource \"aws_dynamodb_table\" \"agent_state\" {\n  name         = \"agent-state\"\n  billing_mode = \"PAY_PER_REQUEST\"\
      \n  hash_key     = \"agent_id\"\n\n  attribute {\n    name = \"agent_id\"\n    type = \"S\"\n  }\n\n  point_in_time_recovery\
      \ {\n    enabled = true\n  }\n\n  ttl {\n    attribute_name = \"expires_at\"\n    enabled        = true\n  }\n}\n"
    non_compliant: "resource \"aws_dynamodb_table\" \"no_persistence\" {\n  name         = \"temp-state\"\n  billing_mode\
      \ = \"PAY_PER_REQUEST\"\n  # No point-in-time recovery\n  # WAF-AGN-040 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_dynamodb_table
    - aws_s3_bucket
    - aws_rds_cluster
  assertions:
  - attribute: name
    op: not_empty
    message: State storage must have persistence configured.
  on_fail: violation
- id: waf-agn-040.tf.aws.memory-audit-logging
  engine: terraform
  automated: true
  title: Memory and state changes must be audited
  provider: aws
  description: All memory and state modifications must be logged to CloudWatch Logs or CloudTrail. Logs must include agent
    ID, operation type (read/write/delete), timestamp, and data modified.
  expected: 'true'
  remediation: Configure CloudWatch Logs or CloudTrail to capture memory/state changes. Use Lambda triggers on DynamoDB streams
    to log all modifications with full audit trail.\n
  example:
    compliant: "resource \"aws_cloudwatch_log_group\" \"memory_audit\" {\n  name = \"/aws/bedrock/memory-audit\"\n}\n\nresource\
      \ \"aws_lambda_function\" \"memory_audit_log\" {\n  function_name = \"memory-audit-log\"\n  # Triggers on DynamoDB stream\n\
      \  # Logs all modifications\n}\n\nresource \"aws_dynamodb_table\" \"agent_memory\" {\n  # With stream enabled for audit\n\
      \  stream_enabled = true\n  stream_view_type = \"NEW_AND_OLD_IMAGES\"\n}\n"
    non_compliant: "resource \"aws_dynamodb_table\" \"no_audit\" {\n  name = \"agent-memory\"\n  # No stream enabled, no audit\
      \ logging\n  # WAF-AGN-040 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_dynamodb_table
    - aws_cloudwatch_log_group
  assertions:
  - attribute: stream_enabled
    op: is_true
    message: Memory table must have stream enabled for audit logging.
  on_fail: violation
- id: waf-agn-040.tf.azurerm.cosmosdb-backup-configured
  engine: terraform
  automated: true
  title: Azure Cosmos DB agent memory must have backup and versioning configured
  provider: azurerm
  description: Azure Cosmos DB accounts used for agent memory/state must have periodic backup configured to prevent data loss
    and enable recovery.
  expected: 'true'
  remediation: 'Configure backup on azurerm_cosmosdb_account with periodic backup or continuous backup. Enable point-in-time
    restore where supported.

    '
  example:
    compliant: "resource \"azurerm_cosmosdb_account\" \"agent_memory\" {\n  name                = \"agent-memory-cosmos\"\n\
      \  location            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n\
      \  offer_type          = \"Standard\"\n  kind                = \"GlobalDocumentDB\"\n\n  backup {\n    type        \
      \        = \"Periodic\"\n    interval_in_minutes = 240\n    retention_in_hours  = 168\n    storage_redundancy    = \"\
      Local\"\n  }\n}\n"
    non_compliant: "resource \"azurerm_cosmosdb_account\" \"agent_memory\" {\n  name                = \"agent-memory-cosmos\"\
      \n  location            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n\
      \  offer_type          = \"Standard\"\n  # No backup block configured\n  # WAF-AGN-040 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_cosmosdb_account
  assertions:
  - attribute: backup
    op: attribute_exists
    message: Cosmos DB account used for agent memory must have backup configured.
  on_fail: violation
- id: waf-agn-040.tf.google.firestore-backup-audit
  engine: terraform
  automated: true
  title: GCP Firestore agent memory must have backup and audit logging configured
  provider: google
  description: GCP Firestore databases used for agent memory/state must have backup (PITR) enabled and audit logging configured
    to track memory changes.
  expected: 'true'
  remediation: 'Configure google_firestore_database with point_in_time_recovery_enablement enabled. Enable Cloud Audit Logs
    for datastore.googleapis.com.

    '
  example:
    compliant: "resource \"google_firestore_database\" \"agent_memory\" {\n  name        = \"agent-memory\"\n  location_id\
      \ = \"eur3\"\n  type        = \"FIRESTORE_NATIVE\"\n  point_in_time_recovery_enablement = \"POINT_IN_TIME_RECOVERY_ENABLED\"\
      \n}\n\nresource \"google_logging_project_sink\" \"firestore_audit\" {\n  name        = \"firestore-audit-sink\"\n  destination\
      \ = \"bigquery.googleapis.com/projects/my-project/datasets/firestore_audit\"\n  filter      = \"protoPayload.serviceName=\"\
      firestore.googleapis.com\"\"\n}\n"
    non_compliant: "resource \"google_firestore_database\" \"agent_memory\" {\n  name        = \"agent-memory\"\n  location_id\
      \ = \"eur3\"\n  type        = \"FIRESTORE_NATIVE\"\n  # No point-in-time recovery enabled\n  # WAF-AGN-040 Violation\n\
      }\n"
  scope:
    block_type: resource
    resource_types:
    - google_firestore_database
    - google_logging_project_sink
  assertions:
  - attribute: point_in_time_recovery_enablement
    op: equals
    expected: POINT_IN_TIME_RECOVERY_ENABLED
    message: Firestore database must have point-in-time recovery enabled for agent memory.
  on_fail: violation
- id: waf-agn-040.tf.stackit.agentic-memory-managed
  engine: terraform
  automated: true
  title: Memories and states must be managed consistently for stackit
  provider: stackit
  description: Memories and states must be managed consistently must be documented in IaC via a agentic-memory-managed tag/label
    on stackit_project. This validates the control is tracked as code.
  expected: 'true'
  remediation: 'Add a agentic-memory-managed tag/label to the stackit_project resource to show the stackit implementation
    of WAF-AGN-040 is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    agentic-memory-managed = \"true\"\n  }\n\
      }\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing agentic-memory-managed labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: agentic-memory-managed
    message: stackit_project is missing the agentic-memory-managed tag/label.
  on_fail: violation
