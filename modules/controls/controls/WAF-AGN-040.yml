checks:
  - id: waf-agn-040.tf.aws.memory-versioning-enabled
    engine: terraform
    automated: true
    title: 'Agenten-Memory muss versioniert sein'
    provider: aws
    description: 'AWS-Bedrock-Agenten-Memory (Sitzungen, Kontext) muss mithilfe versionierter DynamoDB-Tabellen oder versionierter S3-Buckets versioniert werden. Memory-Änderungen müssen mit Zeitstempeln und Versions-IDs nachverfolgt werden.'
    expected: 'true'
    remediation: 'Konfigurieren Sie Versionierung auf DynamoDB-Tabellen oder S3-Buckets, die für Agenten-Memory verwendet werden. Verwenden Sie das AWS SDK, um Memory-Versions-IDs bei jeder Agenten-Interaktion zu verfolgen.\n'
    example:
      compliant: |
        resource "aws_dynamodb_table" "agent_memory" {
          name         = "agent-memory"
          billing_mode = "PAY_PER_REQUEST"
          hash_key     = "session_id"

          attribute {
            name = "session_id"
            type = "S"
          }

          attribute {
            name = "version"
            type = "S"
          }

          global_secondary_index {
            name = "version-index"
            hash_key = "session_id"
            range_key = "version"
          }

          # Versionierung über Anwendungslogik aktiviert
        }
      non_compliant: |
        resource "aws_dynamodb_table" "agent-memory" {
          name         = "agent-memory"
          billing_mode = "PAY_PER_REQUEST"
          # Keine Versionsverfolgung
          # WAF-AGN-040 Verstoß
        }

    scope:
      block_type: resource
      resource_types:
        - aws_dynamodb_table
        - aws_s3_bucket
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Memory-Tabelle muss eine Versionskonfiguration besitzen.'
    on_fail: violation
  - id: waf-agn-040.tf.aws.state-persistence-enabled
    engine: terraform
    automated: true
    title: 'Agenten-State muss persistent gespeichert sein'
    provider: aws
    description: 'Agenten-State (Konversationsverlauf, Kontext, Präferenzen) muss persistent in DynamoDB, S3 oder RDS gespeichert werden. In-Memory-State (Redis/ElastiCache) muss Replikation und automatische Backups konfiguriert haben.'
    expected: 'true'
    remediation: 'Konfigurieren Sie persistenten Speicher für Agenten-State. Verwenden Sie DynamoDB-Tabellen mit aktiviertem Point-in-Time-Recovery oder S3-Buckets mit Versionierung. Konfigurieren Sie Backup-Richtlinien für alle State-Speicher.\n'
    example:
      compliant: |
        resource "aws_dynamodb_table" "agent_state" {
          name         = "agent-state"
          billing_mode = "PAY_PER_REQUEST"
          hash_key     = "agent_id"

          attribute {
            name = "agent_id"
            type = "S"
          }

          point_in_time_recovery {
            enabled = true
          }

          ttl {
            attribute_name = "expires_at"
            enabled        = true
          }
        }
      non_compliant: |
        resource "aws_dynamodb_table" "no_persistence" {
          name         = "temp-state"
          billing_mode = "PAY_PER_REQUEST"
          # Kein Point-in-Time-Recovery
          # WAF-AGN-040 Verstoß
        }

    scope:
      block_type: resource
      resource_types:
        - aws_dynamodb_table
        - aws_s3_bucket
        - aws_rds_cluster
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'State-Speicher muss Persistenz konfiguriert haben.'
    on_fail: violation
  - id: waf-agn-040.tf.aws.memory-audit-logging
    engine: terraform
    automated: true
    title: 'Memory- und State-Änderungen müssen auditiert werden'
    provider: aws
    description: 'Alle Memory- und State-Änderungen müssen in CloudWatch Logs oder CloudTrail protokolliert werden. Die Logs müssen Agenten-ID, Operationstyp (read/write/delete), Zeitstempel und geänderte Daten enthalten.'
    expected: 'true'
    remediation: 'Konfigurieren Sie CloudWatch Logs oder CloudTrail, um Memory/State-Änderungen zu erfassen. Verwenden Sie Lambda-Trigger auf DynamoDB-Streams, um alle Änderungen mit vollständigem Audit-Trail zu protokollieren.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_log_group" "memory_audit" {
          name = "/aws/bedrock/memory-audit"
        }

        resource "aws_lambda_function" "memory_audit_log" {
          function_name = "memory-audit-log"
          # Triggert auf DynamoDB-Stream
          # Protokolliert alle Änderungen
        }

        resource "aws_dynamodb_table" "agent_memory" {
          # Mit aktiviertem Stream für Audit
          stream_enabled = true
          stream_view_type = "NEW_AND_OLD_IMAGES"
        }
      non_compliant: |
        resource "aws_dynamodb_table" "no_audit" {
          name = "agent-memory"
          # Kein Stream aktiviert, kein Audit-Logging
          # WAF-AGN-040 Verstoß
        }

    scope:
      block_type: resource
      resource_types:
        - aws_dynamodb_table
        - aws_cloudwatch_log_group
    assertions:
      - attribute: 'stream_enabled'
        op: 'is_true'
        message: 'Memory-Tabelle muss einen aktivierten Stream für Audit-Logging besitzen.'
    on_fail: violation
