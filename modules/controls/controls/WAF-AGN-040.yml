    controls:
      - 'SC-28, SC-39 (Moderate baseline)'
  - framework: 'CMMC 2.0'
    controls:
      - 'SC.L2-3.8.1 –Protect data at rest'
  - framework: 'IT-Grundschutz'
    controls:
      - 'ORP.5 – Informationstechnisch-related Schutz'
  - framework: 'IRAP'
    controls:
      - 'ISM – Data protection'
