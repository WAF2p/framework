# ID: WAF-AGN-040
id: WAF-AGN-040
pillar: agentic
severity: high
type:
  - governance
  - configuration
description: |
  Erinnerungen und Zustände müssen konsistent verwaltet werden. Agenten-Memory MUSS versioniert sein und es MÜSSEN versionierte Memory-Stores verwendet werden. State-Persistence MUSS so konfiguriert sein, dass Datenverlust verhindert wird. Memory- und State-Änderungen MÜSSEN für Compliance auditiert werden.
