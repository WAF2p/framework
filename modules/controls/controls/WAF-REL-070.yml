references:
  narrative: 'modules/pillar-reliability/pages/controls/WAF-REL-070.adoc'
  related_controls: []

description: |
  All production workloads classified as critical or high availability MUST undergo documented Disaster Recovery (DR) testing at minimum twice per year. DR tests MUST validate actual RTO and RPO targets defined in the DR plan. Tests MUST cover complete failure scenarios: full region failover, database restore, and service reconstruction from IaC. Results MUST be documented and deviation from targets MUST trigger remediation within 30 days. DR plans MUST be reviewed and updated after every significant architecture change.
regulatory_mapping:
  - framework: 'ISO/IEC 27001:2022'
    controls:
      - 'A.17.1.3 – Verify, review and evaluate information security continuity'
  - framework: 'GDPR'
    controls:
      - 'Article 32 – Security of processing (resilience and recovery testing)'
  - framework: 'BSI C5:2022'
    controls:
      - 'RB-04 – Data Backup and Recovery'
      - 'RB-05 – Disaster Recovery'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'REL 14 – Plan for disaster recovery'
      - 'REL 13 – Test resiliency'
  - framework: 'ITIL 4'
    controls:
      - 'Service Continuity Management'
checks:
  - id: waf-rel-070.tf.aws.route53-health-check-failover
    engine: terraform
    automated: true
    title: 'AWS Route 53 failover routing must be configured for DR'
    provider: aws
    description: 'Production DNS entries for critical workloads must use Route 53 health check failover routing policies to enable automated DNS failover during regional events.'
    expected: 'true'
    remediation: 'Configure aws_route53_health_check with type, fqdn, port, resource_path, failure_threshold, and request_interval. Link to Route 53 failover records.\n'
    example:
      compliant: |
        resource "aws_route53_health_check" "primary" {
          fqdn              = "api.payment-service.example.com"
          port              = 443
          type              = "HTTPS"
          resource_path     = "/health/ready"
          failure_threshold = 3
          request_interval  = 10
          tags = {
            Name = "payment-api-health-check"
          }
        }
        
        resource "aws_route53_record" "primary" {
          zone_id = var.hosted_zone_id
          name    = "api.payment-service.example.com"
          type    = "A"
          failover_routing_policy {
            type = "PRIMARY"
          }
          set_identifier  = "primary"
          health_check_id = aws_route53_health_check.primary.id
          alias {
            name                   = aws_lb.primary.dns_name
            zone_id                = aws_lb.primary.zone_id
            evaluate_target_health = true
          }
        }
        
      non_compliant: |
        resource "aws_route53_record" "api" {
          zone_id = var.hosted_zone_id
          name    = "api.payment-service.example.com"
          type    = "A"
          ttl     = 300
          records = [var.primary_ip]
          # No failover routing, no health check – WAF-REL-070 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_route53_health_check
    assertions:
      - attribute: 'type'
        op: 'not_empty'
        message: 'Route 53 health check type must be specified.'
      - attribute: 'failure_threshold'
        op: 'attribute_exists'
        message: 'Health check failure threshold must be explicitly defined.'
      - attribute: 'request_interval'
        op: 'attribute_exists'
        message: 'Health check request interval must be defined.'
    on_fail: violation
  - id: waf-rel-070.tf.azurerm.traffic-manager-profile
    engine: terraform
    automated: true
    title: 'Azure Traffic Manager must be configured for failover routing'
    provider: azurerm
    description: 'Azure Traffic Manager profiles for critical workloads must use failover or performance routing methods with health checks enabled on all endpoints.'
    expected: 'true'
    remediation: 'Configure azurerm_traffic_manager_profile with traffic_routing_method = "Priority" and a monitor_config block with protocol, port, and path for health checks.\n'
    example:
      compliant: |
        resource "azurerm_traffic_manager_profile" "main" {
          name                   = "payment-api-dr"
          resource_group_name    = azurerm_resource_group.main.name
          traffic_routing_method = "Priority"
        
          dns_config {
            relative_name = "payment-api"
            ttl           = 30
          }
        
          monitor_config {
            protocol                     = "HTTPS"
            port                         = 443
            path                         = "/health/ready"
            interval_in_seconds          = 10
            timeout_in_seconds           = 9
            tolerated_number_of_failures = 3
          }
        }
        
      non_compliant: |
        resource "azurerm_traffic_manager_profile" "main" {
          name                   = "payment-api-dr"
          resource_group_name    = azurerm_resource_group.main.name
          traffic_routing_method = "Weighted"
          dns_config {
            relative_name = "payment-api"
            ttl           = 300
          }
          # Missing: monitor_config – no health checking
          # WAF-REL-070 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_traffic_manager_profile
    assertions:
      - attribute: 'traffic_routing_method'
        op: 'not_in'
        message: 'Traffic Manager should use Failover or Priority routing for DR, not only Weighted.'
      - attribute: 'monitor_config'
        op: 'attribute_exists'
        message: 'Traffic Manager must define monitor_config for endpoint health checking.'
    on_fail: violation
  - id: waf-rel-070.tf.google.dns-managed-zone-failover
    engine: terraform
    automated: true
    title: 'GCP Cloud DNS must have low TTL for disaster recovery scenarios'
    provider: google
    description: 'GCP Cloud DNS records for production services must use TTL values <= 60 seconds to enable rapid DNS-based failover during disaster recovery.'
    expected: 'true'
    remediation: 'Set ttl = 30 on google_dns_record_set for production service endpoints. Lower TTL reduces the DNS propagation window during failover events.\n'
    example:
      compliant: |
        resource "google_dns_record_set" "api" {
          name         = "api.payment-service.example.com."
          type         = "A"
          ttl          = 30
          managed_zone = google_dns_managed_zone.main.name
          rrdatas      = [google_compute_global_forwarding_rule.primary.ip_address]
        }
        
      non_compliant: |
        resource "google_dns_record_set" "api" {
          name         = "api.payment-service.example.com."
          type         = "A"
          ttl          = 3600  # WAF-REL-070 violation: 1 hour TTL prevents rapid DR
          managed_zone = google_dns_managed_zone.main.name
          rrdatas      = [var.primary_ip]
        }
        
    scope:
      block_type: resource
      resource_types:
        - google_dns_record_set
    assertions:
      - attribute: 'ttl'
        op: 'less_than_or_equal'
        message: 'DNS record TTL must be <= 60 seconds for DR scenarios to enable rapid failover.'
    on_fail: violation
