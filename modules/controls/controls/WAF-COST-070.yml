# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-COST-070
id: WAF-COST-070
pillar: cost
severity: medium
type:
  - configuration
  - governance
description: |
  Logging and observability resources MUST be organized in explicit retention tiers: Hot (7-30 days), Warm (30-90 days), Cold (90-365 days), Archive (>365 days). CloudWatch Log Groups MUST NOT have retention_in_days = 0 (infinite). Operational log groups MUST have retention_in_days <= 365. DEBUG-level logging in production is prohibited without Architecture Board justification. High-volume trace sampling MUST be configured for services with >1000 req/s.
regulatory_mapping:
  - framework: 'GDPR'
    controls:
      - 'Art. 5(1)(e) – Storage limitation (logs containing personal data must not be kept indefinitely)'
  - framework: 'FinOps Foundation'
    controls:
      - 'Optimize Phase – Observability Cost Management'
  - framework: 'Internal Governance'
    controls:
      - 'Retention Policy – Tiered Log Retention'
      - 'Cloud Cost Governance – Observability Cost Target < 20% of Total'
checks:
  - id: waf-cost-070.tf.aws.cloudwatch-retention-not-infinite
    engine: terraform
    automated: true
    title: 'CloudWatch Log Groups must not use infinite retention (retention_in_days = 0)'
    provider: aws
    description: 'aws_cloudwatch_log_group resources must have retention_in_days set to a value > 0. The value 0 means infinite retention. Omitting retention_in_days also results in infinite retention. Both configurations constitute Architectural Cost Debt.'
    expected: 'true'
    remediation: 'Set retention_in_days on all aws_cloudwatch_log_group resources. Recommended values by tier: operational=30, access=90, security-audit=365. Compliance-driven long retention: use S3 export + lifecycle instead of CloudWatch.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_log_group" "app_logs" {
          name              = "/app/production/payment-service"
          retention_in_days = 30
          tags = merge(module.mandatory_tags.tags, {
            log-tier = "hot"
            log-type = "operational"
          })
        }
        
      non_compliant: |
        resource "aws_cloudwatch_log_group" "app_logs" {
          name = "/app/production/payment-service"
          # retention_in_days omitted = infinite retention = violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_log_group
    assertions:
      - attribute: 'retention_in_days'
        op: 'attribute_exists'
        message: 'retention_in_days must be explicitly set. Missing value defaults to infinite retention.'
      - attribute: 'retention_in_days'
        op: 'greater_than_or_equal'
        message: 'retention_in_days must be >= 1. Value 0 means infinite retention (cost debt).'
    on_fail: violation
  - id: waf-cost-070.tf.aws.cloudwatch-operational-retention-max-365
    engine: terraform
    automated: true
    title: 'Operational CloudWatch Log Groups should have retention <= 365 days'
    provider: aws
    description: 'CloudWatch Log Groups tagged as operational (log-type = operational or log-tier = hot/warm) should have retention_in_days <= 365. Long-term compliance logs should be exported to S3 with lifecycle policies, not stored in CloudWatch indefinitely.'
    expected: 'true'
    remediation: 'For operational logs needing > 365 days retention: configure CloudWatch Logs subscription to export to S3, then apply S3 lifecycle policies for long-term archive. This is significantly cheaper than retaining in CloudWatch.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_log_group" "audit_logs" {
          name              = "/app/production/audit"
          retention_in_days = 90  # Within CloudWatch; exported to S3 via subscription for archival
          tags = merge(module.mandatory_tags.tags, {
            log-tier = "warm"
            log-type = "audit"
          })
        }
        # S3 export subscription configured separately with lifecycle to Glacier
        
      non_compliant: |
        resource "aws_cloudwatch_log_group" "everything" {
          name              = "/app/production/all"
          retention_in_days = 2555  # 7 years in CloudWatch = very expensive
          # Should be: 90d in CloudWatch, then S3 export with Glacier lifecycle
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_log_group
    assertions:
      - attribute: 'retention_in_days'
        op: 'less_than_or_equal'
        message: 'Operational log groups should have retention <= 365 days. Use S3 export for long-term retention.'
    on_fail: finding
