id: WAF-SEC-130
title: All data-storing resources (S3 buckets, RDS instances, DynamoDB tables,...
status: active
tags:
- security
- high
- configuration
- governance
pillar: security
severity: high
type:
- configuration
- governance
category: identity-access
rationale: Unkontrollierte Identitäten und übermäßige Berechtigungen ermöglichen Datendiebstahl, Lateral Movement und unautorisierte Änderungen an Produktivsystemen. Dieses Control adressiert die Anforderungen des Bereichs 'Identitäts- und Zugriffsmanagement' und stellt sicher, dass All data-storing resources (S3 buckets, RDS instances, DynamoDB tables, ElastiCache clusters) MUST carry a 'data-class' tag indicating the sensitivity level.
threat:
- Sensitive data is exposed if storage or transport lacks strong encryption.
- Compromised keys or weak key rotation extend the blast radius of a breach.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - Die Anforderung ist nicht einheitlich umgesetzt; Nachweis existiert nur punktuell oder fehlt.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - Eine dokumentierte Policy oder ein Standard beschreibt die Anforderung.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform-Checks oder IaC-Gates prüfen die Anforderung automatisch in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Abdeckung, Ausnahmen und Qualitätsmetriken werden quartalsweise berichtet.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Die Effektivität wird kontinuierlich gemessen und automatisch optimiert.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-security/pages/controls/WAF-SEC-130.adoc
  related_controls:
  - WAF-SEC-120
  - WAF-SEC-060
  - WAF-SEC-080
  - WAF-SEC-100
  - WAF-SEC-010
  - WAF-SEC-020
  - WAF-SEC-090
