checks:
  - id: waf-sec-130.tf.aws.data-class-tag-required
    engine: terraform
    automated: true
    title: 'Data-storing resources must carry a data-class tag'
    provider: aws
    description: "All data-storing resources (S3 buckets, RDS instances, RDS clusters, DynamoDB tables, ElastiCache clusters) must carry a 'data-class' tag indicating the sensitivity level of data stored in the resource. This tag enables automated policy enforcement, access control decisions, and GDPR Art. 30 data inventory generation."
    expected: 'true'
    remediation: 'Add a \'data-class\' tag to all data-storing resources with a value from the approved classification taxonomy (e.g., "public", "internal", "confidential", "pii", "health", "financial"). Enforce mandatory tagging via an AWS Config rule (required-tags) or an SCP denying CreateBucket, CreateDBInstance, CreateTable API calls without the required tag. Implement a tagging standard in your Terraform module library to make compliant resource creation the default path.\n'
    example:
      compliant: |
        resource "aws_db_instance" "app_db" {
          identifier        = "prod-application-db"
          engine            = "postgres"
          engine_version    = "16.1"
          instance_class    = "db.t3.medium"
          allocated_storage = 100
          storage_encrypted = true
          kms_key_id        = aws_kms_key.rds_pii.arn
          publicly_accessible = false
          db_subnet_group_name = aws_db_subnet_group.private.name
        
          tags = {
            environment = "production"
            owner       = "application-team"
            data-class  = "pii"       # Required data classification tag
          }
        }
        
        resource "aws_dynamodb_table" "sessions" {
          name         = "user-sessions"
          billing_mode = "PAY_PER_REQUEST"
          hash_key     = "session_id"
        
          attribute {
            name = "session_id"
            type = "S"
          }
        
          server_side_encryption {
            enabled     = true
            kms_key_arn = aws_kms_key.dynamodb_internal.arn
          }
        
          tags = {
            environment = "production"
            data-class  = "internal"
          }
        }
        
      non_compliant: |
        resource "aws_db_instance" "app_db" {
          identifier        = "prod-application-db"
          engine            = "postgres"
          instance_class    = "db.t3.medium"
          allocated_storage = 100
          # No tags at all – WAF-SEC-130 violation: data-class tag required
          # No storage_encrypted – encryption required for classified data
          # No publicly_accessible = false – WAF-SEC-130 violation (check 2)
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_s3_bucket
        - aws_db_instance
        - aws_rds_cluster
        - aws_dynamodb_table
        - aws_elasticache_cluster
    assertions:
      - attribute: 'tags'
        op: 'key_exists'
        message: "Data-storing resource MUST carry a 'data-class' tag (e.g., public, internal, confidential, pii, health, financial)."
        expected: 'data-class'
    on_fail: violation
  - id: waf-sec-130.tf.aws.db-not-publicly-accessible
    engine: terraform
    automated: true
    title: 'Database instances and clusters must not be publicly accessible'
    provider: aws
    description: 'All aws_db_instance and aws_rds_cluster resources must have publicly_accessible set to false to prevent direct database access from the internet. Publicly accessible databases expose authentication endpoints to brute-force attacks and vulnerability exploitation and are among the most common causes of catastrophic data breaches.'
    expected: 'true'
    remediation: 'Set publicly_accessible = false on all aws_db_instance and aws_rds_cluster resources. Place database resources in a private subnet group (aws_db_subnet_group) using subnets with no route to an Internet Gateway. Applications must connect to databases via private VPC networking; use AWS Systems Manager Session Manager port forwarding or a bastion host with restricted access for administrative database connections.\n'
    example:
      compliant: |
        resource "aws_db_instance" "main" {
          identifier             = "prod-db"
          engine                 = "postgres"
          engine_version         = "16.1"
          instance_class         = "db.t3.medium"
          allocated_storage      = 100
          storage_encrypted      = true
          kms_key_id             = aws_kms_key.rds.arn
          db_subnet_group_name   = aws_db_subnet_group.private.name
          vpc_security_group_ids = [aws_security_group.rds.id]
          publicly_accessible    = false
          deletion_protection    = true
        
          tags = {
            environment = "production"
            data-class  = "confidential"
          }
        }
        
      non_compliant: |
        resource "aws_db_instance" "main" {
          identifier          = "prod-db"
          engine              = "postgres"
          instance_class      = "db.t3.medium"
          allocated_storage   = 100
          publicly_accessible = true   # WAF-SEC-130 critical violation: database exposed to internet
          # No subnet group specified – may default to public subnets
          # No storage_encrypted – encryption not configured
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_db_instance
        - aws_rds_cluster
    assertions:
      - attribute: 'publicly_accessible'
        op: 'is_false'
        message: 'Database instance or cluster MUST NOT be publicly accessible. Set publicly_accessible = false and place in private subnet.'
    on_fail: violation
  - id: waf-sec-130.tf.aws.s3-public-access-blocked
    engine: terraform
    automated: true
    title: 'S3 buckets must have all public access block settings enabled'
    provider: aws
    description: 'All aws_s3_bucket_public_access_block resources must have block_public_acls, block_public_policy, ignore_public_acls, and restrict_public_buckets all set to true. All four settings are required to fully prevent S3 buckets from being made public through any mechanism including ACLs, bucket policies, or presigned URL configurations.'
    expected: 'true'
    remediation: 'Create an aws_s3_bucket_public_access_block resource for every aws_s3_bucket resource with all four settings set to true. Additionally, enable the S3 account-level block public access setting via the AWS Console or CLI to provide a safety net for any buckets created outside of Terraform. Use aws_s3_bucket_ownership_controls with object_ownership = "BucketOwnerEnforced" to disable ACL-based access entirely.\n'
    example:
      compliant: |
        resource "aws_s3_bucket" "data" {
          bucket = "company-application-data-prod"
          tags = {
            environment = "production"
            data-class  = "confidential"
          }
        }
        
        resource "aws_s3_bucket_public_access_block" "data" {
          bucket                  = aws_s3_bucket.data.id
          block_public_acls       = true
          block_public_policy     = true
          ignore_public_acls      = true
          restrict_public_buckets = true
        }
        
        resource "aws_s3_bucket_server_side_encryption_configuration" "data" {
          bucket = aws_s3_bucket.data.id
          rule {
            apply_server_side_encryption_by_default {
              sse_algorithm     = "aws:kms"
              kms_master_key_id = aws_kms_key.s3.arn
            }
            bucket_key_enabled = true
          }
        }
        
      non_compliant: |
        resource "aws_s3_bucket" "data" {
          bucket = "company-application-data-prod"
          # No aws_s3_bucket_public_access_block – WAF-SEC-130 critical violation
          # Bucket defaults may allow public access via ACL or bucket policy
        }
        
        resource "aws_s3_bucket_public_access_block" "data_partial" {
          bucket                  = aws_s3_bucket.data.id
          block_public_acls       = true
          block_public_policy     = false   # WAF-SEC-130 violation: bucket policy can make bucket public
          ignore_public_acls      = true
          restrict_public_buckets = false   # WAF-SEC-130 violation: public bucket access not restricted
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_s3_bucket_public_access_block
    assertions:
      - attribute: 'block_public_acls'
        op: 'is_true'
        message: 'S3 public access block: block_public_acls must be true.'
      - attribute: 'block_public_policy'
        op: 'is_true'
        message: 'S3 public access block: block_public_policy must be true.'
      - attribute: 'ignore_public_acls'
        op: 'is_true'
        message: 'S3 public access block: ignore_public_acls must be true.'
      - attribute: 'restrict_public_buckets'
        op: 'is_true'
        message: 'S3 public access block: restrict_public_buckets must be true.'
    on_fail: violation
