description: 'All data-storing resources (S3 buckets, RDS instances, DynamoDB tables, ElastiCache clusters) MUST carry a ''data-class'' tag indicating the sensitivity level (e.g., public, internal, confidential, pii, health, financial). Resources classified as ''pii'', ''health'', or ''financial'' MUST be encrypted with a customer-managed KMS key (CMK). Database instances MUST have publicly_accessible set to false. S3 buckets MUST have public access blocked via aws_s3_bucket_public_access_block with all four block settings enabled. No data store containing personal data under GDPR scope MUST be directly reachable from the internet.

  '
