# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-REL-020
id: WAF-REL-020
pillar: reliability
severity: high
type:
  - configuration
description: |
  All production services MUST expose health check endpoints and configure readiness and liveness probes. Load balancers and orchestrators MUST use health checks to route traffic only to healthy instances. Kubernetes workloads MUST define readinessProbe and livenessProbe. AWS load balancers MUST have health check paths configured. Health check intervals, thresholds, and timeout values MUST be explicitly defined – no reliance on cloud provider defaults.
regulatory_mapping:
  - framework: 'ISO/IEC 27001:2022'
    controls:
      - 'A.17.2 – Redundancies'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'REL 6 – Monitor workload resources'
      - 'REL 12 – Test reliability'
  - framework: 'ITIL 4'
    controls:
      - 'Availability Management'
      - 'Event Management'
  - framework: 'CNCF Cloud Native Security'
    controls:
      - 'Runtime Security – Health and Readiness'
checks:
  - id: waf-rel-020.tf.aws.alb-target-group-health-check
    engine: terraform
    automated: true
    title: 'AWS ALB target group must have explicit health check configuration'
    provider: aws
    description: 'AWS Application Load Balancer target groups must define an explicit health_check block with a non-default path, interval, timeout, and healthy/unhealthy thresholds.'
    expected: 'true'
    remediation: 'Add a health_check block to the aws_lb_target_group resource. Define path, interval, timeout, healthy_threshold, and unhealthy_threshold explicitly.\n'
    example:
      compliant: |
        resource "aws_lb_target_group" "api" {
          name     = "payment-api-tg"
          port     = 8080
          protocol = "HTTP"
          vpc_id   = var.vpc_id
        
          health_check {
            enabled             = true
            path                = "/health/ready"
            interval            = 15
            timeout             = 5
            healthy_threshold   = 2
            unhealthy_threshold = 3
            matcher             = "200"
          }
        }
        
      non_compliant: |
        resource "aws_lb_target_group" "api" {
          name     = "payment-api-tg"
          port     = 8080
          protocol = "HTTP"
          vpc_id   = var.vpc_id
          # Missing: health_check block – uses cloud defaults
          # WAF-REL-020 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_lb_target_group
    assertions:
      - attribute: 'health_check'
        op: 'attribute_exists'
        message: 'Target group must define a health_check block.'
      - attribute: 'health_check.path'
        op: 'not_empty'
        message: "Health check path must be explicitly defined (not default '/')."
      - attribute: 'health_check.interval'
        op: 'attribute_exists'
        message: 'Health check interval must be explicitly defined.'
      - attribute: 'health_check.healthy_threshold'
        op: 'attribute_exists'
        message: 'Healthy threshold must be explicitly defined.'
    on_fail: violation
  - id: waf-rel-020.tf.azurerm.lb-probe
    engine: terraform
    automated: true
    title: 'Azure Load Balancer must have a health probe configured'
    provider: azurerm
    description: 'Azure Load Balancer or Application Gateway backends must have explicit health probes defined with non-default paths and intervals.'
    expected: 'true'
    remediation: 'Define an azurerm_lb_probe resource with protocol, port, request_path, interval_in_seconds, and number_of_probes configured.\n'
    example:
      compliant: |
        resource "azurerm_lb_probe" "api_health" {
          loadbalancer_id     = azurerm_lb.main.id
          name                = "api-health-probe"
          protocol            = "Http"
          port                = 8080
          request_path        = "/health/ready"
          interval_in_seconds = 15
          number_of_probes    = 2
        }
        
      non_compliant: |
        resource "azurerm_lb_probe" "probe" {
          loadbalancer_id = azurerm_lb.main.id
          name            = "probe"
          protocol        = "Tcp"
          port            = 80
          # Missing: request_path – TCP probe does not validate application health
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_lb_probe
        - azurerm_application_gateway
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Health probe must have a name.'
      - attribute: 'protocol'
        op: 'not_empty'
        message: 'Health probe protocol must be specified.'
      - attribute: 'request_path'
        op: 'not_empty'
        message: 'Health probe request path must be explicitly configured.'
    on_fail: violation
  - id: waf-rel-020.tf.google.compute-health-check
    engine: terraform
    automated: true
    title: 'GCP Compute health check must be configured for managed instance groups'
    provider: google
    description: 'GCP managed instance groups and load balancers must use explicit health checks with HTTP paths and defined thresholds.'
    expected: 'true'
    remediation: 'Define a google_compute_health_check with http_health_check specifying the request_path, check_interval_sec, timeout_sec, and thresholds.\n'
    example:
      compliant: |
        resource "google_compute_health_check" "api" {
          name                = "payment-api-health"
          check_interval_sec  = 15
          timeout_sec         = 5
          healthy_threshold   = 2
          unhealthy_threshold = 3
        
          http_health_check {
            port         = 8080
            request_path = "/health/ready"
          }
        }
        
      non_compliant: |
        resource "google_compute_health_check" "api" {
          name = "health-check"
          tcp_health_check {
            port = 80
          }
          # Missing: http_health_check with request_path
          # Missing: explicit thresholds and intervals
        }
        
    scope:
      block_type: resource
      resource_types:
        - google_compute_health_check
        - google_compute_backend_service
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Health check must have a name.'
      - attribute: 'http_health_check'
        op: 'attribute_exists'
        message: 'HTTP health check configuration must be defined.'
      - attribute: 'check_interval_sec'
        op: 'attribute_exists'
        message: 'Health check interval must be explicitly defined.'
    on_fail: violation
