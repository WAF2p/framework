# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-REL-030
id: WAF-REL-030
pillar: reliability
severity: high
type:
  - configuration
description: |
  All production stateful and stateless workloads MUST be deployed across a minimum of two Availability Zones (AZs). Databases, caches, and message queues MUST use multi-AZ configurations with automatic failover. Load balancers MUST span at least two AZs. Auto-scaling groups and Kubernetes clusters MUST distribute nodes and pods across AZs. Single-AZ deployments in production are not acceptable without explicit documented risk acceptance.
regulatory_mapping:
  - framework: 'ISO/IEC 27001:2022'
    controls:
      - 'A.17.1 – Information security continuity'
      - 'A.17.2 – Redundancies'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'REL 10 – Use fault isolation to protect your workload'
      - 'REL 13 – Test resiliency'
  - framework: 'ITIL 4'
    controls:
      - 'Availability Management'
      - 'Service Continuity Management'
  - framework: 'BSI C5:2022'
    controls:
      - 'RB-01 – Availability and Redundancy'
checks:
  - id: waf-rel-030.tf.aws.rds-multi-az
    engine: terraform
    automated: true
    title: 'AWS RDS instances must have Multi-AZ enabled'
    provider: aws
    description: 'Production RDS instances must have multi_az = true to enable automatic failover to a standby replica in a different AZ on failure.'
    expected: 'true'
    remediation: 'Set multi_az = true on the aws_db_instance resource. This creates a synchronous standby replica in a different AZ. Failover is automatic and typically completes within 1-2 minutes.\n'
    example:
      compliant: |
        resource "aws_db_instance" "main" {
          identifier        = "payment-db-prod"
          engine            = "postgres"
          engine_version    = "15.4"
          instance_class    = "db.t3.medium"
          allocated_storage = 100
          multi_az          = true
          db_subnet_group_name = aws_db_subnet_group.main.name
          tags = var.mandatory_tags
        }
        
      non_compliant: |
        resource "aws_db_instance" "main" {
          identifier        = "payment-db-prod"
          engine            = "postgres"
          instance_class    = "db.t3.medium"
          allocated_storage = 100
          multi_az          = false  # WAF-REL-030 violation
          db_subnet_group_name = aws_db_subnet_group.main.name
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_db_instance
    assertions:
      - attribute: 'multi_az'
        op: 'is_true'
        message: 'RDS instance must have multi_az = true for production availability.'
    on_fail: violation
  - id: waf-rel-030.tf.aws.autoscaling-multi-az
    engine: terraform
    automated: true
    title: 'AWS Auto Scaling Group must span at least 2 availability zones'
    provider: aws
    description: 'Auto Scaling Groups in production must reference subnets in at least 2 different AZs to ensure compute redundancy.'
    expected: 'true'
    remediation: 'Set vpc_zone_identifier to a list containing subnet IDs from at least 2 AZs. Increase min_size to 2 to ensure at least one instance per AZ during failures.\n'
    example:
      compliant: |
        resource "aws_autoscaling_group" "api" {
          name               = "payment-api-asg"
          min_size           = 2
          max_size           = 10
          desired_capacity   = 2
          vpc_zone_identifier = [
            aws_subnet.private_az1.id,
            aws_subnet.private_az2.id,
          ]
        }
        
      non_compliant: |
        resource "aws_autoscaling_group" "api" {
          name               = "payment-api-asg"
          min_size           = 1
          max_size           = 4
          desired_capacity   = 1
          vpc_zone_identifier = [aws_subnet.private_az1.id]
          # Single AZ – WAF-REL-030 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_autoscaling_group
    assertions:
      - attribute: 'vpc_zone_identifier'
        op: 'not_empty'
        message: 'Auto Scaling Group must specify VPC subnets across multiple AZs.'
      - attribute: 'min_size'
        op: 'greater_than_or_equal'
        message: 'Auto Scaling Group minimum size must be at least 2 for HA.'
    on_fail: violation
  - id: waf-rel-030.tf.azurerm.db-availability-zone
    engine: terraform
    automated: true
    title: 'Azure database services must use zone-redundant configuration'
    provider: azurerm
    description: 'Azure SQL Database, PostgreSQL Flexible Server, and other managed databases must use zone_redundant = true or configure standby_availability_zone.'
    expected: 'true'
    remediation: 'Add a high_availability block with mode = "ZoneRedundant" and configure standby_availability_zone to a different zone than the primary.\n'
    example:
      compliant: |
        resource "azurerm_postgresql_flexible_server" "main" {
          name                = "payment-db-prod"
          resource_group_name = azurerm_resource_group.main.name
          location            = azurerm_resource_group.main.location
          version             = "15"
          sku_name            = "GP_Standard_D2s_v3"
          availability_zone   = "1"
        
          high_availability {
            mode                      = "ZoneRedundant"
            standby_availability_zone = "2"
          }
        }
        
      non_compliant: |
        resource "azurerm_postgresql_flexible_server" "main" {
          name                = "payment-db-prod"
          resource_group_name = azurerm_resource_group.main.name
          location            = azurerm_resource_group.main.location
          version             = "15"
          sku_name            = "GP_Standard_D2s_v3"
          # Missing: high_availability – single zone deployment
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_postgresql_flexible_server
        - azurerm_mssql_database
        - azurerm_mysql_flexible_server
    assertions:
      - attribute: 'high_availability'
        op: 'attribute_exists'
        message: 'Database must define high_availability block with zone-redundant configuration.'
    on_fail: violation
  - id: waf-rel-030.tf.google.sql-availability-type
    engine: terraform
    automated: true
    title: 'GCP Cloud SQL must use REGIONAL availability type'
    provider: google
    description: 'GCP Cloud SQL instances must use availability_type = REGIONAL for automatic failover across zones in the same region.'
    expected: 'true'
    remediation: 'Set availability_type = "REGIONAL" in the settings block of google_sql_database_instance to enable automatic failover to a different zone.\n'
    example:
      compliant: |
        resource "google_sql_database_instance" "main" {
          name             = "payment-db-prod"
          database_version = "POSTGRES_15"
          settings {
            tier              = "db-custom-2-7680"
            availability_type = "REGIONAL"
            backup_configuration {
              enabled    = true
              start_time = "02:00"
            }
          }
        }
        
      non_compliant: |
        resource "google_sql_database_instance" "main" {
          name             = "payment-db-prod"
          database_version = "POSTGRES_15"
          settings {
            tier              = "db-custom-2-7680"
            availability_type = "ZONAL"  # WAF-REL-030 violation
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - google_sql_database_instance
    assertions:
      - attribute: 'settings.availability_type'
        op: 'equals'
        message: 'Cloud SQL must use REGIONAL availability type, not ZONAL.'
    on_fail: violation
