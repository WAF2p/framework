# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-PERF-060
id: WAF-PERF-060
pillar: performance
severity: medium
type:
  - governance
  - configuration
description: |
  All production services handling external or variable load MUST have load tests defined and executed at least as part of staging or pre-production validation gates. Load tests MUST define explicit acceptance criteria (P95/P99 latency thresholds, error rate limits, minimum throughput targets). Performance regression MUST be detected automatically by comparing load test results against the established baseline. Critical services MUST be stress-tested to identify capacity limits before production launches.
regulatory_mapping:
  - framework: 'ISO/IEC 29119'
    controls:
      - 'Software Testing – Performance Testing'
  - framework: 'ISO/IEC 25010'
    controls:
      - 'Performance Efficiency – Time Behavior'
      - 'Performance Efficiency – Capacity'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'PERF 5 – How do you visualize and review performance?'
      - 'REL 9 – How do you test reliability?'
  - framework: 'DORA'
    controls:
      - 'Continuous testing as part of deployment pipelines'
checks:
  - id: waf-perf-060.tf.aws.codepipeline-performance-stage
    engine: terraform
    automated: true
    title: 'AWS CodePipeline should include a performance testing stage'
    provider: aws
    description: 'AWS CodePipeline deployment pipelines for production services should include a performance testing stage (using CodeBuild running k6/Gatling/Locust) before promoting to production. This check verifies that a performance stage is referenced in pipeline configuration.'
    expected: 'true'
    remediation: 'Add a performance testing stage to CodePipeline using CodeBuild to execute load tests. Configure the stage to block promotion to production when acceptance criteria are not met.\n'
    example:
      compliant: |
        resource "aws_codepipeline" "app" {
          name     = "pipeline-payment-api"
          role_arn = aws_iam_role.pipeline.arn
          artifact_store { location = aws_s3_bucket.artifacts.bucket; type = "S3" }
          stage { name = "Source"; action { ... } }
          stage { name = "Build";  action { ... } }
          stage {
            name = "PerformanceTest"
            action {
              name     = "LoadTest"
              category = "Build"
              owner    = "AWS"
              provider = "CodeBuild"
              configuration = {
                ProjectName = aws_codebuild_project.load_test.name
              }
            }
          }
          stage { name = "Deploy"; action { ... } }
        }
        
      non_compliant: |
        resource "aws_codepipeline" "app" {
          name = "pipeline-payment-api"
          stage { name = "Source"; action { ... } }
          stage { name = "Build";  action { ... } }
          stage { name = "Deploy"; action { ... } }
          # No performance test stage – WAF-PERF-060 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_codepipeline
    assertions:
      - attribute: 'stage'
        op: 'not_empty'
        message: 'CodePipeline must have at least 3 stages (Source, Build, Deploy) with performance validation included.'
    on_fail: violation
  - id: waf-perf-060.tf.azurerm.devops-pipeline-perf-gate
    engine: terraform
    automated: true
    title: 'Azure DevOps pipelines should include performance validation gates'
    provider: azurerm
    description: 'Azure deployment pipelines should configure release gates or pre-deployment conditions that execute performance tests before production deployment.'
    expected: 'true'
    remediation: 'Configure Azure DevOps pipeline YAML with a performance test job that runs k6 or Gatling and fails the pipeline if acceptance criteria are not met. Reference load test scripts stored in the repository.\n'
    example:
      compliant: |
        # azure-pipelines.yml (referenced by Terraform azuredevops_build_definition)
        stages:
          - stage: PerformanceTest
            dependsOn: BuildAndPush
            jobs:
              - job: LoadTest
                steps:
                  - script: |
                      k6 run --vus 50 --duration 5m \
                        --env BASE_URL=$(STAGING_URL) \
                        tests/performance/payment-api.js
                    displayName: "Run k6 Load Tests"
                  - task: PublishTestResults@2
                    inputs:
                      testResultsFormat: JUnit
                      testResultsFiles: 'k6-results.xml'
        
      non_compliant: |
        # azure-pipelines.yml without performance stage
        stages:
          - stage: Build
          - stage: Deploy  # Direct deploy without performance gate – WAF-PERF-060 violation
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_resource_group_policy_assignment
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Policy assignments must be named descriptively.'
    on_fail: advisory
  - id: waf-perf-060.tf.google.cloud-build-perf-step
    engine: terraform
    automated: true
    title: 'GCP Cloud Build triggers should include performance test steps'
    provider: google
    description: 'GCP Cloud Build configurations for production deployments should include load test execution steps before deploying to production.'
    expected: 'true'
    remediation: 'Enable Cloud Build trigger and ensure the referenced cloudbuild.yaml includes a performance test step using k6 or Locust before the deploy step.\n'
    example:
      compliant: |
        resource "google_cloudbuild_trigger" "deploy" {
          name     = "deploy-payment-api"
          filename = "cloudbuild.yaml"
          disabled = false
          github {
            owner = var.github_owner
            name  = var.github_repo
            push { branch = "^main$" }
          }
        }
        # cloudbuild.yaml includes:
        # - id: 'performance-test'
        #   name: 'grafana/k6'
        #   args: ['run', 'tests/performance/payment-api.js']
        
      non_compliant: |
        resource "google_cloudbuild_trigger" "deploy" {
          name     = "deploy-payment-api"
          disabled = true  # Trigger disabled – WAF-PERF-060 violation
          filename = "cloudbuild.yaml"
        }
        
    scope:
      block_type: resource
      resource_types:
        - google_cloudbuild_trigger
    assertions:
      - attribute: 'filename'
        op: 'not_empty'
        message: 'Cloud Build trigger must reference a cloudbuild.yaml file.'
      - attribute: 'disabled'
        op: 'is_false'
        message: 'Cloud Build trigger must not be disabled.'
    on_fail: violation
