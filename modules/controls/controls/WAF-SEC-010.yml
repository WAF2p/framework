checks:
- id: waf-sec-010.tf.aws.iam-password-policy-mfa
  engine: terraform
  automated: true
  title: AWS IAM account password policy must meet minimum security requirements
  provider: aws
  description: The aws_iam_account_password_policy resource must enforce a minimum password length of 14, all character class
    requirements, a minimum of 5 passwords in reuse prevention history, and a maximum password age of 90 days.
  expected: 'true'
  remediation: Define an aws_iam_account_password_policy resource with all required attributes set. Ensure minimum_password_length
    >= 14, all require_* flags are true, password_reuse_prevention >= 5, and max_password_age <= 90.\n
  example:
    compliant: "resource \"aws_iam_account_password_policy\" \"strict\" {\n  minimum_password_length        = 14\n  require_uppercase_characters\
      \   = true\n  require_lowercase_characters   = true\n  require_numbers                = true\n  require_symbols    \
      \            = true\n  allow_users_to_change_password = true\n  max_password_age               = 90\n  password_reuse_prevention\
      \      = 5\n  hard_expiry                    = false\n}\n"
    non_compliant: "resource \"aws_iam_account_password_policy\" \"weak\" {\n  minimum_password_length      = 8\n  require_uppercase_characters\
      \ = false\n  require_symbols              = false\n  # Missing password_reuse_prevention and max_password_age\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_iam_account_password_policy
  assertions:
  - attribute: minimum_password_length
    op: greater_than_or_equal
    message: IAM password policy must require a minimum of 14 characters.
    expected: 14
  - attribute: require_uppercase_characters
    op: is_true
    message: IAM password policy must require uppercase characters.
  - attribute: require_lowercase_characters
    op: is_true
    message: IAM password policy must require lowercase characters.
  - attribute: require_numbers
    op: is_true
    message: IAM password policy must require numbers.
  - attribute: require_symbols
    op: is_true
    message: IAM password policy must require symbols.
  - attribute: password_reuse_prevention
    op: greater_than_or_equal
    message: IAM password policy must prevent reuse of at least 5 prior passwords.
    expected: 5
  - attribute: max_password_age
    op: less_than_or_equal
    message: IAM password policy must set maximum password age to 90 days or less.
    expected: 90
  on_fail: violation
- id: waf-sec-010.tf.aws.no-root-access-keys
  engine: terraform
  automated: true
  title: Root account must not have active access keys
  provider: aws
  description: The AWS root account must not have active programmatic access keys. This cannot be fully checked in Terraform
    state but must be validated via AWS IAM credential report or Security Hub control IAM.4.
  expected: 'true'
  remediation: Navigate to AWS IAM > Security Credentials for the root account and delete all access keys. Enable MFA on the
    root account. Restrict root account usage to only tasks that absolutely require it (e.g., account closure, enabling MFA
    for the first time).\n
  example:
    compliant: '# Root access keys are removed via AWS Console – not representable in Terraform.

      # Verify with: aws iam get-account-summary | grep AccountAccessKeysPresent

      # Expected: "AccountAccessKeysPresent": 0

      '
    non_compliant: '# Root account has active access keys visible in AWS IAM > Security Credentials.

      # aws iam get-account-summary output shows "AccountAccessKeysPresent": 1

      '
  scope:
    block_type: resource
    resource_types:
    - aws_iam_user
  assertions:
  - attribute: name
    op: not_equals
    message: Root account must not be managed as a regular IAM user resource. Remove root access keys via AWS Console.
    expected: root
  on_fail: violation
- id: waf-sec-010.tf.azurerm.conditional-access-mfa
  engine: terraform
  automated: true
  title: Azure AD Conditional Access must require MFA for privileged directory roles
  provider: azurerm
  description: An azuread_conditional_access_policy resource must target privileged Entra ID directory roles and require multi-factor
    authentication via grant_controls.
  expected: 'true'
  remediation: Create an azuread_conditional_access_policy that includes privileged directory roles (e.g., Global Administrator,
    Privileged Role Administrator) and sets grant_controls built_in_controls to "mfa". Keep the policy state set to "enabled".\n
  example:
    compliant: "resource \"azuread_conditional_access_policy\" \"privileged_mfa\" {\n  display_name = \"MFA for privileged\
      \ roles\"\n  state        = \"enabled\"\n  conditions {\n    users {\n      included_roles = [\n        \"62e90394-69f5-4237-9190-012177145e10\"\
      ,\n        \"e8611ab8-c189-46df-93df-1fe90f8e42a1\",\n      ]\n    }\n    applications {\n      included_applications\
      \ = [\"All\"]\n    }\n  }\n  grant_controls {\n    operator          = \"OR\"\n    built_in_controls = [\"mfa\"]\n \
      \ }\n}\n"
    non_compliant: '# No azuread_conditional_access_policy requires MFA for privileged directory roles.

      # WAF-SEC-010 violation: privileged Entra ID accounts lack mandatory MFA

      '
  scope:
    block_type: resource
    resource_types:
    - azuread_conditional_access_policy
  assertions:
  - attribute: state
    op: equals
    message: Conditional Access policy must be enabled.
    expected: enabled
  - attribute: grant_controls
    op: attribute_exists
    message: Conditional Access policy must define grant_controls requiring MFA.
  on_fail: violation
- id: waf-sec-010.tf.google.project-owner-binding-mfa-ready
  engine: terraform
  automated: true
  title: GCP project Owner bindings must be limited and coupled with documented MFA enforcement
  provider: google
  description: GCP does not represent MFA policy directly in Terraform, but IAM policy bindings for project owners must be
    explicitly listed and limited to a small set of principals. A guardrail google_organization_policy can restrict domain
    sharing, and identities must come from a workspace/Cloud Identity tenant where 2-Step Verification is enforced.
  expected: 'true'
  remediation: Limit google_project_iam_binding and google_project_iam_member resources using the Owner role (roles/owner)
    to a small whitelist. Enforce 2-Step Verification at the Cloud Identity / Workspace level. Document the exception and
    review process.\n
  example:
    compliant: "data \"google_iam_policy\" \"project\" {\n  binding {\n    role = \"roles/owner\"\n    members = [\n     \
      \ \"user:admin@example.com\",\n    ]\n  }\n}\n\nresource \"google_project_iam_policy\" \"policy\" {\n  project     =\
      \ var.project_id\n  policy_data = data.google_iam_policy.project.policy_data\n}\n\n# Enforced in Workspace Admin console:\n\
      # Security > Authentication > 2-Step Verification > Enforcement > ON\n"
    non_compliant: "resource \"google_project_iam_binding\" \"owner\" {\n  project = var.project_id\n  role    = \"roles/owner\"\
      \n  members = [\n    \"user:anyone@example.com\",\n    \"serviceAccount:sa@example.iam.gserviceaccount.com\",\n  ]\n\
      }\n"
  scope:
    block_type: resource
    resource_types:
    - google_project_iam_policy
    - google_project_iam_binding
    - google_project_iam_member
  assertions:
  - attribute: role
    op: not_equals
    message: GCP project-level Owner role should not be assigned via Terraform; prefer fine-grained roles.
    expected: roles/owner
  - attribute: members
    op: attribute_exists
    message: IAM binding must enumerate members explicitly so ownership is auditable.
  on_fail: finding
- id: waf-sec-010.tf.stackit.organization-owner-limit
  engine: terraform
  automated: true
  title: STACKIT organization and project owners must be limited and documented
  provider: stackit
  description: STACKIT Owner and Organization Owner roles grant full administrative access. These bindings must be explicitly
    declared in Terraform and restricted to a small set of principals. MFA is enforced at STACKIT console level and reviewed
    via quarterly access review.
  expected: 'true'
  remediation: Limit stackit_resourcemanager_project_membership and stackit_authorization_grant resources that assign Owner
    or Organization Owner roles. Maintain a version-controlled allowlist and review it quarterly.\n
  example:
    compliant: "resource \"stackit_authorization_grant\" \"org_owner\" {\n  resource_id = var.stackit_organization_id\n  subject\
      \     = \"user:admin@example.com\"\n  role        = \"Organization Owner\"\n}\n\n# MFA is mandatory in STACKIT IAM settings\
      \ for console users.\n# Review documented in docs/security/access-reviews.md\n"
    non_compliant: "resource \"stackit_authorization_grant\" \"org_owner\" {\n  resource_id = var.stackit_organization_id\n\
      \  subject     = \"group:all-employees@example.com\"\n  role        = \"Organization Owner\"\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_authorization_grant
    - stackit_resourcemanager_project_membership
  assertions:
  - attribute: role
    op: not_in
    message: STACKIT Owner/Organization Owner role must not be assigned to broad groups.
    expected:
    - Owner
    - Organization Owner
  - attribute: subject
    op: not_matches
    message: STACKIT owner grants must target individual users, not generic groups.
    pattern: '^group:'
  on_fail: violation
- id: waf-sec-010.tf.ovh.account-mfa-via-policy
  engine: terraform
  automated: true
  title: OVHcloud IAM policy must enforce MFA for sensitive operations
  provider: ovh
  description: OVHcloud IAM policies can require MFA for sensitive actions (e.g., managing payment, identity, or critical
    services). Terraform ovh_me_identity_policy resources must include an MFA condition for actions affecting account security.
  expected: 'true'
  remediation: Create an OVHcloud IAM policy with a condition requiring MFA for critical actions. Document the policy and
    the list of protected actions in a version-controlled standard.\n
  example:
    compliant: "resource \"ovh_me_identity_policy\" \"sensitive_mfa\" {\n  name = \"sensitive-ops-mfa\"\n  identities = [\n\
      \    \"user:admin@example.com\",\n  ]\n  rules {\n    action = \"account:.*\"\n    effect = \"allow\"\n    resources\
      \ {\n      resource {\n        id    = \"*\"\n        type  = \"account\"\n        label = \"*\"\n      }\n    }\n \
      \ }\n  rules {\n    action    = \".*\"\n    effect    = \"deny\"\n    resources { resource { id = \"*\"; type = \"*\"\
      ; label = \"*\" } }\n  }\n  # MFA is required by an organization-wide setting documented in docs/security/ovh-iam.md\n\
      }\n"
    non_compliant: '# No OVHcloud IAM policy requires MFA for sensitive account actions.

      # MFA is not documented as enforced in the OVHcloud Control Panel.

      '
  scope:
    block_type: resource
    resource_types:
    - ovh_me_identity_policy
  assertions:
  - attribute: identities
    op: attribute_exists
    message: OVHcloud identity policy must enumerate identities explicitly.
  - attribute: rules
    op: attribute_exists
    message: OVHcloud identity policy must define rules.
  on_fail: violation
- id: waf-sec-010.tf.hcloud.console-mfa-ready
  engine: terraform
  automated: true
  title: Hetzner Cloud project members must be individual users with MFA documented
  provider: hcloud
  description: Hetzner Cloud projects do not expose MFA state in Terraform, but project memberships must target individual
    users (not robots) and be limited to required roles. MFA is enforced in the Hetzner Cloud Console and confirmed by quarterly
    access review.
  expected: 'true'
  remediation: Declare hcloud_project_membership resources only for named user accounts with minimum required roles. Disable
    or remove inactive members. Document MFA enablement and review cadence.\n
  example:
    compliant: "resource \"hcloud_project\" \"prod\" {\n  name        = \"production\"\n  description = \"Production workloads\"\
      \n}\n\nresource \"hcloud_project_membership\" \"admin\" {\n  project_id = hcloud_project.prod.id\n  user_email = \"\
      admin@example.com\"\n  role       = \"admin\"\n}\n\n# MFA enabled for all project members via Hetzner Cloud Console.\n\
      # Quarterly review recorded in docs/security/access-reviews.md\n"
    non_compliant: "resource \"hcloud_project_membership\" \"admin\" {\n  project_id = hcloud_project.prod.id\n  user_email\
      \ = \"shared-inbox@example.com\"\n  role       = \"admin\"\n}\n"
  scope:
    block_type: resource
    resource_types:
    - hcloud_project_membership
  assertions:
  - attribute: user_email
    op: not_matches
    message: Hetzner Cloud project membership must not use shared mailboxes.
    pattern: ^shared-.*|.*@.*-shared\.
  - attribute: role
    op: not_equals
    message: Hetzner Cloud project membership should use the minimum role; avoid 'admin' where possible.
    expected: admin
  on_fail: finding
