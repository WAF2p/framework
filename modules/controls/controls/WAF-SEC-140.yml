id: WAF-SEC-140
title: Web Application Firewall and DDoS protection MUST be enabled for public endpoints
status: active
tags:
- architecture
- configuration
- high
- security
pillar: security
severity: high
type:
- configuration
- architecture
category: network-security
rationale: Unzureichender Netzwerkschutz und fehlende DDoS-Abwehr ermöglichen externe Angriffe, Serviceunterbrechungen und
  Datendiebstahl. Dieses Control adressiert die Anforderungen des Bereichs 'Network Security' und stellt sicher, dass All
  internet-facing applications and APIs MUST be protected by a Web Application Firewall (WAF) with...
threat:
- Unprotected public endpoints are directly exposed to SQL injection, XSS, and other OWASP Top 10 attacks.
- Missing DDoS protection allows trivial disruption of services by saturating network or application capacity.
implementation_guidance:
- Document the requirement in a version-controlled policy, ADR, or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - Die Anforderung ist nicht einheitlich umgesetzt; Nachweis existiert nur punktuell oder fehlt.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - Eine dokumentierte Policy oder ein Standard beschreibt die Anforderung.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform-Checks oder IaC-Gates prüfen die Anforderung automatisch in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Abdeckung, Ausnahmen und Qualitätsmetriken werden quartalsweise berichtet.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Die Effektivität wird kontinuierlich gemessen und automatisch optimiert.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-security/pages/controls/WAF-SEC-140.adoc
  related_controls:
  - WAF-SEC-040
  - WAF-SEC-050
  - WAF-SEC-080
  - WAF-SEC-160
  - WAF-SEC-010
  - WAF-REL-110
  - WAF-AGN-110
description: All internet-facing applications and APIs MUST be protected by a Web Application Firewall (WAF) with managed
  rule sets. Distributed Denial-of-Service (DDoS) protection MUST be enabled at the network and application layers. WAF rules
  MUST block common attack patterns (OWASP Top 10) and be reviewed quarterly. Rate limiting MUST be configured to mitigate
  abuse and volumetric attacks.
