checks:
- id: waf-sec-140.tf.aws.waf-associated
  engine: terraform
  provider: aws
  automated: true
  title: AWS public ALB/CloudFront distributions must have an associated WAFv2 WebACL
  description: AWS public ALB/CloudFront distributions must have an associated WAFv2 WebACL
  expected: 'true'
  remediation: AWS public ALB/CloudFront distributions must have an associated WAFv2 WebACL
  scope:
    block_type: resource
    resource_types:
    - aws_wafv2_web_acl_association
    - aws_cloudfront_distribution
  assertions:
  - attribute: web_acl_arn
    op: attribute_exists
    message: Public resource must be associated with a WAFv2 WebACL.
  on_fail: violation
- id: waf-sec-140.tf.azurerm.front-door-waf
  engine: terraform
  provider: azurerm
  automated: true
  title: Azure Front Door/CDN must use WAF policy with managed rules
  description: Azure Front Door/CDN must use WAF policy with managed rules
  expected: 'true'
  remediation: Azure Front Door/CDN must use WAF policy with managed rules
  scope:
    block_type: resource
    resource_types:
    - azurerm_cdn_endpoint_security_policy
    - azurerm_frontdoor_firewall_policy
  assertions:
  - attribute: managed_rule
    op: attribute_exists
    message: WAF policy must include managed rule sets.
  on_fail: violation
- id: waf-sec-140.tf.google.cloud-armor
  engine: terraform
  provider: google
  automated: true
  title: GCP backend services must be protected by Cloud Armor security policy
  description: GCP backend services must be protected by Cloud Armor security policy
  expected: 'true'
  remediation: GCP backend services must be protected by Cloud Armor security policy
  scope:
    block_type: resource
    resource_types:
    - google_compute_backend_service
    - google_compute_backend_bucket
  assertions:
  - attribute: security_policy
    op: attribute_exists
    message: Backend service must reference a Cloud Armor security policy.
  on_fail: violation
- id: waf-sec-140.config.sovereign-provider-waf-documented
  engine: config
  provider: any
  automated: false
  title: Sovereign provider public endpoints must have WAF/DDoS configuration documented
  description: Sovereign provider public endpoints must have WAF/DDoS configuration documented
  expected: 'true'
  remediation: Sovereign provider public endpoints must have WAF/DDoS configuration documented
  scope:
    block_type: file
    path_pattern: docs/security/waf-ddos.md
  assertions:
  - attribute: exists
    op: attribute_exists
    message: WAF/DDoS documentation must exist for sovereign provider public endpoints.
  on_fail: finding
