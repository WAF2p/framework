# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-SUS-070
id: WAF-SUS-070
pillar: sustainability
severity: medium
type:
  - governance
  - configuration
description: |
  Software MUST be designed with energy efficiency as an explicit quality attribute. Architecture Decision Records MUST include energy efficiency considerations for algorithm and data structure choices. Dependencies MUST be reviewed for efficiency: unused libraries, heavy frameworks, and polling patterns MUST be replaced with lightweight alternatives and event-driven designs. Software Carbon Intensity (SCI) SHOULD be measured for critical workloads and included in architecture reviews. Teams MUST avoid over-engineering: monolithic frameworks, excessive microservice proliferation, and redundant compute layers all increase energy consumption without delivering proportional value.
regulatory_mapping:
  - framework: 'Green Software Foundation'
    controls:
      - 'Software Carbon Intensity (SCI) – measurement and optimization standard'
      - 'Energy Efficiency – algorithmic and architectural efficiency'
      - 'Carbon Efficiency – reducing energy per functional unit'
  - framework: 'EU CSRD (Corporate Sustainability Reporting Directive)'
    controls:
      - 'ESRS E1 – Climate Change – operational measures to reduce emissions'
  - framework: 'ISO 14001'
    controls:
      - '6.1.2 – Environmental Aspects – software design as environmental aspect'
checks:
  - id: waf-sus-070.tf.aws.lambda-no-large-layers
    engine: terraform
    automated: true
    title: 'Lambda functions should not attach excessive numbers of layers'
    provider: aws
    description: 'Lambda functions with many layers have larger deployment packages, higher cold-start energy consumption, and more complex dependency footprints. Each layer must be justified by the functionality it provides.'
    expected: 'true'
    remediation: 'Review Lambda layer usage. Consolidate multiple utility layers into a single optimized layer. Use dependency management (requirements.txt, package.json) to control package size. Consider Lambda container images for complex dependency trees with multi-arch builds.\n'
    example:
      compliant: |
        resource "aws_lambda_function" "api" {
          function_name = "api-handler"
          runtime       = "python3.12"
          architectures = ["arm64"]
          handler       = "main.handler"
          role          = aws_iam_role.lambda.arn
          filename      = "function.zip"
          # No unnecessary layers – slim deployment package
        }
        
      non_compliant: |
        resource "aws_lambda_function" "api" {
          function_name = "api-handler"
          runtime       = "python3.12"
          architectures = ["x86_64"]
          layers = [
            aws_lambda_layer_version.utils.arn,
            aws_lambda_layer_version.logging.arn,
            aws_lambda_layer_version.db_client.arn,
            aws_lambda_layer_version.aws_sdk_extras.arn,
            aws_lambda_layer_version.common.arn,
            # WAF-SUS-070 Warning: 5 layers – review and consolidate
          ]
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_lambda_function
    assertions:
      - attribute: 'layers'
        op: 'attribute_exists'
        message: 'No layers attribute found – this check passes; single-package deployments are preferred.'
    on_fail: warning
  - id: waf-sus-070.tf.aws.sqs-not-polling
    engine: terraform
    automated: true
    title: 'SQS event source mapping should use long polling for Lambda triggers'
    provider: aws
    description: 'Lambda functions triggered by SQS should use long polling (maximum_batching_window_in_seconds > 0) to batch messages and reduce the number of Lambda invocations. Short polling or no batching causes excessive invocations per message, increasing energy consumption per unit of work.'
    expected: 'true'
    remediation: 'Set maximum_batching_window_in_seconds = 30 (or higher) and batch_size = 100 on SQS event source mappings to maximize message batching. This reduces Lambda invocations by up to 90% for high-volume queues, directly reducing energy per message processed.\n'
    example:
      compliant: |
        resource "aws_lambda_event_source_mapping" "sqs_trigger" {
          event_source_arn                   = aws_sqs_queue.events.arn
          function_name                      = aws_lambda_function.processor.arn
          batch_size                         = 100
          maximum_batching_window_in_seconds = 30  # batch for 30s before invoking
          function_response_types            = ["ReportBatchItemFailures"]
        }
        
      non_compliant: |
        resource "aws_lambda_event_source_mapping" "sqs_trigger" {
          event_source_arn = aws_sqs_queue.events.arn
          function_name    = aws_lambda_function.processor.arn
          batch_size       = 1  # WAF-SUS-070 Warning: 1 invocation per message, very inefficient
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_lambda_event_source_mapping
    assertions:
      - attribute: 'maximum_batching_window_in_seconds'
        op: 'greater_than_or_equal'
        message: 'SQS Lambda trigger uses no batching window – enable long polling to reduce invocations per message.'
    on_fail: warning
  - id: waf-sus-070.tf.google.cloud-run-min-instances-zero
    engine: terraform
    automated: true
    title: 'GCP Cloud Run services should scale to zero in non-production'
    provider: google
    description: 'Cloud Run services with min_instance_count > 0 maintain warm instances continuously even when there is no traffic. Setting min_instance_count = 0 allows scale-to-zero, eliminating idle compute energy consumption.'
    expected: 'true'
    remediation: 'Set min_instance_count = 0 for all non-production Cloud Run services. For production services with strict cold-start SLAs, use min_instance_count = 1 and document the sustainability trade-off in the architecture decision record.\n'
    example:
      compliant: |
        resource "google_cloud_run_v2_service" "api" {
          name     = "api-service"
          location = "europe-north1"
        
          template {
            scaling {
              min_instance_count = 0   # scale to zero – no idle energy
              max_instance_count = 10
            }
          }
        }
        
      non_compliant: |
        resource "google_cloud_run_v2_service" "api" {
          name     = "api-service"
          location = "us-east1"
        
          template {
            scaling {
              min_instance_count = 5   # WAF-SUS-070 Warning: always-on instances, idle energy
              max_instance_count = 50
            }
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - google_cloud_run_v2_service
    assertions:
      - attribute: 'template.scaling.min_instance_count'
        op: 'equals'
        message: 'Cloud Run service has minimum instances > 0 – idle instances consume energy. Consider scale-to-zero.'
    on_fail: warning
