# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-OPS-020
id: WAF-OPS-020
pillar: operational
severity: high
type:
  - governance
  - configuration
description: |
  All cloud infrastructure MUST be defined as code using an IaC tool (Terraform, Pulumi, AWS CDK, or equivalent). Manual resource creation through cloud consoles MUST be prohibited for all production and staging environments. Infrastructure definitions MUST be version-controlled, reviewed through pull requests, and deployed exclusively through CI/CD pipelines.
regulatory_mapping:
  - framework: 'ISO/IEC 20000-1'
    controls:
      - 'Configuration management'
      - 'Change and deployment management'
  - framework: 'ITIL 4'
    controls:
      - 'Infrastructure and platform management'
      - 'Configuration management'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'Operational Excellence Pillar – OPS 5: How do you reduce defects, ease remediation, and improve flow in your workload?'
  - framework: 'DevOps Research and Assessment (DORA)'
    controls:
      - 'Version Control'
      - 'Infrastructure as Code'
  - framework: 'CIS Controls v8'
    controls:
      - 'CIS-4.6: Securely Manage Enterprise Assets and Software'
checks:
  - id: waf-ops-020.tf.aws.s3-terraform-state-backend
    engine: terraform
    automated: true
    title: 'Terraform state must use S3 backend with DynamoDB locking'
    provider: aws
    description: 'Terraform remote state MUST be stored in an S3 bucket with versioning enabled and a DynamoDB table for state locking. This prevents concurrent state modifications and enables state history and rollback.'
    expected: 'true'
    remediation: "Configure the S3 backend in your Terraform root module's terraform block. Create the S3 bucket with versioning enabled and a DynamoDB table for locking.\n"
    example:
      compliant: |
        terraform {
          backend "s3" {
            bucket         = "my-org-terraform-state"
            key            = "payment-service/production/terraform.tfstate"
            region         = "eu-central-1"
            dynamodb_table = "terraform-state-lock"
            encrypt        = true
          }
        }
        
        resource "aws_s3_bucket_versioning" "state" {
          bucket = "my-org-terraform-state"
          versioning_configuration {
            status = "Enabled"
          }
        }
        
      non_compliant: |
        terraform {
          # No backend configured – local state only
          # WAF-OPS-020 Violation: no remote state
        }
        
    scope:
      block_type: terraform
    assertions:
      - attribute: 'backend'
        op: 'attribute_exists'
        message: 'Terraform must configure a remote backend (not local state).'
    on_fail: violation
  - id: waf-ops-020.tf.aws.s3-state-bucket-versioning
    engine: terraform
    automated: true
    title: 'Terraform state S3 bucket must have versioning enabled'
    provider: aws
    description: 'The S3 bucket used for Terraform remote state MUST have versioning enabled to allow state history, audit, and rollback capabilities.'
    expected: 'true'
    remediation: 'Add an aws_s3_bucket_versioning resource with status = "Enabled" for your Terraform state bucket.\n'
    example:
      compliant: |
        resource "aws_s3_bucket_versioning" "state" {
          bucket = aws_s3_bucket.terraform_state.id
          versioning_configuration {
            status = "Enabled"
          }
        }
        
      non_compliant: |
        resource "aws_s3_bucket_versioning" "state" {
          bucket = aws_s3_bucket.terraform_state.id
          versioning_configuration {
            status = "Suspended"
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_s3_bucket_versioning
    assertions:
      - attribute: 'versioning_configuration.status'
        op: 'equals'
        message: 'S3 state bucket versioning must be Enabled.'
    on_fail: violation
  - id: waf-ops-020.tf.azurerm.terraform-state-storage
    engine: terraform
    automated: true
    title: 'Azure Terraform state must use Azure Storage Account backend'
    provider: azurerm
    description: 'Terraform state for Azure deployments MUST be stored in an Azure Storage Account with blob versioning enabled. This ensures state durability and collaboration.'
    expected: 'true'
    remediation: 'Configure blob versioning on the Storage Account used for Terraform state.\n'
    example:
      compliant: |
        resource "azurerm_storage_account" "terraform_state" {
          name                     = "myorgtfstate"
          resource_group_name      = azurerm_resource_group.tfstate.name
          location                 = var.location
          account_tier             = "Standard"
          account_replication_type = "GRS"
        
          blob_properties {
            versioning_enabled = true
          }
        }
        
      non_compliant: |
        resource "azurerm_storage_account" "terraform_state" {
          name                     = "myorgtfstate"
          resource_group_name      = azurerm_resource_group.tfstate.name
          location                 = var.location
          account_tier             = "Standard"
          account_replication_type = "LRS"
          # No blob versioning – WAF-OPS-020 Violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_storage_account
    assertions:
      - attribute: 'blob_properties'
        op: 'attribute_exists'
        message: 'Storage account must have blob_properties configured.'
    on_fail: violation
