id: WAF-SUS-080
title: All data transfers MUST be designed to minimize unnecessary movement across...
status: active
tags:
- sustainability
- medium
- configuration
pillar: sustainability
severity: medium
type:
- configuration
category: network-encryption
rationale: Unencrypted data transfer enables eavesdropping, man-in-the-middle attacks, and violations of data-protection and
  compliance requirements. This control addresses the requirements of the 'Network Encryption' area and ensures that All data
  transfers MUST be designed to minimize unnecessary movement across network boundaries.
threat:
- Unnecessary data transfers across regions increase network cost and emissions.
- Missing data-locality strategies waste bandwidth and slow down workloads.
implementation_guidance:
- Implement the required configuration as code in Terraform or equivalent IaC.
- Add an automated check to CI/CD so deviations are caught before deployment.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - The requirement is documented; initial resources show the intended configuration.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform checks or IaC gates automatically validate the requirement in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-sustainability/pages/controls/WAF-SUS-080.adoc
  related_controls:
  - WAF-REL-020
  - WAF-REL-030
  - WAF-PERF-070
  - WAF-SUS-010
  - WAF-SUS-030
  - WAF-SEC-010
  - WAF-SEC-020
  - WAF-SEC-060
  - WAF-SOV-020
  - WAF-SOV-060
  - WAF-AGN-010
  - WAF-AGN-080
description: 'All data transfers MUST be designed to minimize unnecessary movement across network boundaries. Cross-region
  data transfers MUST be justified; same-region communication MUST be preferred. Content Delivery Networks (CDN) MUST be used
  for all user-facing static and semi-static content. HTTP compression (gzip/brotli) MUST be enabled for all API responses
  larger than 1KB. VPC Endpoints MUST be used for AWS service communication to avoid internet gateway egress. Data transfer
  optimization is both a cost control and a carbon reduction measure: every byte transferred consumes network energy; minimizing
  transfers minimizes emissions.

  '
regulatory_mapping:
- framework: Green Software Foundation
  controls:
  - Energy Efficiency – minimize network data transfer
  - Software Carbon Intensity (SCI) – network embodied energy
- framework: EU CSRD (Corporate Sustainability Reporting Directive)
  controls:
  - ESRS E1 – Climate Change – operational energy efficiency
- framework: GHG Protocol
  controls:
  - Scope 3 Category 11 – reducing network-related cloud emissions
checks:
- id: waf-sus-080.tf.aws.cloudfront-compression
  engine: terraform
  automated: true
  title: CloudFront distributions must enable compression
  provider: aws
  description: CloudFront distributions must have compress = true on all cache behaviors to automatically compress compressible
    content (text, JSON, HTML, CSS, JavaScript) before delivery. This reduces data transfer volume by 60-80% for text content.
  expected: 'true'
  remediation: Set compress = true on all cache_behavior and default_cache_behavior blocks in the CloudFront distribution.
    CloudFront will automatically compress eligible responses (text/html, text/css, application/json, etc.) using gzip or
    brotli.\n
  example:
    compliant: "resource \"aws_cloudfront_distribution\" \"web\" {\n  default_cache_behavior {\n    allowed_methods      \
      \  = [\"GET\", \"HEAD\"]\n    cached_methods         = [\"GET\", \"HEAD\"]\n    target_origin_id       = \"web-origin\"\
      \n    viewer_protocol_policy = \"redirect-to-https\"\n    compress               = true  # 60-80% transfer reduction\
      \ for text content\n  }\n  # ...\n}\n"
    non_compliant: "resource \"aws_cloudfront_distribution\" \"web\" {\n  default_cache_behavior {\n    allowed_methods  \
      \      = [\"GET\", \"HEAD\"]\n    cached_methods         = [\"GET\", \"HEAD\"]\n    target_origin_id       = \"web-origin\"\
      \n    viewer_protocol_policy = \"redirect-to-https\"\n    compress               = false  # WAF-SUS-080 Violation: uncompressed\
      \ delivery\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_cloudfront_distribution
  assertions:
  - attribute: default_cache_behavior.compress
    op: is_true
    message: CloudFront distribution does not have compression enabled – enable compress = true for 60-80% transfer reduction.
  on_fail: violation
- id: waf-sus-080.tf.aws.vpc-endpoint-s3
  engine: terraform
  automated: true
  title: VPC should have S3 and DynamoDB gateway endpoints to avoid internet egress
  provider: aws
  description: S3 and DynamoDB gateway VPC Endpoints allow EC2 instances and Lambda functions to communicate with these services
    through the AWS private network instead of through an internet gateway. This eliminates internet data transfer charges
    and energy, as the traffic stays within AWS's backbone network.
  expected: 'true'
  remediation: 'Create gateway VPC endpoints for com.amazonaws.REGION.s3 and com.amazonaws.REGION.dynamodb in each VPC. Associate
    them with all route tables. For interface endpoints (STS, ECR, CloudWatch, SSM): create them in private subnets to eliminate
    all internet gateway dependencies.\n'
  example:
    compliant: "resource \"aws_vpc_endpoint\" \"s3\" {\n  vpc_id            = aws_vpc.main.id\n  service_name      = \"com.amazonaws.${var.region}.s3\"\
      \n  vpc_endpoint_type = \"Gateway\"\n  route_table_ids   = aws_route_table.private[*].id\n  tags = {\n    Name    =\
      \ \"s3-gateway-endpoint\"\n    purpose = \"eliminate-internet-egress\"\n  }\n}\n\nresource \"aws_vpc_endpoint\" \"dynamodb\"\
      \ {\n  vpc_id            = aws_vpc.main.id\n  service_name      = \"com.amazonaws.${var.region}.dynamodb\"\n  vpc_endpoint_type\
      \ = \"Gateway\"\n  route_table_ids   = aws_route_table.private[*].id\n}\n"
    non_compliant: "# VPC with no endpoints – all AWS service traffic goes via internet gateway\nresource \"aws_vpc\" \"main\"\
      \ {\n  cidr_block = \"10.0.0.0/16\"\n  # WAF-SUS-080 Warning: no VPC endpoints configured\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_vpc_endpoint
  assertions:
  - attribute: service_name
    op: not_empty
    message: VPC endpoint has no service_name – check configuration.
  on_fail: advisory
- id: waf-sus-080.tf.azurerm.cdn-compression
  engine: terraform
  automated: true
  title: Azure CDN endpoints must have compression enabled
  provider: azurerm
  description: Azure CDN endpoints should have compression enabled to reduce data transfer volume for compressible content
    types. Without compression, each user receives the full uncompressed payload, multiplying network energy consumption.
  expected: 'true'
  remediation: Set is_compression_enabled = true and provide content_types_to_compress list including text/html, text/css,
    application/json, application/javascript. Ensure origin also supports compressed responses or configure CDN-level compression.\n
  example:
    compliant: "resource \"azurerm_cdn_endpoint\" \"web\" {\n  name                = \"web-cdn\"\n  profile_name        =\
      \ azurerm_cdn_profile.main.name\n  resource_group_name = var.resource_group_name\n  location            = \"global\"\
      \n  origin_host_header  = azurerm_storage_account.web.primary_blob_host\n\n  is_compression_enabled = true\n  content_types_to_compress\
      \ = [\n    \"text/html\",\n    \"text/css\",\n    \"application/json\",\n    \"application/javascript\",\n    \"image/svg+xml\"\
      ,\n  ]\n}\n"
    non_compliant: "resource \"azurerm_cdn_endpoint\" \"web\" {\n  name                   = \"web-cdn\"\n  profile_name  \
      \         = azurerm_cdn_profile.main.name\n  resource_group_name    = var.resource_group_name\n  location          \
      \     = \"global\"\n  is_compression_enabled = false  # WAF-SUS-080 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_cdn_endpoint
  assertions:
  - attribute: is_compression_enabled
    op: is_true
    message: Azure CDN endpoint has compression disabled – enable for significant transfer reduction.
  on_fail: violation
- id: waf-sus-080.tf.google.backend-compression
  engine: terraform
  automated: true
  title: GCP backend services and buckets should have compression enabled
  provider: google
  description: GCP backend services (global and regional) and backend buckets used with Cloud CDN should enable compression
    to reduce outbound data transfer and energy consumption.
  expected: 'true'
  remediation: 'Set compression_mode = "AUTOMATIC" on google_compute_backend_service and google_compute_backend_bucket where
    supported by Cloud CDN.

    '
  example:
    compliant: "resource \"google_compute_backend_service\" \"api\" {\n  name             = \"api-backend\"\n  compression_mode\
      \ = \"AUTOMATIC\"\n  enable_cdn       = true\n}\n"
    non_compliant: "resource \"google_compute_backend_service\" \"api\" {\n  name             = \"api-backend\"\n  compression_mode\
      \ = \"DISABLED\"\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_compute_backend_service
    - google_compute_backend_bucket
  assertions:
  - attribute: compression_mode
    op: equals
    expected: AUTOMATIC
    message: GCP backend service/bucket should have compression_mode set to AUTOMATIC.
  on_fail: finding
