# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-SUS-080
id: WAF-SUS-080
pillar: sustainability
severity: medium
type:
  - configuration
description: |
  All data transfers MUST be designed to minimize unnecessary movement across network boundaries. Cross-region data transfers MUST be justified; same-region communication MUST be preferred. Content Delivery Networks (CDN) MUST be used for all user-facing static and semi-static content. HTTP compression (gzip/brotli) MUST be enabled for all API responses larger than 1KB. VPC Endpoints MUST be used for AWS service communication to avoid internet gateway egress. Data transfer optimization is both a cost control and a carbon reduction measure: every byte transferred consumes network energy; minimizing transfers minimizes emissions.
regulatory_mapping:
  - framework: 'Green Software Foundation'
    controls:
      - 'Energy Efficiency – minimize network data transfer'
      - 'Software Carbon Intensity (SCI) – network embodied energy'
  - framework: 'EU CSRD (Corporate Sustainability Reporting Directive)'
    controls:
      - 'ESRS E1 – Climate Change – operational energy efficiency'
  - framework: 'GHG Protocol'
    controls:
      - 'Scope 3 Category 11 – reducing network-related cloud emissions'
checks:
  - id: waf-sus-080.tf.aws.cloudfront-compression
    engine: terraform
    automated: true
    title: 'CloudFront distributions must enable compression'
    provider: aws
    description: 'CloudFront distributions must have compress = true on all cache behaviors to automatically compress compressible content (text, JSON, HTML, CSS, JavaScript) before delivery. This reduces data transfer volume by 60-80% for text content.'
    expected: 'true'
    remediation: 'Set compress = true on all cache_behavior and default_cache_behavior blocks in the CloudFront distribution. CloudFront will automatically compress eligible responses (text/html, text/css, application/json, etc.) using gzip or brotli.\n'
    example:
      compliant: |
        resource "aws_cloudfront_distribution" "web" {
          default_cache_behavior {
            allowed_methods        = ["GET", "HEAD"]
            cached_methods         = ["GET", "HEAD"]
            target_origin_id       = "web-origin"
            viewer_protocol_policy = "redirect-to-https"
            compress               = true  # 60-80% transfer reduction for text content
          }
          # ...
        }
        
      non_compliant: |
        resource "aws_cloudfront_distribution" "web" {
          default_cache_behavior {
            allowed_methods        = ["GET", "HEAD"]
            cached_methods         = ["GET", "HEAD"]
            target_origin_id       = "web-origin"
            viewer_protocol_policy = "redirect-to-https"
            compress               = false  # WAF-SUS-080 Violation: uncompressed delivery
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudfront_distribution
    assertions:
      - attribute: 'default_cache_behavior.compress'
        op: 'is_true'
        message: 'CloudFront distribution does not have compression enabled – enable compress = true for 60-80% transfer reduction.'
    on_fail: violation
  - id: waf-sus-080.tf.aws.vpc-endpoint-s3
    engine: terraform
    automated: true
    title: 'VPC should have S3 and DynamoDB gateway endpoints to avoid internet egress'
    provider: aws
    description: "S3 and DynamoDB gateway VPC Endpoints allow EC2 instances and Lambda functions to communicate with these services through the AWS private network instead of through an internet gateway. This eliminates internet data transfer charges and energy, as the traffic stays within AWS's backbone network."
    expected: 'true'
    remediation: 'Create gateway VPC endpoints for com.amazonaws.REGION.s3 and com.amazonaws.REGION.dynamodb in each VPC. Associate them with all route tables. For interface endpoints (STS, ECR, CloudWatch, SSM): create them in private subnets to eliminate all internet gateway dependencies.\n'
    example:
      compliant: |
        resource "aws_vpc_endpoint" "s3" {
          vpc_id            = aws_vpc.main.id
          service_name      = "com.amazonaws.${var.region}.s3"
          vpc_endpoint_type = "Gateway"
          route_table_ids   = aws_route_table.private[*].id
          tags = {
            Name    = "s3-gateway-endpoint"
            purpose = "eliminate-internet-egress"
          }
        }
        
        resource "aws_vpc_endpoint" "dynamodb" {
          vpc_id            = aws_vpc.main.id
          service_name      = "com.amazonaws.${var.region}.dynamodb"
          vpc_endpoint_type = "Gateway"
          route_table_ids   = aws_route_table.private[*].id
        }
        
      non_compliant: |
        # VPC with no endpoints – all AWS service traffic goes via internet gateway
        resource "aws_vpc" "main" {
          cidr_block = "10.0.0.0/16"
          # WAF-SUS-080 Warning: no VPC endpoints configured
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_vpc_endpoint
    assertions:
      - attribute: 'service_name'
        op: 'not_empty'
        message: 'VPC endpoint has no service_name – check configuration.'
    on_fail: warning
  - id: waf-sus-080.tf.azurerm.cdn-compression
    engine: terraform
    automated: true
    title: 'Azure CDN endpoints must have compression enabled'
    provider: azurerm
    description: 'Azure CDN endpoints should have compression enabled to reduce data transfer volume for compressible content types. Without compression, each user receives the full uncompressed payload, multiplying network energy consumption.'
    expected: 'true'
    remediation: 'Set is_compression_enabled = true and provide content_types_to_compress list including text/html, text/css, application/json, application/javascript. Ensure origin also supports compressed responses or configure CDN-level compression.\n'
    example:
      compliant: |
        resource "azurerm_cdn_endpoint" "web" {
          name                = "web-cdn"
          profile_name        = azurerm_cdn_profile.main.name
          resource_group_name = var.resource_group_name
          location            = "global"
          origin_host_header  = azurerm_storage_account.web.primary_blob_host
        
          is_compression_enabled = true
          content_types_to_compress = [
            "text/html",
            "text/css",
            "application/json",
            "application/javascript",
            "image/svg+xml",
          ]
        }
        
      non_compliant: |
        resource "azurerm_cdn_endpoint" "web" {
          name                   = "web-cdn"
          profile_name           = azurerm_cdn_profile.main.name
          resource_group_name    = var.resource_group_name
          location               = "global"
          is_compression_enabled = false  # WAF-SUS-080 Violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_cdn_endpoint
    assertions:
      - attribute: 'is_compression_enabled'
        op: 'is_true'
        message: 'Azure CDN endpoint has compression disabled – enable for significant transfer reduction.'
    on_fail: violation
