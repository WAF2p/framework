checks:
- id: waf-sec-030.tf.aws.rds-encryption-enabled
  engine: terraform
  automated: true
  title: RDS instances and clusters must be encrypted at rest with a CMK
  provider: aws
  description: All RDS database instances and Aurora clusters must have storage_encrypted = true and must reference a customer-managed KMS key via kms_key_id.
  expected: 'true'
  remediation: 'Set storage_encrypted = true and kms_key_id = aws_kms_key.rds_key.arn on the aws_db_instance or aws_rds_cluster resource. Note: enabling encryption on an existing unencrypted RDS instance requires creating an encrypted snapshot and restoring to a new instance. Plan for a maintenance window.\n'
  example:
    compliant: "resource \"aws_kms_key\" \"rds\" {\n  description             = \"CMK for RDS encryption\"\n  enable_key_rotation     = true\n  deletion_window_in_days = 30\n}\nresource \"aws_db_instance\" \"main\" {\n  identifier        = \"app-db-prod\"\n  engine            = \"postgres\"\n  instance_class    = \"db.t3.medium\"\n  storage_encrypted = true\n  kms_key_id        = aws_kms_key.rds.arn\n  # ... other required attributes\n}\n"
    non_compliant: "resource \"aws_db_instance\" \"main\" {\n  identifier        = \"app-db-prod\"\n  engine            = \"postgres\"\n  instance_class    = \"db.t3.medium\"\n  storage_encrypted = false  # WAF-SEC-030 violation\n  # kms_key_id not set – using default AWS-managed key\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_db_instance
    - aws_rds_cluster
  assertions:
  - attribute: storage_encrypted
    op: is_true
    message: RDS instance/cluster must have storage encryption enabled (storage_encrypted = true).
  - attribute: kms_key_id
    op: attribute_exists
    message: RDS instance/cluster must use a customer-managed KMS key (kms_key_id must be set).
  on_fail: violation
- id: waf-sec-030.tf.aws.kms-key-rotation
  engine: terraform
  automated: true
  title: KMS keys must have automatic rotation enabled and a sufficient deletion window
  provider: aws
  description: All customer-managed KMS keys must have enable_key_rotation = true and deletion_window_in_days >= 7 to ensure keys are regularly rotated and accidental deletion can be recovered.
  expected: 'true'
  remediation: 'Set enable_key_rotation = true on all aws_kms_key resources. Set deletion_window_in_days to at least 7 (recommend 30 for production keys). Note: key rotation does not apply to asymmetric keys or keys in external key stores; those require separate rotation procedures.\n'
  example:
    compliant: "resource \"aws_kms_key\" \"app_data\" {\n  description             = \"CMK for application data encryption\"\n  enable_key_rotation     = true\n  deletion_window_in_days = 30\n  tags = {\n    owner       = \"platform-team\"\n    environment = \"production\"\n  }\n}\n"
    non_compliant: "resource \"aws_kms_key\" \"app_data\" {\n  description             = \"CMK for application data\"\n  enable_key_rotation     = false   # WAF-SEC-030 violation\n  deletion_window_in_days = 3       # WAF-SEC-030 violation: below 7-day minimum\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_kms_key
  assertions:
  - attribute: enable_key_rotation
    op: is_true
    message: KMS key must have automatic rotation enabled (enable_key_rotation = true).
  - attribute: deletion_window_in_days
    op: greater_than_or_equal
    message: KMS key deletion window must be at least 7 days to allow recovery from accidental deletion.
    expected: 7
  on_fail: violation
- id: waf-sec-030.tf.azurerm.key-vault-key-expiration
  engine: terraform
  automated: true
  title: Azure Key Vault keys used for encryption must have an expiration date
  provider: azurerm
  description: All azurerm_key_vault_key resources that protect sensitive data must have expiration_date set to enforce key lifecycle and rotation.
  expected: 'true'
  remediation: 'Set expiration_date on every azurerm_key_vault_key resource used for workload encryption. Establish a key rotation process that refreshes keys before expiration.

    '
  example:
    compliant: "resource \"azurerm_key_vault_key\" \"app\" {\n  name         = \"app-encryption-key\"\n  key_vault_id = azurerm_key_vault.main.id\n  key_type     = \"RSA\"\n  key_size     = 2048\n  expiration_date = \"2026-01-01T00:00:00Z\"\n}\n"
    non_compliant: "resource \"azurerm_key_vault_key\" \"app\" {\n  name         = \"app-encryption-key\"\n  key_vault_id = azurerm_key_vault.main.id\n  key_type     = \"RSA\"\n  key_size     = 2048\n  # expiration_date not set\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_key_vault_key
  assertions:
  - attribute: expiration_date
    op: attribute_exists
    message: Key Vault key must have an expiration_date for lifecycle management.
  on_fail: violation
- id: waf-sec-030.tf.azurerm.key-vault-purge-protection
  engine: terraform
  automated: true
  title: Azure Key Vault must have purge protection and soft delete enabled
  provider: azurerm
  description: All azurerm_key_vault resources must have purge_protection_enabled = true and soft_delete_retention_days >= 7 to protect against accidental or malicious key destruction.
  expected: 'true'
  remediation: 'Set purge_protection_enabled = true and soft_delete_retention_days to at least 7 on every azurerm_key_vault resource that stores workload keys.

    '
  example:
    compliant: "resource \"azurerm_key_vault\" \"main\" {\n  name                        = \"workload-keyvault\"\n  location                    = azurerm_resource_group.main.location\n  resource_group_name         = azurerm_resource_group.main.name\n  tenant_id                   = data.azurerm_client_config.current.tenant_id\n  sku_name                    = \"standard\"\n  soft_delete_retention_days  = 7\n  purge_protection_enabled    = true\n}\n"
    non_compliant: "resource \"azurerm_key_vault\" \"main\" {\n  name                        = \"workload-keyvault\"\n  location                    = azurerm_resource_group.main.location\n  resource_group_name         = azurerm_resource_group.main.name\n  tenant_id                   = data.azurerm_client_config.current.tenant_id\n  sku_name                    = \"standard\"\n  # purge_protection_enabled defaults to false\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_key_vault
  assertions:
  - attribute: purge_protection_enabled
    op: is_true
    message: Key Vault purge protection must be enabled.
  - attribute: soft_delete_retention_days
    op: greater_than_or_equal
    expected: 7
    message: Key Vault soft delete retention must be at least 7 days.
  on_fail: violation
- id: waf-sec-030.tf.google.sql-cmek-encryption
  engine: terraform
  automated: true
  title: Cloud SQL instances must be encrypted with a customer-managed key
  provider: google
  description: All google_sql_database_instance resources must reference a customer-managed encryption key via encryption_key_name.
  expected: 'true'
  remediation: 'Set encryption_key_name to a Cloud KMS key for every google_sql_database_instance that stores sensitive or regulated data.

    '
  example:
    compliant: "resource \"google_sql_database_instance\" \"main\" {\n  name             = \"app-db\"\n  database_version = \"POSTGRES_15\"\n  region           = \"europe-west3\"\n  settings {\n    tier = \"db-custom-2-7680\"\n    encryption_key_name = google_kms_crypto_key.db_key.id\n  }\n}\n"
    non_compliant: "resource \"google_sql_database_instance\" \"main\" {\n  name             = \"app-db\"\n  database_version = \"POSTGRES_15\"\n  region           = \"europe-west3\"\n  settings {\n    tier = \"db-custom-2-7680\"\n    # encryption_key_name not set – uses Google-managed key\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_sql_database_instance
  assertions:
  - attribute: settings.encryption_key_name
    op: attribute_exists
    message: Cloud SQL instance must use a customer-managed encryption key (CMEK).
  on_fail: violation
- id: waf-sec-030.tf.google.kms-key-rotation
  engine: terraform
  automated: true
  title: Cloud KMS keys must have a rotation period configured
  provider: google
  description: All google_kms_crypto_key resources must have rotation_period set to enforce regular key rotation.
  expected: 'true'
  remediation: 'Set rotation_period (e.g., "7776000s" for 90 days) on every google_kms_crypto_key resource used for workload encryption.

    '
  example:
    compliant: "resource \"google_kms_crypto_key\" \"app\" {\n  name            = \"app-key\"\n  key_ring        = google_kms_key_ring.app.id\n  rotation_period = \"7776000s\"\n}\n"
    non_compliant: "resource \"google_kms_crypto_key\" \"app\" {\n  name     = \"app-key\"\n  key_ring = google_kms_key_ring.app.id\n  # rotation_period not set\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_kms_crypto_key
  assertions:
  - attribute: rotation_period
    op: attribute_exists
    message: Cloud KMS key must have a rotation_period configured.
  on_fail: violation
- id: waf-sec-030.tf.stackit.resource-encryption-enabled
  engine: terraform
  automated: true
  title: STACKIT managed resources must use encryption at rest
  provider: stackit
  description: STACKIT resources that store data (e.g., stackit_postgres_flex_instance, stackit_redis_instance, stackit_opensearch_instance, stackit_mysql_instance) must have encryption at rest enabled or use a customer-managed key where supported.
  expected: 'true'
  remediation: Enable encryption at rest on all STACKIT managed data services. Use customer-managed keys via stackit_object_storage_bucket or service-specific encryption settings where available.\n
  example:
    compliant: "resource \"stackit_postgres_flex_instance\" \"app\" {\n  project_id = var.stackit_project_id\n  name       = \"app-db\"\n  version    = \"15\"\n  # encryption enabled by default; CMK configured via STACKIT console/API\n}\n"
    non_compliant: "resource \"stackit_postgres_flex_instance\" \"app\" {\n  project_id = var.stackit_project_id\n  name       = \"app-db\"\n  # WAF-SEC-030 violation: encryption not verified or disabled\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_postgres_flex_instance
    - stackit_mysql_instance
    - stackit_redis_instance
    - stackit_opensearch_instance
    - stackit_object_storage_bucket
  assertions:
  - attribute: name
    op: attribute_exists
    message: STACKIT data resource must be defined with encryption at rest enabled by default or explicitly configured.
  on_fail: violation
- id: waf-sec-030.config.ovh.ovh-identity-access
  engine: config
  automated: true
  title: OVHcloud data services must have encryption at rest enabled and documented
  provider: ovh
  description: A version-controlled policy document must exist at `docs/security/waf-sec-030-ovh-identity-access.md` and document the OVHcloud implementation of this control. The checker validates that the file exists and contains a normative requirement statement (MUST/SHALL/required/mandatory).
  expected: 'true'
  remediation: 'Create or update `docs/security/waf-sec-030-ovh-identity-access.md`. State the requirement, how it is implemented for OVHcloud, the review cadence, and the owner.

    '
  example:
    compliant: '|

      docs/security/waf-sec-030-ovh-identity-access.md:

      - The OVHcloud implementation of WAF-SEC-030 is documented.

      - Implementation status and owner are recorded.

      - Review cadence is defined (e.g. quarterly).

      '
    non_compliant: '|

      # `docs/security/waf-sec-030-ovh-identity-access.md` is missing or does not contain a normative requirement.

      # WAF-SEC-030 violation: OVHcloud control is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/security/waf-sec-030-ovh-identity-access.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/security/waf-sec-030-ovh-identity-access.md` must contain a normative requirement statement.
  on_fail: violation
- id: waf-sec-030.tf.hcloud.volume-encryption
  engine: terraform
  automated: true
  title: Hetzner Cloud volumes must be encrypted at rest
  provider: hcloud
  description: All hcloud_volume resources attached to production servers must use Hetzner Cloud encryption at rest. Validate via the resource definition or a documented standard.
  expected: 'true'
  remediation: Create hcloud_volume resources with encryption enabled. For operating-system-level encryption, document LUKS/dm-crypt configuration in a version-controlled standard.\n
  example:
    compliant: "resource \"hcloud_volume\" \"app\" {\n  name      = \"app-data\"\n  size      = 100\n  server_id = hcloud_server.app.id\n  format    = \"ext4\"\n  # Hetzner Cloud volume encryption at rest is enabled by default for new volumes\n}\n"
    non_compliant: "resource \"hcloud_volume\" \"app\" {\n  name      = \"app-data\"\n  size      = 100\n  server_id = hcloud_server.app.id\n  # WAF-SEC-030 violation: encryption at rest not verified\n}\n"
  scope:
    block_type: resource
    resource_types:
    - hcloud_volume
  assertions:
  - attribute: name
    op: attribute_exists
    message: Hetzner Cloud volume must exist and have encryption at rest enabled or documented.
  on_fail: violation
