checks:
  - id: waf-sec-030.tf.aws.rds-encryption-enabled
    engine: terraform
    automated: true
    title: 'RDS instances and clusters must be encrypted at rest with a CMK'
    provider: aws
    description: 'All RDS database instances and Aurora clusters must have storage_encrypted = true and must reference a customer-managed KMS key via kms_key_id.'
    expected: 'true'
    remediation: 'Set storage_encrypted = true and kms_key_id = aws_kms_key.rds_key.arn on the aws_db_instance or aws_rds_cluster resource. Note: enabling encryption on an existing unencrypted RDS instance requires creating an encrypted snapshot and restoring to a new instance. Plan for a maintenance window.\n'
    example:
      compliant: |
        resource "aws_kms_key" "rds" {
          description             = "CMK for RDS encryption"
          enable_key_rotation     = true
          deletion_window_in_days = 30
        }
        resource "aws_db_instance" "main" {
          identifier        = "app-db-prod"
          engine            = "postgres"
          instance_class    = "db.t3.medium"
          storage_encrypted = true
          kms_key_id        = aws_kms_key.rds.arn
          # ... other required attributes
        }
        
      non_compliant: |
        resource "aws_db_instance" "main" {
          identifier        = "app-db-prod"
          engine            = "postgres"
          instance_class    = "db.t3.medium"
          storage_encrypted = false  # WAF-SEC-030 violation
          # kms_key_id not set – using default AWS-managed key
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_db_instance
        - aws_rds_cluster
    assertions:
      - attribute: 'storage_encrypted'
        op: 'is_true'
        message: 'RDS instance/cluster must have storage encryption enabled (storage_encrypted = true).'
      - attribute: 'kms_key_id'
        op: 'attribute_exists'
        message: 'RDS instance/cluster must use a customer-managed KMS key (kms_key_id must be set).'
    on_fail: violation
  - id: waf-sec-030.tf.aws.kms-key-rotation
    engine: terraform
    automated: true
    title: 'KMS keys must have automatic rotation enabled and a sufficient deletion window'
    provider: aws
    description: 'All customer-managed KMS keys must have enable_key_rotation = true and deletion_window_in_days >= 7 to ensure keys are regularly rotated and accidental deletion can be recovered.'
    expected: 'true'
    remediation: 'Set enable_key_rotation = true on all aws_kms_key resources. Set deletion_window_in_days to at least 7 (recommend 30 for production keys). Note: key rotation does not apply to asymmetric keys or keys in external key stores; those require separate rotation procedures.\n'
    example:
      compliant: |
        resource "aws_kms_key" "app_data" {
          description             = "CMK for application data encryption"
          enable_key_rotation     = true
          deletion_window_in_days = 30
          tags = {
            owner       = "platform-team"
            environment = "production"
          }
        }
        
      non_compliant: |
        resource "aws_kms_key" "app_data" {
          description             = "CMK for application data"
          enable_key_rotation     = false   # WAF-SEC-030 violation
          deletion_window_in_days = 3       # WAF-SEC-030 violation: below 7-day minimum
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_kms_key
    assertions:
      - attribute: 'enable_key_rotation'
        op: 'is_true'
        message: 'KMS key must have automatic rotation enabled (enable_key_rotation = true).'
      - attribute: 'deletion_window_in_days'
        op: 'greater_than_or_equal'
        message: 'KMS key deletion window must be at least 7 days to allow recovery from accidental deletion.'
        expected: 7
    on_fail: violation
