id: WAF-SOV-040
title: All observability data—logs, traces, and metrics—MUST be stored in approved...
status: active
tags:
- sovereign
- high
- configuration
pillar: sovereign
severity: high
type:
- configuration
category: network-security
rationale: Open networks and insufficient segmentation allow external attacks and the spread of threats inside the infrastructure.
  This control addresses the requirements of the 'Network Security' area and ensures that All observability data—logs, traces,
  and metrics—MUST be stored in approved sovereign regions.
threat:
- Observability data outside approved regions can violate data-protection and sovereignty requirements.
- Missing data-location control for logs and metrics complicates audits and regulatory evidence.
implementation_guidance:
- Implement the required configuration as code in Terraform or equivalent IaC.
- Add an automated check to CI/CD so deviations are caught before deployment.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - The requirement is documented; initial resources show the intended configuration.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform checks or IaC gates automatically validate the requirement in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-sovereign/pages/controls/WAF-SOV-040.adoc
  related_controls:
  - WAF-SOV-020
  - WAF-SOV-060
  - WAF-SEC-050
  - WAF-SOV-030
  - WAF-PERF-060
  - WAF-SOV-010
  - WAF-SOV-070
  - WAF-SOV-090
  - WAF-SOV-080
  - WAF-SOV-100
  - WAF-REL-010
  - WAF-SEC-010
description: 'All observability data—logs, traces, and metrics—MUST be stored in approved sovereign regions. Exports to external
  platforms (SaaS observability, third-party SIEM) MUST be explicitly approved, documented, and controlled. Log retention
  periods MUST be defined and enforced. VPC flow logs MUST be enabled to support forensic investigation within sovereign infrastructure.

  '
regulatory_mapping:
- framework: GDPR
  controls:
  - Art. 32 – Security of processing (including integrity monitoring)
  - Art. 44-46 – Transfers to third countries
  - Art. 5(1)(e) – Storage limitation
- framework: BSI C5:2020
  controls:
  - LOG-01 – Logging
  - LOG-02 – Log protection
  - OPS-04 – Data management
- framework: BSI C3A:2026
  controls:
  - 'Dimension 5 – Operational: Logging and monitoring location'
  - 'Dimension 5 – Operational: SOC (Security Operations Center)'
- framework: EUCS (ENISA)
  controls:
  - LOG-01 – Audit logging
  - IVS-09 – Network logging
- framework: ISO 27001:2022
  controls:
  - A.8.15 – Logging
  - A.8.16 – Monitoring activities
checks:
- id: waf-sov-040.tf.aws.cloudtrail-multi-region
  engine: terraform
  automated: true
  title: CloudTrail must be multi-region and have log file validation enabled
  provider: aws
  description: AWS CloudTrail must be enabled for all regions (is_multi_region_trail = true) and log file validation must
    be enabled to detect tampering.
  expected: 'true'
  remediation: Set is_multi_region_trail = true and enable_log_file_validation = true on all CloudTrail resources.\n
  example:
    compliant: "resource \"aws_cloudtrail\" \"sovereign\" {\n  name                          = \"sovereign-audit-trail\"\n\
      \  s3_bucket_name                = aws_s3_bucket.cloudtrail.id\n  is_multi_region_trail         = true\n  enable_log_file_validation\
      \    = true\n  include_global_service_events = true\n}\n"
    non_compliant: "resource \"aws_cloudtrail\" \"trail\" {\n  name           = \"my-trail\"\n  s3_bucket_name = \"my-logs\"\
      \n  # is_multi_region_trail defaults to false\n  # enable_log_file_validation defaults to false\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_cloudtrail
  assertions:
  - attribute: is_multi_region_trail
    op: is_true
    message: CloudTrail must be multi-region to capture events from all regions.
  - attribute: enable_log_file_validation
    op: is_true
    message: CloudTrail log file validation must be enabled to detect tampering.
  on_fail: violation
- id: waf-sov-040.tf.aws.cloudwatch-log-group-retention
  engine: terraform
  automated: true
  title: CloudWatch log groups must have retention period set
  provider: aws
  description: CloudWatch log groups must have an explicit retention_in_days value set. A value of 0 means logs never expire
    and violates data minimization requirements. Minimum 90 days for audit/security logs; 30 days for operational logs.
  expected: 'true'
  remediation: Set retention_in_days on all CloudWatch log groups. Use 90 days minimum for audit and security logs, 30 days
    minimum for application logs.\n
  example:
    compliant: "resource \"aws_cloudwatch_log_group\" \"audit\" {\n  name              = \"/sovereign/audit\"\n  retention_in_days\
      \ = 365\n  kms_key_id        = aws_kms_key.log_encryption.arn\n  tags = {\n    data-class     = \"audit\"\n    data-residency\
      \ = \"eu-only\"\n  }\n}\n"
    non_compliant: "resource \"aws_cloudwatch_log_group\" \"app\" {\n  name = \"/app/logs\"\n  # retention_in_days not set\
      \ – logs never expire\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_cloudwatch_log_group
  assertions:
  - attribute: retention_in_days
    op: attribute_exists
    message: CloudWatch log group is missing 'retention_in_days' attribute.
  - attribute: retention_in_days
    op: not_equals
    message: CloudWatch log group retention_in_days must not be 0 (never expire).
    expected: 0
  - attribute: retention_in_days
    op: greater_than_or_equal
    message: Log group retention must be at least 30 days.
    expected: 30
  on_fail: violation
- id: waf-sov-040.tf.aws.vpc-flow-logs-enabled
  engine: terraform
  automated: true
  title: VPC flow logs must be enabled for all VPCs
  provider: aws
  description: Every aws_vpc resource should have a corresponding aws_flow_log resource to enable network-level forensics
    within the sovereign environment.
  expected: 'true'
  remediation: Create an aws_flow_log resource referencing each VPC to capture network traffic metadata for forensic investigation.\n
  example:
    compliant: "resource \"aws_vpc\" \"main\" {\n  cidr_block = \"10.0.0.0/16\"\n}\nresource \"aws_flow_log\" \"main\" {\n\
      \  vpc_id          = aws_vpc.main.id\n  traffic_type    = \"ALL\"\n  iam_role_arn    = aws_iam_role.flow_log.arn\n \
      \ log_destination = aws_cloudwatch_log_group.flow_log.arn\n}\n"
    non_compliant: "resource \"aws_vpc\" \"main\" {\n  cidr_block = \"10.0.0.0/16\"\n  # No flow log configured\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_vpc
  assertions:
  - attribute: id
    op: has_associated_resource
    message: VPC does not have flow logging enabled. Add an aws_flow_log resource.
  on_fail: violation
- id: waf-sov-040.tf.aws.cloudtrail-cloudwatch-integration
  engine: terraform
  automated: true
  title: CloudTrail should integrate with CloudWatch for real-time monitoring
  provider: aws
  description: CloudTrail should have cloud_watch_logs_group_arn set to enable real-time monitoring and alerting on privileged
    actions and anomalous activity.
  expected: 'true'
  remediation: Set cloud_watch_logs_group_arn and cloud_watch_logs_role_arn on the CloudTrail resource to enable real-time
    detection of privileged and anomalous activities.\n
  scope:
    block_type: resource
    resource_types:
    - aws_cloudtrail
  assertions:
  - attribute: cloud_watch_logs_group_arn
    op: attribute_exists
    message: CloudTrail should have cloud_watch_logs_group_arn configured for real-time monitoring.
  - attribute: cloud_watch_logs_role_arn
    op: attribute_exists
    message: CloudTrail requires cloud_watch_logs_role_arn when CloudWatch integration is used.
  on_fail: advisory
- id: waf-sov-040.tf.aws.log-group-kms-encryption
  engine: terraform
  automated: true
  title: CloudWatch log groups containing audit data should use KMS encryption
  provider: aws
  description: CloudWatch log groups that capture audit, security, or administrative events should have kms_key_id set to
    a CMK to ensure encryption with customer-managed keys.
  expected: 'true'
  remediation: Add kms_key_id referencing a CMK to log groups capturing sensitive audit data.\n
  scope:
    block_type: resource
    resource_types:
    - aws_cloudwatch_log_group
  assertions:
  - attribute: kms_key_id
    op: attribute_exists
    message: Audit/security log group should be encrypted with a customer-managed KMS key.
  on_fail: advisory
- id: waf-sov-040.tf.stackit.logging-region-sovereign
  engine: terraform
  automated: true
  title: StackIT logging must be stored in sovereign regions
  provider: stackit
  description: StackIT log service instances must have data stored in approved sovereign regions only (eu-central-1, eu-west-1).
  expected: 'true'
  remediation: Configure StackIT log service to store logs in approved sovereign regions and enable log export restrictions.\n
  example:
    compliant: "resource \"stackit_log_service\" \"main\" {\n  project_id = stackit_project.main.id\n  name       = \"sovereign-logs\"\
      \n  # Data stored in eu-central-1 by default\n}\n"
    non_compliant: "resource \"stackit_log_service\" \"main\" {\n  project_id = stackit_project.main.id\n  name       = \"\
      logs\"\n  # Data exported to non-sovereign region\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_log_service
  assertions:
  - attribute: region
    op: in
    message: StackIT log service must be in approved sovereign regions only.
    expected:
    - eu-central-1
    - eu-west-1
    - eu-west-3
    - germanywestcentral
    - westeurope
    - northeurope
    - europe-west3
    - europe-west1
    - fsn1
    - hel1
    - de
    - fi
  on_fail: violation
- id: waf-sov-040.tf.ovh.logging-region-sovereign
  engine: terraform
  automated: true
  title: OVH logging must be stored in sovereign regions
  provider: ovh
  description: OVH logging services must store logs in approved sovereign regions only (DE-FRA, DE-EDE, EU-CY).
  expected: 'true'
  remediation: Configure OVH logging services to store logs in approved sovereign regions.\n
  example:
