    message: OVH logging must be in approved sovereign regions only.
    expected:
    - eu-central-1
    - eu-west-1
    - eu-west-3
    - germanywestcentral
    - westeurope
    - northeurope
    - europe-west3
    - europe-west1
    - fsn1
    - hel1
    - de
    - fi
  on_fail: violation
- id: waf-sov-040.tf.hcloud.logging-region-sovereign
  engine: terraform
  automated: true
  title: Hetzner Cloud logging must be stored in sovereign regions
  provider: hcloud
  description: Hetzner Cloud monitoring and logging must be stored in approved sovereign regions only (fsn1, nbg1, hel1).
  expected: 'true'
  remediation: Configure Hetzner Cloud monitoring to store logs in approved sovereign regions.\n
  example:
    compliant: '# Hetzner monitoring configured to stay within fsn1 and hel1 regions

      '
    non_compliant: '# Logs exported to non-sovereign region

      '
  scope:
    block_type: resource
    resource_types:
    - hcloud_server
  assertions:
  - attribute: location
    op: in
    message: Hetzner Cloud logging must be in approved sovereign regions only.
    expected:
    - eu-central-1
    - eu-west-1
    - eu-west-3
    - germanywestcentral
    - westeurope
    - northeurope
    - europe-west3
    - europe-west1
    - fsn1
    - hel1
    - de
    - fi
  on_fail: violation
- id: waf-sov-040.tf.azurerm.log-analytics-location
  engine: terraform
  automated: true
  title: Azure Log Analytics workspace for observability data must be in approved sovereign location
  provider: azurerm
  description: Azure Log Analytics workspaces storing audit, security, and operational logs must be provisioned in an approved
    sovereign location. Data must not be replicated to non-sovereign regions.
  expected: 'true'
  remediation: 'Create azurerm_log_analytics_workspace in an approved sovereign location (e.g., germanywestcentral, westeurope,
    northeurope) and configure linked storage accounts in the same jurisdiction.

    '
  example:
    compliant: "resource \"azurerm_log_analytics_workspace\" \"sovereign\" {\n  name                = \"law-sovereign-audit\"\
      \n  location            = \"germanywestcentral\"\n  resource_group_name = azurerm_resource_group.main.name\n  sku  \
      \               = \"PerGB2018\"\n  retention_in_days   = 365\n}\n"
    non_compliant: "resource \"azurerm_log_analytics_workspace\" \"sovereign\" {\n  name                = \"law-sovereign-audit\"\
      \n  location            = \"eastus\"\n  resource_group_name = azurerm_resource_group.main.name\n  sku              \
      \   = \"PerGB2018\"\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_log_analytics_workspace
  assertions:
  - attribute: location
    op: in
    expected:
    - germanywestcentral
    - westeurope
    - northeurope
    - switzerlandnorth
    - francecentral
    message: Log Analytics workspace must be in an approved sovereign location.
  on_fail: violation
- id: waf-sov-040.tf.google.logging-bucket-location
  engine: terraform
  automated: true
  title: GCP log buckets and sinks must store observability data in approved sovereign locations
  provider: google
  description: GCP logging project buckets and storage buckets receiving log sinks must be located in approved sovereign regions.
    Cloud Logging data must not be routed to non-sovereign destinations.
  expected: 'true'
  remediation: 'Configure google_logging_project_bucket_config in an approved location (e.g., europe-west3) and ensure google_logging_project_sink
    destinations are buckets in sovereign regions.

    '
  example:
    compliant: "resource \"google_logging_project_bucket_config\" \"sovereign\" {\n  bucket_id    = \"sovereign-audit-logs\"\
      \n  location     = \"europe-west3\"\n  retention_days = 365\n}\n\nresource \"google_logging_project_sink\" \"audit\"\
      \ {\n  name        = \"audit-sink\"\n  destination = \"bigquery.googleapis.com/projects/${var.project_id}/datasets/${google_bigquery_dataset.logs.id}\"\
      \n}\n"
    non_compliant: "resource \"google_logging_project_bucket_config\" \"sovereign\" {\n  bucket_id    = \"audit-logs\"\n \
      \ location     = \"us-central1\"\n  retention_days = 365\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_logging_project_bucket_config
  assertions:
  - attribute: location
    op: in
    expected:
    - europe-west3
    - europe-west1
    - europe-north1
    - europe-central2
    message: GCP log bucket must be in an approved sovereign location.
  on_fail: violation
