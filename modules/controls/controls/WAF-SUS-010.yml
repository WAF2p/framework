# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-SUS-010
id: WAF-SUS-010
pillar: sustainability
severity: high
type:
  - governance
  - configuration
description: |
  Organizations MUST measure and report the carbon footprint of their cloud workloads. Cloud-provider carbon footprint tools (AWS Customer Carbon Footprint Tool, Azure Emissions Impact Dashboard, GCP Carbon Footprint) MUST be enabled and queried at least monthly. Emissions data MUST be exported, tagged by workload, and retained for ESG reporting. Organizations subject to CSRD MUST integrate cloud IT emissions into their ESRS E1 reporting.
regulatory_mapping:
  - framework: 'EU CSRD (Corporate Sustainability Reporting Directive)'
    controls:
      - 'ESRS E1 – Climate Change'
      - 'ESRS E1-6 – Gross Scope 1, 2, 3 GHG emissions'
  - framework: 'GHG Protocol'
    controls:
      - 'Scope 3 – Category 11: Use of sold products'
      - 'Scope 2 – Energy Indirect Emissions (location-based and market-based)'
  - framework: 'Green Software Foundation'
    controls:
      - 'Software Carbon Intensity (SCI) – measurement standard'
  - framework: 'SBTi (Science Based Targets initiative)'
    controls:
      - 'ICT Sector Guidance – Scope 3 measurement requirements'
  - framework: 'ISO 14001'
    controls:
      - '6.1.2 – Environmental Aspects identification and assessment'
      - '9.1 – Monitoring, measurement, analysis and evaluation'
checks:
  - id: waf-sus-010.tf.aws.cloudwatch-carbon-export
    engine: terraform
    automated: true
    title: 'AWS CloudWatch log group for carbon footprint data export must exist with retention'
    provider: aws
    description: 'A CloudWatch log group or S3 bucket export for AWS Customer Carbon Footprint Tool data must be configured. This check verifies that a log retention policy is set on log groups used for carbon/cost data (no infinite retention which also wastes storage energy).'
    expected: 'true'
    remediation: 'Set retention_in_days on all CloudWatch log groups. For carbon footprint audit logs, use 365 days to satisfy CSRD 7-year record retention. Use lifecycle policies to transition older logs to S3 Glacier for cost and energy efficiency.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_log_group" "carbon_audit" {
          name              = "/sustainability/carbon-footprint-exports"
          retention_in_days = 365
          tags = {
            purpose     = "carbon-audit"
            workload    = "sustainability-reporting"
            environment = "production"
          }
        }
        
      non_compliant: |
        resource "aws_cloudwatch_log_group" "carbon_audit" {
          name = "/sustainability/carbon-footprint-exports"
          # retention_in_days not set = infinite retention
          # WAF-SUS-010 Violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_log_group
    assertions:
      - attribute: 'retention_in_days'
        op: 'attribute_exists'
        message: 'CloudWatch log group has no retention policy – infinite retention wastes storage and blocks carbon data lifecycle.'
      - attribute: 'retention_in_days'
        op: 'greater_than_or_equal'
        message: 'Retention must be set to at least 1 day; recommended 90-365 days for carbon audit data.'
    on_fail: violation
  - id: waf-sus-010.tf.aws.s3-carbon-export-lifecycle
    engine: terraform
    automated: true
    title: 'S3 bucket for carbon footprint exports must have lifecycle rules'
    provider: aws
    description: 'S3 buckets used to store carbon footprint exports from AWS Cost Explorer or Cost and Usage Reports must have lifecycle rules to transition data to cost-efficient storage tiers and eventually expire old records.'
    expected: 'true'
    remediation: 'Add lifecycle rules to transition objects to STANDARD_IA after 30 days, GLACIER after 90 days, and expire after 2555 days (7 years for CSRD compliance). This reduces storage emissions while satisfying regulatory retention requirements.\n'
    example:
      compliant: |
        resource "aws_s3_bucket_lifecycle_configuration" "carbon_exports" {
          bucket = aws_s3_bucket.carbon_data.id
          rule {
            id     = "carbon-data-lifecycle"
            status = "Enabled"
            transition {
              days          = 30
              storage_class = "STANDARD_IA"
            }
            transition {
              days          = 90
              storage_class = "GLACIER"
            }
            expiration {
              days = 2555
            }
          }
        }
        
      non_compliant: |
        resource "aws_s3_bucket" "carbon_data" {
          bucket = "acme-carbon-footprint-exports"
          # No lifecycle rules – WAF-SUS-010 Violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_s3_bucket_lifecycle_configuration
    assertions:
      - attribute: 'rule'
        op: 'not_empty'
        message: 'S3 bucket has no lifecycle rules – carbon export data will accumulate indefinitely.'
    on_fail: violation
  - id: waf-sus-010.tf.azurerm.log-analytics-retention
    engine: terraform
    automated: true
    title: 'Azure Log Analytics workspace for sustainability data must have retention configured'
    provider: azurerm
    description: 'Azure Log Analytics workspaces used for emissions dashboard data and sustainability reporting must have explicit retention periods. Default unlimited retention accumulates data with no governance.'
    expected: 'true'
    remediation: 'Set retention_in_days to at least 365 for sustainability audit workspaces. Enable data export to Azure Storage with lifecycle management for long-term CSRD retention.\n'
    example:
      compliant: |
        resource "azurerm_log_analytics_workspace" "sustainability" {
          name                = "law-sustainability-reporting"
          location            = var.location
          resource_group_name = var.resource_group_name
          sku                 = "PerGB2018"
          retention_in_days   = 365
          tags = {
            purpose     = "carbon-audit"
            environment = "production"
          }
        }
        
      non_compliant: |
        resource "azurerm_log_analytics_workspace" "sustainability" {
          name                = "law-sustainability-reporting"
          location            = var.location
          resource_group_name = var.resource_group_name
          # retention_in_days not set – WAF-SUS-010 Violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_log_analytics_workspace
    assertions:
      - attribute: 'retention_in_days'
        op: 'attribute_exists'
        message: 'Log Analytics workspace has no explicit retention period – data accumulates indefinitely.'
      - attribute: 'retention_in_days'
        op: 'greater_than_or_equal'
        message: 'Retention for sustainability audit data must be at least 90 days; recommended 365.'
    on_fail: violation
