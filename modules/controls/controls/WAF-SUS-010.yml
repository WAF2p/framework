- configuration
pillar: sustainability
severity: high
type:
- governance
- configuration
category: data-governance
rationale: Missing data classification, ownership, and lifecycle control increase compliance risk, cost, and the likelihood of data loss. This control addresses the requirements of the 'Data Governance' area and ensures that Organizations MUST measure and report the carbon footprint of their cloud workloads.
threat:
- Inefficient resource choices increase energy consumption and carbon emissions.
- Unnecessary compute and storage waste budget and environmental targets.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
