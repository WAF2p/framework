# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-SOV-080
id: WAF-SOV-080
pillar: sovereign
severity: medium
type:
  - governance
description: |
  An inventory of all dependencies and subprocessors MUST be maintained: managed cloud services, third-party SaaS tools, CI/CD platforms, observability providers, and data processors. Changes to this inventory MUST be version-controlled, reviewed, and approved. Provider version constraints in Terraform MUST be pinned to prevent silent upgrades. Module sources MUST reference approved registries with version-locked references.
regulatory_mapping:
  - framework: 'GDPR'
    controls:
      - 'Art. 28 – Processor'
      - 'Art. 30 – Records of processing activities'
      - 'Art. 44-46 – Transfers to third countries'
  - framework: 'BSI C5:2020'
    controls:
      - 'SCA-01 – Supply chain management'
      - 'OPS-04 – Data management'
  - framework: 'BSI C3A:2026'
    controls:
      - 'Dimension 6 – Supply Chain: Software inventory (SBoM)'
      - 'Dimension 6 – Supply Chain: Hardware inventory'
      - 'Dimension 6 – Supply Chain: External service dependencies'
  - framework: 'EUCS (ENISA)'
    controls:
      - 'SCA-01 – Supply chain'
      - 'IAM-04 – Third-party access'
  - framework: 'ISO 27001:2022'
    controls:
      - 'A.5.19 – Information security in supplier relationships'
      - 'A.5.20 – Addressing information security in supplier agreements'
      - 'A.5.21 – Managing information security in the ICT supply chain'
  - framework: 'SLSA'
    controls:
      - 'L2 – Build integrity'
      - 'L3 – Source integrity'
checks:
  - id: waf-sov-080.tf.any.required-providers-version-pinned
    engine: terraform
    automated: true
    title: 'All required_providers must have version constraints pinned'
    provider: any
    description: 'Every entry in the terraform required_providers block must specify a version constraint. Unpinned providers allow silent upgrades that may change behavior, introduce breaking changes, or alter sovereign controls without review.'
    expected: 'true'
    remediation: 'Add version constraints to all required_providers using the ~> operator for compatible version pinning (e.g., ~> 5.0 for AWS provider v5.x).\n'
    example:
      compliant: |
        terraform {
          required_version = ">= 1.6.0"
          required_providers {
            aws = {
              source  = "hashicorp/aws"
              version = "~> 5.40"
            }
            azurerm = {
              source  = "hashicorp/azurerm"
              version = "~> 3.100"
            }
          }
        }
        
      non_compliant: |
        terraform {
          required_providers {
            aws = {
              source = "hashicorp/aws"
              # No version constraint – any version accepted
            }
          }
        }
        
    scope:
      block_type: terraform
    assertions:
      - attribute: 'version'
        op: 'attribute_exists_on_all_providers'
        message: 'One or more required_providers entries are missing version constraints.'
      - attribute: 'version'
        op: 'not_matches'
        message: 'Provider version constraint is too broad (>= 0.0.0). Use a tightly bounded constraint.'
        pattern: '^>= 0\\.0\\.0$'
    on_fail: violation
  - id: waf-sov-080.tf.any.required-terraform-version
    engine: terraform
    automated: true
    title: 'Terraform required_version must be set'
    provider: any
    description: "The 'terraform' block must include a required_version constraint to ensure reproducible behavior across environments and prevent use of incompatible Terraform versions."
    expected: 'true'
    remediation: 'Add required_version = ">= 1.x.x" to the terraform configuration block.\n'
    example:
      compliant: |
        terraform {
          required_version = ">= 1.6.0, < 2.0.0"
        }
        
      non_compliant: |
        terraform {
          # No required_version set
        }
        
    scope:
      block_type: terraform
    assertions:
      - attribute: 'required_version'
        op: 'attribute_exists'
        message: 'terraform block is missing required_version constraint.'
    on_fail: violation
  - id: waf-sov-080.tf.any.module-source-version-pinned
    engine: terraform
    automated: true
    title: 'Terraform module sources must reference a pinned version'
    provider: any
    description: "Terraform modules sourced from the Terraform Registry must specify a 'version' attribute. Git-sourced modules must reference a specific tag or commit hash, not a branch reference."
    expected: 'true'
    remediation: 'Pin module versions explicitly. For registry modules: use version = "x.y.z". For git modules: use ?ref=v1.2.3 with a semver tag.\n'
    example:
      compliant: |
        module "vpc" {
          source  = "terraform-aws-modules/vpc/aws"
          version = "5.5.3"
        }
        module "internal_module" {
          source = "git::https://git.example.com/modules/vpc.git?ref=v2.1.0"
        }
        
      non_compliant: |
        module "vpc" {
          source = "terraform-aws-modules/vpc/aws"
          # No version pinned
        }
        module "internal_module" {
          source = "git::https://git.example.com/modules/vpc.git?ref=main"
          # Branch reference – mutable
        }
        
    scope:
      block_type: module
    assertions:
      - attribute: 'version'
        op: 'attribute_exists_if'
        message: "Registry module must specify a pinned 'version'."
      - attribute: 'source'
        op: 'not_matches'
        message: 'Git module source must reference a specific tag or commit hash, not a branch.'
        pattern: '\\?ref=main|\\?ref=master|\\?ref=develop'
    on_fail: violation
  - id: waf-sov-080.tf.any.no-untrusted-registry-modules
    engine: terraform
    automated: true
    title: 'Terraform module sources must use approved registries or internal git'
    provider: any
    description: 'Module sources must reference the official Terraform Registry (registry.terraform.io), an approved internal module registry, or a verified internal git repository. Arbitrary public git repositories without version pinning are not permitted.'
    expected: 'true'
    remediation: 'Migrate to official Terraform Registry modules (registry.terraform.io) or publish internal modules to your private registry.\n'
    scope:
      block_type: module
    assertions:
      - attribute: 'source'
        op: 'not_matches'
        message: 'Module source references an unapproved public GitHub repository without registry validation.'
        pattern: '^github\\.com/(?!hashicorp/).*\\.git$'
    on_fail: warning
