id: WAF-SOV-080
title: An inventory of all dependencies and subprocessors MUST be maintained:...
status: active
tags:
- sovereign
- medium
- governance
pillar: sovereign
severity: medium
type:
- governance
category: logging-monitoring
rationale: 'Insufficient observability delays incident detection, complicates troubleshooting, and prevents effective audit
  evidence. This control addresses the requirements of the ''Logging and Monitoring'' area and ensures that An inventory of
  all dependencies and subprocessors MUST be maintained: managed cloud services, third-party SaaS tools, CI/CD platforms,
  observability.'
threat:
- Incomplete sub-processor inventories violate processor transparency obligations.
- Missing dependency assessments complicate exit management and emergency planning.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Implementation is regularly reviewed and evidenced in reviews.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-sovereign/pages/controls/WAF-SOV-080.adoc
  related_controls:
  - WAF-SOV-030
  - WAF-SOV-100
  - WAF-REL-010
  - WAF-SOV-060
  - WAF-AGN-040
  - WAF-AGN-050
  - WAF-COST-020
  - WAF-OPS-030
  - WAF-OPS-040
  - WAF-OPS-090
  - WAF-PERF-020
  - WAF-PERF-040
description: 'An inventory of all dependencies and subprocessors MUST be maintained: managed cloud services, third-party SaaS
  tools, CI/CD platforms, observability providers, and data processors. Changes to this inventory MUST be version-controlled,
  reviewed, and approved. Provider version constraints in Terraform MUST be pinned to prevent silent upgrades. Module sources
  MUST reference approved registries with version-locked references.

  '
regulatory_mapping:
- framework: GDPR
  controls:
  - Art. 28 – Processor
  - Art. 30 – Records of processing activities
  - Art. 44-46 – Transfers to third countries
- framework: BSI C5:2020
  controls:
  - SCA-01 – Supply chain management
  - OPS-04 – Data management
- framework: BSI C3A:2026
  controls:
  - 'Dimension 6 – Supply Chain: Software inventory (SBoM)'
  - 'Dimension 6 – Supply Chain: Hardware inventory'
  - 'Dimension 6 – Supply Chain: External service dependencies'
- framework: EUCS (ENISA)
  controls:
  - SCA-01 – Supply chain
  - IAM-04 – Third-party access
- framework: ISO 27001:2022
  controls:
  - A.5.19 – Information security in supplier relationships
  - A.5.20 – Addressing information security in supplier agreements
  - A.5.21 – Managing information security in the ICT supply chain
checks:
- id: waf-sov-080.tf.any.required-providers-version-pinned
  engine: terraform
  automated: true
  title: All required_providers must have version constraints pinned
  provider: any
  description: Every entry in the terraform required_providers block must specify a version constraint. Unpinned providers
    allow silent upgrades that may change behavior, introduce breaking changes, or alter sovereign controls without review.
  expected: 'true'
  remediation: Add version constraints to all required_providers using the ~> operator for compatible version pinning (e.g.,
    ~> 5.0 for AWS provider v5.x).\n
  example:
    compliant: "terraform {\n  required_version = \">= 1.6.0\"\n  required_providers {\n    aws = {\n      source  = \"hashicorp/aws\"\
      \n      version = \"~> 5.40\"\n    }\n    azurerm = {\n      source  = \"hashicorp/azurerm\"\n      version = \"~> 3.100\"\
      \n    }\n  }\n}\n"
    non_compliant: "terraform {\n  required_providers {\n    aws = {\n      source = \"hashicorp/aws\"\n      # No version\
      \ constraint – any version accepted\n    }\n  }\n}\n"
  scope:
    block_type: terraform
  assertions:
  - attribute: version
    op: attribute_exists
    message: One or more required_providers entries are missing version constraints.
  - attribute: version
    op: not_matches
    message: Provider version constraint is too broad (>= 0.0.0). Use a tightly bounded constraint.
    pattern: ^>= 0\\.0\\.0$
  on_fail: violation
- id: waf-sov-080.tf.any.required-terraform-version
  engine: terraform
  automated: true
  title: Terraform required_version must be set
  provider: any
  description: The 'terraform' block must include a required_version constraint to ensure reproducible behavior across environments
    and prevent use of incompatible Terraform versions.
  expected: 'true'
  remediation: Add required_version = ">= 1.x.x" to the terraform configuration block.\n
  example:
    compliant: "terraform {\n  required_version = \">= 1.6.0, < 2.0.0\"\n}\n"
    non_compliant: "terraform {\n  # No required_version set\n}\n"
  scope:
    block_type: terraform
  assertions:
  - attribute: required_version
    op: attribute_exists
    message: terraform block is missing required_version constraint.
  on_fail: violation
- id: waf-sov-080.tf.any.module-source-version-pinned
  engine: terraform
  automated: true
  title: Terraform module sources must reference a pinned version
  provider: any
  description: Terraform modules sourced from the Terraform Registry must specify a 'version' attribute. Git-sourced modules
    must reference a specific tag or commit hash, not a branch reference.
  expected: 'true'
  remediation: 'Pin module versions explicitly. For registry modules: use version = "x.y.z". For git modules: use ?ref=v1.2.3
    with a semver tag.\n'
  example:
    compliant: "module \"vpc\" {\n  source  = \"terraform-aws-modules/vpc/aws\"\n  version = \"5.5.3\"\n}\nmodule \"internal_module\"\
      \ {\n  source = \"git::https://git.example.com/modules/vpc.git?ref=v2.1.0\"\n}\n"
    non_compliant: "module \"vpc\" {\n  source = \"terraform-aws-modules/vpc/aws\"\n  # No version pinned\n}\nmodule \"internal_module\"\
      \ {\n  source = \"git::https://git.example.com/modules/vpc.git?ref=main\"\n  # Branch reference – mutable\n}\n"
  scope:
    block_type: module
  assertions:
  - attribute: version
    op: matches
    message: Registry module must specify a pinned 'version'.
    pattern: \?(ref|version)=
  - attribute: source
    op: not_matches
    message: Git module source must reference a specific tag or commit hash, not a branch.
    pattern: \\?ref=main|\\?ref=master|\\?ref=develop
  on_fail: violation
- id: waf-sov-080.tf.any.no-untrusted-registry-modules
  engine: terraform
  automated: true
  title: Terraform module sources must use approved registries or internal git
  provider: any
  description: Module sources must reference the official Terraform Registry (registry.terraform.io), an approved internal
    module registry, or a verified internal git repository. Arbitrary public git repositories without version pinning are
    not permitted.
  expected: 'true'
  remediation: Migrate to official Terraform Registry modules (registry.terraform.io) or publish internal modules to your
    private registry.\n
  scope:
    block_type: module
  assertions:
  - attribute: source
    op: not_matches
    message: Module source references an unapproved public GitHub repository without registry validation.
    pattern: ^github\\.com/(?!hashicorp/).*\\.git$
  on_fail: advisory
- id: waf-sov-080.tf.stackit.required-provider-version
  engine: terraform
  automated: true
  title: StackIT provider must have pinned version constraint
  provider: stackit
  description: The StackIT (SchwarzIT) Terraform provider must have a version constraint pinned to prevent silent upgrades.
  expected: 'true'
  remediation: Add version constraint to the StackIT provider in required_providers block.\n
  example:
    compliant: "terraform {\n  required_version = \">= 1.6.0\"\n  required_providers {\n    stackit = {\n      source  = \"\
      SchwarzIT/stackit\"\n      version = \"~> 2.0\"\n    }\n  }\n}\n"
    non_compliant: "terraform {\n  required_providers {\n    stackit = {\n      source = \"SchwarzIT/stackit\"\n      # No\
      \ version constraint\n    }\n  }\n}\n"
  scope:
    block_type: terraform
  assertions:
  - attribute: version
    op: attribute_exists
    message: StackIT provider must have version constraint pinned.
  - attribute: version
    op: not_matches
    message: StackIT provider version constraint is too broad.
    pattern: ^>= 0\\.0\\.0$
  on_fail: violation
