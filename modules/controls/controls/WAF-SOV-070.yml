# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-SOV-070
id: WAF-SOV-070
pillar: sovereign
severity: high
type:
  - configuration
description: |
  A formally documented break-glass procedure MUST exist defining trigger criteria, approval workflow, activation steps, and post-incident review requirements. All break-glass actions MUST be fully logged via CloudTrail (or equivalent) with log file validation enabled. Root account and emergency admin activities MUST trigger real-time alerts. Post-incident reviews MUST be documented and linked to the activation event.
regulatory_mapping:
  - framework: 'GDPR'
    controls:
      - 'Art. 32 – Security of processing'
      - 'Art. 33 – Notification of personal data breach'
  - framework: 'BSI C5:2020'
    controls:
      - 'IAM-03 – Privileged access management'
      - 'LOG-01 – Logging'
      - 'BCM-02 – Incident management'
  - framework: 'BSI C3A:2026'
    controls:
      - 'Dimension 3 – State of Defense Takeover: Emergency procedures'
      - 'Dimension 3 – State of Defense Takeover: Federal takeover provisions'
  - framework: 'EUCS (ENISA)'
    controls:
      - 'IAM-03 – Emergency access'
      - 'LOG-01 – Audit logging'
  - framework: 'ISO 27001:2022'
    controls:
      - 'A.5.26 – Response to information security incidents'
      - 'A.8.15 – Logging'
      - 'A.8.16 – Monitoring activities'
  - framework: 'SOC 2'
    controls:
      - 'CC7.4 – Security incident response'
checks:
  - id: waf-sov-070.tf.aws.cloudtrail-enabled-all-regions
    engine: terraform
    automated: true
    title: 'CloudTrail must be multi-region with log file validation'
    provider: aws
    description: 'At least one CloudTrail must be configured with is_multi_region_trail = true and enable_log_file_validation = true to capture all API activity and detect log tampering.'
    expected: 'true'
    remediation: 'Set is_multi_region_trail = true, enable_log_file_validation = true, and include_global_service_events = true on CloudTrail.\n'
    example:
      compliant: |
        resource "aws_cloudtrail" "sovereign" {
          name                          = "sovereign-audit-trail"
          s3_bucket_name                = aws_s3_bucket.cloudtrail.id
          is_multi_region_trail         = true
          enable_log_file_validation    = true
          include_global_service_events = true
          cloud_watch_logs_group_arn    = "${aws_cloudwatch_log_group.cloudtrail.arn}:*"
          cloud_watch_logs_role_arn     = aws_iam_role.cloudtrail_cw.arn
        }
        
      non_compliant: |
        resource "aws_cloudtrail" "trail" {
          name           = "my-trail"
          s3_bucket_name = "my-logs"
          # Defaults: single region, no validation, no CloudWatch
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudtrail
    assertions:
      - attribute: 'is_multi_region_trail'
        op: 'is_true'
        message: 'CloudTrail must be multi-region to capture break-glass events from all regions.'
      - attribute: 'enable_log_file_validation'
        op: 'is_true'
        message: 'CloudTrail log file validation must be enabled to detect tampering.'
      - attribute: 'include_global_service_events'
        op: 'is_true'
        message: 'CloudTrail must include global service events (IAM, STS, etc.).'
    on_fail: violation
  - id: waf-sov-070.tf.aws.cloudtrail-s3-bucket-not-public
    engine: terraform
    automated: true
    title: 'CloudTrail S3 bucket must not be publicly accessible'
    provider: aws
    description: 'The S3 bucket storing CloudTrail logs must have public access blocked. Public CloudTrail logs expose the full API activity of the account.'
    expected: 'true'
    remediation: 'Create an aws_s3_bucket_public_access_block resource for the CloudTrail bucket with all four settings set to true.\n'
    example:
      compliant: |
        resource "aws_s3_bucket_public_access_block" "cloudtrail" {
          bucket                  = aws_s3_bucket.cloudtrail.id
          block_public_acls       = true
          block_public_policy     = true
          ignore_public_acls      = true
          restrict_public_buckets = true
        }
        
      non_compliant: |
        resource "aws_s3_bucket_public_access_block" "cloudtrail" {
          bucket            = aws_s3_bucket.cloudtrail.id
          block_public_acls = true
          # Other settings missing – defaults to false
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_s3_bucket_public_access_block
    assertions:
      - attribute: 'block_public_acls'
        op: 'is_true'
        message: 'CloudTrail S3 bucket must block public ACLs.'
      - attribute: 'block_public_policy'
        op: 'is_true'
        message: 'CloudTrail S3 bucket must block public bucket policy.'
      - attribute: 'ignore_public_acls'
        op: 'is_true'
        message: 'CloudTrail S3 bucket must ignore public ACLs.'
      - attribute: 'restrict_public_buckets'
        op: 'is_true'
        message: 'CloudTrail S3 bucket must restrict public buckets.'
    on_fail: violation
  - id: waf-sov-070.tf.aws.cloudwatch-alarm-root-login
    engine: terraform
    automated: true
    title: 'CloudWatch alarm must exist for root account sign-in'
    provider: aws
    description: 'A CloudWatch metric filter and alarm must be configured to detect and alert on any root account API call or console sign-in. Root usage outside a documented break-glass process is a critical sovereignty violation.'
    expected: 'true'
    remediation: 'Create a CloudWatch metric filter matching root API calls and an alarm that notifies a security SNS topic when the metric is triggered.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_log_metric_filter" "root_usage" {
          name           = "root-account-usage"
          pattern        = "{$.userIdentity.type = Root && $.userIdentity.invokedBy NOT EXISTS && $.eventType != AwsServiceEvent}"
          log_group_name = aws_cloudwatch_log_group.cloudtrail.name
          metric_transformation {
            name      = "RootAccountUsageCount"
            namespace = "CloudTrailMetrics"
            value     = "1"
          }
        }
        resource "aws_cloudwatch_metric_alarm" "root_usage" {
          alarm_name          = "root-account-usage"
          comparison_operator = "GreaterThanOrEqualToThreshold"
          evaluation_periods  = "1"
          metric_name         = "RootAccountUsageCount"
          namespace           = "CloudTrailMetrics"
          period              = "60"
          statistic           = "Sum"
          threshold           = "1"
          alarm_actions       = [aws_sns_topic.security_alerts.arn]
        }
        
      non_compliant: |
        # No metric filter or alarm for root account activity
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_metric_alarm
    assertions:
      - attribute: 'metric_name'
        op: 'has_associated_metric_filter'
        message: 'No CloudWatch alarm found monitoring root account activity.'
    on_fail: violation
  - id: waf-sov-070.tf.aws.cloudwatch-alarm-iam-policy-changes
    engine: terraform
    automated: true
    title: 'CloudWatch alarm must exist for IAM policy changes'
    provider: aws
    description: 'Unauthorized IAM policy changes can escalate privileges or disable sovereignty controls. An alarm must detect and alert on IAM policy creation, modification, or deletion events.'
    expected: 'true'
    remediation: 'Create metric filters for IAM policy changes (CreatePolicy, DeletePolicy, AttachRolePolicy, DetachRolePolicy) with associated CloudWatch alarms.\n'
    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_log_metric_filter
    assertions:
      - attribute: 'pattern'
        op: 'matches'
        message: 'No CloudWatch metric filter found monitoring IAM policy changes.'
        pattern: 'CreatePolicy|DeletePolicy|AttachRolePolicy|DetachRolePolicy'
    on_fail: warning
  - id: waf-sov-070.tf.aws.cloudtrail-s3-access-logging
    engine: terraform
    automated: true
    title: 'CloudTrail S3 bucket should have server access logging enabled'
    provider: aws
    description: 'The S3 bucket storing CloudTrail logs should have access logging enabled to detect unauthorized access attempts to the audit logs themselves.'
    expected: 'true'
    remediation: 'Create an aws_s3_bucket_logging resource for the CloudTrail bucket targeting a separate access logs bucket.\n'
    scope:
      block_type: resource
      resource_types:
        - aws_s3_bucket_logging
    assertions:
      - attribute: 'bucket'
        op: 'references_cloudtrail_bucket'
        message: 'CloudTrail S3 bucket should have an aws_s3_bucket_logging resource configured.'
    on_fail: warning
  - id: waf-sov-070.tf.stackit.logging-enabled
    engine: terraform
    automated: true
    title: 'StackIT services must have logging enabled'
    provider: stackit
    description: 'StackIT services (MySQL, Redis, OpenSearch, Container Registry) must have logging enabled for break-glass activity monitoring.'
    expected: 'true'
    remediation: 'Enable logging on all StackIT services with log file validation.\n'
    example:
      compliant: |
        resource "stackit_mysql_instance" "main" {
          project_id = stackit_project.main.id
          name       = "sovereign-mysql"
          logging {
            enabled = true
          }
        }

      non_compliant: |
        resource "stackit_mysql_instance" "main" {
          project_id = stackit_project.main.id
          name       = "mysql"
          # Logging not enabled
        }

    scope:
      block_type: resource
      resource_types:
        - stackit_mysql_instance
        - stackit_redis_instance
        - stackit_opensearch_instance
        - stackit_container_registry
    assertions:
      - attribute: 'logging.enabled'
        op: 'is_true'
        message: 'StackIT service must have logging enabled for audit purposes.'
    on_fail: warning
  - id: waf-sov-070.tf.ovh.logging-enabled
    engine: terraform
    automated: true
    title: 'OVH services must have logging enabled'
    provider: ovh
    description: 'OVH cloud services must have logging enabled for break-glass activity monitoring.'
    expected: 'true'
    remediation: 'Enable logging on OVH services for audit trail compliance.\n'
    example:
      compliant: |
        # OVH services with logging enabled

      non_compliant: |
        # OVH services without logging

    scope:
      block_type: resource
      resource_types:
        - ovh_cloud_project
        - ovh_vps
        - ovh_dedicated_server
    assertions:
      - attribute: 'logging_enabled'
        op: 'is_true'
        message: 'OVH service must have logging enabled for audit purposes.'
    on_fail: warning
  - id: waf-sov-070.tf.hcloud.logging-enabled
    engine: terraform
    automated: true
    title: 'Hetzner Cloud services must have logging enabled'
    provider: hcloud
    description: 'Hetzner Cloud servers must have logging enabled for break-glass activity monitoring.'
    expected: 'true'
    remediation: 'Enable ssh access logging and system logging on Hetzner Cloud servers.\n'
    example:
      compliant: |
        resource "hcloud_server" "main" {
          name        = "sovereign-server"
          server_type = "cx22"
          labels = {
            logging-enabled = "true"
          }
        }

      non_compliant: |
        resource "hcloud_server" "main" {
          name        = "server"
          server_type = "cx22"
          # No logging configuration
        }

    scope:
      block_type: resource
      resource_types:
        - hcloud_server
    assertions:
      - attribute: 'labels'
        op: 'key_exists'
        key: 'logging-enabled'
        message: 'Hetzner Cloud server must have logging-enabled label.'
    on_fail: warning
