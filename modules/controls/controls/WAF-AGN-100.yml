# ID: WAF-AGN-100
id: WAF-AGN-100
pillar: agentic
severity: low
type:
  - governance
  - documentation
description: |
  Bekannte Agenten-Limitationen müssen in einem Agent Debt Register dokumentiert sein. Limitationen umfassen: Wissens-Cutoff, Werkzeug-Verfügbarkeit, Genauigkeits-Limitationen, Edge Cases und Failure Modes. Das Register muss vierteljährlich mit Verbesserungsplänen überprüft werden.
