    controls:
      - 'RA-5, SI-4 (Moderate baseline)'
  - framework: 'CMMC 2.0'
    controls:
      - 'RA.L2-3.8.1 – Vulnerability scanning'
  - framework: 'IT-Grundschutz'
    controls:
      - 'ORP.1 – Organisation'
