    controls:
      - 'ISM – Logging and monitoring'
  - framework: 'CCCS PBMM'
    controls:
      - 'RA-5 – Vulnerability scanning'
  - framework: 'MAS TRM'
    controls:
      - 'Ch.9 – Change management'
