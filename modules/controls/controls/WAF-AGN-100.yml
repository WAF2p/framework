    requirement statement (MUST/SHALL/required/mandatory).
  expected: 'true'
  remediation: 'Create or update `docs/agentic/waf-agn-100-reliability-design.md`. State the requirement, how it is implemented
    for cross-provider, the review cadence, and the owner.

    '
  example:
    compliant: '|

      docs/agentic/waf-agn-100-reliability-design.md:

