id: WAF-AGN-100
title: Known agent limitations must be documented in an Agent Debt Register
status: active
tags:
- agentic
- low
- governance
- documentation
pillar: agentic
severity: low
type:
- governance
- process
category: reliability-design
rationale: Poor fault tolerance and planning lead to service interruptions, data loss, and loss of trust from customers and
  stakeholders. This control addresses the requirements of the 'Reliability Design' area and ensures that Known agent limitations
  must be documented in an Agent Debt Register.
threat:
- Undocumented agent limitations accumulate technical and regulatory debt.
- Unknown weaknesses in agent systems expose the organization to emergent failure modes.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Implementation is regularly reviewed and evidenced in reviews.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-agentic/pages/controls/WAF-AGN-100.adoc
  related_controls:
  - WAF-REL-080
  - WAF-REL-100
  - WAF-AGN-090
  - WAF-AGN-050
  - WAF-AGN-040
  - WAF-AGN-070
  - WAF-AGN-060
  - WAF-AGN-030
  - WAF-REL-010
  - WAF-COST-020
  - WAF-OPS-010
  - WAF-OPS-030
description: 'Known agent limitations must be documented in an Agent Debt Register. Limitations include: knowledge cutoff,
  tool availability, accuracy limitations, edge cases, and failure modes. The register must be reviewed quarterly with improvement
  plans.

  '
