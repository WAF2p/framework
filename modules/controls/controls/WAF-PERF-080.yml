# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-PERF-080
id: WAF-PERF-080
pillar: performance
severity: low
type:
  - governance
  - configuration
description: |
  Workloads with highly variable, spiky, or unpredictable traffic patterns SHOULD be evaluated for serverless or fully managed compute architectures. Where serverless is appropriate, Lambda, Cloud Functions, Azure Functions, or managed container services (Fargate, Cloud Run) MUST be configured with appropriate memory, timeout, concurrency, and cold-start mitigation strategies. Serverless function configurations MUST be optimized to avoid under-memory allocation, excessive timeouts, and uncontrolled concurrency.
regulatory_mapping:
  - framework: 'ISO/IEC 25010'
    controls:
      - 'Performance Efficiency – Time Behavior'
      - 'Performance Efficiency – Capacity'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'PERF 1 – How do you select the best performing architecture?'
      - 'COST 8 – How do you use managed services to improve efficiency?'
  - framework: 'Azure Well-Architected Framework'
    controls:
      - 'Performance Efficiency – Use platform-as-a-service'
  - framework: 'Google Cloud Architecture Framework'
    controls:
      - 'Managed services – Use fully managed services where possible'
checks:
  - id: waf-perf-080.tf.aws.lambda-memory-timeout-configured
    engine: terraform
    automated: true
    title: 'AWS Lambda functions must have explicit memory and timeout configuration'
    provider: aws
    description: 'Lambda functions must not use default memory (128MB) or default timeout (3s) for production use. Both must be explicitly configured based on measured performance profiles.'
    expected: 'true'
    remediation: 'Run AWS Lambda Power Tuning to find optimal memory allocation. Set timeout = 2x measured P99 execution time. Set reserved_concurrent_executions to limit blast radius on account concurrency.\n'
    example:
      compliant: |
        resource "aws_lambda_function" "payment_processor" {
          function_name = "payment-processor"
          runtime       = "python3.12"
          handler       = "handler.process"
          filename      = data.archive_file.lambda.output_path
          memory_size   = 512    # Tuned with Lambda Power Tuning
          timeout       = 30     # 2x measured P99 of 15s
          reserved_concurrent_executions = 100  # Prevent consuming all account concurrency
          environment {
            variables = {
              LOG_LEVEL = "INFO"
            }
          }
        }
        
      non_compliant: |
        resource "aws_lambda_function" "payment_processor" {
          function_name = "payment-processor"
          runtime       = "python3.12"
          handler       = "handler.process"
          filename      = data.archive_file.lambda.output_path
          # memory_size defaults to 128MB – not profiled – WAF-PERF-080 violation
          # timeout defaults to 3s – may cause timeouts
          # No reserved_concurrent_executions – uncontrolled concurrency
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_lambda_function
    assertions:
      - attribute: 'memory_size'
        op: 'greater_than_or_equal'
        message: 'Lambda memory_size must be explicitly set >= 256MB for production functions (default 128MB is rarely optimal).'
      - attribute: 'timeout'
        op: 'greater_than_or_equal'
        message: 'Lambda timeout must be explicitly set (not default 3s) and sized appropriately.'
      - attribute: 'reserved_concurrent_executions'
        op: 'not_equals'
        message: 'Lambda reserved_concurrent_executions should be configured to control account concurrency usage.'
    on_fail: violation
  - id: waf-perf-080.tf.azurerm.function-app-plan-configured
    engine: terraform
    automated: true
    title: 'Azure Function Apps for production should use Premium or Dedicated plan'
    provider: azurerm
    description: 'Azure Function Apps in production should use Premium or Dedicated (App Service) plan to avoid cold starts, enable VNet integration, and provide predictable performance.'
    expected: 'true'
    remediation: 'For production latency-sensitive functions, use EP1/EP2/EP3 (Premium) or P1v3/P2v3 (Dedicated). Consumption plan (Y1) is acceptable for truly event-driven, non-latency-critical workloads.\n'
    example:
      compliant: |
        resource "azurerm_service_plan" "functions" {
          name                = "plan-payment-functions"
          resource_group_name = azurerm_resource_group.main.name
          location            = azurerm_resource_group.main.location
          os_type             = "Linux"
          sku_name            = "EP1"  # Premium plan – consistent performance, no cold starts
        }
        
      non_compliant: |
        resource "azurerm_service_plan" "functions" {
          name     = "plan-payment-functions"
          os_type  = "Linux"
          sku_name = "Y1"  # Consumption – cold starts for production latency SLO – advisory
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_service_plan
    assertions:
      - attribute: 'sku_name'
        op: 'not_in'
        message: 'Production Function Apps should not use Y1 (Consumption) plan due to cold starts and unpredictable performance.'
    on_fail: advisory
  - id: waf-perf-080.tf.google.cloud-run-min-instances
    engine: terraform
    automated: true
    title: 'GCP Cloud Run services with latency SLOs must set min-instances > 0'
    provider: google
    description: 'GCP Cloud Run services that have latency SLOs must configure minimum instances > 0 to eliminate cold starts. Services scaling to zero will experience cold start latency that may violate P99 SLO targets.'
    expected: 'true'
    remediation: 'Set the autoscaling.knative.dev/minScale annotation to >= 1 for latency-sensitive services. For cost optimization, consider min=1 during business hours and scheduled scaling to 0 overnight.\n'
    example:
      compliant: |
        resource "google_cloud_run_v2_service" "app" {
          name     = "payment-api"
          location = "europe-west3"
          template {
            scaling {
              min_instance_count = 1
              max_instance_count = 50
            }
            containers {
              image = "europe-west3-docker.pkg.dev/${var.project}/services/payment-api:latest"
              resources {
                limits = {
                  cpu    = "2"
                  memory = "512Mi"
                }
              }
            }
          }
        }
        
      non_compliant: |
        resource "google_cloud_run_v2_service" "app" {
          name     = "payment-api"
          location = "europe-west3"
          template {
            # No scaling config – scales to zero, cold starts – WAF-PERF-080 advisory
            containers {
              image = "europe-west3-docker.pkg.dev/${var.project}/services/payment-api:latest"
            }
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - google_cloud_run_service
        - google_cloud_run_v2_service
    assertions:
      - attribute: 'template.metadata.annotations["autoscaling.knative.dev/minScale"]'
        op: 'not_empty'
        message: 'Cloud Run service should set minimum instance annotation to prevent cold starts.'
    on_fail: advisory
