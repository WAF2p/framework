id: WAF-REL-040
title: All production databases, object stores, and stateful services MUST have...
status: active
tags:
- reliability
- critical
- governance
- configuration
pillar: reliability
severity: critical
type:
- governance
- configuration
category: secret-management
rationale: Hardcoded or poorly managed secrets enable unauthorized access, data leakage, and escalation within the cloud ecosystem.
  This control addresses the requirements of the 'Secrets Management' area and ensures that All production databases, object
  stores, and stateful services MUST have automated backup configurations with defined retention periods.
threat:
- Databases without backups or with too short retention cannot be recovered from corruption.
- Missing point-in-time recovery significantly extends recovery time from logical errors.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform checks or IaC gates automatically validate the requirement in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-reliability/pages/controls/WAF-REL-040.adoc
  related_controls:
  - WAF-REL-050
  - WAF-SEC-010
  - WAF-SEC-020
  - WAF-SEC-060
  - WAF-SOV-020
  - WAF-SOV-060
  - WAF-AGN-010
  - WAF-AGN-080
  - WAF-COST-010
  - WAF-COST-040
  - WAF-COST-090
  - WAF-OPS-020
description: 'All production databases, object stores, and stateful services MUST have automated backup configurations with
  defined retention periods. Backup configurations MUST specify RPO-aligned retention. Recovery procedures MUST be tested
  at minimum quarterly through documented restore exercises. Backups MUST be stored in a separate account, region, or vault
  from the primary data source. Point-in-time recovery (PITR) MUST be enabled for all production databases. Untested backups
  are not backups.

  '
regulatory_mapping:
- framework: ISO 27001:2022
  controls:
  - A.8.13 – Information backup
  - A.17.1 – Information security continuity
- framework: GDPR
  controls:
  - Article 32 – Security of processing (data availability)
  - Article 5(1)(f) – Integrity and confidentiality
- framework: BSI C5:2020
  controls:
  - RB-01 – Availability and Redundancy
  - RB-04 – Data Backup and Recovery
checks:
- id: waf-rel-040.tf.aws.rds-backup-retention
  engine: terraform
  automated: true
  title: AWS RDS must have backup retention >= 7 days with PITR enabled
  provider: aws
  description: Production RDS instances must have backup_retention_period of at least 7 days to enable point-in-time recovery
    across a full week of transactions.
  expected: 'true'
  remediation: Set backup_retention_period >= 7 on the aws_db_instance resource. Enable deletion_protection = true to prevent
    accidental deletion. Configure backup_window to a low-traffic maintenance window.\n
  example:
    compliant: "resource \"aws_db_instance\" \"main\" {\n  identifier             = \"payment-db-prod\"\n  engine        \
      \         = \"postgres\"\n  instance_class         = \"db.t3.medium\"\n  allocated_storage      = 100\n  backup_retention_period\
      \ = 14\n  backup_window          = \"02:00-03:00\"\n  deletion_protection    = true\n  copy_tags_to_snapshot  = true\n\
      }\n"
    non_compliant: "resource \"aws_db_instance\" \"main\" {\n  identifier             = \"payment-db-prod\"\n  engine    \
      \             = \"postgres\"\n  instance_class         = \"db.t3.medium\"\n  allocated_storage      = 100\n  backup_retention_period\
      \ = 1   # WAF-REL-040 violation\n  deletion_protection    = false # WAF-REL-040 violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_db_instance
    - aws_rds_cluster
  assertions:
  - attribute: backup_retention_period
    op: greater_than_or_equal
    message: RDS backup retention must be at least 7 days for production.
    expected: 1
  - attribute: deletion_protection
    op: is_true
    message: RDS deletion protection must be enabled to prevent accidental deletion.
  on_fail: violation
- id: waf-rel-040.tf.aws.s3-versioning
  engine: terraform
  automated: true
  title: AWS S3 buckets with production data must have versioning enabled
  provider: aws
  description: S3 buckets storing production data must have versioning enabled to allow recovery from accidental deletion
    or overwrite.
  expected: 'true'
  remediation: Add an aws_s3_bucket_versioning resource referencing the bucket with versioning_configuration { status = "Enabled"
    }.\n
  example:
    compliant: "resource \"aws_s3_bucket_versioning\" \"data\" {\n  bucket = aws_s3_bucket.production_data.id\n  versioning_configuration\
      \ {\n    status = \"Enabled\"\n  }\n}\n"
    non_compliant: "resource \"aws_s3_bucket_versioning\" \"data\" {\n  bucket = aws_s3_bucket.production_data.id\n  versioning_configuration\
      \ {\n    status = \"Suspended\"  # WAF-REL-040 violation\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_s3_bucket_versioning
  assertions:
  - attribute: versioning_configuration.status
    op: equals
    message: S3 bucket versioning must be Enabled for production data buckets.
    expected: Enabled
  on_fail: violation
- id: waf-rel-040.tf.azurerm.postgresql-backup
  engine: terraform
  automated: true
  title: Azure PostgreSQL Flexible Server must have backup retention >= 7 days
  provider: azurerm
  description: Azure PostgreSQL Flexible Server must configure backup_retention_days of at least 7 for production workloads.
  expected: 'true'
  remediation: Set backup_retention_days >= 7 and geo_redundant_backup_enabled = true on the azurerm_postgresql_flexible_server
    resource.\n
  example:
    compliant: "resource \"azurerm_postgresql_flexible_server\" \"main\" {\n  name                         = \"payment-db-prod\"\
      \n  resource_group_name          = azurerm_resource_group.main.name\n  location                     = \"westeurope\"\
      \n  version                      = \"15\"\n  backup_retention_days        = 14\n  geo_redundant_backup_enabled = true\n\
      \  sku_name                     = \"GP_Standard_D2s_v3\"\n}\n"
    non_compliant: "resource \"azurerm_postgresql_flexible_server\" \"main\" {\n  name                         = \"payment-db-prod\"\
      \n  resource_group_name          = azurerm_resource_group.main.name\n  location                     = \"westeurope\"\
      \n  version                      = \"15\"\n  backup_retention_days        = 1   # WAF-REL-040 violation\n  geo_redundant_backup_enabled\
      \ = false # WAF-REL-040 violation\n  sku_name                     = \"GP_Standard_D2s_v3\"\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_postgresql_flexible_server
    - azurerm_mysql_flexible_server
  assertions:
  - attribute: backup_retention_days
    op: greater_than_or_equal
    message: Database backup retention must be at least 7 days.
    expected: 7
  - attribute: geo_redundant_backup_enabled
    op: is_true
    message: Geo-redundant backup must be enabled for cross-region recovery.
  on_fail: violation
- id: waf-rel-040.tf.google.sql-backup-config
  engine: terraform
  automated: true
  title: GCP Cloud SQL must have automated backups and PITR enabled
  provider: google
  description: GCP Cloud SQL instances must have automated backups enabled with point-in-time recovery enabled for production
    databases.
  expected: 'true'
  remediation: Set enabled = true and point_in_time_recovery_enabled = true in the backup_configuration block of the google_sql_database_instance
    settings.\n
  example:
    compliant: "resource \"google_sql_database_instance\" \"main\" {\n  name             = \"payment-db-prod\"\n  database_version\
      \ = \"POSTGRES_15\"\n  settings {\n    tier = \"db-custom-2-7680\"\n    backup_configuration {\n      enabled      \
      \                  = true\n      start_time                     = \"02:00\"\n      point_in_time_recovery_enabled =\
      \ true\n      transaction_log_retention_days = 7\n      retained_backups               = 14\n      retention_unit  \
      \               = \"COUNT\"\n    }\n  }\n}\n"
    non_compliant: "resource \"google_sql_database_instance\" \"main\" {\n  name             = \"payment-db-prod\"\n  database_version\
      \ = \"POSTGRES_15\"\n  settings {\n    tier = \"db-custom-2-7680\"\n    backup_configuration {\n      enabled = false\
      \  # WAF-REL-040 violation\n    }\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_sql_database_instance
  assertions:
  - attribute: settings.backup_configuration.enabled
    op: is_true
    message: Cloud SQL automated backups must be enabled.
  - attribute: settings.backup_configuration.point_in_time_recovery_enabled
    op: is_true
    message: Cloud SQL point-in-time recovery must be enabled.
  on_fail: violation
