      docs/security/waf-sec-100-azurerm-identity-access.md:

      - The Azure implementation of WAF-SEC-100 is documented.

      - Implementation status and owner are recorded.

      - Review cadence is defined (e.g. quarterly).

      '
    non_compliant: '|

      # `docs/security/waf-sec-100-azurerm-identity-access.md` is missing or does not contain a normative requirement.

      # WAF-SEC-100 violation: Azure control is not documented

      '
