id: WAF-SEC-100
title: An incident response (IR) plan MUST exist, be documented,...
status: active
tags:
- security
- medium
- governance
pillar: security
severity: medium
type:
- governance
category: identity-access
rationale: Uncontrolled identities and excessive permissions enable data theft, lateral movement, and unauthorized changes
  to production systems. This control addresses the requirements of the 'Identity and Access Management' area and ensures
  that An incident response (IR) plan MUST exist, be documented, version-controlled, and tested at least annually via tabletop
  exercises or simulated incident drills.
threat:
- Missing incident-response plans extend reaction times and worsen the impact of security incidents.
- Untested IR processes lead to wrong decisions and missed regulatory reporting obligations in a real event.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Implementation is regularly reviewed and evidenced in reviews.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-security/pages/controls/WAF-SEC-100.adoc
  related_controls:
  - WAF-SEC-060
  - WAF-SEC-080
  - WAF-SEC-120
  - WAF-SEC-130
  - WAF-SEC-090
  - WAF-SEC-020
  - WAF-SEC-010
  - WAF-SEC-040
  - WAF-SEC-030
  - WAF-SOV-020
  - WAF-SOV-060
  - WAF-AGN-010
description: 'An incident response (IR) plan MUST exist, be documented, version-controlled, and tested at least annually via
  tabletop exercises or simulated incident drills. SNS topics or equivalent alerting channels MUST be configured to receive
  security findings from GuardDuty, Security Hub, and CloudTrail metric alarms. Security-relevant CloudWatch log groups MUST
  retain logs for a minimum of 365 days. S3-based CloudTrail and VPC Flow Log archives MUST be retained for at least 12 months.
  The incident response plan MUST define roles and responsibilities, escalation paths, communication templates, and steps
  for evidence preservation, containment, eradication, and recovery.

  '
