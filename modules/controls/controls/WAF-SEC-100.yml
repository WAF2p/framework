checks:
- id: waf-sec-100.tf.aws.sns-security-alerts
  engine: terraform
  automated: true
  title: SNS topic for security alerts must be provisioned
  provider: aws
  description: An aws_sns_topic resource for security alerting must exist in the account. This topic should be subscribed
    to GuardDuty and Security Hub EventBridge rules, and must have at least one active subscription routing to an on-call
    system.
  expected: 'true'
  remediation: 'Create an aws_sns_topic resource named ''security-alerts'' or similar. Add subscriptions (aws_sns_topic_subscription)
    pointing to PagerDuty, OpsGenie, or a Slack webhook endpoint. Configure EventBridge rules targeting this topic for GuardDuty
    findings with severity >= 7 and Security Hub CRITICAL findings.

    '
  example:
    compliant: "resource \"aws_sns_topic\" \"security_alerts\" {\n  name              = \"security-alerts\"\n  kms_master_key_id\
      \ = aws_kms_key.sns.id\n  tags = {\n    owner       = \"security-team\"\n    environment = \"production\"\n  }\n}\n\
      resource \"aws_sns_topic_subscription\" \"pagerduty\" {\n  topic_arn = aws_sns_topic.security_alerts.arn\n  protocol\
      \  = \"https\"\n  endpoint  = var.pagerduty_endpoint\n}\n"
    non_compliant: '# No aws_sns_topic resource for security alerts present

      # WAF-SEC-100 violation: security alerting channel not provisioned in IaC

      '
  scope:
    block_type: resource
    resource_types:
    - aws_sns_topic
  assertions:
  - attribute: name
    op: attribute_exists
    message: An SNS topic for security alerts must be provisioned with a defined name.
  on_fail: violation
- id: waf-sec-100.tf.aws.cloudwatch-log-retention-security
  engine: terraform
  automated: true
  title: Security-relevant CloudWatch log groups must retain logs for at least 365 days
  provider: aws
  description: CloudWatch log groups used for security-relevant data (application logs, VPC flow logs ingested into CloudWatch,
    Lambda security function logs) must have retention_in_days set to at least 365 to satisfy forensic and regulatory retention
    requirements.
  expected: 'true'
  remediation: Set retention_in_days = 365 (or higher) on all security-relevant aws_cloudwatch_log_group resources. For CloudTrail
    and VPC Flow Logs with higher volume, consider using S3-based retention with lifecycle policies (Standard for 12 months,
    Glacier for 7 years) rather than CloudWatch to optimize cost.\n
  example:
    compliant: "resource \"aws_cloudwatch_log_group\" \"app_security\" {\n  name              = \"/security/application-events\"\
      \n  retention_in_days = 365\n  kms_key_id        = aws_kms_key.logs.arn\n  tags = {\n    owner       = \"security-team\"\
      \n    data-class  = \"operational\"\n  }\n}\n"
    non_compliant: "resource \"aws_cloudwatch_log_group\" \"app_security\" {\n  name              = \"/security/application-events\"\
      \n  retention_in_days = 30  # WAF-SEC-100 violation: below 365-day minimum\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_cloudwatch_log_group
  assertions:
  - attribute: retention_in_days
    op: greater_than_or_equal
    message: Security-relevant log groups MUST retain logs for at least 365 days to support forensic investigation and regulatory
      compliance.
    expected: 365
  on_fail: violation
- id: waf-sec-100.manual.any.incident-response-plan
  engine: manual
  automated: true
  title: Incident response plan must exist, be version-controlled, and tested annually
  provider: any
  description: A formal incident response plan must be documented, stored in version control, and tested via tabletop exercise
    or live drill at least once per year. The plan must cover roles, escalation paths, GDPR breach notification workflow,
    and playbooks for the top incident types relevant to the workload.
  expected: 'true'
  remediation: '1. Draft an incident response plan covering: Preparation, Detection & Analysis,\n   Containment, Eradication,
    Recovery, and Post-Incident Review phases.\n2. Define RACI matrix for each phase including external communication and\n   GDPR
    DPA notification responsibility.\n3. Create runbooks for top 5-10 incident types (credential compromise, data exfiltration,\n   ransomware,
    privilege escalation, supply chain attack).\n4. Store the IR plan in a version-controlled repository with mandatory review.
    5. Schedule annual tabletop exercise; document results and track action items.\n'
  example:
    compliant: '# IR plan stored at: docs/security/incident-response-plan.md (version-controlled)

      # Last tested: 2025-11-15 via tabletop exercise (ref: IR-DRILL-2025-001)

      # Runbooks available at: docs/security/runbooks/

      # GDPR DPA notification workflow: docs/security/gdpr-breach-notification.md

      '
    non_compliant: '# No incident response plan exists in the repository.

      # WAF-SEC-100 violation: IR plan is a mandatory governance artifact.

      '
  scope:
    block_type: terraform
  assertions:
  - attribute: ir_plan_version_controlled
    op: is_true
    message: Incident response plan must be stored in version control (e.g., Git repository under /docs/security/ir-plan.md).
  on_fail: violation
