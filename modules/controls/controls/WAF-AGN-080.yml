# ID: WAF-AGN-080
id: WAF-AGN-080
pillar: agentic
severity: high
type:
  - governance
  - configuration
description: |
  Human approval MUST be required for sensitive decisions. Human-in-the-loop workflows must be defined for critical actions. Approval workflows must be auditable with timestamps and approver identity. Escape hatches must exist for emergency interventions.
regulatory_mapping:
  - framework: 'ISO 27001:2022'
    controls:
      - 'A.8.2 – Privileged access rights'
      - 'A.8.3 – Information access restriction'
      - 'A.13.1.1 – Control of information in sessions'
  - framework: 'ISO 27017'
    controls:
      - 'CLD.9.5 – Segregation in virtual computing environments'
  - framework: 'CIS Controls v8'
    controls:
      - 'CIS 5 – Account Management'
      - 'CIS 6 – Access Control Management'
  - framework: 'SOC 2 Type II'
    controls:
      - 'CC4.1 – Monitoring activities'
      - 'CC6.1 – Logical access security'
  - framework: 'NIST SP 800-53'
    controls:
      - 'AC-2 – Account Management'
      - 'AC-6 – Least Privilege'
      - 'AU-2 – Event logging'
  - framework: 'NIST CSF 2.0'
    controls:
      - 'PR.AA-01 – Identities and credentials are managed'
      - 'DE.CM – Continuous monitoring'
  - framework: 'GDPR'
    controls:
      - 'Art. 32 – Security of processing'
      - 'Art. 22 – Automated individual decision-making'
      - 'Art. 5(1)(f) – Integrity and confidentiality'
  - framework: 'PCI DSS v4.0'
    controls:
      - 'Req 7 – Restrict access by business need to know'
      - 'Req 8 – Identify and authenticate access'
  - framework: 'CSA STAR'
    controls:
      - 'CCM IAM-09 – User Access Authorization'
      - 'CCM Logging and Monitoring'
  - framework: 'BSI C5:2020'
    controls:
      - 'IDM-01 – Identity and access management policy'
      - 'OPS-01 – Operational monitoring'
  - framework: 'TISAX'
    controls:
      - 'Information security – Monitoring and logging'
      - 'Information security – Access rights management'
  - framework: 'ANSSI SecNumCloud'
    controls:
      - 'Domain – Access management'
      - 'Domain – Logging and monitoring'
  - framework: 'BIO'
    controls:
      - 'BIO – Logboekhouding en monitoring'
      - 'BIO – Toegangsrechten en autorisatiebeheer'
  - framework: 'ENS High'
    controls:
      - 'op.acc.4 – Proceso de gestión de derechos de acceso'
      - 'op.exp.6 – Gestión de cambios'
  - framework: 'UK NCSC CAF'
    controls:
      - 'B2.a – Identity verification and authorisation'
      - 'A4 – Policy and assurance'
