checks:
  - id: waf-agn-080.tf.aws.human-in-the-loop-approved-decisions
    engine: terraform
    automated: true
    title: 'Human-in-the-loop must be configured for sensitive decisions'
    provider: aws
    description: 'For high-risk agent decisions (financial transactions, legal decisions, personal data changes), human approval MUST be required. The approval workflow must capture approver identity, timestamp, and decision rationale.'
    expected: 'true'
    remediation: 'Configure AWS Bedrock human-in-the-loop for sensitive decision types. Define decision scopes requiring human review. Configure approval channels (email, Slack, custom UI). Store approval records in audit log.\n'
    example:
      compliant: |
        resource "aws_bedrock_guardrail" "sensitive_actions" {
          name = "sensitive-actions-guardrail"

          sensitive_information_policy {
            medical_information = {
              detect_masked = true
            }
            pii_entity_type = {
              detect_masked = true
            }
            financial_information = {
              detect_masked = true
            }
          }

          inappropriate_content_policy {
            hate = {
              detect_masked = true
            }
            sexual = {
              detect_masked = true
            }
            violent = {
              detect_masked = true
            }
            mix = {
              detect_masked = true
            }
          }
        }

        resource "aws_bedrockagent" "hitable_agent" {
          agent_name = "sensitive-agent"

          guardrail_configuration {
            guardrail_arn = aws_bedrock_guardrail.sensitive_actions.arn
            guardrail_version = "DRAFT"
          }

          human_interaction_configuration {
            human_interpretation_prompt = "Review agent decision before execution"
            human_interpretation_timeout = 7200
            human_interpretation_output_context_name = "human_approval"
          }
        }
      non_compliant: |
        resource "aws_bedrockagent" "fully_automated" {
          agent_name = "no-human-in-loop"
          # No human-in-the-loop for sensitive actions
          # WAF-AGN-080 Violation
        }

    scope:
      block_type: resource
      resource_types:
        - aws_bedrock_guardrail
        - aws_bedrockagent
    assertions:
      - attribute: 'human_interaction_configuration'
        op: 'attribute_exists'
        message: 'Human-in-the-loop must be configured for sensitive decisions.'
    on_fail: violation
  - id: waf-agn-080.tf.aws.approval-audit-logging
    engine: terraform
    automated: true
    title: 'Human approvals must be audited with full context'
    provider: aws
    description: 'All human approvals must be logged with timestamp, approver identity, decision type, input context, and approval/rejection decision. Logs must be immutable and stored separately from agent logs.'
    expected: 'true'
    remediation: 'Configure CloudWatch Logs for approval events with full metadata. Use CloudTrail for API-level approval tracking. Implement log encryption and access controls for audit integrity.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_log_group" "approval_audit" {
          name = "/aws/bedrock/approval-audit"
          kms_key_id = aws_kms_key.log_encryption.arn
          retention_in_days = 365
        }

        resource "aws_cloudwatch_log_metric_filter" "approvals" {
          name = "approval-metric"

          log_group_name = aws_cloudwatch_log_group.approval_audit.name

          pattern = "{ $.event_type = \"human_approval\" }"

          metric_transformations {
            metric_name      = "HumanApprovals"
            metric_namespace = "AuditMetrics"
            metric_value     = "1"
          }
        }
      non_compliant: |
        # No approval audit logging
        # WAF-AGN-080 Violation
        # Human decisions not auditable

    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_log_group
        - aws_cloudwatch_log_metric_filter
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Approval audit logging must be configured.'
    on_fail: violation
  - id: waf-agn-080.tf.aws.emergency-escape-hatch
    engine: terraform
    automated: true
    title: 'Emergency escape hatch must exist for agent intervention'
    provider: aws
    description: 'An emergency escape hatch must exist for immediate human intervention. This could be a stop button, override command, or emergency shutdown mechanism accessible via console or API.'
    expected: 'true'
    remediation: 'Configure an emergency stop mechanism accessible via AWS Console, CLI, or API. Define procedures for emergency intervention. Document escape hatch access and activation procedures.\n'
    example:
      compliant: |
        resource "aws_iam_policy" "emergency_stop" {
          name = "emergency-stop-policy"

          policy = jsonencode({
            Version = "2012-10-17"
            Statement = [{
              Effect = "Allow"
              Action = [
                "bedrock:StopInferenceResource",
                "lambda:StopFunction",
                "ecs:StopTask"
              ]
              Resource = [
                "arn:aws:bedrock:*:*:inference-resource/*",
                "arn:aws:lambda:*:*:function:*-emergency-stop"
              ]
            }]
          })
        }

        resource "aws_sns_topic" "emergency_alerts" {
          name = "emergency-agent-alerts"
        }
      non_compliant: |
        # No emergency escape hatch
        # WAF-AGN-080 Violation
        # Cannot intervene in emergency

    scope:
      block_type: resource
      resource_types:
        - aws_iam_policy
        - aws_sns_topic
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Emergency escape hatch must be configured.'
    on_fail: violation
