      - 'ISM – Logging and monitoring'
  - framework: 'CCCS PBMM'
    controls:
      - 'AC-2, AC-6 – Account and authenticator management'
      - 'AU-2 – Logging and audit'
  - framework: 'MAS TRM'
    controls:
      - 'Ch.6 – Access control'
      - 'Ch.9 – Change management'
  - framework: 'ISMAP'
