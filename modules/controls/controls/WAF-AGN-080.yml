checks:
- id: waf-agn-080.tf.aws.human-in-the-loop-approved-decisions
  engine: terraform
  automated: true
  title: Human-in-the-loop must be configured for sensitive decisions
  provider: aws
  description: For high-risk agent decisions (financial transactions, legal decisions, personal data changes), human approval
    MUST be required. The approval workflow must capture approver identity, timestamp, and decision rationale.
  expected: 'true'
  remediation: Configure AWS Bedrock human-in-the-loop for sensitive decision types. Define decision scopes requiring human
    review. Configure approval channels (email, Slack, custom UI). Store approval records in audit log.\n
  example:
    compliant: "resource \"aws_bedrock_guardrail\" \"sensitive_actions\" {\n  name = \"sensitive-actions-guardrail\"\n\n \
      \ sensitive_information_policy {\n    medical_information = {\n      detect_masked = true\n    }\n    pii_entity_type\
      \ = {\n      detect_masked = true\n    }\n    financial_information = {\n      detect_masked = true\n    }\n  }\n\n\
      \  inappropriate_content_policy {\n    hate = {\n      detect_masked = true\n    }\n    sexual = {\n      detect_masked\
      \ = true\n    }\n    violent = {\n      detect_masked = true\n    }\n    mix = {\n      detect_masked = true\n    }\n\
      \  }\n}\n\nresource \"aws_bedrockagent\" \"hitable_agent\" {\n  agent_name = \"sensitive-agent\"\n\n  guardrail_configuration\
      \ {\n    guardrail_arn = aws_bedrock_guardrail.sensitive_actions.arn\n    guardrail_version = \"DRAFT\"\n  }\n\n  human_interaction_configuration\
      \ {\n    human_interpretation_prompt = \"Review agent decision before execution\"\n    human_interpretation_timeout\
      \ = 7200\n    human_interpretation_output_context_name = \"human_approval\"\n  }\n}\n"
    non_compliant: "resource \"aws_bedrockagent\" \"fully_automated\" {\n  agent_name = \"no-human-in-loop\"\n  # No human-in-the-loop\
      \ for sensitive actions\n  # WAF-AGN-080 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_bedrock_guardrail
    - aws_bedrockagent
  assertions:
  - attribute: human_interaction_configuration
    op: attribute_exists
    message: Human-in-the-loop must be configured for sensitive decisions.
  on_fail: violation
- id: waf-agn-080.tf.aws.approval-audit-logging
  engine: terraform
  automated: true
  title: Human approvals must be audited with full context
  provider: aws
  description: All human approvals must be logged with timestamp, approver identity, decision type, input context, and approval/rejection
    decision. Logs must be immutable and stored separately from agent logs.
  expected: 'true'
  remediation: Configure CloudWatch Logs for approval events with full metadata. Use CloudTrail for API-level approval tracking.
    Implement log encryption and access controls for audit integrity.\n
  example:
    compliant: "resource \"aws_cloudwatch_log_group\" \"approval_audit\" {\n  name = \"/aws/bedrock/approval-audit\"\n  kms_key_id\
      \ = aws_kms_key.log_encryption.arn\n  retention_in_days = 365\n}\n\nresource \"aws_cloudwatch_log_metric_filter\" \"\
      approvals\" {\n  name = \"approval-metric\"\n\n  log_group_name = aws_cloudwatch_log_group.approval_audit.name\n\n \
      \ pattern = \"{ $.event_type = \\\"human_approval\\\" }\"\n\n  metric_transformations {\n    metric_name      = \"HumanApprovals\"\
      \n    metric_namespace = \"AuditMetrics\"\n    metric_value     = \"1\"\n  }\n}\n"
    non_compliant: '# No approval audit logging

      # WAF-AGN-080 Violation

      # Human decisions not auditable

      '
  scope:
    block_type: resource
    resource_types:
    - aws_cloudwatch_log_group
    - aws_cloudwatch_log_metric_filter
  assertions:
  - attribute: name
    op: not_empty
    message: Approval audit logging must be configured.
  on_fail: violation
- id: waf-agn-080.tf.aws.emergency-escape-hatch
  engine: terraform
  automated: true
  title: Emergency escape hatch must exist for agent intervention
  provider: aws
  description: An emergency escape hatch must exist for immediate human intervention. This could be a stop button, override
    command, or emergency shutdown mechanism accessible via console or API.
  expected: 'true'
  remediation: Configure an emergency stop mechanism accessible via AWS Console, CLI, or API. Define procedures for emergency
    intervention. Document escape hatch access and activation procedures.\n
  example:
    compliant: "resource \"aws_iam_policy\" \"emergency_stop\" {\n  name = \"emergency-stop-policy\"\n\n  policy = jsonencode({\n\
      \    Version = \"2012-10-17\"\n    Statement = [{\n      Effect = \"Allow\"\n      Action = [\n        \"bedrock:StopInferenceResource\"\
      ,\n        \"lambda:StopFunction\",\n        \"ecs:StopTask\"\n      ]\n      Resource = [\n        \"arn:aws:bedrock:*:*:inference-resource/*\"\
      ,\n        \"arn:aws:lambda:*:*:function:*-emergency-stop\"\n      ]\n    }]\n  })\n}\n\nresource \"aws_sns_topic\"\
      \ \"emergency_alerts\" {\n  name = \"emergency-agent-alerts\"\n}\n"
    non_compliant: '# No emergency escape hatch

      # WAF-AGN-080 Violation

      # Cannot intervene in emergency

      '
  scope:
    block_type: resource
    resource_types:
    - aws_iam_policy
    - aws_sns_topic
  assertions:
  - attribute: name
    op: not_empty
    message: Emergency escape hatch must be configured.
  on_fail: violation
- id: waf-agn-080.tf.azurerm.logic-app-approval
  engine: terraform
  automated: true
  title: Azure Logic Apps approval workflow must exist for sensitive agent decisions
  provider: azurerm
  description: Azure Logic Apps must implement human-in-the-loop approval workflows for sensitive agent actions, capturing
    approver identity and timestamp.
  expected: 'true'
  remediation: 'Deploy azurerm_logic_app_workflow with HTTP trigger and Office 365 / Teams approval connector for sensitive
    agent decisions.

    '
  example:
    compliant: "resource \"azurerm_logic_app_workflow\" \"agent_approval\" {\n  name                = \"agent-approval-workflow\"\
      \n  location            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n\
      }\n\n# Workflow definition includes Start and wait for an approval action\n"
    non_compliant: "resource \"azurerm_cognitive_deployment\" \"agent\" {\n  name = \"agent-deployment\"\n  # No Logic Apps\
      \ approval workflow configured\n  # WAF-AGN-080 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_logic_app_workflow
  assertions:
  - attribute: name
    op: not_empty
    message: Logic Apps workflow must be configured for human-in-the-loop approval.
  on_fail: violation
- id: waf-agn-080.tf.google.workflows-approval
  engine: terraform
  automated: true
  title: GCP Workflows must implement human approval step for sensitive agent decisions
  provider: google
  description: GCP Workflows must include a human approval step (e.g., callback or Cloud Tasks with external approval) before
    executing sensitive agent actions.
  expected: 'true'
  remediation: 'Configure google_workflows_workflow with an explicit approval step using callbacks or Cloud Tasks.

    '
  example:
    compliant: "resource \"google_workflows_workflow\" \"agent_approval\" {\n  name            = \"agent-approval\"\n  region\
      \          = \"europe-west3\"\n  service_account = google_service_account.agent_workflows.email\n\n  source_contents\
      \ = <<EOF\nmain:\n  params: [args]\n  steps:\n    - init:\n        assign:\n          - request_id: $${args.request_id}\n\
      \    - wait_for_approval:\n        call: http.get\n        args:\n          url: $${\"https://approval.example.com/\"\
      \ + request_id}\n        result: approval\n    - execute_if_approved:\n        switch:\n          - condition: $${approval.body.approved\
      \ == true}\n            next: execute_action\n          - condition: true\n            next: reject_action\nEOF\n}\n"
    non_compliant: "resource \"google_workflows_workflow\" \"agent_auto\" {\n  name   = \"agent-auto\"\n  region = \"europe-west3\"\
      \n  # No human approval step\n  # WAF-AGN-080 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_workflows_workflow
  assertions:
  - attribute: source_contents
    op: matches
    pattern: (?i)approval|approved|human|review
    message: Workflow source must include a human approval step.
  on_fail: violation
- id: waf-agn-080.tf.stackit.agentic-human-approval
  engine: terraform
  automated: true
  title: Human approval for stackit
  provider: stackit
  description: Human approval must be documented in IaC via a agentic-human-approval tag/label on stackit_project. This validates
    the control is tracked as code.
  expected: 'true'
  remediation: 'Add a agentic-human-approval tag/label to the stackit_project resource to show the stackit implementation
    of WAF-AGN-080 is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    agentic-human-approval = \"true\"\n  }\n\
      }\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing agentic-human-approval labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: agentic-human-approval
    message: stackit_project is missing the agentic-human-approval tag/label.
  on_fail: violation
