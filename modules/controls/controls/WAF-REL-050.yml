id: WAF-REL-050
title: All inter-service and downstream HTTP/gRPC calls MUST define explicit...
status: active
tags:
- reliability
- high
- configuration
pillar: reliability
severity: high
type:
- configuration
category: data-governance
rationale: Fehlende Datenklassifizierung, -eigentümerschaft und Lifecycle-Steuerung erhöhen Compliance-Risiken, Kosten und
  die Wahrscheinlichkeit von Datenverlusten. Dieses Control adressiert die Anforderungen des Bereichs 'Daten-Governance' und
  stellt sicher, dass All inter-service and downstream HTTP/gRPC calls MUST define explicit timeout values. Critical service
  dependencies MUST implement circuit breaker patterns.
threat:
- Unbounded timeouts and retries cascade failures into downstream systems and extend outages.
- Missing circuit breakers let workloads remain in perpetual failure states when downstream breaks.
implementation_guidance:
- Implement the required configuration as code in Terraform or equivalent IaC.
- Add an automated check to CI/CD so deviations are caught before deployment.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - Die Anforderung ist nicht einheitlich umgesetzt; Nachweis existiert nur punktuell oder fehlt.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - Die Anforderung ist dokumentiert; erste Ressourcen zeigen die gewünschte Konfiguration.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform-Checks oder IaC-Gates prüfen die Anforderung automatisch in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Abdeckung, Ausnahmen und Qualitätsmetriken werden quartalsweise berichtet.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Die Effektivität wird kontinuierlich gemessen und automatisch optimiert.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-reliability/pages/controls/WAF-REL-050.adoc
  related_controls:
  - WAF-REL-040
  - WAF-COST-010
  - WAF-OPS-020
  - WAF-SUS-010
  - WAF-REL-010
  - WAF-REL-060
  - WAF-COST-080
  - WAF-OPS-070
  - WAF-OPS-100
  - WAF-SUS-030
  - WAF-REL-090
  - WAF-AGN-040
description: 'All inter-service and downstream HTTP/gRPC calls MUST define explicit timeout values. Critical service dependencies
  MUST implement circuit breaker patterns. Retry logic MUST use exponential backoff with jitter. Connection pools MUST have
  defined maximum sizes. Services MUST implement bulkhead isolation for different dependency classes. No service may rely
  on default (infinite or undefined) timeouts for external calls.

  '
regulatory_mapping:
- framework: ISO 27001:2022
  controls:
  - A.17.1 – Information security continuity
- framework: ITIL 4
  controls:
  - Service Continuity Management
  - Problem Management
- framework: SRE Book (Google)
  controls:
  - Chapter 22 – Addressing Cascading Failures
checks:
- id: waf-rel-050.tf.aws.alb-idle-timeout
  engine: terraform
  automated: true
  title: AWS ALB idle timeout must be explicitly configured
  provider: aws
  description: ALB idle_timeout must be set to a value appropriate for the workload, not relying on the default 60 seconds
    which may be too long or too short.
  expected: 'true'
  remediation: 'Set idle_timeout on the aws_lb resource. Typical values: 30s for APIs, 300s for file uploads. Align with client-side
    timeout configuration.\n'
  example:
    compliant: "resource \"aws_lb\" \"api\" {\n  name               = \"payment-api-alb\"\n  internal           = false\n\
      \  load_balancer_type = \"application\"\n  security_groups    = [aws_security_group.alb.id]\n  subnets            =\
      \ var.public_subnet_ids\n  idle_timeout       = 30\n\n  tags = var.mandatory_tags\n}\n"
    non_compliant: "resource \"aws_lb\" \"api\" {\n  name               = \"payment-api-alb\"\n  internal           = false\n\
      \  load_balancer_type = \"application\"\n  security_groups    = [aws_security_group.alb.id]\n  subnets            =\
      \ var.public_subnet_ids\n  # Missing: idle_timeout – using AWS default of 60s\n  # WAF-REL-050 violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_lb
  assertions:
  - attribute: idle_timeout
    op: attribute_exists
    message: ALB idle_timeout must be explicitly configured, not using default.
  - attribute: load_balancer_type
    op: equals
    message: This check applies to Application Load Balancers.
    expected: application
  on_fail: violation
- id: waf-rel-050.tf.azurerm.app-gateway-timeout
  engine: terraform
  automated: true
  title: Azure Application Gateway backend settings must define explicit timeouts
  provider: azurerm
  description: Azure Application Gateway backend HTTP settings must define request_timeout_in_seconds rather than relying
    on defaults.
  expected: 'true'
  remediation: 'Set request_timeout_in_seconds in the backend_http_settings block. Recommended values: 30 for APIs, 120 for
    batch operations.\n'
  example:
    compliant: "resource \"azurerm_application_gateway\" \"main\" {\n  name                = \"payment-appgw\"\n  resource_group_name\
      \ = azurerm_resource_group.main.name\n  location            = azurerm_resource_group.main.location\n\n  backend_http_settings\
      \ {\n    name                  = \"api-backend-settings\"\n    cookie_based_affinity = \"Disabled\"\n    port      \
      \            = 8080\n    protocol              = \"Http\"\n    request_timeout_in_seconds = 30\n  }\n  # ... other required\
      \ blocks\n}\n"
    non_compliant: "resource \"azurerm_application_gateway\" \"main\" {\n  name                = \"payment-appgw\"\n  resource_group_name\
      \ = azurerm_resource_group.main.name\n  location            = azurerm_resource_group.main.location\n\n  backend_http_settings\
      \ {\n    name                  = \"api-backend-settings\"\n    cookie_based_affinity = \"Disabled\"\n    port      \
      \            = 8080\n    protocol              = \"Http\"\n    # Missing: request_timeout_in_seconds\n    # WAF-REL-050\
      \ violation\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_application_gateway
  assertions:
  - attribute: backend_http_settings
    op: attribute_exists
    message: Application Gateway must define backend_http_settings.
  - attribute: backend_http_settings.request_timeout_in_seconds
    op: attribute_exists
    message: Backend HTTP settings must define explicit request_timeout_in_seconds.
  on_fail: violation
- id: waf-rel-050.tf.google.cloud-run-timeout
  engine: terraform
  automated: true
  title: GCP Cloud Run services must define explicit request timeout
  provider: google
  description: GCP Cloud Run service templates must define timeout_seconds to prevent runaway requests from consuming resources
    indefinitely.
  expected: 'true'
  remediation: Set timeout_seconds in the template.spec block of google_cloud_run_service. Default is 300s; set to the appropriate
    value for your workload latency SLO.\n
  example:
    compliant: "resource \"google_cloud_run_service\" \"api\" {\n  name     = \"payment-api\"\n  location = var.region\n\n\
      \  template {\n    spec {\n      timeout_seconds = 30\n      containers {\n        image = var.container_image\n   \
      \     resources {\n          limits = { cpu = \"1000m\", memory = \"512Mi\" }\n        }\n      }\n    }\n  }\n}\n"
    non_compliant: "resource \"google_cloud_run_service\" \"api\" {\n  name     = \"payment-api\"\n  location = var.region\n\
      \n  template {\n    spec {\n      # Missing: timeout_seconds – using default 300s\n      # WAF-REL-050 violation\n \
      \     containers {\n        image = var.container_image\n      }\n    }\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_cloud_run_service
    - google_cloud_run_v2_service
  assertions:
  - attribute: template.spec.timeout_seconds
    op: attribute_exists
    message: Cloud Run service must define timeout_seconds in the template spec.
  on_fail: violation
