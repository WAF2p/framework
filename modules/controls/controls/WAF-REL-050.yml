checks:
  - id: waf-rel-050.tf.aws.alb-idle-timeout
    engine: terraform
    automated: true
    title: 'AWS ALB idle timeout must be explicitly configured'
    provider: aws
    description: 'ALB idle_timeout must be set to a value appropriate for the workload, not relying on the default 60 seconds which may be too long or too short.'
    expected: 'true'
    remediation: 'Set idle_timeout on the aws_lb resource. Typical values: 30s for APIs, 300s for file uploads. Align with client-side timeout configuration.\n'
    example:
      compliant: |
        resource "aws_lb" "api" {
          name               = "payment-api-alb"
          internal           = false
          load_balancer_type = "application"
          security_groups    = [aws_security_group.alb.id]
          subnets            = var.public_subnet_ids
          idle_timeout       = 30
        
          tags = var.mandatory_tags
        }
        
      non_compliant: |
        resource "aws_lb" "api" {
          name               = "payment-api-alb"
          internal           = false
          load_balancer_type = "application"
          security_groups    = [aws_security_group.alb.id]
          subnets            = var.public_subnet_ids
          # Missing: idle_timeout – using AWS default of 60s
          # WAF-REL-050 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_lb
    assertions:
      - attribute: 'idle_timeout'
        op: 'attribute_exists'
        message: 'ALB idle_timeout must be explicitly configured, not using default.'
      - attribute: 'load_balancer_type'
        op: 'equals'
        message: 'This check applies to Application Load Balancers.'
    on_fail: violation
  - id: waf-rel-050.tf.azurerm.app-gateway-timeout
    engine: terraform
    automated: true
    title: 'Azure Application Gateway backend settings must define explicit timeouts'
    provider: azurerm
    description: 'Azure Application Gateway backend HTTP settings must define request_timeout_in_seconds rather than relying on defaults.'
    expected: 'true'
    remediation: 'Set request_timeout_in_seconds in the backend_http_settings block. Recommended values: 30 for APIs, 120 for batch operations.\n'
    example:
      compliant: |
        resource "azurerm_application_gateway" "main" {
          name                = "payment-appgw"
          resource_group_name = azurerm_resource_group.main.name
          location            = azurerm_resource_group.main.location
        
          backend_http_settings {
            name                  = "api-backend-settings"
            cookie_based_affinity = "Disabled"
            port                  = 8080
            protocol              = "Http"
            request_timeout_in_seconds = 30
          }
          # ... other required blocks
        }
        
      non_compliant: |
        resource "azurerm_application_gateway" "main" {
          name                = "payment-appgw"
          resource_group_name = azurerm_resource_group.main.name
          location            = azurerm_resource_group.main.location
        
          backend_http_settings {
            name                  = "api-backend-settings"
            cookie_based_affinity = "Disabled"
            port                  = 8080
            protocol              = "Http"
            # Missing: request_timeout_in_seconds
            # WAF-REL-050 violation
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_application_gateway
    assertions:
      - attribute: 'backend_http_settings'
        op: 'attribute_exists'
        message: 'Application Gateway must define backend_http_settings.'
      - attribute: 'backend_http_settings.request_timeout_in_seconds'
        op: 'attribute_exists'
        message: 'Backend HTTP settings must define explicit request_timeout_in_seconds.'
    on_fail: violation
  - id: waf-rel-050.tf.google.cloud-run-timeout
    engine: terraform
    automated: true
    title: 'GCP Cloud Run services must define explicit request timeout'
    provider: google
    description: 'GCP Cloud Run service templates must define timeout_seconds to prevent runaway requests from consuming resources indefinitely.'
    expected: 'true'
    remediation: 'Set timeout_seconds in the template.spec block of google_cloud_run_service. Default is 300s; set to the appropriate value for your workload latency SLO.\n'
    example:
      compliant: |
        resource "google_cloud_run_service" "api" {
          name     = "payment-api"
          location = var.region
        
          template {
            spec {
              timeout_seconds = 30
              containers {
                image = var.container_image
                resources {
                  limits = { cpu = "1000m", memory = "512Mi" }
                }
              }
            }
          }
        }
        
      non_compliant: |
        resource "google_cloud_run_service" "api" {
          name     = "payment-api"
          location = var.region
        
          template {
            spec {
              # Missing: timeout_seconds – using default 300s
              # WAF-REL-050 violation
              containers {
                image = var.container_image
              }
            }
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - google_cloud_run_service
        - google_cloud_run_v2_service
    assertions:
      - attribute: 'template.spec.timeout_seconds'
        op: 'attribute_exists'
        message: 'Cloud Run service must define timeout_seconds in the template spec.'
    on_fail: violation
