# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-COST-100
id: WAF-COST-100
pillar: cost
severity: medium
type:
  - governance
description: |
  A structured Cost Debt Register MUST exist as a version-controlled file in the repository. Each entry MUST document: unique ID, title, description, owner (team), estimated annual impact (EUR), detection date, target resolution date, status (monitoring/paydown/accepted), and either a paydown plan or a documented acceptance rationale. A quarterly Architecture Board review entry covering cost debt status MUST exist for the current quarter. This control governs the ongoing management of Architectural Cost Debt.
regulatory_mapping:
  - framework: 'FinOps Foundation'
    controls:
      - 'Operate Phase – Cost Governance and Accountability'
      - 'FinOps Principles – A FinOps Practice is About More Than Saving Money'
  - framework: 'Internal Governance'
    controls:
      - 'Architecture Governance – Cost Debt Management'
      - 'Cloud Cost Governance Policy – Quarterly Cost Debt Review Mandatory'
checks:
  - id: waf-cost-100.tf.any.cost-debt-register-file-exists
    engine: terraform
    automated: true
    title: 'Cost Debt Register file must exist in repository'
    provider: any
    description: 'A cost-debt-register.yml (or cost-debt-register.md) file must exist in the docs/ directory of the repository. This is a process control validated through CI pipeline file existence check or repository audit. The file must be version-controlled.'
    expected: 'true'
    remediation: 'Create docs/cost-debt-register.yml in the repository. Use the format documented in bp-cost-debt.adoc. Initialize with at least the brownfield discovery entries or a note that no cost debt has been identified yet (with review date).\n'
    example:
      compliant: |
        # docs/cost-debt-register.yml
        version: "1.0"
        last_reviewed: "2025-03-01"
        reviewed_by: "Architecture Board"
        next_review: "2025-06-01"
        
        entries:
          - id: CD-2025-001
            title: "Multi-AZ PostgreSQL without SLO basis"
            category: "ha-over-engineering"
            owner: "platform-team"
            estimated_annual_impact_eur: 22000
            status: "paydown"
            paydown_plan: "SLO review by 2025-04-15; downgrade if SLO <= 99.5%"
            target_resolution: "2025-06-30"
        
      non_compliant: |
        # docs/cost-debt-register.yml does not exist in repository
        # Architectural cost debt is untracked and unmanaged
        
    scope:
      block_type: resource
    on_fail: violation
  - id: waf-cost-100.tf.any.quarterly-review-entry-current
    engine: terraform
    automated: true
    title: 'Quarterly Architecture Board review entry must exist for current quarter'
    provider: any
    description: 'The cost-debt-register.yml must contain a quarterly review entry for the current quarter (or the most recently completed quarter). An absent review entry for more than one quarter indicates the mandatory quarterly review cadence is not being maintained.'
    expected: 'true'
    remediation: 'After the quarterly Architecture Board review, add a review record to docs/cost-debt-reviews/<YYYY-Q[1-4]>-review.yml (or equivalent location). The review record must include: date, attendees, new entries, paydown updates, acceptance decisions, and Architecture Board sign-off.\n'
    example:
      compliant: |
        # docs/cost-debt-reviews/2025-Q1-review.yml
        quarter: "2025-Q1"
        date: "2025-03-01"
        attendees:
          - "CTO"
          - "Principal Engineer Platform"
          - "FinOps Lead"
        new_entries:
          - id: CD-2025-003
            decision: "Accepted with exit plan requirement by Q2 2025"
        paydown_updates:
          - id: CD-2025-002
            progress: "COMPLETED. Savings: 100 EUR/month confirmed."
        sign_off: "Architecture Board"
        next_review: "2025-06-01"
        
      non_compliant: |
        # No quarterly review entry for 2025-Q1 exists
        # Mandatory Architecture Board review not conducted – WAF-COST-100 violation
        
    scope:
      block_type: resource
    on_fail: finding
