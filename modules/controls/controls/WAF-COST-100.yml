id: WAF-COST-100
title: A structured Cost Debt Register MUST exist as a version-controlled file in...
status: active
tags:
- cost
- medium
- governance
pillar: cost
severity: medium
type:
- governance
category: cost-governance
rationale: Lack of cost transparency and governance leads to budget overruns, cloud waste, and unaccountable spending. This
  control addresses the requirements of the 'Cost Governance' area and ensures that A structured Cost Debt Register MUST exist
  as a version-controlled file in the repository.
threat:
- Uncontrolled cloud spend erodes budget and project viability.
- High lock-in or debt decisions are made without financial impact visibility.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Implementation is regularly reviewed and evidenced in reviews.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-cost/pages/controls/WAF-COST-100.adoc
  related_controls:
  - WAF-COST-050
  - WAF-COST-060
  - WAF-SUS-020
  - WAF-PERF-100
  - WAF-COST-080
  - WAF-COST-070
  - WAF-SUS-100
  - WAF-COST-020
  - WAF-COST-010
  - WAF-REL-010
  - WAF-AGN-040
  - WAF-AGN-050
description: 'A structured Cost Debt Register MUST exist as a version-controlled file in the repository. Each entry MUST document:
  unique ID, title, description, owner (team), estimated annual impact (EUR), detection date, target resolution date, status
  (monitoring/paydown/accepted), and either a paydown plan or a documented acceptance rationale. A quarterly Architecture
  Board review entry covering cost debt status MUST exist for the current quarter. This control governs the ongoing management
  of Architectural Cost Debt.

  '
regulatory_mapping:
- framework: FinOps Foundation
  controls:
  - Operate Phase – Cost Governance and Accountability
  - FinOps Principles – A FinOps Practice is About More Than Saving Money
checks:
- id: waf-cost-100.config.any.cost-governance
  engine: config
  automated: true
  title: Cost Debt Register file must exist in repository
  provider: any
  description: A version-controlled policy document must exist at `docs/cost/waf-cost-100-cost-governance.md` and document
    the provider-agnostic implementation of this control. The checker validates that the file exists and contains a normative
    requirement statement (MUST/SHALL/required/mandatory).
  expected: 'true'
  remediation: 'Create or update `docs/cost/waf-cost-100-cost-governance.md`. State the requirement, how it is implemented
    for provider-agnostic, the review cadence, and the owner.

    '
  example:
    compliant: '|

      docs/cost/waf-cost-100-cost-governance.md:

      - The provider-agnostic implementation of WAF-COST-100 is documented.

      - Implementation status and owner are recorded.

      - Review cadence is defined (e.g. quarterly).

      '
    non_compliant: '|

      # `docs/cost/waf-cost-100-cost-governance.md` is missing or does not contain a normative requirement.

      # WAF-COST-100 violation: provider-agnostic control is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/cost/waf-cost-100-cost-governance.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/cost/waf-cost-100-cost-governance.md` must contain a normative requirement statement.
  on_fail: violation
