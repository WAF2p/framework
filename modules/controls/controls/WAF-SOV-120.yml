id: WAF-SOV-120
title: Data processing agreements MUST be documented for every sub-processor
status: active
tags:
- governance
- high
- sovereign
pillar: sovereign
severity: high
type:
- governance
category: data-governance
rationale: Fehlende Datenklassifizierung, Dokumentation oder Standortsteuerung erhöhen Compliance-Risiken, Kosten und Betriebsrisiken.
  Dieses Control adressiert die Anforderungen des Bereichs 'Data Governance' und stellt sicher, dass A current data processing
  agreement (DPA) or order processing agreement (AVV) MUST exist for each su...
threat:
- Missing DPAs violate GDPR Article 28 and similar processor accountability requirements.
- Undocumented sub-processors increase supply-chain risk and prevent effective exit management.
implementation_guidance:
- Document the requirement in a version-controlled policy, ADR, or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - Die Anforderung ist nicht einheitlich umgesetzt; Nachweis existiert nur punktuell oder fehlt.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - Eine dokumentierte Policy oder ein Standard beschreibt die Anforderung.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform-Checks oder IaC-Gates prüfen die Anforderung automatisch in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Abdeckung, Ausnahmen und Qualitätsmetriken werden quartalsweise berichtet.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Die Effektivität wird kontinuierlich gemessen und automatisch optimiert.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-sovereign/pages/controls/WAF-SOV-120.adoc
  related_controls:
  - WAF-SOV-010
  - WAF-SOV-030
  - WAF-SOV-050
  - WAF-SOV-060
  - WAF-SOV-090
  - WAF-SEC-010
  - WAF-SEC-130
description: A current data processing agreement (DPA) or order processing agreement (AVV) MUST exist for each sub-processor
  handling personal or regulated data. Sub-processor lists MUST be maintained and reviewed at least annually. DPA terms MUST
  cover data location, security measures, breach notification, deletion, and audit rights. Changes to sub-processors MUST
  follow a documented approval workflow.
regulatory_mapping:
- framework: GDPR
  controls:
  - Art. 28 – Processor
  - Art. 46 – Transfers with appropriate safeguards
- framework: BSI C5:2020
  controls:
  - OPS-02 – Supplier relationships
- framework: DORA
  controls:
  - Art. 28 – Subcontracting of ICT services
- framework: ISO 27001:2022
  controls:
  - A.5.19 – Information security in supplier relationships
checks:
- id: waf-sov-120.config.dpa-register
  engine: config
  provider: any
  automated: false
  title: DPA register must list all sub-processors
  description: DPA register must list all sub-processors
  expected: 'true'
  remediation: DPA register must list all sub-processors
  scope:
    block_type: file
    path_pattern: docs/governance/dpa-register.md
  assertions:
  - attribute: exists
    op: attribute_exists
    message: DPA/AVV register must list each sub-processor and agreement status.
  on_fail: violation
