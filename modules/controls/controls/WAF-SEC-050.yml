checks:
  - id: waf-sec-050.tf.aws.no-public-ip-internal-compute
    engine: terraform
    automated: true
    title: 'Internal compute resources must not be assigned public IP addresses'
    provider: aws
    description: 'EC2 instances and launch templates used for application or internal workloads must have associate_public_ip_address = false to ensure they are not directly reachable from the internet.'
    expected: 'true'
    remediation: 'Set associate_public_ip_address = false on all aws_instance and aws_launch_template resources used for internal workloads. Place these instances in private subnets. Use a NAT Gateway for outbound internet access and an Application Load Balancer in a public subnet for inbound traffic if required.\n'
    example:
      compliant: |
        resource "aws_instance" "app" {
          ami                         = data.aws_ami.ubuntu.id
          instance_type               = "t3.medium"
          subnet_id                   = aws_subnet.private.id
          associate_public_ip_address = false
          vpc_security_group_ids      = [aws_security_group.app.id]
          tags = { Name = "app-server" }
        }
        
      non_compliant: |
        resource "aws_instance" "app" {
          ami                         = data.aws_ami.ubuntu.id
          instance_type               = "t3.medium"
          subnet_id                   = aws_subnet.public.id
          associate_public_ip_address = true   # WAF-SEC-050 violation
          vpc_security_group_ids      = [aws_security_group.app.id]
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_instance
        - aws_launch_template
    assertions:
      - attribute: 'associate_public_ip_address'
        op: 'is_false'
        message: 'Internal compute resources MUST NOT have public IP addresses assigned. Use private subnets and NAT Gateway for outbound access.'
    on_fail: violation
  - id: waf-sec-050.tf.aws.no-unrestricted-ssh
    engine: terraform
    automated: true
    title: 'Security groups must not allow unrestricted SSH or RDP ingress from the internet'
    provider: aws
    description: 'Security group ingress rules must not allow port 22 (SSH) or port 3389 (RDP) from 0.0.0.0/0 (IPv4) or ::/0 (IPv6). Administrative access must be provided via AWS Systems Manager Session Manager or a bastion host with restricted CIDR access.'
    expected: 'true'
    remediation: "Remove any ingress rule allowing port 22 or 3389 from 0.0.0.0/0. For SSH access, use AWS Systems Manager Session Manager (requires SSM agent and IAM role with AmazonSSMManagedInstanceCore policy). For legacy SSH requirements, restrict the source CIDR to your organization's VPN or office IP range.\n"
    example:
      compliant: |
        resource "aws_security_group" "app" {
          name   = "app-server-sg"
          vpc_id = aws_vpc.main.id
          # No SSH ingress rule – use SSM Session Manager instead
          egress {
            from_port   = 443
            to_port     = 443
            protocol    = "tcp"
            cidr_blocks = ["0.0.0.0/0"]
            description = "HTTPS outbound for AWS API calls"
          }
        }
        
      non_compliant: |
        resource "aws_security_group" "bad" {
          name   = "app-server-sg"
          vpc_id = aws_vpc.main.id
          ingress {
            from_port   = 22
            to_port     = 22
            protocol    = "tcp"
            cidr_blocks = ["0.0.0.0/0"]   # WAF-SEC-050 violation: open SSH to internet
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_security_group
        - aws_vpc_security_group_ingress_rule
    assertions:
      - attribute: 'ingress'
        op: 'json_not_contains_pattern'
        message: 'Security group must not allow ingress from 0.0.0.0/0 on administrative ports. Restrict to known CIDR ranges or use SSM Session Manager.'
        pattern: '"cidr_blocks":\\s*\\["0\\.0\\.0\\.0/0"\\]'
    on_fail: violation

  - id: waf-sec-050.tf.azurerm.nic-no-public-ip
    engine: terraform
    automated: true
    title: 'Azure network interfaces for internal workloads must not have a public IP address'
    provider: azurerm
    description: 'All azurerm_network_interface resources used for internal application workloads must leave ip_configuration.public_ip_address_id empty or unset.'
    expected: 'true'
    remediation: |
      Remove public_ip_address_id from the ip_configuration block of internal azurerm_network_interface resources. Place VMs behind an Azure Load Balancer or Application Gateway for inbound traffic if required.
    example:
      compliant: |
        resource "azurerm_network_interface" "app" {
          name                = "app-nic"
          location            = azurerm_resource_group.main.location
          resource_group_name = azurerm_resource_group.main.name
          ip_configuration {
            name                          = "internal"
            subnet_id                     = azurerm_subnet.private.id
            private_ip_address_allocation = "Dynamic"
          }
        }
      non_compliant: |
        resource "azurerm_network_interface" "app" {
          name                = "app-nic"
          location            = azurerm_resource_group.main.location
          resource_group_name = azurerm_resource_group.main.name
          ip_configuration {
            name                          = "internal"
            subnet_id                     = azurerm_subnet.private.id
            private_ip_address_allocation = "Dynamic"
            public_ip_address_id          = azurerm_public_ip.app.id
          }
        }
    scope:
      block_type: resource
      resource_types:
        - azurerm_network_interface
    assertions:
      - attribute: 'ip_configuration.public_ip_address_id'
        op: 'equals'
        expected: ''
        message: 'Network interface for internal workloads must not have a public IP address assigned.'
    on_fail: violation

  - id: waf-sec-050.tf.azurerm.nsg-no-admin-internet
    engine: terraform
    automated: true
    title: 'Azure network security groups must not allow unrestricted SSH or RDP from the internet'
    provider: azurerm
    description: 'All azurerm_network_security_group resources must not contain a security_rule that allows destination port 22 or 3389 from source_address_prefix "*" or "Internet".'
    expected: 'true'
    remediation: |
      Remove or restrict administrative ingress rules in azurerm_network_security_group and azurerm_network_security_rule resources. Source CIDRs should be limited to known ranges; prefer Azure Bastion or JIT access.
    example:
      compliant: |
        resource "azurerm_network_security_group" "app" {
          name                = "app-nsg"
          location            = azurerm_resource_group.main.location
          resource_group_name = azurerm_resource_group.main.name
          # No SSH/RDP ingress from the internet
        }
      non_compliant: |
        resource "azurerm_network_security_group" "bad" {
          name                = "bad-nsg"
          location            = azurerm_resource_group.main.location
          resource_group_name = azurerm_resource_group.main.name
          security_rule {
            name                       = "AllowSSH"
            priority                   = 100
            direction                  = "Inbound"
            access                     = "Allow"
            protocol                   = "Tcp"
            source_port_range          = "*"
            destination_port_range     = "22"
            source_address_prefix      = "Internet"
            destination_address_prefix = "*"
          }
        }
    scope:
      block_type: resource
      resource_types:
        - azurerm_network_security_group
        - azurerm_network_security_rule
    assertions:
      - attribute: 'security_rule'
        op: 'json_not_contains_pattern'
        pattern: '"destination_port_range":\s*"22"'
        message: 'NSG must not allow unrestricted SSH (port 22) from the internet.'
      - attribute: 'security_rule'
        op: 'json_not_contains_pattern'
        pattern: '"destination_port_range":\s*"3389"'
        message: 'NSG must not allow unrestricted RDP (port 3389) from the internet.'
    on_fail: violation

  - id: waf-sec-050.tf.google.vm-no-access-config
    engine: terraform
    automated: true
    title: 'Google Compute Engine instances for internal workloads must not have external IPs'
    provider: google
    description: 'All google_compute_instance resources used for internal application workloads must not contain a network_interface.access_config block (no external IP).'
    expected: 'true'
    remediation: |
      Remove the access_config block from network_interface on internal google_compute_instance resources. Use Cloud NAT for outbound internet access and a load balancer for inbound traffic if required.
    example:
      compliant: |
        resource "google_compute_instance" "app" {
          name         = "app-vm"
          machine_type = "e2-medium"
          zone         = "europe-west3-a"
          network_interface {
            subnetwork = google_compute_subnetwork.private.id
          }
        }
      non_compliant: |
        resource "google_compute_instance" "app" {
          name         = "app-vm"
          machine_type = "e2-medium"
          zone         = "europe-west3-a"
          network_interface {
            subnetwork = google_compute_subnetwork.private.id
            access_config {
              # external IP assigned
            }
          }
        }
    scope:
      block_type: resource
      resource_types:
        - google_compute_instance
    assertions:
      - attribute: 'network_interface.access_config'
        op: 'equals'
        expected: ''
        message: 'Internal compute instances must not have an access_config block assigning an external IP.'
    on_fail: violation

  - id: waf-sec-050.tf.google.firewall-no-admin-internet
    engine: terraform
    automated: true
    title: 'Google Cloud firewalls must not allow unrestricted SSH or RDP from the internet'
    provider: google
    description: 'All google_compute_firewall resources allowing ingress must not allow ports 22 or 3389 from source_ranges containing "0.0.0.0/0".'
    expected: 'true'
    remediation: |
      Restrict source_ranges on google_compute_firewall rules for management ports to trusted CIDRs. Prefer Identity-Aware Proxy (IAP) for administrative access.
    example:
      compliant: |
        resource "google_compute_firewall" "internal" {
          name    = "allow-internal"
          network = google_compute_network.main.id
          allow {
            protocol = "tcp"
            ports    = ["443"]
          }
          source_ranges = ["10.0.0.0/8"]
        }
      non_compliant: |
        resource "google_compute_firewall" "bad" {
          name    = "allow-ssh-internet"
          network = google_compute_network.main.id
          allow {
            protocol = "tcp"
            ports    = ["22"]
          }
          source_ranges = ["0.0.0.0/0"]
        }
    scope:
      block_type: resource
      resource_types:
        - google_compute_firewall
    assertions:
      - attribute: 'allow'
        op: 'json_not_contains_pattern'
        pattern: '"ports":\s*\[\s*"22"'
        message: 'Firewall must not allow unrestricted SSH (port 22) from the internet.'
      - attribute: 'allow'
        op: 'json_not_contains_pattern'
        pattern: '"ports":\s*\[\s*"3389"'
        message: 'Firewall must not allow unrestricted RDP (port 3389) from the internet.'
    on_fail: violation
