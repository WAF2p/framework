  on_fail: violation
- id: waf-sec-110.tf.google.binary-authorization
  engine: terraform
  automated: true
  title: GCP Binary Authorization must require attestation for production deployments
  provider: google
  description: A google_binary_authorization_policy resource must define a default_admission_rule with evaluation_mode "REQUIRE_ATTESTATION"
    so that only signed, trusted container images can be deployed to production GKE clusters.
  expected: 'true'
  remediation: Create a google_binary_authorization_policy with default_admission_rule evaluation_mode = "REQUIRE_ATTESTATION"
    and an attestation authority (google_binary_authorization_attestor) used by the CI/CD pipeline to sign images. Configure
    GKE clusters to enable Binary Authorization.\n
  example:
    compliant: "resource \"google_binary_authorization_policy\" \"prod\" {\n  default_admission_rule {\n    evaluation_mode\
      \  = \"REQUIRE_ATTESTATION\"\n    enforcement_mode = \"ENFORCED_BLOCK_AND_AUDIT_LOG\"\n    require_attestations_by =\
      \ [\n      google_binary_authorization_attestor.ci.id,\n    ]\n  }\n}\n\nresource \"google_binary_authorization_attestor\"\
      \ \"ci\" {\n  name = \"ci-pipeline-attestor\"\n  attestation_authority_note {\n    note_reference = google_container_analysis_note.ci.name\n\
      \    public_keys {\n      ascii_armored_pgp_public_key = file(\"ci-pipeline.pub\")\n    }\n  }\n}\n"
    non_compliant: "resource \"google_binary_authorization_policy\" \"prod\" {\n  default_admission_rule {\n    evaluation_mode\
      \  = \"ALWAYS_ALLOW\"  # WAF-SEC-110 violation: any image can deploy\n    enforcement_mode = \"ENFORCED_BLOCK_AND_AUDIT_LOG\"\
      \n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_binary_authorization_policy
  assertions:
  - attribute: default_admission_rule
    op: attribute_exists
    message: Binary Authorization policy must define a default_admission_rule.
  on_fail: violation
- id: waf-sec-110.tf.aws.ecr-scan-enabled
  engine: terraform
  automated: true
  title: ECR repositories must have image scanning enabled on push
  provider: aws
  description: All aws_ecr_repository resources must include an image_scanning_configuration block with scan_on_push = true
    to ensure every image pushed to the registry is automatically scanned for known CVEs before it can be deployed to production
    workloads.
  expected: 'true'
  remediation: Add an image_scanning_configuration block with scan_on_push = true to all aws_ecr_repository resources. For
    enhanced scanning including programming language libraries (not just OS packages), enable Amazon Inspector integration
    at the account level and configure ECR enhanced scanning via the AWS Inspector console or API. Integrate ECR scan result
    checks into CI/CD deployment gates.\n
  example:
    compliant: "resource \"aws_ecr_repository\" \"app\" {\n  name                 = \"my-application\"\n  image_tag_mutability\
      \ = \"IMMUTABLE\"\n\n  image_scanning_configuration {\n    scan_on_push = true\n  }\n}\n"
    non_compliant: "resource \"aws_ecr_repository\" \"app\" {\n  name                 = \"my-application\"\n  image_tag_mutability\
      \ = \"IMMUTABLE\"\n  # Missing image_scanning_configuration – WAF-SEC-110 violation\n  # Images pushed to this repository\
      \ are not scanned for CVEs\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_ecr_repository
  assertions:
  - attribute: image_scanning_configuration
    op: attribute_exists
    message: ECR repository must have image_scanning_configuration defined with scan_on_push enabled.
  on_fail: violation
