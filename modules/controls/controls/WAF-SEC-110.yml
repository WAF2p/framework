checks:
  - id: waf-sec-110.tf.aws.ecr-immutable-tags
    engine: terraform
    automated: true
    title: 'ECR repositories must enforce immutable image tags'
    provider: aws
    description: "All aws_ecr_repository resources must have image_tag_mutability set to 'IMMUTABLE'. Mutable tags allow a tag to be overwritten with a different image after a security scan has passed, creating a window for supply chain injection that bypasses pre-deployment controls."
    expected: 'true'
    remediation: 'Set image_tag_mutability = "IMMUTABLE" on all aws_ecr_repository resources. Update CI/CD pipelines to tag images with unique identifiers such as the Git commit SHA or a semantic version (e.g., v1.2.3-sha-abc1234) rather than mutable tags like \'latest\'. Existing pipelines using \'latest\' must be updated to use versioned tags before enabling immutability.\n'
    example:
      compliant: |
        resource "aws_ecr_repository" "app" {
          name                 = "my-application"
          image_tag_mutability = "IMMUTABLE"
        
          image_scanning_configuration {
            scan_on_push = true
          }
        
          encryption_configuration {
            encryption_type = "KMS"
            kms_key         = aws_kms_key.ecr.arn
          }
        
          tags = {
            environment = "production"
            owner       = "platform-team"
          }
        }
        
      non_compliant: |
        resource "aws_ecr_repository" "app" {
          name                 = "my-application"
          image_tag_mutability = "MUTABLE"  # WAF-SEC-110 violation: allows tag overwrite
          # No image_scanning_configuration    # WAF-SEC-110 violation: scan-on-push required
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_ecr_repository
    assertions:
      - attribute: 'image_tag_mutability'
        op: 'equals'
        message: 'ECR repository must use IMMUTABLE tag mutability to prevent post-push tag updates.'
        expected: 'IMMUTABLE'
    on_fail: violation
  - id: waf-sec-110.tf.aws.ecr-scan-enabled
    engine: terraform
    automated: true
    title: 'ECR repositories must have image scanning enabled on push'
    provider: aws
    description: 'All aws_ecr_repository resources must include an image_scanning_configuration block with scan_on_push = true to ensure every image pushed to the registry is automatically scanned for known CVEs before it can be deployed to production workloads.'
    expected: 'true'
    remediation: 'Add an image_scanning_configuration block with scan_on_push = true to all aws_ecr_repository resources. For enhanced scanning including programming language libraries (not just OS packages), enable Amazon Inspector integration at the account level and configure ECR enhanced scanning via the AWS Inspector console or API. Integrate ECR scan result checks into CI/CD deployment gates.\n'
    example:
      compliant: |
        resource "aws_ecr_repository" "app" {
          name                 = "my-application"
          image_tag_mutability = "IMMUTABLE"
        
          image_scanning_configuration {
            scan_on_push = true
          }
        }
        
      non_compliant: |
        resource "aws_ecr_repository" "app" {
          name                 = "my-application"
          image_tag_mutability = "IMMUTABLE"
          # Missing image_scanning_configuration – WAF-SEC-110 violation
          # Images pushed to this repository are not scanned for CVEs
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_ecr_repository
    assertions:
      - attribute: 'image_scanning_configuration'
        op: 'attribute_exists'
        message: 'ECR repository must have image_scanning_configuration defined with scan_on_push enabled.'
    on_fail: violation
