checks:
- id: waf-sec-110.tf.aws.ecr-immutable-tags
  engine: terraform
  automated: true
  title: ECR repositories must enforce immutable image tags
  provider: aws
  description: All aws_ecr_repository resources must have image_tag_mutability set to 'IMMUTABLE'. Mutable tags allow a tag
    to be overwritten with a different image after a security scan has passed, creating a window for supply chain injection
    that bypasses pre-deployment controls.
  expected: 'true'
  remediation: 'Set image_tag_mutability = "IMMUTABLE" on all aws_ecr_repository resources. Update CI/CD pipelines to tag
    images with unique identifiers such as the Git commit SHA or a semantic version (e.g., v1.2.3-sha-abc1234) rather than
    mutable tags like ''latest''. Existing pipelines using ''latest'' must be updated to use versioned tags before enabling
    immutability.

    '
  example:
    compliant: "resource \"aws_ecr_repository\" \"app\" {\n  name                 = \"my-application\"\n  image_tag_mutability\
      \ = \"IMMUTABLE\"\n\n  image_scanning_configuration {\n    scan_on_push = true\n  }\n\n  encryption_configuration {\n\
      \    encryption_type = \"KMS\"\n    kms_key         = aws_kms_key.ecr.arn\n  }\n\n  tags = {\n    environment = \"production\"\
      \n    owner       = \"platform-team\"\n  }\n}\n"
    non_compliant: "resource \"aws_ecr_repository\" \"app\" {\n  name                 = \"my-application\"\n  image_tag_mutability\
      \ = \"MUTABLE\"  # WAF-SEC-110 violation: allows tag overwrite\n  # No image_scanning_configuration    # WAF-SEC-110\
      \ violation: scan-on-push required\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_ecr_repository
  assertions:
  - attribute: image_tag_mutability
    op: equals
    message: ECR repository must use IMMUTABLE tag mutability to prevent post-push tag updates.
    expected: IMMUTABLE
  on_fail: violation
- id: waf-sec-110.config.azurerm.azurerm-container-security
