checks:
- id: waf-sec-060.tf.aws.secrets-manager-exists
  engine: terraform
  automated: true
  title: Secrets Manager secrets must be defined with a recovery window
  provider: aws
  description: All aws_secretsmanager_secret resources must have a name attribute set and recovery_window_in_days >= 7 to prevent accidental deletion from causing immediate and irrecoverable data access loss.
  expected: 'true'
  remediation: Add name and recovery_window_in_days = 30 to all aws_secretsmanager_secret resources. Do not set force_overwrite_replica_secret = true or recovery_window_in_days = 0 unless in a controlled testing environment.\n
  example:
    compliant: "resource \"aws_secretsmanager_secret\" \"db_password\" {\n  name                    = \"prod/app/db-password\"\n  description             = \"RDS master password for production application database\"\n  kms_key_id              = aws_kms_key.secrets.arn\n  recovery_window_in_days = 30\n  tags = {\n    owner       = \"platform-team\"\n    environment = \"production\"\n  }\n}\n"
    non_compliant: "resource \"aws_secretsmanager_secret\" \"db_password\" {\n  # name not set                           – WAF-SEC-060 violation\n  recovery_window_in_days = 0              # WAF-SEC-060 violation: no recovery window\n  # kms_key_id not set                     – WAF-SEC-060 violation (check 2)\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_secretsmanager_secret
  assertions:
  - attribute: name
    op: attribute_exists
    message: Secrets Manager secret must have an explicit name attribute.
  - attribute: recovery_window_in_days
    op: greater_than_or_equal
    message: Secrets Manager secret recovery window must be at least 7 days to allow recovery from accidental deletion.
    expected: 7
  on_fail: violation
- id: waf-sec-060.tf.aws.secrets-encrypted-with-cmk
  engine: terraform
  automated: true
  title: Secrets Manager secrets must be encrypted with a customer-managed KMS key
  provider: aws
  description: All aws_secretsmanager_secret resources must have a kms_key_id attribute referencing a customer-managed KMS key. Using the default AWS-managed key (aws/secretsmanager) is not acceptable for production workloads containing sensitive credentials.
  expected: 'true'
  remediation: Create an aws_kms_key resource with enable_key_rotation = true and reference its ARN via kms_key_id = aws_kms_key.secrets.arn in the aws_secretsmanager_secret resource. Ensure the KMS key policy grants the Secrets Manager service principal permission to use the key for encryption and decryption.\n
  example:
    compliant: "resource \"aws_kms_key\" \"secrets\" {\n  description         = \"CMK for Secrets Manager encryption\"\n  enable_key_rotation = true\n}\nresource \"aws_secretsmanager_secret\" \"api_key\" {\n  name       = \"prod/app/external-api-key\"\n  kms_key_id = aws_kms_key.secrets.arn\n}\n"
    non_compliant: "resource \"aws_secretsmanager_secret\" \"api_key\" {\n  name = \"prod/app/external-api-key\"\n  # kms_key_id not set – using default aws/secretsmanager key\n  # WAF-SEC-060 violation: CMK encryption required for production secrets\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_secretsmanager_secret
  assertions:
  - attribute: kms_key_id
    op: attribute_exists
    message: Secrets Manager secret MUST be encrypted with a customer-managed KMS key (kms_key_id must be set).
  on_fail: violation
- id: waf-sec-060.tf.azurerm.key-vault-secret-expiration
  engine: terraform
  automated: true
  title: Azure Key Vault secrets must have an expiration date
  provider: azurerm
  description: All azurerm_key_vault_secret resources storing workload secrets must have expiration_date set to enforce rotation and lifecycle.
  expected: 'true'
  remediation: 'Set expiration_date on every azurerm_key_vault_secret resource and establish a rotation workflow that refreshes the secret before expiration.

    '
  example:
    compliant: "resource \"azurerm_key_vault_secret\" \"db_password\" {\n  name         = \"db-password\"\n  value        = var.db_password\n  key_vault_id = azurerm_key_vault.main.id\n  expiration_date = \"2026-01-01T00:00:00Z\"\n}\n"
    non_compliant: "resource \"azurerm_key_vault_secret\" \"db_password\" {\n  name         = \"db-password\"\n  value        = var.db_password\n  key_vault_id = azurerm_key_vault.main.id\n  # expiration_date not set\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_key_vault_secret
  assertions:
  - attribute: expiration_date
    op: attribute_exists
    message: Key Vault secret must have an expiration_date for lifecycle management.
  on_fail: violation
- id: waf-sec-060.tf.google.secret-manager-exists
  engine: terraform
  automated: true
  title: Google Secret Manager secrets must be defined for workload secrets
  provider: google
  description: All workload secrets must be stored in google_secret_manager_secret resources rather than plain text or local state.
  expected: 'true'
  remediation: 'Create google_secret_manager_secret resources for all sensitive configuration values. Reference secret versions via data sources rather than storing values in Terraform state.

    '
  example:
    compliant: "resource \"google_secret_manager_secret\" \"db_password\" {\n  secret_id = \"db-password\"\n  replication {\n    auto {}\n  }\n}\n"
    non_compliant: '# Secret value stored in plain text or Terraform variable

      # Use google_secret_manager_secret instead

      '
  scope:
    block_type: resource
    resource_types:
    - google_secret_manager_secret
  assertions:
  - attribute: secret_id
    op: attribute_exists
    message: Workload secrets must be stored in Google Secret Manager.
  on_fail: violation
- id: waf-sec-060.tf.stackit.secret-manager-rotation
  engine: terraform
  automated: true
  title: STACKIT secrets must be stored in Secret Manager and rotated
  provider: stackit
  description: Credentials, API keys, and other secrets used by STACKIT workloads must be stored in stackit_secret_manager_secret resources and rotated regularly. Hard-coded secrets in Terraform are prohibited.
  expected: 'true'
  remediation: Create stackit_secret_manager_secret resources for all sensitive values. Reference them via data sources in application configuration. Implement rotation via automation or documented process.\n
  example:
    compliant: "resource \"stackit_secret_manager_secret\" \"db_password\" {\n  project_id = var.stackit_project_id\n  name       = \"db-password\"\n  # value managed via STACKIT Secret Manager; rotation automated\n}\n"
    non_compliant: '# Database password hard-coded in Terraform or plain text.

      # WAF-SEC-060 violation: secrets not managed in Secret Manager

      '
  scope:
    block_type: resource
    resource_types:
    - stackit_secret_manager_secret
  assertions:
  - attribute: name
    op: attribute_exists
    message: STACKIT secrets must be stored in Secret Manager resources.
  on_fail: violation
- id: waf-sec-060.config.ovh.ovh-identity-access
  engine: config
  automated: true
  title: OVHcloud workloads must store secrets in a managed vault or secret store
  provider: ovh
  description: A version-controlled policy document must exist at `docs/security/waf-sec-060-ovh-identity-access.md` and document the OVHcloud implementation of this control. The checker validates that the file exists and contains a normative requirement statement (MUST/SHALL/required/mandatory).
  expected: 'true'
  remediation: 'Create or update `docs/security/waf-sec-060-ovh-identity-access.md`. State the requirement, how it is implemented for OVHcloud, the review cadence, and the owner.

    '
  example:
    compliant: '|

      docs/security/waf-sec-060-ovh-identity-access.md:

      - The OVHcloud implementation of WAF-SEC-060 is documented.

      - Implementation status and owner are recorded.

      - Review cadence is defined (e.g. quarterly).

      '
    non_compliant: '|

      # `docs/security/waf-sec-060-ovh-identity-access.md` is missing or does not contain a normative requirement.

      # WAF-SEC-060 violation: OVHcloud control is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/security/waf-sec-060-ovh-identity-access.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/security/waf-sec-060-ovh-identity-access.md` must contain a normative requirement statement.
  on_fail: violation
