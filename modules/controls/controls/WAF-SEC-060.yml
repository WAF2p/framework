checks:
  - id: waf-sec-060.tf.aws.secrets-manager-exists
    engine: terraform
    automated: true
    title: 'Secrets Manager secrets must be defined with a recovery window'
    provider: aws
    description: 'All aws_secretsmanager_secret resources must have a name attribute set and recovery_window_in_days >= 7 to prevent accidental deletion from causing immediate and irrecoverable data access loss.'
    expected: 'true'
    remediation: 'Add name and recovery_window_in_days = 30 to all aws_secretsmanager_secret resources. Do not set force_overwrite_replica_secret = true or recovery_window_in_days = 0 unless in a controlled testing environment.\n'
    example:
      compliant: |
        resource "aws_secretsmanager_secret" "db_password" {
          name                    = "prod/app/db-password"
          description             = "RDS master password for production application database"
          kms_key_id              = aws_kms_key.secrets.arn
          recovery_window_in_days = 30
          tags = {
            owner       = "platform-team"
            environment = "production"
          }
        }
        
      non_compliant: |
        resource "aws_secretsmanager_secret" "db_password" {
          # name not set                           – WAF-SEC-060 violation
          recovery_window_in_days = 0              # WAF-SEC-060 violation: no recovery window
          # kms_key_id not set                     – WAF-SEC-060 violation (check 2)
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_secretsmanager_secret
    assertions:
      - attribute: 'name'
        op: 'attribute_exists'
        message: 'Secrets Manager secret must have an explicit name attribute.'
      - attribute: 'recovery_window_in_days'
        op: 'greater_than_or_equal'
        message: 'Secrets Manager secret recovery window must be at least 7 days to allow recovery from accidental deletion.'
        expected: 7
    on_fail: violation
  - id: waf-sec-060.tf.aws.secrets-encrypted-with-cmk
    engine: terraform
    automated: true
    title: 'Secrets Manager secrets must be encrypted with a customer-managed KMS key'
    provider: aws
    description: 'All aws_secretsmanager_secret resources must have a kms_key_id attribute referencing a customer-managed KMS key. Using the default AWS-managed key (aws/secretsmanager) is not acceptable for production workloads containing sensitive credentials.'
    expected: 'true'
    remediation: 'Create an aws_kms_key resource with enable_key_rotation = true and reference its ARN via kms_key_id = aws_kms_key.secrets.arn in the aws_secretsmanager_secret resource. Ensure the KMS key policy grants the Secrets Manager service principal permission to use the key for encryption and decryption.\n'
    example:
      compliant: |
        resource "aws_kms_key" "secrets" {
          description         = "CMK for Secrets Manager encryption"
          enable_key_rotation = true
        }
        resource "aws_secretsmanager_secret" "api_key" {
          name       = "prod/app/external-api-key"
          kms_key_id = aws_kms_key.secrets.arn
        }
        
      non_compliant: |
        resource "aws_secretsmanager_secret" "api_key" {
          name = "prod/app/external-api-key"
          # kms_key_id not set – using default aws/secretsmanager key
          # WAF-SEC-060 violation: CMK encryption required for production secrets
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_secretsmanager_secret
    assertions:
      - attribute: 'kms_key_id'
        op: 'attribute_exists'
        message: 'Secrets Manager secret MUST be encrypted with a customer-managed KMS key (kms_key_id must be set).'
    on_fail: violation
