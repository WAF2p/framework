# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-SUS-090
id: WAF-SUS-090
pillar: sustainability
severity: medium
type:
  - governance
  - configuration
description: |
  Organizations subject to CSRD (or voluntarily reporting ESG) MUST have documented processes for collecting, aggregating, and reporting cloud IT emissions as part of Scope 3 GHG inventory. Cloud IT emissions data MUST be exported from cloud provider tools at least quarterly. CSRD-scope organizations MUST map cloud emissions to ESRS E1-6 reporting requirements. Emission reduction targets MUST be documented and tracked against baseline. Where possible, ESG data collection MUST be automated (scheduled exports, API integrations) to ensure data quality and reduce manual reporting burden.
regulatory_mapping:
  - framework: 'EU CSRD (Corporate Sustainability Reporting Directive)'
    controls:
      - 'ESRS E1 – Climate Change'
      - 'ESRS E1-6 – Gross Scope 1, 2, and 3 GHG emissions and total GHG emissions'
      - 'ESRS 2 – General Disclosures: data collection and reporting processes'
  - framework: 'GHG Protocol'
    controls:
      - 'Corporate Standard – Scope 3 Category 11'
      - 'Scope 2 Guidance – market-based and location-based methods'
  - framework: 'SBTi (Science Based Targets initiative)'
    controls:
      - 'ICT Sector Guidance – target setting and tracking'
      - 'Near-term corporate targets – annual progress reporting'
  - framework: 'ISO 14001'
    controls:
      - '9.1 – Monitoring, measurement, analysis and evaluation'
      - '9.3 – Management review – including environmental performance'
checks:
  - id: waf-sus-090.tf.aws.cost-explorer-export-s3
    engine: terraform
    automated: true
    title: 'S3 bucket for Cost Explorer / Carbon Footprint Tool exports must exist with appropriate retention'
    provider: aws
    description: 'An S3 bucket dedicated to receiving automated exports from AWS Cost Explorer (including the Customer Carbon Footprint Tool data) must exist with appropriate lifecycle policies for ESG audit data retention (7 years for CSRD).'
    expected: 'true'
    remediation: 'Create a dedicated S3 bucket for sustainability data exports. Tag it with purpose = "esg-reporting" and configure lifecycle policies for 7-year retention (CSRD requires 7 years for sustainability disclosures). Enable versioning and access logging for audit trail completeness.\n'
    example:
      compliant: |
        resource "aws_s3_bucket" "esg_data" {
          bucket = "acme-esg-carbon-footprint-exports"
          tags = {
            purpose     = "esg-reporting"
            owner       = "sustainability-team"
            environment = "production"
            workload    = "esg-reporting"
          }
        }
        
        resource "aws_s3_bucket_versioning" "esg_data" {
          bucket = aws_s3_bucket.esg_data.id
          versioning_configuration {
            status = "Enabled"
          }
        }
        
        resource "aws_s3_bucket_lifecycle_configuration" "esg_data" {
          bucket = aws_s3_bucket.esg_data.id
          rule {
            id     = "esg-audit-retention"
            status = "Enabled"
            transition {
              days          = 365
              storage_class = "GLACIER"
            }
            expiration {
              days = 2555  # 7 years CSRD retention
            }
          }
        }
        
      non_compliant: |
        resource "aws_s3_bucket" "esg_data" {
          bucket = "esg-exports-bucket"
          # WAF-SUS-090 Warning: no purpose tag, no lifecycle policy, no versioning
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_s3_bucket
    assertions:
      - attribute: 'tags'
        op: 'key_exists'
        key: 'purpose'
        message: "ESG/sustainability S3 buckets should have a 'purpose' tag for audit identification."
    on_fail: warning
  - id: waf-sus-090.tf.aws.budgets-sustainability-alert
    engine: terraform
    automated: true
    title: 'AWS Budgets must include sustainability monitoring (cost as carbon proxy)'
    provider: aws
    description: 'AWS cost budgets serve as a proxy for sustainability monitoring. Carbon emissions are broadly proportional to cost for equivalent workloads. Budget alerts that detect unexpected cost increases also detect unexpected emission increases.'
    expected: 'true'
    remediation: 'Configure at least two budget notifications: at 80% (warning) and 100% (breach) of monthly budget. Add an additional ANOMALY_DETECTION notification type to catch unexpected spending spikes that indicate workload carbon anomalies.\n'
    example:
      compliant: |
        resource "aws_budgets_budget" "sustainability_proxy" {
          name         = "sustainability-carbon-proxy"
          budget_type  = "COST"
          limit_amount = "500"
          limit_unit   = "USD"
          time_unit    = "MONTHLY"
        
          notification {
            comparison_operator        = "GREATER_THAN"
            threshold                  = 80
            threshold_type             = "PERCENTAGE"
            notification_type          = "ACTUAL"
            subscriber_email_addresses = [var.sustainability_team_email]
          }
        
          notification {
            comparison_operator        = "GREATER_THAN"
            threshold                  = 100
            threshold_type             = "PERCENTAGE"
            notification_type          = "FORECASTED"
            subscriber_email_addresses = [var.sustainability_team_email]
          }
        }
        
      non_compliant: |
        resource "aws_budgets_budget" "main" {
          name         = "monthly-budget"
          budget_type  = "COST"
          limit_amount = "1000"
          limit_unit   = "USD"
          time_unit    = "MONTHLY"
          # WAF-SUS-090 Violation: no notifications – cost/carbon overruns not detected
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_budgets_budget
    assertions:
      - attribute: 'notification'
        op: 'not_empty'
        message: 'AWS Budget has no notification configured – cost/carbon anomalies will go undetected.'
    on_fail: violation
  - id: waf-sus-090.tf.azurerm.cost-management-export
    engine: terraform
    automated: true
    title: 'Azure Cost Management export should be configured for sustainability reporting'
    provider: azurerm
    description: 'Azure Cost Management exports enable automated delivery of cost and emissions data to Azure Storage, which can then feed into ESG reporting platforms. At minimum, a monthly actual cost export should be configured for the subscription.'
    expected: 'true'
    remediation: 'Configure azurerm_subscription_cost_management_export with type = "ActualCost", recurrence_type = "Monthly", and export to an Azure Storage account with appropriate retention. Connect to Azure Emissions Impact Dashboard for carbon data.\n'
    example:
      compliant: |
        resource "azurerm_subscription_cost_management_export" "sustainability" {
          name            = "monthly-sustainability-export"
          subscription_id = var.subscription_id
          active          = true
        
          recurrence_type    = "Monthly"
          recurrence_period_start_date = "2024-01-01T00:00:00Z"
          recurrence_period_end_date   = "2030-12-31T00:00:00Z"
        
          export_data_storage_location {
            container_id     = azurerm_storage_container.esg_exports.resource_manager_id
            root_folder_path = "/carbon-footprint"
          }
        
          export_data_options {
            type       = "ActualCost"
            time_frame = "TheLastMonth"
          }
        }
        
      non_compliant: |
        # No Azure Cost Management export configured – WAF-SUS-090 Violation
        # ESG data collection requires automated export configuration
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_cost_management_export_resource_group_cost
        - azurerm_subscription_cost_management_export
    assertions:
      - attribute: 'active'
        op: 'is_true'
        message: 'Azure Cost Management export is not active – ESG data collection interrupted.'
    on_fail: violation
