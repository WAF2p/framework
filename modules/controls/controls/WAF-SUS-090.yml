id: WAF-SUS-090
title: Organizations subject to CSRD (or voluntarily reporting ESG) MUST have...
status: active
tags:
- sustainability
- medium
- governance
- configuration
pillar: sustainability
severity: medium
type:
- governance
- configuration
category: agentic-governance
rationale: Ungouvernierte Agenten treffen unreviewte Entscheidungen, verarbeiten sensible Daten ungeschützt und hinterlassen
  keine nachvollziehbare Audit-Spur. Dieses Control adressiert die Anforderungen des Bereichs 'Agentic-Governance' und stellt
  sicher, dass Organizations subject to CSRD (or voluntarily reporting ESG) MUST have documented processes for collecting,
  aggregating, and reporting cloud IT emissions as.
threat:
- Missing sustainability reporting prevents ESG transparency and regulatory compliance.
- Incomplete carbon data complicates defining and monitoring reduction targets.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - Die Anforderung ist nicht einheitlich umgesetzt; Nachweis existiert nur punktuell oder fehlt.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - Eine dokumentierte Policy oder ein Standard beschreibt die Anforderung.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform-Checks oder IaC-Gates prüfen die Anforderung automatisch in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Abdeckung, Ausnahmen und Qualitätsmetriken werden quartalsweise berichtet.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Die Effektivität wird kontinuierlich gemessen und automatisch optimiert.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-sustainability/pages/controls/WAF-SUS-090.adoc
  related_controls:
  - WAF-AGN-020
  - WAF-SUS-040
  - WAF-REL-010
  - WAF-SEC-010
  - WAF-SEC-020
  - WAF-SEC-060
  - WAF-SOV-020
  - WAF-SOV-060
  - WAF-AGN-010
  - WAF-AGN-040
  - WAF-AGN-050
  - WAF-AGN-080
description: 'Organizations subject to CSRD (or voluntarily reporting ESG) MUST have documented processes for collecting,
  aggregating, and reporting cloud IT emissions as part of Scope 3 GHG inventory. Cloud IT emissions data MUST be exported
  from cloud provider tools at least quarterly. CSRD-scope organizations MUST map cloud emissions to ESRS E1-6 reporting requirements.
  Emission reduction targets MUST be documented and tracked against baseline. Where possible, ESG data collection MUST be
  automated (scheduled exports, API integrations) to ensure data quality and reduce manual reporting burden.

  '
regulatory_mapping:
- framework: EU CSRD (Corporate Sustainability Reporting Directive)
  controls:
  - ESRS E1 – Climate Change
  - ESRS E1-6 – Gross Scope 1, 2, and 3 GHG emissions and total GHG emissions
  - 'ESRS 2 – General Disclosures: data collection and reporting processes'
- framework: GHG Protocol
  controls:
  - Corporate Standard – Scope 3 Category 11
  - Scope 2 Guidance – market-based and location-based methods
- framework: SBTi (Science Based Targets initiative)
  controls:
  - ICT Sector Guidance – target setting and tracking
  - Near-term corporate targets – annual progress reporting
- framework: ISO 14001
  controls:
  - 9.1 – Monitoring, measurement, analysis and evaluation
  - 9.3 – Management review – including environmental performance
checks:
- id: waf-sus-090.tf.aws.cost-explorer-export-s3
  engine: terraform
  automated: true
  title: S3 bucket for Cost Explorer / Carbon Footprint Tool exports must exist with appropriate retention
  provider: aws
  description: An S3 bucket dedicated to receiving automated exports from AWS Cost Explorer (including the Customer Carbon
    Footprint Tool data) must exist with appropriate lifecycle policies for ESG audit data retention (7 years for CSRD).
  expected: 'true'
  remediation: Create a dedicated S3 bucket for sustainability data exports. Tag it with purpose = "esg-reporting" and configure
    lifecycle policies for 7-year retention (CSRD requires 7 years for sustainability disclosures). Enable versioning and
    access logging for audit trail completeness.\n
  example:
    compliant: "resource \"aws_s3_bucket\" \"esg_data\" {\n  bucket = \"acme-esg-carbon-footprint-exports\"\n  tags = {\n\
      \    purpose     = \"esg-reporting\"\n    owner       = \"sustainability-team\"\n    environment = \"production\"\n\
      \    workload    = \"esg-reporting\"\n  }\n}\n\nresource \"aws_s3_bucket_versioning\" \"esg_data\" {\n  bucket = aws_s3_bucket.esg_data.id\n\
      \  versioning_configuration {\n    status = \"Enabled\"\n  }\n}\n\nresource \"aws_s3_bucket_lifecycle_configuration\"\
      \ \"esg_data\" {\n  bucket = aws_s3_bucket.esg_data.id\n  rule {\n    id     = \"esg-audit-retention\"\n    status =\
      \ \"Enabled\"\n    transition {\n      days          = 365\n      storage_class = \"GLACIER\"\n    }\n    expiration\
      \ {\n      days = 2555  # 7 years CSRD retention\n    }\n  }\n}\n"
    non_compliant: "resource \"aws_s3_bucket\" \"esg_data\" {\n  bucket = \"esg-exports-bucket\"\n  # WAF-SUS-090 Warning:\
      \ no purpose tag, no lifecycle policy, no versioning\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_s3_bucket
  assertions:
  - attribute: tags
    op: key_exists
    key: purpose
    message: ESG/sustainability S3 buckets should have a 'purpose' tag for audit identification.
  on_fail: advisory
- id: waf-sus-090.tf.aws.budgets-sustainability-alert
  engine: terraform
  automated: true
  title: AWS Budgets must include sustainability monitoring (cost as carbon proxy)
  provider: aws
  description: AWS cost budgets serve as a proxy for sustainability monitoring. Carbon emissions are broadly proportional
    to cost for equivalent workloads. Budget alerts that detect unexpected cost increases also detect unexpected emission
    increases.
  expected: 'true'
  remediation: 'Configure at least two budget notifications: at 80% (warning) and 100% (breach) of monthly budget. Add an
    additional ANOMALY_DETECTION notification type to catch unexpected spending spikes that indicate workload carbon anomalies.\n'
  example:
    compliant: "resource \"aws_budgets_budget\" \"sustainability_proxy\" {\n  name         = \"sustainability-carbon-proxy\"\
      \n  budget_type  = \"COST\"\n  limit_amount = \"500\"\n  limit_unit   = \"USD\"\n  time_unit    = \"MONTHLY\"\n\n  notification\
      \ {\n    comparison_operator        = \"GREATER_THAN\"\n    threshold                  = 80\n    threshold_type    \
      \         = \"PERCENTAGE\"\n    notification_type          = \"ACTUAL\"\n    subscriber_email_addresses = [var.sustainability_team_email]\n\
      \  }\n\n  notification {\n    comparison_operator        = \"GREATER_THAN\"\n    threshold                  = 100\n\
      \    threshold_type             = \"PERCENTAGE\"\n    notification_type          = \"FORECASTED\"\n    subscriber_email_addresses\
      \ = [var.sustainability_team_email]\n  }\n}\n"
    non_compliant: "resource \"aws_budgets_budget\" \"main\" {\n  name         = \"monthly-budget\"\n  budget_type  = \"COST\"\
      \n  limit_amount = \"1000\"\n  limit_unit   = \"USD\"\n  time_unit    = \"MONTHLY\"\n  # WAF-SUS-090 Violation: no notifications\
      \ – cost/carbon overruns not detected\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_budgets_budget
  assertions:
  - attribute: notification
    op: not_empty
    message: AWS Budget has no notification configured – cost/carbon anomalies will go undetected.
  on_fail: violation
- id: waf-sus-090.tf.azurerm.cost-management-export
  engine: terraform
  automated: true
  title: Azure Cost Management export should be configured for sustainability reporting
  provider: azurerm
  description: Azure Cost Management exports enable automated delivery of cost and emissions data to Azure Storage, which
    can then feed into ESG reporting platforms. At minimum, a monthly actual cost export should be configured for the subscription.
  expected: 'true'
  remediation: Configure azurerm_subscription_cost_management_export with type = "ActualCost", recurrence_type = "Monthly",
    and export to an Azure Storage account with appropriate retention. Connect to Azure Emissions Impact Dashboard for carbon
    data.\n
  example:
    compliant: "resource \"azurerm_subscription_cost_management_export\" \"sustainability\" {\n  name            = \"monthly-sustainability-export\"\
      \n  subscription_id = var.subscription_id\n  active          = true\n\n  recurrence_type    = \"Monthly\"\n  recurrence_period_start_date\
      \ = \"2024-01-01T00:00:00Z\"\n  recurrence_period_end_date   = \"2030-12-31T00:00:00Z\"\n\n  export_data_storage_location\
      \ {\n    container_id     = azurerm_storage_container.esg_exports.resource_manager_id\n    root_folder_path = \"/carbon-footprint\"\
      \n  }\n\n  export_data_options {\n    type       = \"ActualCost\"\n    time_frame = \"TheLastMonth\"\n  }\n}\n"
    non_compliant: '# No Azure Cost Management export configured – WAF-SUS-090 Violation

      # ESG data collection requires automated export configuration

      '
  scope:
    block_type: resource
    resource_types:
    - azurerm_cost_management_export_resource_group_cost
    - azurerm_subscription_cost_management_export
  assertions:
  - attribute: active
    op: is_true
    message: Azure Cost Management export is not active – ESG data collection interrupted.
  on_fail: violation
- id: waf-sus-090.tf.google.bigquery-billing-export
  engine: terraform
  automated: true
  title: GCP BigQuery dataset must be configured for billing/ESG export
  provider: google
  description: GCP projects must export detailed billing data to a BigQuery dataset so cost and carbon data can be queried
    for CSRD/ESG reporting. The dataset must be labeled for ESG use.
  expected: 'true'
  remediation: 'Create a BigQuery dataset named or labeled for billing/ESG export and enable billing export in the GCP console.

    '
  example:
    compliant: "resource \"google_bigquery_dataset\" \"esg_billing\" {\n  dataset_id = \"esg_billing_export\"\n  location\
      \   = \"EU\"\n  labels = {\n    purpose     = \"esg-reporting\"\n    environment = \"production\"\n  }\n}\n"
    non_compliant: "resource \"google_bigquery_dataset\" \"other\" {\n  dataset_id = \"other\"\n  location   = \"US\"\n  #\
      \ Not labeled for ESG/billing export\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_bigquery_dataset
  assertions:
  - attribute: labels
    op: key_exists
    key: purpose
    message: BigQuery dataset for ESG export must be labeled with purpose.
  - attribute: labels.purpose
    op: matches
    pattern: esg|billing|sustainability|carbon
    message: BigQuery dataset purpose label should indicate ESG/sustainability/billing use.
  on_fail: violation
