id: WAF-SEC-160
title: Security-relevant logs MUST be centrally collected and protected against tampering
status: active
tags:
- configuration
- governance
- high
- security
pillar: security
severity: high
type:
- governance
- configuration
category: logging-monitoring
rationale: Lokale oder manipulierbare Logs verhindern forensische Analysen und erschweren regulatorische Nachweise erheblich.
  Dieses Control adressiert die Anforderungen des Bereichs 'Logging Monitoring' und stellt sicher, dass All authentication,
  authorization, data access, and administrative activity logs MUST be forwarded t...
threat:
- Locally stored logs can be deleted or modified by attackers to hide evidence of compromise.
- Missing centralized log correlation prevents timely detection of multi-stage attacks.
implementation_guidance:
- Document the requirement in a version-controlled policy, ADR, or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - Die Anforderung ist nicht einheitlich umgesetzt; Nachweis existiert nur punktuell oder fehlt.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - Eine dokumentierte Policy oder ein Standard beschreibt die Anforderung.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform-Checks oder IaC-Gates prüfen die Anforderung automatisch in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Abdeckung, Ausnahmen und Qualitätsmetriken werden quartalsweise berichtet.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Die Effektivität wird kontinuierlich gemessen und automatisch optimiert.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-security/pages/controls/WAF-SEC-160.adoc
  related_controls:
  - WAF-SEC-080
  - WAF-SEC-090
  - WAF-SEC-100
  - WAF-OPS-050
  - WAF-SUS-110
  - WAF-SOV-110
description: All authentication, authorization, data access, and administrative activity logs MUST be forwarded to a central
  SIEM or log platform. Log integrity MUST be ensured by write-once storage, cryptographic hashing, or immutable retention.
  Forwarding MUST be configured so that logs cannot be disabled or altered at the source without triggering an alert. Retention
  periods MUST meet compliance and forensic requirements.
regulatory_mapping:
- framework: ISO 27001:2022
  controls:
  - A.8.15 – Logging
  - A.8.16 – Monitoring activities
- framework: CIS Controls v8
  controls:
  - CIS 8 – Audit Log Management
- framework: PCI DSS v4.0
  controls:
  - Req 10 – Log and monitor access to network resources and cardholder data
- framework: SOC 2 Type II
  controls:
  - CC7.2 – System monitoring
  - CC4.1 – Monitoring activities
- framework: GDPR
  controls:
  - Art. 32 – Security of processing
  - Art. 33 – Personal data breach notification
- framework: NIS2
  controls:
  - Art. 21(2)(f) – Incident handling
- framework: DORA
  controls:
  - Art. 12 – ICT-related incident reporting
- framework: EUCS (ENISA)
  controls:
  - MON-01 – Logging and monitoring
- framework: BSI C5:2020
  controls:
  - OPS-05 – Logging and monitoring
- framework: NIST SP 800-53
  controls:
  - AU-6 – Audit Review
  - AU-9 – Protection of Audit Information
checks:
- id: waf-sec-160.tf.aws.cloudwatch-logs-retention
  engine: terraform
  provider: aws
  automated: true
  title: Security-relevant CloudWatch log groups must have explicit retention
  description: Security-relevant CloudWatch log groups must have explicit retention
  expected: 'true'
  remediation: Security-relevant CloudWatch log groups must have explicit retention
  scope:
    block_type: resource
    resource_types:
    - aws_cloudwatch_log_group
  assertions:
  - attribute: retention_in_days
    op: greater_than_or_equal
    expected: 365
    message: Security log group retention must be at least 365 days.
  on_fail: violation
- id: waf-sec-160.tf.aws.s3-log-integrity
  engine: terraform
  provider: aws
  automated: true
  title: Central log S3 buckets must have versioning or object lock enabled
  description: Central log S3 buckets must have versioning or object lock enabled
  expected: 'true'
  remediation: Central log S3 buckets must have versioning or object lock enabled
  scope:
    block_type: resource
    resource_types:
    - aws_s3_bucket
    - aws_s3_bucket_versioning
    - aws_s3_bucket_object_lock_configuration
  assertions:
  - attribute: versioning.status
    op: equals
    expected: Enabled
    message: Central log bucket must have versioning enabled.
  on_fail: finding
- id: waf-sec-160.tf.azurerm.log-analytics-sku
  engine: terraform
  provider: azurerm
  automated: true
  title: Azure Log Analytics workspace for security logs must define retention
  description: Azure Log Analytics workspace for security logs must define retention
  expected: 'true'
  remediation: Azure Log Analytics workspace for security logs must define retention
  scope:
    block_type: resource
    resource_types:
    - azurerm_log_analytics_workspace
  assertions:
  - attribute: retention_in_days
    op: greater_than_or_equal
    expected: 365
    message: Security log retention must be at least 365 days.
  on_fail: violation
