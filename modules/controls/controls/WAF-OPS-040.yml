description: 'All production alerting MUST be based on user-visible symptoms (elevated error rates, latency exceeding SLO
  thresholds, availability degradation) rather than internal causes (CPU usage, memory consumption, disk I/O). Every alert
  that pages an on-call engineer MUST be actionable and MUST have a linked runbook. Alert fatigue through non-actionable alerts
  MUST be actively managed and reduced.

  '
regulatory_mapping:
- framework: ISO/IEC 20000-1
  controls:
  - Incident management
  - Monitoring, measurement, analysis, and evaluation
- framework: ITIL 4
  controls:
  - Monitoring and event management
  - Incident management
- framework: SRE Book (Google)
  controls:
  - 'Chapter 6: Monitoring Distributed Systems – Four Golden Signals'
  - 'Chapter 5: Eliminating Toil'
checks:
- id: waf-ops-040.tf.aws.cloudwatch-alarm-symptom-based
  engine: terraform
  automated: true
  title: CloudWatch alarms must use symptom-based metrics
  provider: aws
  description: CloudWatch alarms MUST use application-level symptom metrics (error rates, latency, request counts) rather
    than exclusively infrastructure metrics. Alarms MUST include alarm_description with actionable information.
  expected: 'true'
  remediation: Add alarm_description with symptom description and runbook link. Ensure alarm_actions routes to an SNS topic
    connected to on-call alerting.\n
  example:
    compliant: "resource \"aws_cloudwatch_metric_alarm\" \"high_error_rate\" {\n  alarm_name          = \"payment-service-high-error-rate\"\
      \n  comparison_operator = \"GreaterThanThreshold\"\n  evaluation_periods  = 2\n  metric_name         = \"5XXError\"\n\
      \  namespace           = \"AWS/ApplicationELB\"\n  period              = 60\n  statistic           = \"Sum\"\n  threshold\
      \           = 10\n  alarm_description   = \"Payment service 5XX error rate > 10/min. Runbook: https://wiki/runbooks/payment-errors\"\
      \n  alarm_actions       = [aws_sns_topic.pagerduty.arn]\n  dimensions = {\n    LoadBalancer = aws_lb.main.arn_suffix\n\
      \  }\n}\n"
    non_compliant: "resource \"aws_cloudwatch_metric_alarm\" \"high_cpu\" {\n  alarm_name          = \"high-cpu\"\n  comparison_operator\
      \ = \"GreaterThanThreshold\"\n  evaluation_periods  = 1\n  metric_name         = \"CPUUtilization\"\n  namespace   \
      \        = \"AWS/EC2\"\n  period              = 300\n  statistic           = \"Average\"\n  threshold           = 80\n\
      \  # No alarm_description, no runbook link – WAF-OPS-040 Violation\n  # Cause-based metric, not symptom-based\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_cloudwatch_metric_alarm
  assertions:
  - attribute: alarm_description
    op: not_empty
    message: CloudWatch alarm must have a non-empty alarm_description explaining the symptom and action.
  - attribute: alarm_actions
    op: not_empty
    message: CloudWatch alarm must have at least one alarm_action (SNS topic, Auto Scaling, etc.).
  on_fail: violation
- id: waf-ops-040.tf.azurerm.monitor-alert-symptom
  engine: terraform
  automated: true
  title: Azure Monitor metric alerts must include symptom description and action group
  provider: azurerm
  description: Azure Monitor metric alerts for production workloads MUST include a descriptive name indicating the symptom
    and MUST reference an action group for notification.
  expected: 'true'
  remediation: Add a description field explaining the user-visible symptom and runbook location. Reference an azurerm_monitor_action_group
    in the action block.\n
  example:
    compliant: "resource \"azurerm_monitor_metric_alert\" \"error_rate\" {\n  name                = \"payment-service-error-rate-high\"\
      \n  resource_group_name = azurerm_resource_group.main.name\n  scopes              = [azurerm_application_insights.main.id]\n\
      \  description         = \"Payment service error rate > 1%. Runbook: https://wiki/runbooks/payment-errors\"\n\n  criteria\
      \ {\n    metric_namespace = \"Microsoft.Insights/Components\"\n    metric_name      = \"requests/failed\"\n    aggregation\
      \      = \"Count\"\n    operator         = \"GreaterThan\"\n    threshold        = 10\n  }\n\n  action {\n    action_group_id\
      \ = azurerm_monitor_action_group.oncall.id\n  }\n}\n"
    non_compliant: "resource \"azurerm_monitor_metric_alert\" \"cpu_alert\" {\n  name                = \"cpu-high\"\n  resource_group_name\
      \ = azurerm_resource_group.main.name\n  scopes              = [azurerm_virtual_machine.app.id]\n  # No description,\
      \ no action group – WAF-OPS-040 Violation\n  criteria {\n    metric_namespace = \"Microsoft.Compute/virtualMachines\"\
      \n    metric_name      = \"Percentage CPU\"\n    aggregation      = \"Average\"\n    operator         = \"GreaterThan\"\
      \n    threshold        = 80\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_monitor_metric_alert
  assertions:
  - attribute: description
    op: not_empty
    message: Azure Monitor alert must have a description explaining the symptom.
  - attribute: action
    op: attribute_exists
    message: Azure Monitor alert must reference at least one action group.
  on_fail: violation
- id: waf-ops-040.tf.google.monitoring-alert-symptom
  engine: terraform
  automated: true
  title: GCP Monitoring alert policies must use symptom-based conditions
  provider: google
  description: GCP Monitoring alert policies MUST include a user_labels field identifying the service and symptom type, and
    MUST have notification channels configured.
  expected: 'true'
  remediation: 'Add notification_channels referencing PagerDuty, Slack, or email channels. Name the alert with the service
    and symptom (e.g., ''payment-service-high-latency'').

    '
  example:
    compliant: "resource \"google_monitoring_alert_policy\" \"latency_alert\" {\n  display_name = \"payment-service-latency-p99-high\"\
      \n  combiner     = \"OR\"\n\n  conditions {\n    display_name = \"p99 latency > 500ms\"\n    condition_threshold {\n\
      \      filter          = \"metric.type=\\\"custom.googleapis.com/payment/latency_p99\\\"\"\n      comparison      =\
      \ \"COMPARISON_GT\"\n      threshold_value = 500\n      duration        = \"60s\"\n    }\n  }\n\n  notification_channels\
      \ = [google_monitoring_notification_channel.pagerduty.name]\n\n  documentation {\n    content = \"Payment service p99\
      \ latency exceeded 500ms. Runbook: https://wiki/runbooks/payment-latency\"\n  }\n}\n"
    non_compliant: "resource \"google_monitoring_alert_policy\" \"cpu_alert\" {\n  display_name = \"high-cpu\"\n  combiner\
      \     = \"OR\"\n  conditions {\n    display_name = \"CPU > 80%\"\n    condition_threshold {\n      filter     = \"metric.type=\\\
      \"compute.googleapis.com/instance/cpu/utilization\\\"\"\n      comparison = \"COMPARISON_GT\"\n      threshold_value\
      \ = 0.8\n    }\n  }\n  # No notification channels – WAF-OPS-040 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_monitoring_alert_policy
  assertions:
  - attribute: display_name
    op: not_empty
    message: Alert policy must have a descriptive display_name.
  - attribute: notification_channels
    op: not_empty
    message: Alert policy must have at least one notification channel.
  on_fail: violation
- id: waf-ops-040.tf.stackit.observability-dashboard
  engine: terraform
  automated: true
  title: All production alerting for stackit
  provider: stackit
  description: All production alerting must be documented in IaC via a observability-dashboard tag/label on stackit_project.
    This validates the control is tracked as code.
  expected: 'true'
  remediation: 'Add a observability-dashboard tag/label to the stackit_project resource to show the stackit implementation
    of WAF-OPS-040 is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    observability-dashboard = \"true\"\n  }\n\
      }\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing observability-dashboard labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: observability-dashboard
    message: stackit_project is missing the observability-dashboard tag/label.
  on_fail: violation
