- id: waf-ops-100.tf.azurerm.automation-runbook
  engine: terraform
  automated: true
  title: Azure Automation runbook must exist for repetitive operational tasks
  provider: azurerm
  description: Repetitive operational tasks (VM patching, certificate rotation, cleanup jobs) MUST be automated using Azure
    Automation runbooks to reduce toil.
  expected: 'true'
  remediation: Create an azurerm_automation_runbook resource with PowerShell or Python runbook_type and linked to an existing
    azurerm_automation_account for operational procedures that currently require manual intervention.
  example:
    compliant: "resource \"azurerm_automation_account\" \"ops\" {\n  name                = \"ops-automation\"\n  location\
      \            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n  sku_name\
      \            = \"Basic\"\n}\n\nresource \"azurerm_automation_runbook\" \"rotate_certs\" {\n  name                  \
      \  = \"RotateKeyVaultCertificates\"\n  location                = azurerm_resource_group.main.location\n  resource_group_name\
      \     = azurerm_resource_group.main.name\n  automation_account_name = azurerm_automation_account.ops.name\n  runbook_type\
      \            = \"PowerShell\"\n  log_verbose             = true\n  log_progress            = true\n}\n"
    non_compliant: "resource \"azurerm_automation_runbook\" \"rotate_certs\" {\n  name        = \"RotateKeyVaultCertificates\"\
      \n  # Missing automation_account_name and runbook_type\n  # WAF-OPS-100 Violation: operational process not automated\n\
      }\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_automation_runbook
  assertions:
  - attribute: runbook_type
    op: not_empty
    message: Azure Automation runbook must define a runbook_type.
  - attribute: automation_account_name
    op: not_empty
    message: Azure Automation runbook must be linked to an automation account.
  on_fail: violation
- id: waf-ops-100.tf.google.scheduler-ops-review
  engine: terraform
  automated: true
  title: Cloud Scheduler job must trigger quarterly operational debt review reminders
  provider: google
  description: A GCP Cloud Scheduler job MUST be configured to send quarterly operational debt review reminders to the team's
    notification channel.
  expected: 'true'
  remediation: Create a google_cloud_scheduler_job with a cron schedule for quarterly reviews and target it to a Pub/Sub topic
    or HTTP endpoint for notifications.
  example:
    compliant: "resource \"google_cloud_scheduler_job\" \"ops_review_reminder\" {\n  name             = \"quarterly-ops-debt-review\"\
      \n  description      = \"Quarterly reminder to review and update Operational Debt Register\"\n  schedule         = \"\
      0 9 1 1,4,7,10 *\"\n  time_zone        = \"Europe/Berlin\"\n  pubsub_target {\n    topic_name = google_pubsub_topic.team_notifications.id\n\
      \    data       = base64encode(\"Quarterly Operational Debt Register review due\")\n  }\n}\n"
    non_compliant: '# No Cloud Scheduler job configured

      # WAF-OPS-100 Violation: no automated review cadence enforcement

      '
  scope:
    block_type: resource
    resource_types:
    - google_cloud_scheduler_job
  assertions:
  - attribute: schedule
    op: attribute_exists
    message: Cloud Scheduler job must define a schedule for periodic review reminders.
  on_fail: violation
