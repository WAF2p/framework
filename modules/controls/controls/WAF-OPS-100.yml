id: WAF-OPS-100
title: All known operational debt – manual processes, undocumented workarounds,...
status: active
tags:
- operational
- medium
- governance
- configuration
pillar: excellence
severity: medium
type:
- governance
- configuration
category: data-governance
rationale: Fehlende Datenklassifizierung, -eigentümerschaft und Lifecycle-Steuerung erhöhen Compliance-Risiken, Kosten und
  die Wahrscheinlichkeit von Datenverlusten. Dieses Control adressiert die Anforderungen des Bereichs 'Daten-Governance' und
  stellt sicher, dass All known operational debt – manual processes, undocumented workarounds, toil-generating tasks, outdated
  runbooks, siloed knowledge – MUST be tracked in a.
threat:
- Undocumented manual processes accumulate operational debt and knowledge-risk.
- Unprioritized operational debt blocks planned automation and scaling.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - Die Anforderung ist nicht einheitlich umgesetzt; Nachweis existiert nur punktuell oder fehlt.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - Eine dokumentierte Policy oder ein Standard beschreibt die Anforderung.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform-Checks oder IaC-Gates prüfen die Anforderung automatisch in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Abdeckung, Ausnahmen und Qualitätsmetriken werden quartalsweise berichtet.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Die Effektivität wird kontinuierlich gemessen und automatisch optimiert.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-excellence/pages/controls/WAF-OPS-100.adoc
  related_controls:
  - WAF-OPS-070
  - WAF-OPS-020
  - WAF-COST-010
  - WAF-REL-050
  - WAF-SUS-010
  - WAF-OPS-090
  - WAF-COST-080
  - WAF-SUS-030
  - WAF-OPS-040
  - WAF-OPS-030
  - WAF-REL-010
  - WAF-REL-040
description: 'All known operational debt – manual processes, undocumented workarounds, toil-generating tasks, outdated runbooks,
  siloed knowledge – MUST be tracked in a version-controlled Operational Debt Register. The register MUST be reviewed quarterly
  with explicit prioritization and paydown allocation. Operational debt items MUST have severity classification, estimated
  toil hours, owner, and target resolution date.

  '
regulatory_mapping:
- framework: ISO/IEC 20000-1
  controls:
  - Continual improvement
  - Risk management
- framework: ITIL 4
  controls:
  - Continual improvement
  - Problem management
- framework: SRE Book (Google)
  controls:
  - 'Chapter 5: Eliminating Toil'
checks:
- id: waf-ops-100.tf.aws.eventbridge-ops-review-schedule
  engine: terraform
  automated: true
  title: EventBridge scheduled rule must exist for automated operational review reminders
  provider: aws
  description: An AWS EventBridge (CloudWatch Events) scheduled rule MUST be configured to send quarterly operational debt
    review reminders to the team's notification channel.
  expected: 'true'
  remediation: Create an aws_cloudwatch_event_rule with a cron schedule_expression for quarterly reviews and target it to
    an SNS topic or Lambda for notifications.\n
  example:
    compliant: "resource \"aws_cloudwatch_event_rule\" \"ops_review_reminder\" {\n  name                = \"quarterly-ops-debt-review\"\
      \n  description         = \"Quarterly reminder to review and update Operational Debt Register\"\n  schedule_expression\
      \ = \"cron(0 9 1 1,4,7,10 ? *)\"\n  is_enabled          = true\n}\n\nresource \"aws_cloudwatch_event_target\" \"ops_review_sns\"\
      \ {\n  rule      = aws_cloudwatch_event_rule.ops_review_reminder.name\n  target_id = \"OpsReviewNotification\"\n  arn\
      \       = aws_sns_topic.team_notifications.arn\n  input = jsonencode({\n    message = \"Quarterly Operational Debt Register\
      \ review due. Runbook: https://wiki/ops-debt-review\"\n  })\n}\n"
    non_compliant: '# No scheduled operational review reminder configured

      # WAF-OPS-100 Violation: no automated review cadence enforcement

      '
  scope:
    block_type: resource
    resource_types:
    - aws_cloudwatch_event_rule
  assertions:
  - attribute: schedule_expression
    op: attribute_exists
    message: CloudWatch Event rule must define a schedule_expression for periodic review.
  on_fail: violation
- id: waf-ops-100.tf.aws.ssm-automation-runbook
  engine: terraform
  automated: true
  title: AWS SSM automation documents must exist for repetitive operational tasks
  provider: aws
  description: Repetitive operational tasks (AMI patching, instance rotation, configuration updates) MUST be automated using
    AWS Systems Manager automation documents to reduce toil.
  expected: 'true'
  remediation: Create aws_ssm_document resources with Automation document type to automate repetitive operational procedures
    that currently require manual intervention.\n
  example:
    compliant: "resource \"aws_ssm_document\" \"rotate_instances\" {\n  name            = \"RotateASGInstances\"\n  document_type\
      \   = \"Automation\"\n  document_format = \"YAML\"\n\n  content = <<-DOC\n    description: Rotate all instances in an\
      \ Auto Scaling Group\n    schemaVersion: \"0.3\"\n    parameters:\n      AutoScalingGroupName:\n        type: String\n\
      \        description: Name of the Auto Scaling Group to rotate\n    mainSteps:\n      - name: TerminateInstances\n \
      \       action: aws:executeScript\n        inputs:\n          Runtime: python3.11\n          Handler: rotate_instances\n\
      \  DOC\n}\n"
    non_compliant: '# No SSM automation documents defined

      # Instance rotation performed manually via console

      # WAF-OPS-100 Violation: manual process not automated

      '
  scope:
    block_type: resource
    resource_types:
    - aws_ssm_document
  assertions:
  - attribute: document_type
    op: not_empty
    message: SSM document must define a document_type.
  - attribute: content
    op: not_empty
    message: SSM document must have content defining automation steps.
  on_fail: violation
