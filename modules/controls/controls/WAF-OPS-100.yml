# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-OPS-100
id: WAF-OPS-100
pillar: operational
severity: medium
type:
  - governance
  - configuration
description: |
  All known operational debt – manual processes, undocumented workarounds, toil-generating tasks, outdated runbooks, siloed knowledge – MUST be tracked in a version-controlled Operational Debt Register. The register MUST be reviewed quarterly with explicit prioritization and paydown allocation. Operational debt items MUST have severity classification, estimated toil hours, owner, and target resolution date.
regulatory_mapping:
  - framework: 'ISO/IEC 20000-1'
    controls:
      - 'Continual improvement'
      - 'Risk management'
  - framework: 'ITIL 4'
    controls:
      - 'Continual improvement'
      - 'Problem management'
  - framework: 'Google SRE Book'
    controls:
      - 'Chapter 5: Eliminating Toil'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'Operational Excellence Pillar – OPS 10: How do you use findings to take action?'
checks:
  - id: waf-ops-100.tf.aws.eventbridge-ops-review-schedule
    engine: terraform
    automated: true
    title: 'EventBridge scheduled rule must exist for automated operational review reminders'
    provider: aws
    description: "An AWS EventBridge (CloudWatch Events) scheduled rule MUST be configured to send quarterly operational debt review reminders to the team's notification channel."
    expected: 'true'
    remediation: 'Create an aws_cloudwatch_event_rule with a cron schedule_expression for quarterly reviews and target it to an SNS topic or Lambda for notifications.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_event_rule" "ops_review_reminder" {
          name                = "quarterly-ops-debt-review"
          description         = "Quarterly reminder to review and update Operational Debt Register"
          schedule_expression = "cron(0 9 1 1,4,7,10 ? *)"
          is_enabled          = true
        }
        
        resource "aws_cloudwatch_event_target" "ops_review_sns" {
          rule      = aws_cloudwatch_event_rule.ops_review_reminder.name
          target_id = "OpsReviewNotification"
          arn       = aws_sns_topic.team_notifications.arn
          input = jsonencode({
            message = "Quarterly Operational Debt Register review due. Runbook: https://wiki/ops-debt-review"
          })
        }
        
      non_compliant: |
        # No scheduled operational review reminder configured
        # WAF-OPS-100 Violation: no automated review cadence enforcement
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_event_rule
    assertions:
      - attribute: 'schedule_expression'
        op: 'attribute_exists'
        message: 'CloudWatch Event rule must define a schedule_expression for periodic review.'
    on_fail: violation
  - id: waf-ops-100.tf.aws.ssm-automation-runbook
    engine: terraform
    automated: true
    title: 'AWS SSM automation documents must exist for repetitive operational tasks'
    provider: aws
    description: 'Repetitive operational tasks (AMI patching, instance rotation, configuration updates) MUST be automated using AWS Systems Manager automation documents to reduce toil.'
    expected: 'true'
    remediation: 'Create aws_ssm_document resources with Automation document type to automate repetitive operational procedures that currently require manual intervention.\n'
    example:
      compliant: |
        resource "aws_ssm_document" "rotate_instances" {
          name            = "RotateASGInstances"
          document_type   = "Automation"
          document_format = "YAML"
        
          content = <<-DOC
            description: Rotate all instances in an Auto Scaling Group
            schemaVersion: "0.3"
            parameters:
              AutoScalingGroupName:
                type: String
                description: Name of the Auto Scaling Group to rotate
            mainSteps:
              - name: TerminateInstances
                action: aws:executeScript
                inputs:
                  Runtime: python3.11
                  Handler: rotate_instances
          DOC
        }
        
      non_compliant: |
        # No SSM automation documents defined
        # Instance rotation performed manually via console
        # WAF-OPS-100 Violation: manual process not automated
        
    scope:
      block_type: resource
      resource_types:
        - aws_ssm_document
    assertions:
      - attribute: 'document_type'
        op: 'not_empty'
        message: 'SSM document must define a document_type.'
      - attribute: 'content'
        op: 'not_empty'
        message: 'SSM document must have content defining automation steps.'
    on_fail: violation
