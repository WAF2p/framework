id: WAF-REL-100
title: All known reliability risks, deferred reliability improvements, and...
status: active
tags:
- reliability
- medium
- governance
pillar: reliability
severity: medium
type:
- governance
category: reliability-design
rationale: Mangelhafte Ausfallsicherheit und Planung führen zu Serviceunterbrechungen, Datenverlust und Vertrauensverlust
  bei Kunden und Stakeholdern. Dieses Control adressiert die Anforderungen des Bereichs 'Zuverlässigkeitsdesign' und stellt
  sicher, dass All known reliability risks, deferred reliability improvements, and technical decisions that reduce system
  resilience MUST be tracked in a version-controlled.
threat:
- Service outages impact users and revenue when redundancy is missing.
- Recovery from failures is slower without tested runbooks or automated rollback.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - Die Anforderung ist nicht einheitlich umgesetzt; Nachweis existiert nur punktuell oder fehlt.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - Eine dokumentierte Policy oder ein Standard beschreibt die Anforderung.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Die Umsetzung wird regelmäßig überprüft und in Reviews nachgewiesen.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Abdeckung, Ausnahmen und Qualitätsmetriken werden quartalsweise berichtet.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Die Effektivität wird kontinuierlich gemessen und automatisch optimiert.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-reliability/pages/controls/WAF-REL-100.adoc
  related_controls:
  - WAF-REL-080
  - WAF-REL-070
  - WAF-REL-060
  - WAF-REL-090
  - WAF-AGN-100
  - WAF-REL-010
  - WAF-AGN-040
  - WAF-AGN-050
  - WAF-COST-020
  - WAF-OPS-010
  - WAF-OPS-030
  - WAF-OPS-040
description: 'All known reliability risks, deferred reliability improvements, and technical decisions that reduce system resilience
  MUST be tracked in a version-controlled Reliability Debt Register. Each entry MUST include: description, workload affected,
  severity (P1–P4), estimated remediation effort, business risk if deferred, owner, and target remediation date. The register
  MUST be reviewed quarterly by engineering leadership. Reliability debt created by deliberate architecture decisions MUST
  be accepted in writing with a remediation plan.

  '
regulatory_mapping:
- framework: ISO 27001:2022
  controls:
  - A.17.1 – Information security continuity
  - 6.1.2 – Information security risk assessment
- framework: ITIL 4
  controls:
  - Problem Management
  - Continual Improvement
- framework: SRE Book (Google)
  controls:
  - Chapter 5 – Eliminating Toil
  - Chapter 6 – Monitoring Distributed Systems
checks:
- id: waf-rel-100.tf.aws.config-conformance-pack
  engine: terraform
  automated: true
  title: AWS Config conformance packs must be deployed for reliability compliance tracking
  provider: aws
  description: AWS Config conformance packs for reliability controls should be deployed to automatically track compliance
    status of reliability requirements across accounts.
  expected: 'true'
  remediation: 'Deploy aws_config_conformance_pack with a template covering reliability rules: rds-multi-az-support, elasticache-replication-group-multi-az-enabled,
    backup-plan-min-frequency-and-min-retention-check.\n'
  example:
    compliant: "resource \"aws_config_conformance_pack\" \"reliability\" {\n  name = \"reliability-conformance-pack\"\n\n\
      \  template_body = <<-EOT\n    Parameters: {}\n    Resources:\n      RDSMultiAZ:\n        Type: AWS::Config::ConfigRule\n\
      \        Properties:\n          ConfigRuleName: rds-multi-az-support\n          Source:\n            Owner: AWS\n  \
      \          SourceIdentifier: RDS_MULTI_AZ_SUPPORT\n      BackupRecoveryPoint:\n        Type: AWS::Config::ConfigRule\n\
      \        Properties:\n          ConfigRuleName: backup-recovery-point-minimum-retention-check\n          Source:\n \
      \           Owner: AWS\n            SourceIdentifier: BACKUP_RECOVERY_POINT_MINIMUM_RETENTION_CHECK\n  EOT\n}\n"
    non_compliant: '# No AWS Config conformance pack configured

      # Reliability compliance status not tracked automatically

      # WAF-REL-100 violation

      '
  scope:
    block_type: resource
    resource_types:
    - aws_config_conformance_pack
  assertions:
  - attribute: name
    op: not_empty
    message: Config conformance pack must have a name.
  - attribute: template_body
    op: attribute_exists
    message: Config conformance pack must define template_body or template_s3_uri.
  on_fail: violation
- id: waf-rel-100.tf.azurerm.policy-assignment-reliability
  engine: terraform
  automated: true
  title: Azure Policy assignments must cover reliability compliance requirements
  provider: azurerm
  description: Azure Policy assignments should enforce reliability controls at the subscription or management group level
    to automate compliance tracking.
  expected: 'true'
  remediation: Create azurerm_subscription_policy_assignment referencing built-in reliability policies (zone-redundant databases,
    geo-redundant backup, etc.)\n
  example:
    compliant: "resource \"azurerm_subscription_policy_assignment\" \"reliability_zone_redundant\" {\n  name             \
      \    = \"require-zone-redundant-databases\"\n  subscription_id      = var.subscription_id\n  policy_definition_id =\
      \ \"/providers/Microsoft.Authorization/policyDefinitions/00000000-0000-0000-0000-000000000001\"\n  display_name    \
      \     = \"Reliability: Require zone-redundant databases in production\"\n  description          = \"Enforces WAF-REL-030:\
      \ Multi-AZ/zone-redundant deployment for databases.\"\n  enforce              = true\n  location             = \"westeurope\"\
      \n  identity { type = \"SystemAssigned\" }\n}\n"
    non_compliant: '# No Azure Policy assignments for reliability

      # Reliability compliance manually tracked or not tracked at all

      # WAF-REL-100 violation

      '
  scope:
    block_type: resource
    resource_types:
    - azurerm_subscription_policy_assignment
    - azurerm_management_group_policy_assignment
  assertions:
  - attribute: name
    op: not_empty
    message: Policy assignment must have a name.
  - attribute: policy_definition_id
    op: not_empty
    message: Policy assignment must reference a policy definition ID.
  - attribute: display_name
    op: not_empty
    message: Policy assignment must have a descriptive display name.
  on_fail: violation
- id: waf-rel-100.tf.google.org-policy-reliability
  engine: terraform
  automated: true
  title: GCP Organization policies should enforce reliability constraints
  provider: google
  description: GCP organization policies should enforce constraints relevant to reliability such as requiring deletion protection
    on production databases.
  expected: 'true'
  remediation: Define google_org_policy_policy resources enforcing reliability constraints at the project or organization
    level.\n
  example:
    compliant: "resource \"google_project_organization_policy\" \"sql_deletion_protection\" {\n  project    = var.project_id\n\
      \  constraint = \"constraints/sql.restrictAuthorizedNetworks\"\n\n  list_policy {\n    deny {\n      all = true\n  \
      \  }\n  }\n}\n"
    non_compliant: '# No GCP organization policies for reliability enforcement

      # Reliability controls rely on team convention only

      # WAF-REL-100 violation

      '
  scope:
    block_type: resource
    resource_types:
    - google_org_policy_policy
    - google_project_organization_policy
  assertions:
  - attribute: name
    op: not_empty
    message: Organization policy must have a name.
  - attribute: spec
    op: attribute_exists
    message: Organization policy must define spec.
  on_fail: violation
- id: waf-rel-100.tf.stackit.disaster-recovery-tested
  engine: terraform
  automated: true
  title: All known reliability risks, deferred reliability improvements, and... for stackit
  provider: stackit
  description: All known reliability risks, deferred reliability improvements, and... must be documented in IaC via a disaster-recovery-tested
    tag/label on stackit_project. This validates the control is tracked as code.
  expected: 'true'
  remediation: 'Add a disaster-recovery-tested tag/label to the stackit_project resource to show the stackit implementation
    of WAF-REL-100 is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    disaster-recovery-tested = \"true\"\n  }\n\
      }\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing disaster-recovery-tested labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: disaster-recovery-tested
    message: stackit_project is missing the disaster-recovery-tested tag/label.
  on_fail: violation
