checks:
  - id: waf-agn-020.tf.aws.bedrock-agent-tools-approved
    engine: terraform
    automated: true
    title: 'AWS-Bedrock-Agenten müssen genehmigte Werkzeugdefinitionen besitzen'
    provider: aws
    description: 'AWS-Bedrock-Agenten müssen explizite Werkzeugdefinitionen in ihrem Tool-Schema besitzen. Wildcard- oder uneingeschränkte Werkzeuge sind untersagt. Alle Werkzeuge müssen aus einer genehmigten Liste stammen.'
    expected: 'true'
    remediation: "Definieren Sie explizite Werkzeuge im tool_schema der aws_bedrockagent-Ressource. Verwenden Sie den 'tools'-Block, um jedes erlaubte Werkzeug mit Namen, Beschreibung und Input-Schema festzulegen. Verwenden Sie keine Wildcard-Definitionen.\n"
    example:
      compliant: |
        resource "aws_bedrockagent" "support_agent" {
          agent_name = "customer-support"

          tool_schema {
            tools = [{
              name = "lookup_customer"
              description = "Kunde anhand E-Mail suchen"
              input_schema = jsonencode({
                type = "object"
                properties = {
                  email = { type = "string" }
                }
                required = ["email"]
              })
            }, {
              name = "check_order_status"
              description = "Bestellstatus prüfen"
              input_schema = jsonencode({
                type = "object"
                properties = {
                  order_id = { type = "string" }
                }
                required = ["order_id"]
              })
            }]
          }
        }
      non_compliant: |
        resource "aws_bedrockagent" "bad_agent" {
          agent_name = "unrestricted-agent"

          tool_schema {
            tools = [{
              name = "*"
              description = "Alle Werkzeuge erlauben"
              # WAF-AGN-020 Verstoß: Wildcard-Werkzeugdefinition
            }]
          }
        }

    scope:
      block_type: resource
      resource_types:
        - aws_bedrockagent
    assertions:
      - attribute: 'tool_schema.tools'
        op: 'attribute_exists'
        message: 'Agent muss explizite Werkzeugdefinitionen besitzen.'
      - attribute: 'tool_schema.tools'
        op: 'not_contains_pattern'
        message: 'Werkzeuge dürfen keine Wildcard-Namen wie "*" verwenden. Definieren Sie nur spezifische Werkzeuge.'
        pattern: '"name":\\s*"\*"'
    on_fail: violation
  - id: waf-agn-020.tf.google.vertex-agent-tools-approved
    engine: terraform
    automated: true
    title: 'Google-Vertex-AI-Agenten müssen genehmigte Werkzeugdefinitionen besitzen'
    provider: google
    description: 'Google-Vertex-AI-Agenten müssen explizite Tool-Funktionsdeklarationen besitzen. Alle Werkzeuge müssen vorab genehmigte Funktionen mit definierten Schemas referenzieren.'
    expected: 'true'
    remediation: 'Definieren Sie function_declarations in der vertex_ai_agent-Konfiguration mit spezifischen Funktionsnamen, Beschreibungen und Parameter-Schemas. Verwenden Sie keine generischen oder Wildcard-Funktionsdefinitionen.\n'
    example:
      compliant: |
        resource "google_vertex_ai_agent" "data_analyst" {
          display_name = "data-analyst-agent"

          function_declarations = [{
            name = "query_database"
            description = "Analytische Datenbank abfragen"
            parameters = {
              type = "OBJECT"
              properties = {
                query = {
                  type = "STRING"
                  description = "Auszuführende SQL-Abfrage"
                }
              }
              required = ["query"]
            }
          }]
        }
      non_compliant: |
        resource "google_vertex_ai_agent" "unrestricted" {
          display_name = "unrestricted-agent"

          function_declarations = [{
            name = "any_function"
            description = "Jede Funktion erlaubt"
            # WAF-AGN-020 Verstoß: zu permissiv
          }]
        }

    scope:
      block_type: resource
      resource_types:
        - google_vertex_ai_agent
    assertions:
      - attribute: 'function_declarations'
        op: 'not_empty'
        message: 'Agent muss explizite Funktionsdeklarationen besitzen.'
    on_fail: violation
  - id: waf-agn-020.tf.aws.tool-call-logging-enabled
    engine: terraform
    automated: true
    title: 'AWS-Bedrock-Tool-Calls müssen protokolliert werden'
    provider: aws
    description: 'Alle von AWS-Bedrock-Agenten ausgeführten Tool-Calls MÜSSEN in CloudWatch Logs mit Zeitstempel, Agenten-ID, Werkzeugname, Input, Output und Dauer protokolliert werden.'
    expected: 'true'
    remediation: "Konfigurieren Sie CloudWatch-Logging für Bedrock-Agenten. Aktivieren Sie 'Inference logs' in der Bedrock-Konsole oder über die API. Erstellen Sie eine Log-Gruppe unter /aws/bedrock/inference-logs.\n"
    example:
      compliant: |
        resource "aws_cloudwatch_log_group" "bedrock_logs" {
          name = "/aws/bedrock/inference-logs"
        }

        resource "aws_bedrockagent" "agent" {
          agent_name = "loggable-agent"
          # Tool-Call-Logging über CloudWatch aktiviert
        }
      non_compliant: |
        resource "aws_bedrockagent" "no_logging" {
          agent_name = "no-logging-agent"
          # Keine CloudWatch-Log-Gruppe konfiguriert
          # WAF-AGN-020 Verstoß: kein Tool-Call-Logging
        }

    scope:
      block_type: resource
      resource_types:
        - aws_bedrockagent
        - aws_cloudwatch_log_group
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Tool-Call-Logging muss mit einer Log-Gruppe konfiguriert sein.'
    on_fail: violation
  - id: waf-agn-020.tf.aws.tool-rate-limits-configured
    engine: terraform
    automated: true
    title: 'Tool-Call-Rate-Limits müssen für Agenten konfiguriert sein'
    provider: aws
    description: 'Agenten MÜSSEN Rate Limiting konfiguriert haben, um Missbrauch zu verhindern. Maximale Tokens pro Minute und Requests pro Minute sollten definiert sein.'
    expected: 'true'
    remediation: 'Konfigurieren Sie Rate Limits in der Bedrock-Agenten-Konfiguration. Verwenden Sie das AWS SDK oder die Konsole, um maxTokensPerMinute und maxRequestsPerMinute für jeden Agenten festzulegen.\n'
    example:
      compliant: |
        resource "aws_bedrockagent" "rate_limited_agent" {
          agent_name = "rate-limited"

          agent_resource_role_arn = aws_iam_role.bedrock.arn

          instruction = "You are a helpful assistant."

          # Rate Limiting über IAM-Policy oder externen Service
          # Werkzeuge sollten über API Gateway o. Ä. rate-limited werden
        }
      non_compliant: |
        resource "aws_bedrockagent" "unlimited" {
          agent_name = "unlimited-agent"
          # Kein Rate Limiting konfiguriert
          # WAF-AGN-020 Verstoß
        }

    scope:
      block_type: resource
      resource_types:
        - aws_bedrockagent
    assertions:
      - attribute: 'agent_name'
        op: 'not_empty'
        message: 'Agent muss eine Rate-Limiting-Konfiguration besitzen.'
    on_fail: violation
