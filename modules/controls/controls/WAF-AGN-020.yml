# ID: WAF-AGN-020
id: WAF-AGN-020
pillar: agentic
severity: high
type:
  - governance
  - configuration
description: |
  Nicht jeder Agent sollte jedes Werkzeug nutzen können. Die Werkzeugnutzung muss genehmigt, protokolliert und begrenzt sein. Agenten MÜSSEN explizite Werkzeugdefinitionen mit genehmigten Listen besitzen. Alle Tool-Calls MÜSSEN mit Kontext, Input, Output und Zeitstempel protokolliert werden. Rate Limits und Sandboxing MÜSSEN angewendet werden, um Missbrauch zu verhindern.
