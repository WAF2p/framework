checks:
  - id: waf-agn-020.tf.aws.bedrock-agent-tools-approved
    engine: terraform
    automated: true
    title: 'AWS Bedrock agents must have approved tool definitions'
    provider: aws
    description: 'AWS Bedrock agents must have explicit tool definitions in their tool schema. Wildcard or unrestricted tools are prohibited. All tools must be from an approved list.'
    expected: 'true'
    remediation: 'Define explicit tools in the aws_bedrockagent resource tool_schema. Use the 'tools' block to specify each allowed tool with name, description, and input schema. Do not use wildcard definitions.\n'
    example:
      compliant: |
        resource "aws_bedrockagent" "support_agent" {
          agent_name = "customer-support"

          tool_schema {
            tools = [{
              name = "lookup_customer"
              description = "Look up customer by email"
              input_schema = jsonencode({
                type = "object"
                properties = {
                  email = { type = "string" }
                }
                required = ["email"]
              })
            }, {
              name = "check_order_status"
              description = "Check order status"
              input_schema = jsonencode({
                type = "object"
                properties = {
                  order_id = { type = "string" }
                }
                required = ["order_id"]
              })
            }]
          }
        }
      non_compliant: |
        resource "aws_bedrockagent" "bad_agent" {
          agent_name = "unrestricted-agent"

          tool_schema {
            tools = [{
              name = "*"
              description = "Allow all tools"
              # WAF-AGN-020 Violation: wildcard tool definition
            }]
          }
        }

    scope:
      block_type: resource
      resource_types:
        - aws_bedrockagent
    assertions:
      - attribute: 'tool_schema.tools'
        op: 'attribute_exists'
        message: 'Agent must have explicit tool definitions.'
      - attribute: 'tool_schema.tools'
        op: 'not_contains_pattern'
        message: 'Tools must not use wildcard names like "*". Define specific tools only.'
        pattern: '"name":\\s*"\*"'
    on_fail: violation
  - id: waf-agn-020.tf.google.vertex-agent-tools-approved
    engine: terraform
    automated: true
    title: 'Google Vertex AI agents must have approved tool definitions'
    provider: google
    description: 'Google Vertex AI agents must have explicit tool function declarations. All tools must reference pre-approved functions with defined schemas.'
    expected: 'true'
    remediation: 'Define function_declarations in the vertex_ai_agent configuration with specific function names, descriptions, and parameter schemas. Do not use generic or wildcard function definitions.\n'
    example:
      compliant: |
        resource "google_vertex_ai_agent" "data_analyst" {
          display_name = "data-analyst-agent"

          function_declarations = [{
            name = "query_database"
            description = "Query the analytics database"
            parameters = {
              type = "OBJECT"
              properties = {
                query = {
                  type = "STRING"
                  description = "SQL query to execute"
                }
              }
              required = ["query"]
            }
          }]
        }
      non_compliant: |
        resource "google_vertex_ai_agent" "unrestricted" {
          display_name = "unrestricted-agent"

          function_declarations = [{
            name = "any_function"
            description = "Any function allowed"
            # WAF-AGN-020 Violation: too permissive
          }]
        }

    scope:
      block_type: resource
      resource_types:
        - google_vertex_ai_agent
    assertions:
      - attribute: 'function_declarations'
        op: 'not_empty'
        message: 'Agent must have explicit function declarations.'
    on_fail: violation
  - id: waf-agn-020.tf.aws.tool-call-logging-enabled
    engine: terraform
    automated: true
    title: 'AWS Bedrock tool calls must be logged'
    provider: aws
    description: 'All tool calls made by AWS Bedrock agents MUST be logged to CloudWatch Logs with timestamp, agent ID, tool name, input, output, and duration.'
    expected: 'true'
    remediation: 'Configure CloudWatch logging for Bedrock agents. Enable 'Inference logs' in the Bedrock console or via API. Create a log group at /aws/bedrock/inference-logs.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_log_group" "bedrock_logs" {
          name = "/aws/bedrock/inference-logs"
        }

        resource "aws_bedrockagent" "agent" {
          agent_name = "loggable-agent"
          # Tool call logging enabled via CloudWatch
        }
      non_compliant: |
        resource "aws_bedrockagent" "no_logging" {
          agent_name = "no-logging-agent"
          # No CloudWatch log group configured
          # WAF-AGN-020 Violation: no tool call logging
        }

    scope:
      block_type: resource
      resource_types:
        - aws_bedrockagent
        - aws_cloudwatch_log_group
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Tool call logging must be configured with a log group.'
    on_fail: violation
  - id: waf-agn-020.tf.aws.tool-rate-limits-configured
    engine: terraform
    automated: true
    title: 'Tool call rate limits must be configured for agents'
    provider: aws
    description: 'Agents MUST have rate limiting configured to prevent abuse. Maximum tokens per minute and requests per minute should be defined.'
    expected: 'true'
    remediation: 'Configure rate limits in the Bedrock agent configuration. Use AWS SDK or Console to set maxTokensPerMinute and maxRequestsPerMinute for each agent.\n'
    example:
      compliant: |
        resource "aws_bedrockagent" "rate_limited_agent" {
          agent_name = "rate-limited"

          agent_resource_role_arn = aws_iam_role.bedrock.arn

          instruction = "You are a helpful assistant."

          # Rate limiting via IAM policy or external service
          # Tools should be rate-limited via API Gateway or similar
        }
      non_compliant: |
        resource "aws_bedrockagent" "unlimited" {
          agent_name = "unlimited-agent"
          # No rate limiting configured
          # WAF-AGN-020 Violation
        }

    scope:
      block_type: resource
      resource_types:
        - aws_bedrockagent
    assertions:
      - attribute: 'agent_name'
        op: 'not_empty'
        message: 'Agent must have rate limiting configuration.'
    on_fail: violation
