checks:
- id: waf-agn-020.tf.aws.bedrock-agent-tools-approved
  engine: terraform
  automated: true
  title: AWS Bedrock agents must have approved tool definitions
  provider: aws
  description: AWS Bedrock agents must have explicit tool definitions in their tool schema. Wildcard or unrestricted tools
    are prohibited. All tools must be from an approved list.
  expected: 'true'
  remediation: 'Define explicit tools in the aws_bedrockagent resource tool_schema. Use the ''tools'' block to specify each
    allowed tool with name, description, and input schema. Do not use wildcard definitions.

    '
  example:
    compliant: "resource \"aws_bedrockagent\" \"support_agent\" {\n  agent_name = \"customer-support\"\n\n  tool_schema {\n\
      \    tools = [{\n      name = \"lookup_customer\"\n      description = \"Look up customer by email\"\n      input_schema\
      \ = jsonencode({\n        type = \"object\"\n        properties = {\n          email = { type = \"string\" }\n     \
      \   }\n        required = [\"email\"]\n      })\n    }, {\n      name = \"check_order_status\"\n      description =\
      \ \"Check order status\"\n      input_schema = jsonencode({\n        type = \"object\"\n        properties = {\n   \
      \       order_id = { type = \"string\" }\n        }\n        required = [\"order_id\"]\n      })\n    }]\n  }\n}\n"
    non_compliant: "resource \"aws_bedrockagent\" \"bad_agent\" {\n  agent_name = \"unrestricted-agent\"\n\n  tool_schema\
      \ {\n    tools = [{\n      name = \"*\"\n      description = \"Allow all tools\"\n      # WAF-AGN-020 Violation: wildcard\
      \ tool definition\n    }]\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_bedrockagent
  assertions:
  - attribute: tool_schema.tools
    op: attribute_exists
    message: Agent must have explicit tool definitions.
  - attribute: tool_schema.tools
    op: json_not_contains_pattern
    message: Tools must not use wildcard names like "*". Define specific tools only.
    pattern: '"name":\\s*"\*"'
  on_fail: violation
- id: waf-agn-020.tf.azurerm.ai-tool-filter
  engine: terraform
  automated: true
  title: Azure AI services must have content filters and tool restrictions configured
  provider: azurerm
  description: Azure AI services deployments must have content filters and tool usage restrictions configured. Only approved
    tool functions should be exposed to agents.
  expected: 'true'
  remediation: 'Configure azurerm_cognitive_account with network ACLs and content filters. Use azurerm_cognitive_deployment
    with strict model settings. Document approved tools in ADR.

    '
  example:
    compliant: "resource \"azurerm_cognitive_account\" \"ai\" {\n  name                = \"ai-services-account\"\n  location\
      \            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n  kind\
      \                = \"OpenAI\"\n  sku_name            = \"S0\"\n\n  network_acls {\n    default_action = \"Deny\"\n \
      \   ip_rules       = [\"10.0.0.0/24\"]\n  }\n}\n\nresource \"azurerm_cognitive_deployment\" \"agent\" {\n  name    \
      \             = \"agent-deployment\"\n  cognitive_account_id = azurerm_cognitive_account.ai.id\n  model {\n    format\
      \  = \"OpenAI\"\n    name    = \"gpt-4o\"\n    version = \"2024-08-06\"\n  }\n  sku {\n    name = \"Standard\"\n   \
      \ capacity = 1\n  }\n}\n"
    non_compliant: "resource \"azurerm_cognitive_account\" \"ai\" {\n  name                = \"ai-services-account\"\n  location\
      \            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n  kind\
      \                = \"OpenAI\"\n  sku_name            = \"S0\"\n  # No network ACLs or content filters configured\n \
      \ # WAF-AGN-020 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_cognitive_account
    - azurerm_cognitive_deployment
  assertions:
  - attribute: network_acls
    op: attribute_exists
    message: Azure AI services account must have network ACLs restricting access.
  - attribute: sku_name
    op: not_empty
    message: Azure AI deployment must have a configured SKU.
  on_fail: violation
- id: waf-agn-020.tf.google.vertex-agent-tools-approved
  engine: terraform
  automated: true
  title: Google Vertex AI agents must have approved tool definitions
  provider: google
  description: Google Vertex AI agents must have explicit tool function declarations. All tools must reference pre-approved
    functions with defined schemas.
  expected: 'true'
  remediation: Define function_declarations in the vertex_ai_agent configuration with specific function names, descriptions,
    and parameter schemas. Do not use generic or wildcard function definitions.\n
  example:
    compliant: "resource \"google_vertex_ai_agent\" \"data_analyst\" {\n  display_name = \"data-analyst-agent\"\n\n  function_declarations\
      \ = [{\n    name = \"query_database\"\n    description = \"Query the analytics database\"\n    parameters = {\n    \
      \  type = \"OBJECT\"\n      properties = {\n        query = {\n          type = \"STRING\"\n          description =\
      \ \"SQL query to execute\"\n        }\n      }\n      required = [\"query\"]\n    }\n  }]\n}\n"
    non_compliant: "resource \"google_vertex_ai_agent\" \"unrestricted\" {\n  display_name = \"unrestricted-agent\"\n\n  function_declarations\
      \ = [{\n    name = \"any_function\"\n    description = \"Any function allowed\"\n    # WAF-AGN-020 Violation: too permissive\n\
      \  }]\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_vertex_ai_agent
  assertions:
  - attribute: function_declarations
    op: not_empty
    message: Agent must have explicit function declarations.
  on_fail: violation
- id: waf-agn-020.tf.aws.tool-call-logging-enabled
  engine: terraform
  automated: true
  title: AWS Bedrock tool calls must be logged
  provider: aws
  description: All tool calls made by AWS Bedrock agents MUST be logged to CloudWatch Logs with timestamp, agent ID, tool
    name, input, output, and duration.
  expected: 'true'
  remediation: 'Configure CloudWatch logging for Bedrock agents. Enable ''Inference logs'' in the Bedrock console or via API.
    Create a log group at /aws/bedrock/inference-logs.

    '
  example:
    compliant: "resource \"aws_cloudwatch_log_group\" \"bedrock_logs\" {\n  name = \"/aws/bedrock/inference-logs\"\n}\n\n\
      resource \"aws_bedrockagent\" \"agent\" {\n  agent_name = \"loggable-agent\"\n  # Tool call logging enabled via CloudWatch\n\
      }\n"
    non_compliant: "resource \"aws_bedrockagent\" \"no_logging\" {\n  agent_name = \"no-logging-agent\"\n  # No CloudWatch\
      \ log group configured\n  # WAF-AGN-020 Violation: no tool call logging\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_bedrockagent
    - aws_cloudwatch_log_group
  assertions:
  - attribute: name
    op: not_empty
    message: Tool call logging must be configured with a log group.
  on_fail: violation
- id: waf-agn-020.tf.aws.tool-rate-limits-configured
  engine: terraform
  automated: true
  title: Tool call rate limits must be configured for agents
  provider: aws
  description: Agents MUST have rate limiting configured to prevent abuse. Maximum tokens per minute and requests per minute
    should be defined.
  expected: 'true'
  remediation: Configure rate limits in the Bedrock agent configuration. Use AWS SDK or Console to set maxTokensPerMinute
    and maxRequestsPerMinute for each agent.\n
  example:
    compliant: "resource \"aws_bedrockagent\" \"rate_limited_agent\" {\n  agent_name = \"rate-limited\"\n\n  agent_resource_role_arn\
      \ = aws_iam_role.bedrock.arn\n\n  instruction = \"You are a helpful assistant.\"\n\n  # Rate limiting via IAM policy\
      \ or external service\n  # Tools should be rate-limited via API Gateway or similar\n}\n"
    non_compliant: "resource \"aws_bedrockagent\" \"unlimited\" {\n  agent_name = \"unlimited-agent\"\n  # No rate limiting\
      \ configured\n  # WAF-AGN-020 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_bedrockagent
  assertions:
  - attribute: agent_name
    op: not_empty
    message: Agent must have rate limiting configuration.
  on_fail: violation
- id: waf-agn-020.tf.stackit.agentic-access-reviewed
  engine: terraform
