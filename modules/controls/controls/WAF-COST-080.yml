# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-COST-080
id: WAF-COST-080
pillar: cost
severity: medium
type:
  - governance
  - configuration
description: |
  Compute resources with sustained utilization >= 70% over 30 days MUST be covered by Reserved Instances or Savings Plans. All persistent on-demand compute resources MUST carry a 'capacity-commitment' tag documenting their reservation status and the date of the last commitment review. Spot/Preemptible Instances are the preferred option for variable and interruptible workloads.
regulatory_mapping:
  - framework: 'FinOps Foundation'
    controls:
      - 'Optimize Phase – Rate Optimization and Commitment Management'
      - 'Operate Phase – Commitment Planning and Renewal Management'
  - framework: 'Internal Governance'
    controls:
      - 'Cloud Cost Governance Policy – Minimum Reserved Instance Coverage for Baseline Workloads'
checks:
  - id: waf-cost-080.tf.aws.ec2-capacity-commitment-tag
    engine: terraform
    automated: true
    title: 'EC2 instances must declare their capacity commitment status'
    provider: aws
    description: "All EC2 instances must carry a 'capacity-commitment' tag documenting whether the instance is covered by a reservation, savings plan, spot pricing, or on-demand. This tag proves active commitment management and enables automated coverage reporting."
    expected: 'true'
    remediation: "Add 'capacity-commitment' tag to all EC2 instances. Value 'reserved' or 'savings-plan' = commitment exists. Value 'on-demand' = no commitment, flagged for review. Value 'reviewed' = reviewed and consciously left on-demand (needs date + justification).\n"
    example:
      compliant: |
        # Baseline instance with savings plan coverage
        resource "aws_instance" "app" {
          ami           = data.aws_ami.ubuntu.id
          instance_type = "c5.2xlarge"
          tags = merge(module.mandatory_tags.tags, {
            rightsizing-reviewed = "2025-03-01"
            capacity-commitment  = "savings-plan"
            commitment-type      = "compute-savings-plan-1yr"
            commitment-expiry    = "2026-03-01"
          })
        }
        
        # Spot instance for CI/CD
        resource "aws_instance" "ci_runner" {
          ami                    = data.aws_ami.ubuntu.id
          instance_type          = "c5.xlarge"
          instance_market_options {
            market_type = "spot"
          }
          tags = merge(module.mandatory_tags.tags, {
            capacity-commitment = "spot"
          })
        }
        
      non_compliant: |
        resource "aws_instance" "app" {
          ami           = data.aws_ami.ubuntu.id
          instance_type = "c5.2xlarge"
          tags = {
            cost-center = "fintech-platform"
            # Missing capacity-commitment – commitment status unknown
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_instance
        - aws_launch_template
    assertions:
      - attribute: 'tags'
        op: 'key_exists'
        key: 'capacity-commitment'
        message: "EC2 instance missing 'capacity-commitment' tag. Reservation status must be declared."
      - attribute: 'tags.capacity-commitment'
        op: 'in'
        message: 'capacity-commitment must be: reserved, savings-plan, spot, on-demand, or reviewed.'
    on_fail: violation
  - id: waf-cost-080.tf.azurerm.vm-commitment-tag
    engine: terraform
    automated: true
    title: 'Azure VMs must declare their capacity commitment status'
    provider: azurerm
    description: "All Azure Virtual Machines must carry a 'capacity-commitment' tag documenting whether the VM is covered by a Reserved VM Instance, Azure Savings Plan, Spot pricing, or On-Demand. This enables automated coverage gap detection."
    expected: 'true'
    remediation: "Add 'capacity-commitment' tag to all Azure VM resources. Use Azure Advisor to identify baseline VMs that should have Reserved VM Instances.\n"
    example:
      compliant: |
        resource "azurerm_linux_virtual_machine" "app" {
          name                = "vm-payment-app"
          resource_group_name = azurerm_resource_group.main.name
          location            = var.location
          size                = "Standard_D4s_v3"
          tags = merge(local.mandatory_tags, {
            "capacity-commitment" = "reserved"
            "commitment-type"     = "1yr-no-upfront"
          })
        }
        
      non_compliant: |
        resource "azurerm_linux_virtual_machine" "app" {
          name     = "vm-payment-app"
          location = var.location
          size     = "Standard_D8s_v3"
          # Missing: capacity-commitment tag
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_linux_virtual_machine
        - azurerm_windows_virtual_machine
        - azurerm_virtual_machine_scale_set
    assertions:
      - attribute: 'tags'
        op: 'key_exists'
        key: 'capacity-commitment'
        message: "Azure VM missing 'capacity-commitment' tag."
    on_fail: violation
