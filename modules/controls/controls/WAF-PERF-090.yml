# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-PERF-090
id: WAF-PERF-090
pillar: performance
severity: medium
type:
  - configuration
  - governance
description: |
  All block storage (EBS, Azure Managed Disks, GCP Persistent Disk) and object storage used by production workloads MUST be configured with appropriate I/O performance settings (IOPS, throughput, storage class). Storage volumes MUST use the most cost-efficient performance tier for their workload. EBS volumes MUST use gp3 instead of gp2 for new deployments. Storage I/O performance MUST be monitored and alerts configured for throughput saturation and high queue depth.
regulatory_mapping:
  - framework: 'ISO/IEC 25010'
    controls:
      - 'Performance Efficiency – Resource Utilization'
      - 'Performance Efficiency – Time Behavior'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'PERF 3 – How do you select your storage solution?'
  - framework: 'Azure Well-Architected Framework'
    controls:
      - 'Performance Efficiency – Choose the right storage'
  - framework: 'Google Cloud Architecture Framework'
    controls:
      - 'Storage selection – Choose appropriate disk type'
checks:
  - id: waf-perf-090.tf.aws.ebs-gp3-volume-type
    engine: terraform
    automated: true
    title: 'AWS EBS volumes must use gp3 type instead of gp2'
    provider: aws
    description: 'EBS volumes must use gp3 type for new deployments. gp3 provides baseline performance of 3000 IOPS and 125 MB/s throughput without burst mechanics, at 20% lower cost than gp2. gp2 volumes deplete burst credits under sustained load causing unpredictable performance.'
    expected: 'true'
    remediation: 'Change volume_type from "gp2" to "gp3". For databases requiring higher IOPS, set explicit iops and throughput values on gp3 (max 16000 IOPS, 1000 MB/s). Migration from gp2 to gp3 is online and non-disruptive.\n'
    example:
      compliant: |
        resource "aws_ebs_volume" "data" {
          availability_zone = "eu-west-1a"
          size              = 100
          type              = "gp3"
          iops              = 6000    # Explicitly set above default 3000
          throughput        = 250     # Explicitly set above default 125 MB/s
          encrypted         = true
          tags = {
            Name    = "data-payment-api"
            workload = "payment-api"
          }
        }
        
      non_compliant: |
        resource "aws_ebs_volume" "data" {
          availability_zone = "eu-west-1a"
          size              = 100
          type              = "gp2"  # gp2 – burst-dependent – WAF-PERF-090 violation
          # No explicit IOPS; subject to credit depletion
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_ebs_volume
        - aws_db_instance
        - aws_launch_template
    assertions:
      - attribute: 'volume_type'
        op: 'not_equals'
        message: 'EBS volume must not use gp2 type. Migrate to gp3 for consistent performance and lower cost.'
      - attribute: 'volume_type'
        op: 'in'
        message: 'EBS volume type must be explicitly set to a supported current type.'
    on_fail: violation
  - id: waf-perf-090.tf.azurerm.managed-disk-premium
    engine: terraform
    automated: true
    title: 'Azure Managed Disks for production database workloads should use Premium SSD'
    provider: azurerm
    description: 'Azure Managed Disks used for database data volumes should use Premium SSD (P series) or Ultra Disk for high-IOPS workloads. Standard HDD or Standard SSD is inappropriate for production database storage.'
    expected: 'true'
    remediation: 'Set storage_account_type = "Premium_LRS" for database data disks. Use UltraSSD_LRS for extremely latency-sensitive workloads requiring sub-millisecond I/O.\n'
    example:
      compliant: |
        resource "azurerm_managed_disk" "db_data" {
          name                 = "disk-db-payment-data"
          resource_group_name  = azurerm_resource_group.main.name
          location             = azurerm_resource_group.main.location
          storage_account_type = "Premium_LRS"
          create_option        = "Empty"
          disk_size_gb         = 256
          tags = {
            workload = "payment-db"
            tier     = "data"
          }
        }
        
      non_compliant: |
        resource "azurerm_managed_disk" "db_data" {
          name                 = "disk-db-payment-data"
          storage_account_type = "Standard_LRS"  # HDD for database – WAF-PERF-090 advisory
          create_option        = "Empty"
          disk_size_gb         = 256
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_managed_disk
    assertions:
      - attribute: 'storage_account_type'
        op: 'not_in'
        message: 'Production database disks must use Premium_LRS or UltraSSD_LRS, not Standard or StandardSSD.'
    on_fail: advisory
  - id: waf-perf-090.tf.google.persistent-disk-ssd
    engine: terraform
    automated: true
    title: 'GCP Persistent Disks for production workloads should use SSD type'
    provider: google
    description: 'GCP Persistent Disks for production compute and database workloads should use pd-ssd or pd-balanced type, not pd-standard (HDD) which has high latency.'
    expected: 'true'
    remediation: 'Set type = "pd-balanced" for general workloads or type = "pd-ssd" for high-IOPS databases. pd-extreme is available for ultra-high IOPS requirements.\n'
    example:
      compliant: |
        resource "google_compute_disk" "db_data" {
          name  = "disk-payment-db-data"
          type  = "pd-ssd"
          zone  = "europe-west3-a"
          size  = 100
          labels = {
            workload = "payment-db"
          }
        }
        
      non_compliant: |
        resource "google_compute_disk" "db_data" {
          name  = "disk-payment-db-data"
          type  = "pd-standard"  # HDD – high latency for database – WAF-PERF-090 advisory
          zone  = "europe-west3-a"
          size  = 100
        }
        
    scope:
      block_type: resource
      resource_types:
        - google_compute_disk
    assertions:
      - attribute: 'type'
        op: 'not_equals'
        message: 'Production Persistent Disk must not use pd-standard (HDD). Use pd-ssd or pd-balanced.'
    on_fail: advisory
