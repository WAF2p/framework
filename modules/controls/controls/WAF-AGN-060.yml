# ID: WAF-AGN-060
id: WAF-AGN-060
pillar: agentic
severity: medium
type:
  - governance
  - configuration
description: |
  Viele Agenten müssen koordiniert werden. Die Agenten-Orchestrierung MUSS Coordinator/Manager-Patterns oder Mesh-Architekturen verwenden. Event-basierte Kommunikation MUSS für Agenten-Messaging konfiguriert sein. Failure Recovery und Agenten-Health-Monitoring MÜSSEN vorhanden sein.
