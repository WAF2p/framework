id: WAF-AGN-060
title: Many agents must be coordinated
status: active
tags:
- agentic
- medium
- governance
- configuration
pillar: agentic
severity: medium
type:
- governance
- configuration
category: logging-monitoring
rationale: Insufficient observability delays incident detection, complicates troubleshooting, and prevents effective audit
  evidence. This control addresses the requirements of the 'Logging and Monitoring' area and ensures that Many agents must
  be coordinated. Agent orchestration MUST use coordinator/manager patterns or mesh architectures.
threat:
- Uncoordinated agents create race conditions, deadlocks, or duplicate critical operations.
- Missing orchestration governance allows agent swarms to bypass approval boundaries.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
