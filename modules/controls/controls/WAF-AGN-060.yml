checks:
- id: waf-agn-060.tf.aws.coordinator-agent-configured
  engine: terraform
  automated: true
  title: Multi-agent systems must have coordinator/manager configured
  provider: aws
  description: Multi-agent AWS Bedrock systems must have a coordinator agent that manages worker agents. The coordinator must
    route tasks, aggregate results, and handle failures.
  expected: 'true'
  remediation: Design a coordinator agent pattern where one agent orchestrates multiple specialized agents. Use AWS Step Functions
    or Lambda to manage the coordination flow. Define clear task delegation and result aggregation.\n
  example:
    compliant: "# Coordinator agent manages worker agents\nresource \"aws_bedrockagent\" \"coordinator\" {\n  agent_name =\
      \ \"agent-coordinator\"\n  # Manages multiple worker agents\n}\n\nresource \"aws_bedrockagent\" \"worker_analysis\"\
      \ {\n  agent_name = \"analysis-worker\"\n  # Works under coordinator direction\n}\n\nresource \"aws_bedrockagent\" \"\
      worker_research\" {\n  agent_name = \"research-worker\"\n  # Works under coordinator direction\n}\n\n# Coordination\
      \ via Step Functions or Lambda\nresource \"aws_lambda_function\" \"agent_coordinator\" {\n  function_name = \"agent-coordinator-function\"\
      \n  # Coordinates agent communication\n}\n"
    non_compliant: '# No coordinator defined

      # WAF-AGN-060 Violation

      '
  scope:
    block_type: resource
    resource_types:
    - aws_bedrockagent
    - aws_lambda_function
    - aws_sfn_state_machine
  assertions:
  - attribute: agent_name
    op: not_empty
    message: Coordinator agent must be configured for multi-agent systems.
  on_fail: violation
- id: waf-agn-060.tf.aws.event-based-communication
  engine: terraform
  automated: true
  title: Agent communication must use event-based messaging
  provider: aws
  description: Agents must communicate via event-based channels (SNS, SQS, EventBridge) rather than direct HTTP calls. This
    ensures decoupling, resilience, and auditability of agent interactions.
  expected: 'true'
  remediation: Configure SNS topics, SQS queues, and EventBridge rules for agent communication. Agents publish messages to
    channels and subscribe to relevant events. Avoid direct agent-to-agent HTTP endpoints.\n
  example:
    compliant: "resource \"aws_sns_topic\" \"agent_events\" {\n  name = \"agent-events\"\n}\n\nresource \"aws_sqs_queue\"\
      \ \"agent_queue\" {\n  name = \"agent-messages\"\n}\n\nresource \"aws_sns_topic_subscription\" \"agent_subscription\"\
      \ {\n  topic_arn = aws_sns_topic.agent_events.arn\n  protocol  = \"sqs\"\n  endpoint  = aws_sqs_queue.agent_queue.arn\n\
      }\n\nresource \"aws_bedrockagent\" \"event_agent\" {\n  agent_name = \"event-based-agent\"\n  # Listens to SNS/SQS for\
      \ events\n}\n"
    non_compliant: "resource \"aws_bedrockagent\" \"direct-agent\" {\n  agent_name = \"direct-rpc-agent\"\n  # Direct HTTP\
      \ calls to other agents\n  # WAF-AGN-060 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_sns_topic
    - aws_sqs_queue
    - aws_bedrockagent
  assertions:
  - attribute: name
    op: not_empty
    message: Event-based communication (SNS/SQS/EventBridge) must be configured.
  on_fail: violation
- id: waf-agn-060.tf.aws.failure-recovery-configured
  engine: terraform
  automated: true
  title: Multi-agent systems must have failure recovery configured
  provider: aws
  description: Multi-agent systems must have automated failure recovery. Failed agents must be restarted, messages requeued,
    and alerts raised. Dead letter queues must be configured for failed messages.
  expected: 'true'
  remediation: Configure CloudWatch Alarms for agent health monitoring. Set up Lambda retry policies and dead letter queues
    for failed message processing. Implement agent health checks with automatic restart.\n
  example:
    compliant: "resource \"aws_sqs_queue\" \"dead_letter_queue\" {\n  name = \"agent-dead-letter\"\n}\n\nresource \"aws_sqs_queue\"\
      \ \"main_queue\" {\n  name = \"agent-messages\"\n  redrive_policy = jsonencode({\n    deadLetterTargetArn = aws_sqs_queue.dead_letter_queue.arn\n\
      \    maxReceiveCount       = 3\n  })\n}\n\nresource \"aws_cloudwatch_metric_alarm\" \"agent_health\" {\n  alarm_name\
      \          = \"agent-health-alarm\"\n  comparison_operator = \"LessThanThreshold\"\n  evaluation_periods  = 3\n  metric_name\
      \         = \"Invocations\"\n  namespace           = \"AWS/Lambda\"\n  period              = 300\n  statistic      \
      \     = \"Sum\"\n  threshold           = 1\n  alarm_description   = \"Agent failure detected\"\n}\n"
    non_compliant: "resource \"aws_sqs_queue\" \"no_redrive\" {\n  name = \"messages-no-recovery\"\n  # No dead letter queue\
      \ configured\n  # WAF-AGN-060 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_sqs_queue
    - aws_cloudwatch_metric_alarm
  assertions:
  - attribute: name
    op: not_empty
    message: Failure recovery (dead letter queue, alarms) must be configured.
  on_fail: violation
- id: waf-agn-060.tf.azurerm.event-grid-coordination
  engine: terraform
  automated: true
  title: Azure Event Grid must be configured for agent coordination
  provider: azurerm
  description: Azure Event Grid topics and subscriptions must be configured for event-based communication between agents,
    enabling decoupled coordination.
  expected: 'true'
  remediation: 'Deploy azurerm_eventgrid_topic and azurerm_eventgrid_event_subscription to route agent events between coordinator
    and worker agents.

    '
  example:
    compliant: "resource \"azurerm_eventgrid_topic\" \"agent_events\" {\n  name                = \"agent-events\"\n  location\
      \            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n}\n\n\
      resource \"azurerm_eventgrid_event_subscription\" \"agent_subscription\" {\n  name  = \"agent-worker-subscription\"\n\
      \  scope = azurerm_eventgrid_topic.agent_events.id\n\n  webhook_endpoint {\n    url = \"https://agent-worker.example.com/events\"\
      \n  }\n}\n"
    non_compliant: "resource \"azurerm_cognitive_deployment\" \"agent\" {\n  name = \"standalone-agent\"\n  # No Event Grid\
      \ coordination configured\n  # WAF-AGN-060 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_eventgrid_topic
    - azurerm_eventgrid_event_subscription
  assertions:
  - attribute: name
    op: not_empty
    message: Event Grid topic must be configured for agent coordination.
  - attribute: scope
    op: not_empty
    message: Event Grid subscription must route agent events.
  on_fail: violation
- id: waf-agn-060.tf.google.eventarc-coordination
  engine: terraform
  automated: true
  title: GCP Eventarc triggers must be configured for agent coordination
  provider: google
  description: GCP Eventarc triggers must route agent events to Cloud Run services or Cloud Functions for event-based coordination
    between agents.
  expected: 'true'
  remediation: 'Configure google_eventarc_trigger resources to subscribe to relevant events and route them to agent services.

    '
  example:
    compliant: "resource \"google_eventarc_trigger\" \"agent_event\" {\n  name     = \"agent-coordination-trigger\"\n  location\
      \ = \"europe-west3\"\n\n  matching_criteria {\n    attribute = \"type\"\n    value     = \"google.cloud.pubsub.topic.v1.messagePublished\"\
      \n  }\n\n  destination {\n    cloud_run_service {\n      service = google_cloud_run_service.agent_worker.name\n    \
      \  region  = \"europe-west3\"\n    }\n  }\n}\n"
    non_compliant: "resource \"google_cloud_run_service\" \"agent_worker\" {\n  name = \"agent-worker\"\n  # No Eventarc trigger\
      \ for event-based coordination\n  # WAF-AGN-060 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_eventarc_trigger
  assertions:
  - attribute: matching_criteria
    op: attribute_exists
    message: Eventarc trigger must define matching criteria for agent events.
  - attribute: destination
    op: attribute_exists
    message: Eventarc trigger must route events to an agent service destination.
  on_fail: violation
