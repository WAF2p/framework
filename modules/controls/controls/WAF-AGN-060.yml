checks:
  - id: waf-agn-060.tf.aws.coordinator-agent-configured
    engine: terraform
    automated: true
    title: 'Multi-agent systems must have coordinator/manager configured'
    provider: aws
    description: 'Multi-agent AWS Bedrock systems must have a coordinator agent that manages worker agents. The coordinator must route tasks, aggregate results, and handle failures.'
    expected: 'true'
    remediation: 'Design a coordinator agent pattern where one agent orchestrates multiple specialized agents. Use AWS Step Functions or Lambda to manage the coordination flow. Define clear task delegation and result aggregation.\n'
    example:
      compliant: |
        # Coordinator agent manages worker agents
        resource "aws_bedrockagent" "coordinator" {
          agent_name = "agent-coordinator"
          # Manages multiple worker agents
        }

        resource "aws_bedrockagent" "worker_analysis" {
          agent_name = "analysis-worker"
          # Works under coordinator direction
        }

        resource "aws_bedrockagent" "worker_research" {
          agent_name = "research-worker"
          # Works under coordinator direction
        }

        # Coordination via Step Functions or Lambda
        resource "aws_lambda_function" "agent_coordinator" {
          function_name = "agent-coordinator-function"
          # Coordinates agent communication
        }
      non_compliant: |
        # No coordinator defined
        # WAF-AGN-060 Violation
      # Agents operate independently without coordination

    scope:
      block_type: resource
      resource_types:
        - aws_bedrockagent
        - aws_lambda_function
        - aws_sfn_state_machine
    assertions:
      - attribute: 'agent_name'
        op: 'not_empty'
        message: 'Coordinator agent must be configured for multi-agent systems.'
    on_fail: violation
  - id: waf-agn-060.tf.aws.event-based-communication
    engine: terraform
    automated: true
    title: 'Agent communication must use event-based messaging'
    provider: aws
    description: 'Agents must communicate via event-based channels (SNS, SQS, EventBridge) rather than direct HTTP calls. This ensures decoupling, resilience, and auditability of agent interactions.'
    expected: 'true'
    remediation: 'Configure SNS topics, SQS queues, and EventBridge rules for agent communication. Agents publish messages to channels and subscribe to relevant events. Avoid direct agent-to-agent HTTP endpoints.\n'
    example:
      compliant: |
        resource "aws_sns_topic" "agent_events" {
          name = "agent-events"
        }

        resource "aws_sqs_queue" "agent_queue" {
          name = "agent-messages"
        }

        resource "aws_sns_topic_subscription" "agent_subscription" {
          topic_arn = aws_sns_topic.agent_events.arn
          protocol  = "sqs"
          endpoint  = aws_sqs_queue.agent_queue.arn
        }

        resource "aws_bedrockagent" "event_agent" {
          agent_name = "event-based-agent"
          # Listens to SNS/SQS for events
        }
      non_compliant: |
        resource "aws_bedrockagent" "direct-agent" {
          agent_name = "direct-rpc-agent"
          # Direct HTTP calls to other agents
          # WAF-AGN-060 Violation
        }

    scope:
      block_type: resource
      resource_types:
        - aws_sns_topic
        - aws_sqs_queue
        - aws_bedrockagent
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Event-based communication (SNS/SQS/EventBridge) must be configured.'
    on_fail: violation
  - id: waf-agn-060.tf.aws.failure-recovery-configured
    engine: terraform
    automated: true
    title: 'Multi-agent systems must have failure recovery configured'
    provider: aws
    description: 'Multi-agent systems must have automated failure recovery. Failed agents must be restarted, messages requeued, and alerts raised. Dead letter queues must be configured for failed messages.'
    expected: 'true'
    remediation: 'Configure CloudWatch Alarms for agent health monitoring. Set up Lambda retry policies and dead letter queues for failed message processing. Implement agent health checks with automatic restart.\n'
    example:
      compliant: |
        resource "aws_sqs_queue" "dead_letter_queue" {
          name = "agent-dead-letter"
        }

        resource "aws_sqs_queue" "main_queue" {
          name = "agent-messages"
          redrive_policy = jsonencode({
            deadLetterTargetArn = aws_sqs_queue.dead_letter_queue.arn
            maxReceiveCount       = 3
          })
        }

        resource "aws_cloudwatch_metric_alarm" "agent_health" {
          alarm_name          = "agent-health-alarm"
          comparison_operator = "LessThanThreshold"
          evaluation_periods  = 3
          metric_name         = "Invocations"
          namespace           = "AWS/Lambda"
          period              = 300
          statistic           = "Sum"
          threshold           = 1
          alarm_description   = "Agent failure detected"
        }
      non_compliant: |
        resource "aws_sqs_queue" "no_redrive" {
          name = "messages-no-recovery"
          # No dead letter queue configured
          # WAF-AGN-060 Violation
        }

    scope:
      block_type: resource
      resource_types:
        - aws_sqs_queue
        - aws_cloudwatch_metric_alarm
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Failure recovery (dead letter queue, alarms) must be configured.'
    on_fail: violation
