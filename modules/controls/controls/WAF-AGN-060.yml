checks:
  - id: waf-agn-060.tf.aws.coordinator-agent-configured
    engine: terraform
    automated: true
    title: 'Multi-Agent-Systeme müssen einen Coordinator/Manager konfiguriert haben'
    provider: aws
    description: 'Multi-Agent-AWS-Bedrock-Systeme müssen einen Coordinator-Agenten besitzen, der Worker-Agenten verwaltet. Der Coordinator muss Aufgaben routen, Ergebnisse aggregieren und Fehler behandeln.'
    expected: 'true'
    remediation: 'Entwerfen Sie ein Coordinator-Agenten-Pattern, bei dem ein Agent mehrere spezialisierte Agenten orchestriert. Verwenden Sie AWS Step Functions oder Lambda, um den Koordinationsfluss zu steuern. Definieren Sie klare Aufgabendelegation und Ergebnisaggregation.\n'
    example:
      compliant: |
        # Coordinator-Agent verwaltet Worker-Agenten
        resource "aws_bedrockagent" "coordinator" {
          agent_name = "agent-coordinator"
          # Verwaltet mehrere Worker-Agenten
        }

        resource "aws_bedrockagent" "worker_analysis" {
          agent_name = "analysis-worker"
          # Arbeitet unter Anleitung des Coordinators
        }

        resource "aws_bedrockagent" "worker_research" {
          agent_name = "research-worker"
          # Arbeitet unter Anleitung des Coordinators
        }

        # Koordination über Step Functions oder Lambda
        resource "aws_lambda_function" "agent_coordinator" {
          function_name = "agent-coordinator-function"
          # Koordiniert Agenten-Kommunikation
        }
      non_compliant: |
        # Kein Coordinator definiert
        # WAF-AGN-060 Verstoß
        # Agenten operieren unkoordiniert

    scope:
      block_type: resource
      resource_types:
        - aws_bedrockagent
        - aws_lambda_function
        - aws_sfn_state_machine
    assertions:
      - attribute: 'agent_name'
        op: 'not_empty'
        message: 'Coordinator-Agent muss für Multi-Agent-Systeme konfiguriert sein.'
    on_fail: violation
  - id: waf-agn-060.tf.aws.event-based-communication
    engine: terraform
    automated: true
    title: 'Agenten-Kommunikation muss event-basiertes Messaging verwenden'
    provider: aws
    description: 'Agenten müssen über event-basierte Kanäle (SNS, SQS, EventBridge) kommunizieren, anstatt direkte HTTP-Aufrufe zu verwenden. Dies gewährleistet Entkopplung, Resilienz und Auditierbarkeit von Agenten-Interaktionen.'
    expected: 'true'
    remediation: 'Konfigurieren Sie SNS-Themen, SQS-Warteschlangen und EventBridge-Regeln für die Agenten-Kommunikation. Agenten veröffentlichen Nachrichten auf Kanälen und abonnieren relevante Ereignisse. Vermeiden Sie direkte Agent-zu-Agent-HTTP-Endpunkte.\n'
    example:
      compliant: |
        resource "aws_sns_topic" "agent_events" {
          name = "agent-events"
        }

        resource "aws_sqs_queue" "agent_queue" {
          name = "agent-messages"
        }

        resource "aws_sns_topic_subscription" "agent_subscription" {
          topic_arn = aws_sns_topic.agent_events.arn
          protocol  = "sqs"
          endpoint  = aws_sqs_queue.agent_queue.arn
        }

        resource "aws_bedrockagent" "event_agent" {
          agent_name = "event-based-agent"
          # Lauscht auf SNS/SQS-Ereignisse
        }
      non_compliant: |
        resource "aws_bedrockagent" "direct-agent" {
          agent_name = "direct-rpc-agent"
          # Direkte HTTP-Aufrufe an andere Agenten
          # WAF-AGN-060 Verstoß
        }

    scope:
      block_type: resource
      resource_types:
        - aws_sns_topic
        - aws_sqs_queue
        - aws_bedrockagent
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Event-basierte Kommunikation (SNS/SQS/EventBridge) muss konfiguriert sein.'
    on_fail: violation
  - id: waf-agn-060.tf.aws.failure-recovery-configured
    engine: terraform
    automated: true
    title: 'Multi-Agent-Systeme müssen Failure Recovery konfiguriert haben'
    provider: aws
    description: 'Multi-Agent-Systeme müssen automatisiertes Failure Recovery besitzen. Fehlgeschlagene Agenten müssen neu gestartet, Nachrichten neu eingereiht und Alerts ausgelöst werden. Dead-Letter-Queues müssen für fehlgeschlagene Nachrichten konfiguriert sein.'
    expected: 'true'
    remediation: 'Konfigurieren Sie CloudWatch-Alarms für Agenten-Health-Monitoring. Richten Sie Lambda-Retry-Policies und Dead-Letter-Queues für fehlgeschlagene Nachrichtenverarbeitung ein. Implementieren Sie Agenten-Health-Checks mit automatischem Neustart.\n'
    example:
      compliant: |
        resource "aws_sqs_queue" "dead_letter_queue" {
          name = "agent-dead-letter"
        }

        resource "aws_sqs_queue" "main_queue" {
          name = "agent-messages"
          redrive_policy = jsonencode({
            deadLetterTargetArn = aws_sqs_queue.dead_letter_queue.arn
            maxReceiveCount       = 3
          })
        }

        resource "aws_cloudwatch_metric_alarm" "agent_health" {
          alarm_name          = "agent-health-alarm"
          comparison_operator = "LessThanThreshold"
          evaluation_periods  = 3
          metric_name         = "Invocations"
          namespace           = "AWS/Lambda"
          period              = 300
          statistic           = "Sum"
          threshold           = 1
          alarm_description   = "Agentenfehler erkannt"
        }
      non_compliant: |
        resource "aws_sqs_queue" "no_redrive" {
          name = "messages-no-recovery"
          # Keine Dead-Letter-Queue konfiguriert
          # WAF-AGN-060 Verstoß
        }

    scope:
      block_type: resource
      resource_types:
        - aws_sqs_queue
        - aws_cloudwatch_metric_alarm
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Failure Recovery (Dead-Letter-Queue, Alarms) muss konfiguriert sein.'
    on_fail: violation
