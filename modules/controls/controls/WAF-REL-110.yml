id: WAF-REL-110
title: Circuit breaker, backpressure, and rate limiting MUST be defined for downstream dependencies
status: active
tags:
- architecture
- configuration
- high
- reliability
pillar: reliability
severity: high
type:
- configuration
- architecture
category: reliability-design
rationale: Fehlende Resilience-Patterns und nicht getestete Degradationsstrategien führen zu kaskadierenden Ausfällen und
  längerer Wiederherstellungszeit. Dieses Control adressiert die Anforderungen des Bereichs 'Reliability Design' und stellt
  sicher, dass Every downstream HTTP/gRPC dependency MUST have explicit timeout, retry, circuit breaker, and bulkhe...
threat:
- Cascading failures spread when a single slow dependency saturates all callers.
- Unbounded retries during outages amplify load and prevent recovery of failing services.
implementation_guidance:
- Document the requirement in a version-controlled policy, ADR, or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
- Implement the required configuration as code in Terraform or equivalent IaC.
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - Die Anforderung ist nicht einheitlich umgesetzt; Nachweis existiert nur punktuell oder fehlt.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - Eine dokumentierte Policy oder ein Standard beschreibt die Anforderung.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Terraform-Checks oder IaC-Gates prüfen die Anforderung automatisch in CI/CD.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Abdeckung, Ausnahmen und Qualitätsmetriken werden quartalsweise berichtet.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Die Effektivität wird kontinuierlich gemessen und automatisch optimiert.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-reliability/pages/controls/WAF-REL-110.adoc
  related_controls:
  - WAF-REL-050
  - WAF-REL-120
  - WAF-REL-130
  - WAF-OPS-020
  - WAF-OPS-040
  - WAF-AGN-040
  - WAF-AGN-110
description: Every downstream HTTP/gRPC dependency MUST have explicit timeout, retry, circuit breaker, and bulkhead configuration.
  Services MUST propagate backpressure instead of accepting unbounded load. Rate limits MUST protect backends from accidental
  or malicious overload. Configuration MUST be observable through metrics and tested via chaos or fault injection.
regulatory_mapping:
- framework: ISO 27001:2022
  controls:
  - A.17.1 – Information security continuity
- framework: SRE Book (Google)
  controls:
  - Chapter 22 – Addressing Cascading Failures
- framework: ITIL 4
  controls:
  - Service Continuity Management
- framework: NIST CSF 2.0
  controls:
  - RS.RP-01 – Response plan is executed
checks:
- id: waf-rel-110.tf.aws.alb-timeout
  engine: terraform
  provider: aws
  automated: true
  title: AWS ALB idle timeout must be explicitly configured
  description: AWS ALB idle timeout must be explicitly configured
  expected: 'true'
  remediation: AWS ALB idle timeout must be explicitly configured
  scope:
    block_type: resource
    resource_types:
    - aws_lb
  assertions:
  - attribute: idle_timeout
    op: attribute_exists
    message: ALB idle_timeout must be explicitly set.
  on_fail: violation
- id: waf-rel-110.tf.aws.api-gateway-throttle
  engine: terraform
  provider: aws
  automated: true
  title: AWS API Gateway must define throttling settings
  description: AWS API Gateway must define throttling settings
  expected: 'true'
  remediation: AWS API Gateway must define throttling settings
  scope:
    block_type: resource
    resource_types:
    - aws_api_gateway_stage
    - aws_apigatewayv2_stage
  assertions:
  - attribute: throttle_settings
    op: attribute_exists
    message: API Gateway stage must define throttling.
  on_fail: finding
- id: waf-rel-110.tf.azurerm.app-gateway-timeout
  engine: terraform
  provider: azurerm
  automated: true
  title: Azure Application Gateway backend settings must define explicit request timeout
  description: Azure Application Gateway backend settings must define explicit request timeout
  expected: 'true'
  remediation: Azure Application Gateway backend settings must define explicit request timeout
  scope:
    block_type: resource
    resource_types:
    - azurerm_application_gateway
  assertions:
  - attribute: backend_http_settings.request_timeout_in_seconds
    op: attribute_exists
    message: Backend HTTP settings must define request timeout.
  on_fail: violation
- id: waf-rel-110.config.resilience-policy
  engine: config
  provider: any
  automated: false
  title: Circuit breaker policy must be documented
  description: Circuit breaker policy must be documented
  expected: 'true'
  remediation: Circuit breaker policy must be documented
  scope:
    block_type: file
    path_pattern: docs/reliability/circuit-breaker-policy.md
  assertions:
  - attribute: exists
    op: attribute_exists
    message: Circuit breaker/backpressure policy must exist.
  on_fail: finding
