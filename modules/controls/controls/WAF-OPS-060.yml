# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-OPS-060
id: WAF-OPS-060
pillar: operational
severity: medium
type:
  - governance
  - configuration
description: |
  Every production workload MUST have a runbook covering all known failure modes, routine operational tasks, and escalation paths. Runbooks MUST be version-controlled, regularly reviewed (at minimum quarterly), and accessible to all on-call engineers without authentication barriers at 3 AM. Alert rules that trigger on-call pages MUST link to the relevant runbook section.
regulatory_mapping:
  - framework: 'ISO/IEC 20000-1'
    controls:
      - 'Knowledge management'
      - 'Incident management'
  - framework: 'ITIL 4'
    controls:
      - 'Knowledge management'
      - 'Incident management'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'Operational Excellence Pillar – OPS 3: How do you understand your operations?'
  - framework: 'SOC 2 Type II'
    controls:
      - 'CC9.1 – Risk Mitigation Activities'
checks:
  - id: waf-ops-060.tf.aws.cloudwatch-alarm-runbook-annotation
    engine: terraform
    automated: true
    title: 'CloudWatch alarms must include runbook URL in description'
    provider: aws
    description: 'All CloudWatch metric alarms that trigger on-call notifications MUST include a runbook URL in the alarm_description to reduce mean time to resolution.'
    expected: 'true'
    remediation: 'Include a runbook URL in the alarm_description field: alarm_description = "Error rate exceeded. Runbook: https://wiki/runbooks/service-errors"\n'
    example:
      compliant: |
        resource "aws_cloudwatch_metric_alarm" "error_rate" {
          alarm_name          = "payment-service-error-rate"
          comparison_operator = "GreaterThanThreshold"
          evaluation_periods  = 2
          metric_name         = "5XXError"
          namespace           = "AWS/ApplicationELB"
          period              = 60
          statistic           = "Sum"
          threshold           = 10
          alarm_description   = "Payment service error rate high. Runbook: https://wiki/runbooks/payment-5xx"
          alarm_actions       = [aws_sns_topic.oncall.arn]
        }
        
      non_compliant: |
        resource "aws_cloudwatch_metric_alarm" "error_rate" {
          alarm_name          = "payment-service-error-rate"
          comparison_operator = "GreaterThanThreshold"
          evaluation_periods  = 2
          metric_name         = "5XXError"
          namespace           = "AWS/ApplicationELB"
          period              = 60
          statistic           = "Sum"
          threshold           = 10
          alarm_description   = "High error rate"
          # No runbook URL – WAF-OPS-060 Violation
          alarm_actions       = [aws_sns_topic.oncall.arn]
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_metric_alarm
    assertions:
      - attribute: 'alarm_description'
        op: 'matches'
        message: 'CloudWatch alarm description must include a runbook URL (http:// or https://).'
        pattern: 'https?://'
    on_fail: violation
  - id: waf-ops-060.tf.aws.prometheus-alert-runbook-label
    engine: terraform
    automated: true
    title: 'Prometheus alert rules must include runbook_url annotation'
    provider: aws
    description: 'Prometheus alert rules managed in AWS Managed Prometheus MUST include a runbook_url annotation so on-call engineers have immediate access to remediation steps.'
    expected: 'true'
    remediation: 'Add runbook_url: "https://wiki/runbooks/<service>" annotation to all Prometheus alert rules.\n'
    example:
      compliant: |
        resource "aws_prometheus_rule_group_namespace" "alerts" {
          name         = "payment-service-alerts"
          workspace_id = aws_prometheus_workspace.main.id
          data         = <<-EOT
            groups:
              - name: payment-service
                rules:
                  - alert: HighErrorRate
                    expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
                    for: 2m
                    annotations:
                      summary: "High error rate on payment service"
                      runbook_url: "https://wiki/runbooks/payment-errors"
          EOT
        }
        
      non_compliant: |
        resource "aws_prometheus_rule_group_namespace" "alerts" {
          name         = "payment-service-alerts"
          workspace_id = aws_prometheus_workspace.main.id
          data         = <<-EOT
            groups:
              - name: payment-service
                rules:
                  - alert: HighErrorRate
                    expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
                    # No runbook_url annotation – WAF-OPS-060 Violation
          EOT
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_prometheus_rule_group_namespace
    assertions:
      - attribute: 'data'
        op: 'matches'
        message: 'Prometheus alert rules must include runbook_url annotation.'
        pattern: 'runbook_url'
    on_fail: violation
