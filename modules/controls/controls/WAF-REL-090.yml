id: WAF-REL-090
title: Production and staging workloads MUST undergo structured chaos engineering...
status: active
tags:
- reliability
- medium
- governance
pillar: reliability
severity: medium
type:
- governance
category: logging-monitoring
rationale: Insufficient observability delays incident detection, complicates troubleshooting, and prevents effective audit
  evidence. This control addresses the requirements of the 'Logging and Monitoring' area and ensures that Production and staging
  workloads MUST undergo structured chaos engineering experiments at minimum quarterly.
threat:
- Untested workloads surprise teams during real outages because known weaknesses were never exercised.
- Missing chaos experiments prevent targeted discovery of resilience gaps.
implementation_guidance:
- Document the requirement in a version-controlled policy or standard.
- Assign ownership and establish a review cadence (e.g., quarterly).
maturity_levels:
  level_1:
    description: Ad hoc – control not consistently applied
    criteria:
    - The requirement is not consistently implemented; evidence exists only ad-hoc or is missing.
  level_2:
    description: Standardised – policy defined and communicated
    criteria:
    - A documented policy or standard describes the requirement.
  level_3:
    description: Integrated – automated validation in CI/CD
    criteria:
    - Implementation is regularly reviewed and evidenced in reviews.
  level_4:
    description: Auditable – metrics and exceptions tracked
    criteria:
    - Coverage, exceptions, and quality metrics are reported quarterly.
  level_5:
    description: Optimised – continuous improvement based on data
    criteria:
    - Effectiveness is continuously measured and automatically improved.
evidence:
  required:
  - kind: iac
    description: Terraform configuration implementing the control.
  - kind: governance
    description: Policy, ADR, or standard documenting the requirement.
  optional:
  - kind: config
    description: Cloud console or API output confirming runtime state.
references:
  narrative: modules/pillar-reliability/pages/controls/WAF-REL-090.adoc
  related_controls:
  - WAF-REL-060
  - WAF-REL-010
  - WAF-AGN-040
  - WAF-AGN-050
  - WAF-COST-020
  - WAF-OPS-030
  - WAF-OPS-040
  - WAF-OPS-090
  - WAF-PERF-020
  - WAF-PERF-040
  - WAF-PERF-050
  - WAF-SOV-030
description: 'Production and staging workloads MUST undergo structured chaos engineering experiments at minimum quarterly.
  Experiments MUST be based on hypothesis-driven testing against defined failure modes. Results MUST be documented and deviations
  from expected behavior MUST trigger reliability improvements. Chaos experiments MUST be run in staging before production.
  Production chaos MUST have defined blast radius limits, rollback procedures, and active monitoring during execution. Ad-hoc
  or unsanctioned "accidental chaos" is not a substitute.

  '
regulatory_mapping:
- framework: ITIL 4
  controls:
  - Problem Management
  - Service Continuity Management
- framework: SRE Book (Google)
  controls:
  - Chapter 33 – Lessons Learned from Other Industries
  - DiRT (Disaster Recovery Testing)
- framework: ISO 27001:2022
  controls:
  - A.17.1.3 – Verify, review and evaluate information security continuity
checks:
- id: waf-rel-090.tf.aws.fis-experiment-template
  engine: terraform
  automated: true
  title: AWS FIS experiment templates must define stop conditions
  provider: aws
  description: AWS Fault Injection Simulator experiment templates must define stop_condition blocks to automatically abort
    experiments when error budget thresholds are exceeded.
  expected: 'true'
  remediation: Add a stop_condition block to the aws_fis_experiment_template referencing a CloudWatch alarm that triggers
    when error budget is consumed.\n
  example:
    compliant: "resource \"aws_fis_experiment_template\" \"az_failure\" {\n  description = \"Hypothesis: Service recovers\
      \ from AZ failure within 60s without SLO violation\"\n  role_arn    = aws_iam_role.fis.arn\n\n  stop_condition {\n \
      \   source = \"aws:cloudwatch:alarm\"\n    value  = aws_cloudwatch_metric_alarm.slo_burn_rate.arn\n  }\n\n  action {\n\
      \    name      = \"terminate-instances-az1\"\n    action_id = \"aws:ec2:terminate-instances\"\n    target {\n      key\
      \   = \"Instances\"\n      value = \"az1-instances\"\n    }\n  }\n\n  target {\n    name           = \"az1-instances\"\
      \n    resource_type  = \"aws:ec2:instance\"\n    selection_mode = \"PERCENT(25)\"\n    resource_tag {\n      key   =\
      \ \"availability-zone\"\n      value = \"eu-west-1a\"\n    }\n  }\n}\n"
    non_compliant: "resource \"aws_fis_experiment_template\" \"az_failure\" {\n  description = \"AZ failure test\"\n  role_arn\
      \    = aws_iam_role.fis.arn\n  # Missing: stop_condition – experiment has no abort mechanism\n  # WAF-REL-090 violation\n\
      \  action {\n    name      = \"terminate-instances\"\n    action_id = \"aws:ec2:terminate-instances\"\n    target {\n\
      \      key   = \"Instances\"\n      value = \"all-instances\"\n    }\n  }\n  target {\n    name           = \"all-instances\"\
      \n    resource_type  = \"aws:ec2:instance\"\n    selection_mode = \"ALL\"\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_fis_experiment_template
  assertions:
  - attribute: description
    op: not_empty
    message: FIS experiment must have a descriptive description with hypothesis.
  - attribute: stop_condition
    op: attribute_exists
    message: FIS experiment must define at least one stop_condition.
  - attribute: role_arn
    op: not_empty
    message: FIS experiment must specify an IAM role ARN.
  on_fail: violation
- id: waf-rel-090.tf.azurerm.chaos-studio-experiment
  engine: terraform
  automated: true
  title: Azure Chaos Studio experiments must target non-production environments first
  provider: azurerm
  description: Azure Chaos Studio experiments must have a name and location configured and should target resources tagged
    with the correct environment.
  expected: 'true'
  remediation: Configure azurerm_chaos_studio_experiment with name, resource_group_name, location, and identity. Define the
    experiment steps in the schema_version block.\n
  example:
    compliant: "resource \"azurerm_chaos_studio_experiment\" \"pod_failure\" {\n  name                = \"payment-api-pod-failure-staging\"\
      \n  location            = azurerm_resource_group.staging.location\n  resource_group_name = azurerm_resource_group.staging.name\n\
      \n  identity {\n    type = \"SystemAssigned\"\n  }\n\n  schema_version = \"2.0\"\n  steps {\n    name = \"pod-failure-step\"\
      \n    branches {\n      name = \"main-branch\"\n      actions {\n        action_urn = \"urn:csci:microsoft:azureKubernetesServiceChaosMesh:podChaos/2.2\"\
      \n        duration   = \"PT5M\"\n      }\n    }\n  }\n}\n"
    non_compliant: '# No chaos experiments configured – WAF-REL-090 violation

      # Resilience claims not validated by fault injection

      '
  scope:
    block_type: resource
    resource_types:
    - azurerm_chaos_studio_experiment
  assertions:
  - attribute: name
    op: not_empty
    message: Chaos Studio experiment must have a descriptive name.
  - attribute: location
    op: not_empty
    message: Chaos Studio experiment must specify a location.
  - attribute: identity
    op: attribute_exists
    message: Chaos Studio experiment must define an identity for execution.
  on_fail: violation
- id: waf-rel-090.tf.google.fault-injection-test
  engine: terraform
  automated: true
  title: GCP Cloud Run services should have fault injection testing configured
  provider: google
  description: GCP workloads should use Traffic Director or Cloud Service Mesh fault injection to validate resilience patterns.
    Alternatively, load testing pipelines should include fault scenarios.
  expected: 'true'
  remediation: Configure fault_injection_policy in the default_route_action of the URL map to inject delays or abort responses
    for chaos testing.\n
  example:
    compliant: "resource \"google_compute_url_map\" \"api\" {\n  name = \"payment-api-url-map\"\n\n  default_route_action\
      \ {\n    fault_injection_policy {\n      delay {\n        fixed_delay {\n          seconds = 5\n          nanos   =\
      \ 0\n        }\n        percentage = 10  # 10% of requests get 5s delay\n      }\n      abort {\n        http_status\
      \ = 503\n        percentage  = 5  # 5% abort for chaos testing\n      }\n    }\n    weighted_backend_services {\n  \
      \    backend_service = google_compute_backend_service.api.id\n      weight          = 1000\n    }\n  }\n}\n"
    non_compliant: "resource \"google_compute_url_map\" \"api\" {\n  name            = \"payment-api-url-map\"\n  default_service\
      \ = google_compute_backend_service.api.id\n  # No fault injection configured – resilience not testable\n  # WAF-REL-090\
      \ violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_compute_url_map
  assertions:
  - attribute: name
    op: not_empty
    message: URL map must have a name.
  - attribute: default_route_action
    op: attribute_exists
    message: URL map should define default_route_action for fault injection testing.
  on_fail: violation
- id: waf-rel-090.tf.stackit.rollback-tested
  engine: terraform
  automated: true
  title: Production and staging workloads for stackit
  provider: stackit
  description: Production and staging workloads must be documented in IaC via a rollback-tested tag/label on stackit_project.
    This validates the control is tracked as code.
  expected: 'true'
  remediation: 'Add a rollback-tested tag/label to the stackit_project resource to show the stackit implementation of WAF-REL-090
    is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    rollback-tested = \"true\"\n  }\n}\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing rollback-tested labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: rollback-tested
    message: stackit_project is missing the rollback-tested tag/label.
  on_fail: violation
