checks:
  - id: waf-sec-020.tf.aws.no-admin-policy-attachment
    engine: terraform
    automated: true
    title: 'AdministratorAccess managed policy must not be attached to workload IAM principals'
    provider: aws
    description: 'The AWS-managed AdministratorAccess policy (arn:aws:iam::aws:policy/AdministratorAccess) must not be attached to any IAM role, user, or group used for automated workloads, applications, or CI/CD pipelines.'
    expected: 'true'
    remediation: 'Remove the AdministratorAccess attachment and replace it with a scoped IAM policy that grants only the specific actions and resources required for the workload. Use IAM Access Advisor to identify which permissions were actually used in the last 90 days as a baseline.\n'
    example:
      compliant: |
        resource "aws_iam_role_policy_attachment" "app_policy" {
          role       = aws_iam_role.app_role.name
          policy_arn = aws_iam_policy.app_scoped_policy.arn  # custom, least-privilege policy
        }
        resource "aws_iam_policy" "app_scoped_policy" {
          name = "app-scoped-policy"
          policy = jsonencode({
            Version = "2012-10-17"
            Statement = [{
              Effect   = "Allow"
              Action   = ["s3:GetObject", "s3:PutObject"]
              Resource = "arn:aws:s3:::my-app-bucket/*"
            }]
          })
        }
        
      non_compliant: |
        resource "aws_iam_role_policy_attachment" "bad" {
          role       = aws_iam_role.app_role.name
          policy_arn = "arn:aws:iam::aws:policy/AdministratorAccess"
          # WAF-SEC-020 violation: AdministratorAccess must not be attached to workload roles
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_iam_role_policy_attachment
        - aws_iam_user_policy_attachment
        - aws_iam_group_policy_attachment
    assertions:
      - attribute: 'policy_arn'
        op: 'not_equals'
        message: 'AdministratorAccess managed policy MUST NOT be attached to any IAM principal.'
        expected: 'arn:aws:iam::aws:policy/AdministratorAccess'
    on_fail: violation
  - id: waf-sec-020.tf.aws.no-inline-wildcard-policy
    engine: terraform
    automated: true
    title: 'IAM policies must not combine wildcard actions with wildcard resources'
    provider: aws
    description: "Inline and managed IAM policies must not contain statements with Action: '*' combined with Resource: '*'. This check requires manual review or a supplementary static analysis tool (e.g., Cloudsplaining, Checkov) as Terraform plan output must be parsed for policy document content."
    expected: 'true'
    remediation: 'Replace wildcard actions with a specific list of required API actions. Replace wildcard resources with specific ARNs or ARN patterns. Use IAM Access Advisor to determine which actions are actually used by the role.\n'
    example:
      compliant: |
        resource "aws_iam_policy" "scoped" {
          name = "scoped-s3-policy"
          policy = jsonencode({
            Version = "2012-10-17"
            Statement = [{
              Effect   = "Allow"
              Action   = ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"]
              Resource = "arn:aws:s3:::my-bucket/*"
            }]
          })
        }
        
      non_compliant: |
        resource "aws_iam_policy" "wildcard" {
          name = "bad-wildcard-policy"
          policy = jsonencode({
            Version = "2012-10-17"
            Statement = [{
              Effect   = "Allow"
              Action   = "*"          # WAF-SEC-020 violation
              Resource = "*"          # Combined wildcard = full admin
            }]
          })
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_iam_policy
        - aws_iam_role_policy
        - aws_iam_user_policy
        - aws_iam_group_policy
    assertions:
      - attribute: 'policy'
        op: 'json_not_contains_pattern'
        message: "IAM policy must not use wildcard Action '*'. Use scoped actions instead."
        pattern: '"Action":\\s*"\\*"'
    on_fail: violation
