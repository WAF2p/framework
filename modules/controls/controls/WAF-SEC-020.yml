description: 'IAM policies MUST NOT grant wildcard actions (Action: "*") combined with wildcard resources (Resource: "*").
  The AWS-managed AdministratorAccess policy MUST NOT be attached to roles used for automated workloads, CI/CD pipelines,
  or application service accounts. All IAM permissions MUST follow the principle of least privilege, granting only the minimum
  rights required for the intended function. Privilege escalation paths MUST be identified and eliminated using IAM Access
  Analyzer.

  '
