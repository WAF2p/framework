checks:
- id: waf-sec-020.tf.aws.no-admin-policy-attachment
  engine: terraform
  automated: true
  title: AdministratorAccess managed policy must not be attached to workload IAM principals
  provider: aws
  description: The AWS-managed AdministratorAccess policy (arn:aws:iam::aws:policy/AdministratorAccess) must not be attached
    to any IAM role, user, or group used for automated workloads, applications, or CI/CD pipelines.
  expected: 'true'
  remediation: Remove the AdministratorAccess attachment and replace it with a scoped IAM policy that grants only the specific
    actions and resources required for the workload. Use IAM Access Advisor to identify which permissions were actually used
    in the last 90 days as a baseline.\n
  example:
    compliant: "resource \"aws_iam_role_policy_attachment\" \"app_policy\" {\n  role       = aws_iam_role.app_role.name\n\
      \  policy_arn = aws_iam_policy.app_scoped_policy.arn  # custom, least-privilege policy\n}\nresource \"aws_iam_policy\"\
      \ \"app_scoped_policy\" {\n  name = \"app-scoped-policy\"\n  policy = jsonencode({\n    Version = \"2012-10-17\"\n \
      \   Statement = [{\n      Effect   = \"Allow\"\n      Action   = [\"s3:GetObject\", \"s3:PutObject\"]\n      Resource\
      \ = \"arn:aws:s3:::my-app-bucket/*\"\n    }]\n  })\n}\n"
    non_compliant: "resource \"aws_iam_role_policy_attachment\" \"bad\" {\n  role       = aws_iam_role.app_role.name\n  policy_arn\
      \ = \"arn:aws:iam::aws:policy/AdministratorAccess\"\n  # WAF-SEC-020 violation: AdministratorAccess must not be attached\
      \ to workload roles\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_iam_role_policy_attachment
    - aws_iam_user_policy_attachment
    - aws_iam_group_policy_attachment
  assertions:
  - attribute: policy_arn
    op: not_equals
    message: AdministratorAccess managed policy MUST NOT be attached to any IAM principal.
    expected: arn:aws:iam::aws:policy/AdministratorAccess
  on_fail: violation
- id: waf-sec-020.tf.aws.no-inline-wildcard-policy
  engine: terraform
  automated: true
  title: IAM policies must not combine wildcard actions with wildcard resources
  provider: aws
  description: 'Inline and managed IAM policies must not contain statements with Action: ''*'' combined with Resource: ''*''.
    This check requires manual review or a supplementary static analysis tool (e.g., Cloudsplaining, Checkov) as Terraform
    plan output must be parsed for policy document content.'
  expected: 'true'
  remediation: Replace wildcard actions with a specific list of required API actions. Replace wildcard resources with specific
    ARNs or ARN patterns. Use IAM Access Advisor to determine which actions are actually used by the role.\n
  example:
    compliant: "resource \"aws_iam_policy\" \"scoped\" {\n  name = \"scoped-s3-policy\"\n  policy = jsonencode({\n    Version\
      \ = \"2012-10-17\"\n    Statement = [{\n      Effect   = \"Allow\"\n      Action   = [\"s3:GetObject\", \"s3:PutObject\"\
      , \"s3:DeleteObject\"]\n      Resource = \"arn:aws:s3:::my-bucket/*\"\n    }]\n  })\n}\n"
    non_compliant: "resource \"aws_iam_policy\" \"wildcard\" {\n  name = \"bad-wildcard-policy\"\n  policy = jsonencode({\n\
      \    Version = \"2012-10-17\"\n    Statement = [{\n      Effect   = \"Allow\"\n      Action   = \"*\"          # WAF-SEC-020\
      \ violation\n      Resource = \"*\"          # Combined wildcard = full admin\n    }]\n  })\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_iam_policy
    - aws_iam_role_policy
    - aws_iam_user_policy
    - aws_iam_group_policy
  assertions:
  - attribute: policy
    op: json_not_contains_pattern
    message: IAM policy must not use wildcard Action '*'. Use scoped actions instead.
    pattern: '"Action":\\s*"\\*"'
  on_fail: violation
- id: waf-sec-020.tf.azurerm.no-owner-contributor-assignment
  engine: terraform
  automated: true
  title: Azure built-in Owner or Contributor roles must not be assigned to workload principals
  provider: azurerm
  description: azurerm_role_assignment resources must not use the built-in Owner or Contributor role definitions for application
    service principals, CI/CD pipelines, or automated workloads. Use custom or built-in roles scoped to least privilege.
  expected: 'true'
  remediation: Replace azurerm_role_assignment entries using "Owner" or "Contributor" with scoped custom roles or built-in
    roles that grant only the actions required (e.g., Reader, Storage Blob Contributor, Key Vault Secrets User).\n
  example:
    compliant: "resource \"azurerm_role_assignment\" \"app_storage\" {\n  scope                = azurerm_storage_account.app.id\n\
      \  role_definition_name = \"Storage Blob Data Contributor\"\n  principal_id         = azuread_service_principal.app.object_id\n\
      }\n"
    non_compliant: "resource \"azurerm_role_assignment\" \"bad\" {\n  scope                = data.azurerm_subscription.current.id\n\
      \  role_definition_name = \"Owner\"\n  principal_id         = azuread_service_principal.cicd.object_id\n  # WAF-SEC-020\
      \ violation: Owner assigned to workload principal\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_role_assignment
  assertions:
  - attribute: role_definition_name
    op: not_in
    message: Owner and Contributor built-in roles must not be assigned to workload principals.
    expected:
    - Owner
    - Contributor
  on_fail: violation
- id: waf-sec-020.tf.azurerm.custom-role-no-wildcard
  engine: terraform
  automated: true
  title: Azure custom role definitions must not include wildcard actions
  provider: azurerm
  description: azurerm_role_definition resources must not declare permissions with Action "*" or NotAction "*" combined with
    assignable scopes that grant broad access. Custom roles should list explicit actions and data actions.
  expected: 'true'
  remediation: Replace wildcard actions in azurerm_role_definition permissions blocks with explicit Microsoft.* actions required
    by the workload. Avoid NotAction "*" patterns.\n
  example:
    compliant: "resource \"azurerm_role_definition\" \"scoped\" {\n  name        = \"App Scoped Role\"\n  scope       = data.azurerm_subscription.current.id\n\
      \  permissions {\n    actions     = [\"Microsoft.Storage/storageAccounts/read\"]\n    not_actions = []\n  }\n  assignable_scopes\
      \ = [data.azurerm_subscription.current.id]\n}\n"
    non_compliant: "resource \"azurerm_role_definition\" \"wildcard\" {\n  name  = \"Wildcard Admin\"\n  scope = data.azurerm_subscription.current.id\n\
      \  permissions {\n    actions     = [\"*\"]  # WAF-SEC-020 violation: wildcard action\n    not_actions = []\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_role_definition
  assertions:
  - attribute: permissions
    op: not_contains
    message: Custom role permissions must not contain wildcard action "*".
    expected: '*'
  on_fail: violation
- id: waf-sec-020.tf.google.no-basic-project-roles
  engine: terraform
  automated: true
  title: GCP basic project roles must not be bound to workload principals
  provider: google
  description: google_project_iam_member and google_project_iam_binding resources must not use roles/owner, roles/editor,
    or roles/viewer for application service accounts, CI/CD pipelines, or automated workloads.
  expected: 'true'
  remediation: Remove google_project_iam_member / google_project_iam_binding entries using roles/owner, roles/editor, or roles/viewer.
    Replace with predefined service-specific roles (e.g., roles/storage.objectAdmin) or custom roles listing only required
    permissions.\n
  example:
    compliant: "resource \"google_project_iam_member\" \"app_storage\" {\n  project = var.project_id\n  role    = \"roles/storage.objectAdmin\"\
      \n  member  = \"serviceAccount:${google_service_account.app.email}\"\n}\n"
    non_compliant: "resource \"google_project_iam_member\" \"bad\" {\n  project = var.project_id\n  role    = \"roles/editor\"\
      \  # WAF-SEC-020 violation: overly permissive basic role\n  member  = \"serviceAccount:${google_service_account.cicd.email}\"\
      \n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_project_iam_member
    - google_project_iam_binding
    - google_organization_iam_member
    - google_organization_iam_binding
  assertions:
  - attribute: role
    op: not_in
    message: GCP basic roles must not be assigned to workload principals.
    expected:
    - roles/owner
    - roles/editor
    - roles/viewer
  on_fail: violation
- id: waf-sec-020.tf.google.custom-role-no-wildcard
  engine: terraform
  automated: true
  title: GCP custom IAM roles must not include wildcard permissions
  provider: google
  description: google_project_iam_custom_role and google_organization_iam_custom_role resources must not include "*" in their
    permissions list. Permissions should be explicit GCP service methods.
  expected: 'true'
  remediation: Replace wildcard permissions in google_project_iam_custom_role with explicit permissions required by the workload.
    Audit the custom role using IAM Policy Analyzer or gcloud iam roles list.\n
  example:
    compliant: "resource \"google_project_iam_custom_role\" \"scoped\" {\n  project = var.project_id\n  role_id = \"appScoped\"\
      \n  title   = \"App Scoped Role\"\n  permissions = [\n    \"storage.objects.get\",\n    \"storage.objects.create\",\n\
      \  ]\n}\n"
    non_compliant: "resource \"google_project_iam_custom_role\" \"wildcard\" {\n  project = var.project_id\n  role_id = \"\
      wildcardAdmin\"\n  title   = \"Wildcard Admin\"\n  permissions = [\"*\"]  # WAF-SEC-020 violation: wildcard permission\n\
      }\n"
  scope:
    block_type: resource
    resource_types:
    - google_project_iam_custom_role
    - google_organization_iam_custom_role
  assertions:
  - attribute: permissions
    op: not_contains
    message: Custom role permissions must not contain wildcard "*".
    expected: '*'
  on_fail: violation
- id: waf-sec-020.config.stackit.stackit-identity-access
  engine: config
  automated: true
  title: STACKIT access controls must follow least privilege and be documented
  provider: stackit
  description: A version-controlled policy document must exist at `docs/security/waf-sec-020-stackit-identity-access.md` and
    document the STACKIT implementation of this control. The checker validates that the file exists and contains a normative
    requirement statement (MUST/SHALL/required/mandatory).
  expected: 'true'
  remediation: 'Create or update `docs/security/waf-sec-020-stackit-identity-access.md`. State the requirement, how it is
    implemented for STACKIT, the review cadence, and the owner.

    '
  example:
    compliant: '|

      docs/security/waf-sec-020-stackit-identity-access.md:

      - The STACKIT implementation of WAF-SEC-020 is documented.

      - Implementation status and owner are recorded.

      - Review cadence is defined (e.g. quarterly).

      '
    non_compliant: '|

      # `docs/security/waf-sec-020-stackit-identity-access.md` is missing or does not contain a normative requirement.

      # WAF-SEC-020 violation: STACKIT control is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/security/waf-sec-020-stackit-identity-access.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/security/waf-sec-020-stackit-identity-access.md` must contain a normative requirement statement.
  on_fail: violation
