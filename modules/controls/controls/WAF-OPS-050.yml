# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-OPS-050
id: WAF-OPS-050
pillar: operational
severity: medium
type:
  - governance
  - configuration
description: |
  All changes to production systems MUST go through a defined change management process that includes risk assessment, approval workflow for high-risk changes, deployment freeze policies for critical periods, and post-deployment verification. Change records MUST be linked to deployment artifacts and stored with sufficient context for audit.
regulatory_mapping:
  - framework: 'ISO/IEC 20000-1'
    controls:
      - 'Change and deployment management'
      - 'Release and deployment management'
  - framework: 'ITIL 4'
    controls:
      - 'Change enablement'
      - 'Release management'
  - framework: 'SOC 2 Type II'
    controls:
      - 'CC8.1 – Change Management – Authorized Changes'
  - framework: 'AWS Well-Architected Framework'
    controls:
      - 'Operational Excellence Pillar – OPS 6: How do you deploy your workload?'
  - framework: 'PCI DSS v4.0'
    controls:
      - 'Requirement 6.5: Changes to all system components are managed securely'
checks:
  - id: waf-ops-050.tf.aws.codepipeline-manual-approval
    engine: terraform
    automated: true
    title: 'Production CodePipeline must include a manual approval stage before deployment'
    provider: aws
    description: 'AWS CodePipeline pipelines deploying to production MUST include a manual approval action before the production deploy stage to enforce change review.'
    expected: 'true'
    remediation: 'Add a stage with an Approval action before the production Deploy stage in your CodePipeline. Set the approval SNS topic and add a message referencing the change ticket.\n'
    example:
      compliant: |
        resource "aws_codepipeline" "app_pipeline" {
          name     = "payment-service-pipeline"
          role_arn = aws_iam_role.codepipeline_role.arn
        
          artifact_store {
            location = aws_s3_bucket.artifacts.bucket
            type     = "S3"
          }
        
          stage { name = "Source" /* ... */ }
          stage { name = "Build"  /* ... */ }
          stage { name = "Deploy-Staging" /* ... */ }
        
          stage {
            name = "Approval-Production"
            action {
              name     = "ManualApproval"
              category = "Approval"
              owner    = "AWS"
              provider = "Manual"
              version  = "1"
              configuration = {
                NotificationArn = aws_sns_topic.approvals.arn
                CustomData      = "Review checklist: https://wiki/deploy-checklist"
              }
            }
          }
        
          stage { name = "Deploy-Production" /* ... */ }
        }
        
      non_compliant: |
        resource "aws_codepipeline" "app_pipeline" {
          # Pipeline goes directly from staging to production
          # with no approval gate – WAF-OPS-050 Violation
          stage { name = "Source" }
          stage { name = "Build" }
          stage { name = "Deploy-Production" }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_codepipeline
    assertions:
      - attribute: 'stage'
        op: 'attribute_exists'
        message: 'Pipeline must define at least one stage with approval action.'
    on_fail: violation
  - id: waf-ops-050.tf.azurerm.devops-environment-approval
    engine: terraform
    automated: true
    title: 'Azure DevOps production environment must require approval checks'
    provider: azurerm
    description: 'Azure DevOps environments used for production deployments MUST have approval checks configured to enforce the change review process.'
    expected: 'true'
    remediation: 'Configure approval checks on the azuredevops_environment used for production via azuredevops_check_approval or the Azure DevOps portal after environment creation.\n'
    example:
      compliant: |
        resource "azuredevops_environment" "production" {
          project_id  = azuredevops_project.main.id
          name        = "production"
          description = "Production environment – requires approval before deployment"
        }
        
        # Configure approval check via API or portal:
        # Approvers: tech-lead group, minimum 1 approval required
        
      non_compliant: |
        resource "azuredevops_environment" "production" {
          project_id = azuredevops_project.main.id
          name       = "production"
          # No approval check configured – WAF-OPS-050 Violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - azuredevops_environment
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Azure DevOps environment must have a name.'
    on_fail: violation
