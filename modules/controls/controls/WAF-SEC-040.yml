checks:
- id: waf-sec-040.tf.aws.alb-https-listener
  engine: terraform
  automated: true
  title: ALB and NLB listeners must use HTTPS, not HTTP
  provider: aws
  description: Application and Network Load Balancer listeners must be configured with the HTTPS protocol (or TLS for NLB). Listeners configured with plain HTTP on port 80 are only acceptable if they redirect to HTTPS via a fixed-response redirect rule and do not forward traffic to targets.
  expected: 'true'
  remediation: Change the listener protocol to HTTPS and provide a valid ACM certificate ARN. If a port 80 listener is required for redirect purposes, change the default_action to type = "redirect" with redirect { protocol = "HTTPS", status_code = "HTTP_301" }.\n
  example:
    compliant: "resource \"aws_lb_listener\" \"https\" {\n  load_balancer_arn = aws_lb.main.arn\n  port              = 443\n  protocol          = \"HTTPS\"\n  ssl_policy        = \"ELBSecurityPolicy-TLS13-1-2-2021-06\"\n  certificate_arn   = aws_acm_certificate.main.arn\n  default_action {\n    type             = \"forward\"\n    target_group_arn = aws_lb_target_group.app.arn\n  }\n}\nresource \"aws_lb_listener\" \"redirect_http\" {\n  load_balancer_arn = aws_lb.main.arn\n  port              = 80\n  protocol          = \"HTTP\"\n  default_action {\n    type = \"redirect\"\n    redirect {\n      port        = \"443\"\n      protocol    = \"HTTPS\"\n      status_code = \"HTTP_301\"\n    }\n  }\n}\n"
    non_compliant: "resource \"aws_lb_listener\" \"http\" {\n  load_balancer_arn = aws_lb.main.arn\n  port              = 80\n  protocol          = \"HTTP\"   # WAF-SEC-040 violation: plain HTTP forwarding\n  default_action {\n    type             = \"forward\"\n    target_group_arn = aws_lb_target_group.app.arn\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_lb_listener
    - aws_alb_listener
  assertions:
  - attribute: protocol
    op: not_equals
    message: Load balancer listener MUST use HTTPS (or HTTP-to-HTTPS redirect), not plain HTTP forwarding.
    expected: HTTP
  on_fail: violation
- id: waf-sec-040.tf.aws.cloudfront-tls-policy
  engine: terraform
  automated: true
  title: CloudFront distributions must enforce TLS 1.2 or higher
  provider: aws
  description: CloudFront distributions must have a viewer_certificate block with minimum_protocol_version set to at least TLSv1.2_2021 to prevent connections using outdated TLS versions.
  expected: 'true'
  remediation: Add a viewer_certificate block to the aws_cloudfront_distribution resource. Set minimum_protocol_version = "TLSv1.2_2021" and ssl_support_method = "sni-only". Use a custom ACM certificate instead of the default CloudFront certificate for production workloads with custom domains.\n
  example:
    compliant: "resource \"aws_cloudfront_distribution\" \"main\" {\n  # ... origin and cache behavior config\n  viewer_certificate {\n    acm_certificate_arn      = aws_acm_certificate.cdn.arn\n    ssl_support_method       = \"sni-only\"\n    minimum_protocol_version = \"TLSv1.2_2021\"\n  }\n}\n"
    non_compliant: "resource \"aws_cloudfront_distribution\" \"main\" {\n  # ... origin and cache behavior config\n  viewer_certificate {\n    cloudfront_default_certificate = true\n    # minimum_protocol_version not set – defaults to TLSv1 (WAF-SEC-040 violation)\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_cloudfront_distribution
  assertions:
  - attribute: viewer_certificate
    op: attribute_exists
    message: CloudFront distribution must have an explicit viewer_certificate block configured.
  on_fail: violation
- id: waf-sec-040.tf.azurerm.web-app-min-tls
  engine: terraform
  automated: true
  title: Azure App Service and Function Apps must enforce TLS 1.2
  provider: azurerm
  description: All azurerm_linux_web_app, azurerm_windows_web_app, azurerm_linux_function_app, and azurerm_windows_function_app resources must set site_config.minimum_tls_version to "1.2".
  expected: 'true'
  remediation: 'Set minimum_tls_version = "1.2" in the site_config block of every App Service and Function App resource.

    '
  example:
    compliant: "resource \"azurerm_linux_web_app\" \"app\" {\n  name                = \"app-service\"\n  resource_group_name = azurerm_resource_group.main.name\n  location            = azurerm_resource_group.main.location\n  service_plan_id     = azurerm_service_plan.app.id\n  site_config {\n    minimum_tls_version = \"1.2\"\n    ftps_state          = \"Disabled\"\n  }\n}\n"
    non_compliant: "resource \"azurerm_linux_web_app\" \"app\" {\n  name                = \"app-service\"\n  resource_group_name = azurerm_resource_group.main.name\n  location            = azurerm_resource_group.main.location\n  service_plan_id     = azurerm_service_plan.app.id\n  site_config {\n    # minimum_tls_version defaults to \"1.0\" on older APIs\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_linux_web_app
    - azurerm_windows_web_app
    - azurerm_linux_function_app
    - azurerm_windows_function_app
  assertions:
  - attribute: site_config.minimum_tls_version
    op: equals
    expected: '1.2'
    message: App Service / Function App must enforce TLS 1.2 minimum.
  on_fail: violation
- id: waf-sec-040.tf.azurerm.cdn-no-http
  engine: terraform
  automated: true
  title: Azure CDN endpoints must not allow plain HTTP delivery
  provider: azurerm
  description: All azurerm_cdn_endpoint resources must set is_http_allowed to false so content is only served over HTTPS.
  expected: 'true'
  remediation: 'Set is_http_allowed = false on every azurerm_cdn_endpoint resource. Configure HTTPS delivery and a valid custom domain certificate if needed.

    '
  example:
    compliant: "resource \"azurerm_cdn_endpoint\" \"app\" {\n  name                      = \"app-cdn\"\n  profile_name              = azurerm_cdn_profile.app.name\n  location                  = azurerm_resource_group.main.location\n  resource_group_name       = azurerm_resource_group.main.name\n  is_http_allowed           = false\n  origin_host_header        = azurerm_storage_account.app.primary_web_host\n}\n"
    non_compliant: "resource \"azurerm_cdn_endpoint\" \"app\" {\n  name                      = \"app-cdn\"\n  profile_name              = azurerm_cdn_profile.app.name\n  location                  = azurerm_resource_group.main.location\n  resource_group_name       = azurerm_resource_group.main.name\n  # is_http_allowed defaults to true\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_cdn_endpoint
  assertions:
  - attribute: is_http_allowed
    op: is_false
    message: CDN endpoint must not allow plain HTTP delivery.
  on_fail: violation
- id: waf-sec-040.tf.google.ssl-policy-tls-1-2
  engine: terraform
  automated: true
  title: Google Cloud SSL policies must enforce TLS 1.2 or higher
  provider: google
  description: All google_compute_ssl_policy resources must set min_tls_version to "TLS_1_2" or "TLS_1_3".
  expected: 'true'
  remediation: 'Set min_tls_version = "TLS_1_2" (or "TLS_1_3") on every google_compute_ssl_policy resource.

    '
  example:
    compliant: "resource \"google_compute_ssl_policy\" \"app\" {\n  name            = \"app-ssl-policy\"\n  profile         = \"CUSTOM\"\n  min_tls_version = \"TLS_1_2\"\n  custom_features = [\"TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256\"]\n}\n"
    non_compliant: "resource \"google_compute_ssl_policy\" \"app\" {\n  name            = \"app-ssl-policy\"\n  profile         = \"COMPATIBLE\"\n  # min_tls_version defaults to TLS_1_0 in COMPATIBLE profile\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_compute_ssl_policy
  assertions:
  - attribute: min_tls_version
    op: in
    expected:
    - TLS_1_2
    - TLS_1_3
    message: SSL policy must enforce TLS 1.2 or higher.
  on_fail: violation
- id: waf-sec-040.tf.stackit.resource-data-class-tags
  engine: terraform
  automated: true
  title: STACKIT resources must be tagged with data classification
  provider: stackit
  description: All STACKIT resources that store or process data must carry a data-class tag (public, internal, confidential, restricted) to enforce appropriate security controls.
  expected: 'true'
  remediation: Add a data-class tag to all STACKIT resources. Use a shared tagging module and enforce it via CI/CD checks.\n
  example:
    compliant: "resource \"stackit_object_storage_bucket\" \"app\" {\n  project_id = var.stackit_project_id\n  name       = \"app-data\"\n  tags = {\n    data-class = \"confidential\"\n    owner      = \"platform-team\"\n  }\n}\n"
    non_compliant: "resource \"stackit_object_storage_bucket\" \"app\" {\n  project_id = var.stackit_project_id\n  name       = \"app-data\"\n  # Missing data-class tag – WAF-SEC-040 violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_object_storage_bucket
    - stackit_postgres_flex_instance
    - stackit_mysql_instance
    - stackit_redis_instance
    - stackit_opensearch_instance
    - stackit_load_balancer
    - stackit_network
  assertions:
  - attribute: tags
    op: key_exists
    key: data-class
    message: STACKIT resource must have a 'data-class' tag.
  on_fail: violation
- id: waf-sec-040.tf.ovh.resource-data-class-tags
  engine: terraform
  automated: true
  title: OVHcloud resources must be tagged with data classification
  provider: ovh
  description: All OVHcloud resources that store or process data must carry a data-class tag or label (public, internal, confidential, restricted) to enforce appropriate security controls.
  expected: 'true'
  remediation: Add a data-class tag or label to all OVHcloud resources. Document the tagging scheme and enforce it via CI/CD checks.\n
  example:
    compliant: "resource \"ovh_cloud_project_instance\" \"app\" {\n  project_id = var.ovh_project_id\n  name       = \"app-vm\"\n  flavor     = \"b2-7\"\n  image      = \"Ubuntu 22.04\"\n  tags = {\n    data-class = \"confidential\"\n    owner      = \"platform-team\"\n  }\n}\n"
    non_compliant: "resource \"ovh_cloud_project_instance\" \"app\" {\n  project_id = var.ovh_project_id\n  name       = \"app-vm\"\n  flavor     = \"b2-7\"\n  image      = \"Ubuntu 22.04\"\n  # Missing data-class tag – WAF-SEC-040 violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - ovh_cloud_project_instance
    - ovh_vps
    - ovh_dedicated_server
    - ovh_cloud_project
  assertions:
  - attribute: tags
    op: key_exists
    key: data-class
    message: OVHcloud resource must have a 'data-class' tag or label.
  on_fail: violation
- id: waf-sec-040.tf.hcloud.resource-data-class-labels
  engine: terraform
  automated: true
  title: Hetzner Cloud resources must be labelled with data classification
  provider: hcloud
  description: All Hetzner Cloud resources that store or process data must carry a data-class label (public, internal, confidential, restricted) to enforce appropriate security controls.
  expected: 'true'
  remediation: Add a data-class label to all Hetzner Cloud resources. Use a shared labelling module and enforce it via CI/CD checks.\n
  example:
    compliant: "resource \"hcloud_server\" \"app\" {\n  name        = \"app-server\"\n  server_type = \"cx22\"\n  image       = \"ubuntu-22.04\"\n  labels = {\n    data-class = \"confidential\"\n    owner      = \"platform-team\"\n  }\n}\n"
    non_compliant: "resource \"hcloud_server\" \"app\" {\n  name        = \"app-server\"\n  server_type = \"cx22\"\n  image       = \"ubuntu-22.04\"\n  # Missing data-class label – WAF-SEC-040 violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - hcloud_server
    - hcloud_volume
    - hcloud_network
    - hcloud_load_balancer
  assertions:
  - attribute: labels
    op: key_exists
    key: data-class
    message: Hetzner Cloud resource must have a 'data-class' label.
  on_fail: violation
