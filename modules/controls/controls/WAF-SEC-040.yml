checks:
  - id: waf-sec-040.tf.aws.alb-https-listener
    engine: terraform
    automated: true
    title: 'ALB and NLB listeners must use HTTPS, not HTTP'
    provider: aws
    description: 'Application and Network Load Balancer listeners must be configured with the HTTPS protocol (or TLS for NLB). Listeners configured with plain HTTP on port 80 are only acceptable if they redirect to HTTPS via a fixed-response redirect rule and do not forward traffic to targets.'
    expected: 'true'
    remediation: 'Change the listener protocol to HTTPS and provide a valid ACM certificate ARN. If a port 80 listener is required for redirect purposes, change the default_action to type = "redirect" with redirect { protocol = "HTTPS", status_code = "HTTP_301" }.\n'
    example:
      compliant: |
        resource "aws_lb_listener" "https" {
          load_balancer_arn = aws_lb.main.arn
          port              = 443
          protocol          = "HTTPS"
          ssl_policy        = "ELBSecurityPolicy-TLS13-1-2-2021-06"
          certificate_arn   = aws_acm_certificate.main.arn
          default_action {
            type             = "forward"
            target_group_arn = aws_lb_target_group.app.arn
          }
        }
        resource "aws_lb_listener" "redirect_http" {
          load_balancer_arn = aws_lb.main.arn
          port              = 80
          protocol          = "HTTP"
          default_action {
            type = "redirect"
            redirect {
              port        = "443"
              protocol    = "HTTPS"
              status_code = "HTTP_301"
            }
          }
        }
        
      non_compliant: |
        resource "aws_lb_listener" "http" {
          load_balancer_arn = aws_lb.main.arn
          port              = 80
          protocol          = "HTTP"   # WAF-SEC-040 violation: plain HTTP forwarding
          default_action {
            type             = "forward"
            target_group_arn = aws_lb_target_group.app.arn
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_lb_listener
        - aws_alb_listener
    assertions:
      - attribute: 'protocol'
        op: 'not_equals'
        message: 'Load balancer listener MUST use HTTPS (or HTTP-to-HTTPS redirect), not plain HTTP forwarding.'
        expected: 'HTTP'
    on_fail: violation
  - id: waf-sec-040.tf.aws.cloudfront-tls-policy
    engine: terraform
    automated: true
    title: 'CloudFront distributions must enforce TLS 1.2 or higher'
    provider: aws
    description: 'CloudFront distributions must have a viewer_certificate block with minimum_protocol_version set to at least TLSv1.2_2021 to prevent connections using outdated TLS versions.'
    expected: 'true'
    remediation: 'Add a viewer_certificate block to the aws_cloudfront_distribution resource. Set minimum_protocol_version = "TLSv1.2_2021" and ssl_support_method = "sni-only". Use a custom ACM certificate instead of the default CloudFront certificate for production workloads with custom domains.\n'
    example:
      compliant: |
        resource "aws_cloudfront_distribution" "main" {
          # ... origin and cache behavior config
          viewer_certificate {
            acm_certificate_arn      = aws_acm_certificate.cdn.arn
            ssl_support_method       = "sni-only"
            minimum_protocol_version = "TLSv1.2_2021"
          }
        }
        
      non_compliant: |
        resource "aws_cloudfront_distribution" "main" {
          # ... origin and cache behavior config
          viewer_certificate {
            cloudfront_default_certificate = true
            # minimum_protocol_version not set – defaults to TLSv1 (WAF-SEC-040 violation)
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudfront_distribution
    assertions:
      - attribute: 'viewer_certificate'
        op: 'attribute_exists'
        message: 'CloudFront distribution must have an explicit viewer_certificate block configured.'
    on_fail: violation

  - id: waf-sec-040.tf.azurerm.web-app-min-tls
    engine: terraform
    automated: true
    title: 'Azure App Service and Function Apps must enforce TLS 1.2'
    provider: azurerm
    description: 'All azurerm_linux_web_app, azurerm_windows_web_app, azurerm_linux_function_app, and azurerm_windows_function_app resources must set site_config.minimum_tls_version to "1.2".'
    expected: 'true'
    remediation: |
      Set minimum_tls_version = "1.2" in the site_config block of every App Service and Function App resource.
    example:
      compliant: |
        resource "azurerm_linux_web_app" "app" {
          name                = "app-service"
          resource_group_name = azurerm_resource_group.main.name
          location            = azurerm_resource_group.main.location
          service_plan_id     = azurerm_service_plan.app.id
          site_config {
            minimum_tls_version = "1.2"
            ftps_state          = "Disabled"
          }
        }
      non_compliant: |
        resource "azurerm_linux_web_app" "app" {
          name                = "app-service"
          resource_group_name = azurerm_resource_group.main.name
          location            = azurerm_resource_group.main.location
          service_plan_id     = azurerm_service_plan.app.id
          site_config {
            # minimum_tls_version defaults to "1.0" on older APIs
          }
        }
    scope:
      block_type: resource
      resource_types:
        - azurerm_linux_web_app
        - azurerm_windows_web_app
        - azurerm_linux_function_app
        - azurerm_windows_function_app
    assertions:
      - attribute: 'site_config.minimum_tls_version'
        op: 'equals'
        expected: '1.2'
        message: 'App Service / Function App must enforce TLS 1.2 minimum.'
    on_fail: violation

  - id: waf-sec-040.tf.azurerm.cdn-no-http
    engine: terraform
    automated: true
    title: 'Azure CDN endpoints must not allow plain HTTP delivery'
    provider: azurerm
    description: 'All azurerm_cdn_endpoint resources must set is_http_allowed to false so content is only served over HTTPS.'
    expected: 'true'
    remediation: |
      Set is_http_allowed = false on every azurerm_cdn_endpoint resource. Configure HTTPS delivery and a valid custom domain certificate if needed.
    example:
      compliant: |
        resource "azurerm_cdn_endpoint" "app" {
          name                      = "app-cdn"
          profile_name              = azurerm_cdn_profile.app.name
          location                  = azurerm_resource_group.main.location
          resource_group_name       = azurerm_resource_group.main.name
          is_http_allowed           = false
          origin_host_header        = azurerm_storage_account.app.primary_web_host
        }
      non_compliant: |
        resource "azurerm_cdn_endpoint" "app" {
          name                      = "app-cdn"
          profile_name              = azurerm_cdn_profile.app.name
          location                  = azurerm_resource_group.main.location
          resource_group_name       = azurerm_resource_group.main.name
          # is_http_allowed defaults to true
        }
    scope:
      block_type: resource
      resource_types:
        - azurerm_cdn_endpoint
    assertions:
      - attribute: 'is_http_allowed'
        op: 'is_false'
        message: 'CDN endpoint must not allow plain HTTP delivery.'
    on_fail: violation

  - id: waf-sec-040.tf.google.ssl-policy-tls-1-2
    engine: terraform
    automated: true
    title: 'Google Cloud SSL policies must enforce TLS 1.2 or higher'
    provider: google
    description: 'All google_compute_ssl_policy resources must set min_tls_version to "TLS_1_2" or "TLS_1_3".'
    expected: 'true'
    remediation: |
      Set min_tls_version = "TLS_1_2" (or "TLS_1_3") on every google_compute_ssl_policy resource.
    example:
      compliant: |
        resource "google_compute_ssl_policy" "app" {
          name            = "app-ssl-policy"
          profile         = "CUSTOM"
          min_tls_version = "TLS_1_2"
          custom_features = ["TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"]
        }
      non_compliant: |
        resource "google_compute_ssl_policy" "app" {
          name            = "app-ssl-policy"
          profile         = "COMPATIBLE"
          # min_tls_version defaults to TLS_1_0 in COMPATIBLE profile
        }
    scope:
      block_type: resource
      resource_types:
        - google_compute_ssl_policy
    assertions:
      - attribute: 'min_tls_version'
        op: 'in'
        expected:
          - TLS_1_2
          - TLS_1_3
        message: 'SSL policy must enforce TLS 1.2 or higher.'
    on_fail: violation
