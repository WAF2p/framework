checks:
  - id: waf-sec-040.tf.aws.alb-https-listener
    engine: terraform
    automated: true
    title: 'ALB and NLB listeners must use HTTPS, not HTTP'
    provider: aws
    description: 'Application and Network Load Balancer listeners must be configured with the HTTPS protocol (or TLS for NLB). Listeners configured with plain HTTP on port 80 are only acceptable if they redirect to HTTPS via a fixed-response redirect rule and do not forward traffic to targets.'
    expected: 'true'
    remediation: 'Change the listener protocol to HTTPS and provide a valid ACM certificate ARN. If a port 80 listener is required for redirect purposes, change the default_action to type = "redirect" with redirect { protocol = "HTTPS", status_code = "HTTP_301" }.\n'
    example:
      compliant: |
        resource "aws_lb_listener" "https" {
          load_balancer_arn = aws_lb.main.arn
          port              = 443
          protocol          = "HTTPS"
          ssl_policy        = "ELBSecurityPolicy-TLS13-1-2-2021-06"
          certificate_arn   = aws_acm_certificate.main.arn
          default_action {
            type             = "forward"
            target_group_arn = aws_lb_target_group.app.arn
          }
        }
        resource "aws_lb_listener" "redirect_http" {
          load_balancer_arn = aws_lb.main.arn
          port              = 80
          protocol          = "HTTP"
          default_action {
            type = "redirect"
            redirect {
              port        = "443"
              protocol    = "HTTPS"
              status_code = "HTTP_301"
            }
          }
        }
        
      non_compliant: |
        resource "aws_lb_listener" "http" {
          load_balancer_arn = aws_lb.main.arn
          port              = 80
          protocol          = "HTTP"   # WAF-SEC-040 violation: plain HTTP forwarding
          default_action {
            type             = "forward"
            target_group_arn = aws_lb_target_group.app.arn
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_lb_listener
        - aws_alb_listener
    assertions:
      - attribute: 'protocol'
        op: 'not_equals'
        message: 'Load balancer listener MUST use HTTPS (or HTTP-to-HTTPS redirect), not plain HTTP forwarding.'
        expected: 'HTTP'
    on_fail: violation
  - id: waf-sec-040.tf.aws.cloudfront-tls-policy
    engine: terraform
    automated: true
    title: 'CloudFront distributions must enforce TLS 1.2 or higher'
    provider: aws
    description: 'CloudFront distributions must have a viewer_certificate block with minimum_protocol_version set to at least TLSv1.2_2021 to prevent connections using outdated TLS versions.'
    expected: 'true'
    remediation: 'Add a viewer_certificate block to the aws_cloudfront_distribution resource. Set minimum_protocol_version = "TLSv1.2_2021" and ssl_support_method = "sni-only". Use a custom ACM certificate instead of the default CloudFront certificate for production workloads with custom domains.\n'
    example:
      compliant: |
        resource "aws_cloudfront_distribution" "main" {
          # ... origin and cache behavior config
          viewer_certificate {
            acm_certificate_arn      = aws_acm_certificate.cdn.arn
            ssl_support_method       = "sni-only"
            minimum_protocol_version = "TLSv1.2_2021"
          }
        }
        
      non_compliant: |
        resource "aws_cloudfront_distribution" "main" {
          # ... origin and cache behavior config
          viewer_certificate {
            cloudfront_default_certificate = true
            # minimum_protocol_version not set – defaults to TLSv1 (WAF-SEC-040 violation)
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudfront_distribution
    assertions:
      - attribute: 'viewer_certificate'
        op: 'attribute_exists'
        message: 'CloudFront distribution must have an explicit viewer_certificate block configured.'
    on_fail: violation
