# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-COST-040
id: WAF-COST-040
pillar: cost
severity: high
type:
  - configuration
description: |
  All storage resources (S3 buckets, Azure Storage accounts, GCS buckets) MUST have explicit lifecycle rules configured. All log groups (CloudWatch, Azure Log Analytics, GCP Cloud Logging) MUST have an explicit retention_in_days value that is not 0 (infinite) and not null. No storage or logging resource may be provisioned without an explicit, finite retention or lifecycle policy. Infinite retention is classified as Architectural Cost Debt.
regulatory_mapping:
  - framework: 'FinOps Foundation'
    controls:
      - 'Optimize Phase – Storage Optimization and Lifecycle Management'
  - framework: 'GDPR'
    controls:
      - 'Art. 5(1)(e) – Storage limitation (data not kept longer than necessary)'
      - 'Art. 17 – Right to erasure (lifecycle policies support GDPR deletion requirements)'
  - framework: 'Internal Governance'
    controls:
      - 'Data Retention Policy – Explicit lifecycle for all data categories'
      - 'Cloud Cost Governance – No infinite retention defaults'
checks:
  - id: waf-cost-040.tf.aws.s3-lifecycle-rule-defined
    engine: terraform
    automated: true
    title: 'S3 buckets must have explicit lifecycle configuration'
    provider: aws
    description: 'Every aws_s3_bucket resource must have an associated aws_s3_bucket_lifecycle_configuration resource, or a lifecycle_rule block. S3 buckets without lifecycle rules accumulate data indefinitely, driving unbounded storage costs.'
    expected: 'true'
    remediation: 'Add an aws_s3_bucket_lifecycle_configuration resource for every S3 bucket. Include at minimum: transition to STANDARD_IA after 30 days, GLACIER after 90 days, and an abort_incomplete_multipart_upload rule with days_after_initiation = 3.\n'
    example:
      compliant: |
        resource "aws_s3_bucket_lifecycle_configuration" "data" {
          bucket = aws_s3_bucket.data.id
        
          rule {
            id     = "tiering"
            status = "Enabled"
        
            transition {
              days          = 30
              storage_class = "STANDARD_IA"
            }
            transition {
              days          = 90
              storage_class = "GLACIER_IR"
            }
            expiration {
              days = 365
            }
          }
        
          rule {
            id     = "abort-incomplete"
            status = "Enabled"
            abort_incomplete_multipart_upload {
              days_after_initiation = 3
            }
          }
        }
        
      non_compliant: |
        resource "aws_s3_bucket" "data" {
          bucket = "acme-application-data"
          # No lifecycle configuration – WAF-COST-040 violation
          # Data will accumulate indefinitely
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_s3_bucket_lifecycle_configuration
    assertions:
      - attribute: 'rule'
        op: 'not_empty'
        message: 'S3 lifecycle configuration must contain at least one rule.'
    on_fail: violation
  - id: waf-cost-040.tf.aws.cloudwatch-log-retention-not-zero
    engine: terraform
    automated: true
    title: 'CloudWatch Log Groups must not have infinite retention'
    provider: aws
    description: 'All aws_cloudwatch_log_group resources must have retention_in_days set to a value greater than 0. The Terraform default (not setting retention_in_days) results in infinite retention, which is classified as Architectural Cost Debt in WAF++.'
    expected: 'true'
    remediation: 'Set retention_in_days on all aws_cloudwatch_log_group resources. Use the 4-tier model: operational=30, security-audit=365, compliance=2555 (7yr). Never use 0 (infinite) as this represents unconstrained cost debt.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_log_group" "application" {
          name              = "/app/production/payment-service"
          retention_in_days = 30  # Hot-tier: operational logs
          kms_key_id        = aws_kms_key.logging.arn
          tags              = module.mandatory_tags.tags
        }
        
        resource "aws_cloudwatch_log_group" "audit" {
          name              = "/app/production/audit"
          retention_in_days = 365  # Cold-tier: audit logs
          kms_key_id        = aws_kms_key.logging.arn
          tags              = module.mandatory_tags.tags
        }
        
      non_compliant: |
        resource "aws_cloudwatch_log_group" "application" {
          name = "/app/production/payment-service"
          # retention_in_days not set = infinite retention = WAF-COST-040 violation
        }
        
        resource "aws_cloudwatch_log_group" "debug" {
          name              = "/app/production/debug"
          retention_in_days = 0  # Explicit infinite – also a violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_log_group
    assertions:
      - attribute: 'retention_in_days'
        op: 'attribute_exists'
        message: 'CloudWatch Log Group is missing retention_in_days. Default is infinite retention (cost debt).'
      - attribute: 'retention_in_days'
        op: 'greater_than_or_equal'
        message: 'retention_in_days must be >= 1. Setting 0 means infinite retention (WAF-COST-040 violation).'
    on_fail: violation
