checks:
  - id: waf-sec-070.tf.aws.ecr-image-scanning
    engine: terraform
    automated: true
    title: 'ECR repositories must have image scanning enabled'
    provider: aws
    description: 'All aws_ecr_repository resources must have an image_scanning_configuration block with scan_on_push = true to ensure every pushed image is immediately scanned for known vulnerabilities.'
    expected: 'true'
    remediation: 'Add an image_scanning_configuration block to all aws_ecr_repository resources:\n  image_scanning_configuration { scan_on_push = true }\nFor enhanced scanning, enable Amazon Inspector at the account level and configure continuous ECR scanning via aws_inspector2_enabler resource.\n'
    example:
      compliant: |
        resource "aws_ecr_repository" "app" {
          name                 = "my-application"
          image_tag_mutability = "IMMUTABLE"
          image_scanning_configuration {
            scan_on_push = true
          }
          encryption_configuration {
            encryption_type = "KMS"
            kms_key         = aws_kms_key.ecr.arn
          }
        }
        
      non_compliant: |
        resource "aws_ecr_repository" "app" {
          name = "my-application"
          # image_scanning_configuration not set – WAF-SEC-070 violation
          # image_tag_mutability defaults to MUTABLE – WAF-SEC-070 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_ecr_repository
    assertions:
      - attribute: 'image_scanning_configuration'
        op: 'attribute_exists'
        message: 'ECR repository must have image_scanning_configuration block defined with scan_on_push = true.'
    on_fail: violation
  - id: waf-sec-070.tf.aws.ecr-immutable-tags
    engine: terraform
    automated: true
    title: 'ECR repositories must use immutable image tags'
    provider: aws
    description: "All aws_ecr_repository resources must have image_tag_mutability = 'IMMUTABLE' to prevent overwriting of existing image tags, which could allow supply chain attacks by replacing a trusted image with a malicious one."
    expected: 'true'
    remediation: 'Set image_tag_mutability = "IMMUTABLE" on all aws_ecr_repository resources. Update deployment pipelines to reference images by digest (sha256:...) rather than mutable tags like \'latest\'. Implement a tagging strategy using semantic versioning (e.g., v1.2.3) combined with immutability for full traceability.\n'
    example:
      compliant: |
        resource "aws_ecr_repository" "app" {
          name                 = "my-application"
          image_tag_mutability = "IMMUTABLE"
          image_scanning_configuration {
            scan_on_push = true
          }
        }
        
      non_compliant: |
        resource "aws_ecr_repository" "app" {
          name                 = "my-application"
          image_tag_mutability = "MUTABLE"  # WAF-SEC-070 violation: allows tag overwrite
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_ecr_repository
    assertions:
      - attribute: 'image_tag_mutability'
        op: 'equals'
        message: "ECR repository MUST use immutable tags (image_tag_mutability = 'IMMUTABLE') to prevent image tampering."
        expected: 'IMMUTABLE'
    on_fail: violation
