checks:
- id: waf-sec-070.tf.aws.ecr-image-scanning
  engine: terraform
  automated: true
  title: ECR repositories must have image scanning enabled
  provider: aws
  description: All aws_ecr_repository resources must have an image_scanning_configuration block with scan_on_push = true to
    ensure every pushed image is immediately scanned for known vulnerabilities.
  expected: 'true'
  remediation: Add an image_scanning_configuration block to all aws_ecr_repository resources:\n  image_scanning_configuration
    { scan_on_push = true }\nFor enhanced scanning, enable Amazon Inspector at the account level and configure continuous
    ECR scanning via aws_inspector2_enabler resource.\n
  example:
    compliant: "resource \"aws_ecr_repository\" \"app\" {\n  name                 = \"my-application\"\n  image_tag_mutability\
      \ = \"IMMUTABLE\"\n  image_scanning_configuration {\n    scan_on_push = true\n  }\n  encryption_configuration {\n  \
      \  encryption_type = \"KMS\"\n    kms_key         = aws_kms_key.ecr.arn\n  }\n}\n"
    non_compliant: "resource \"aws_ecr_repository\" \"app\" {\n  name = \"my-application\"\n  # image_scanning_configuration\
      \ not set – WAF-SEC-070 violation\n  # image_tag_mutability defaults to MUTABLE – WAF-SEC-070 violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_ecr_repository
  assertions:
  - attribute: image_scanning_configuration
    op: attribute_exists
    message: ECR repository must have image_scanning_configuration block defined with scan_on_push = true.
  on_fail: violation
- id: waf-sec-070.tf.aws.ecr-immutable-tags
  engine: terraform
  automated: true
  title: ECR repositories must use immutable image tags
  provider: aws
  description: All aws_ecr_repository resources must have image_tag_mutability = 'IMMUTABLE' to prevent overwriting of existing
    image tags, which could allow supply chain attacks by replacing a trusted image with a malicious one.
  expected: 'true'
  remediation: 'Set image_tag_mutability = "IMMUTABLE" on all aws_ecr_repository resources. Update deployment pipelines to
    reference images by digest (sha256:...) rather than mutable tags like ''latest''. Implement a tagging strategy using semantic
    versioning (e.g., v1.2.3) combined with immutability for full traceability.

    '
  example:
    compliant: "resource \"aws_ecr_repository\" \"app\" {\n  name                 = \"my-application\"\n  image_tag_mutability\
      \ = \"IMMUTABLE\"\n  image_scanning_configuration {\n    scan_on_push = true\n  }\n}\n"
    non_compliant: "resource \"aws_ecr_repository\" \"app\" {\n  name                 = \"my-application\"\n  image_tag_mutability\
      \ = \"MUTABLE\"  # WAF-SEC-070 violation: allows tag overwrite\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_ecr_repository
  assertions:
  - attribute: image_tag_mutability
    op: equals
    message: ECR repository MUST use immutable tags (image_tag_mutability = 'IMMUTABLE') to prevent image tampering.
    expected: IMMUTABLE
  on_fail: violation
- id: waf-sec-070.config.azurerm.azurerm-container-security
  engine: config
  automated: true
  title: Azure Container Registry vulnerability scanning must be enabled
  provider: azurerm
  description: A version-controlled policy document must exist at `docs/security/waf-sec-070-azurerm-container-security.md`
    and document the Azure implementation of this control. The checker validates that the file exists and contains a normative
    requirement statement (MUST/SHALL/required/mandatory).
  expected: 'true'
  remediation: 'Create or update `docs/security/waf-sec-070-azurerm-container-security.md`. State the requirement, how it
    is implemented for Azure, the review cadence, and the owner.

    '
  example:
    compliant: '|

      docs/security/waf-sec-070-azurerm-container-security.md:

      - The Azure implementation of WAF-SEC-070 is documented.

      - Implementation status and owner are recorded.

      - Review cadence is defined (e.g. quarterly).

      '
    non_compliant: '|

      # `docs/security/waf-sec-070-azurerm-container-security.md` is missing or does not contain a normative requirement.

      # WAF-SEC-070 violation: Azure control is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/security/waf-sec-070-azurerm-container-security.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/security/waf-sec-070-azurerm-container-security.md` must contain a normative requirement statement.
  on_fail: violation
