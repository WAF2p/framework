checks:
  - id: waf-sov-010.tf.any.resource-tag-data-residency
    engine: terraform
    automated: true
    title: "Data resources must carry 'data-residency' tag"
    provider: any
    description: "Primary data resources (object storage, relational DB, NoSQL, data warehouses) must be tagged with 'data-residency' to indicate the jurisdiction constraint for that resource."
    expected: 'true'
    remediation: "Add 'data-residency' and 'data-class' tags to all data-storing resources. Acceptable values for 'data-residency': eu-only, de-only, ch-only, at-only, global-approved. Acceptable values for 'data-class': pii, health, financial, operational, public, restricted.\n"
    example:
      compliant: |
        resource "aws_s3_bucket" "customer_data" {
          bucket = "acme-customer-data-prod"
          tags = {
            data-class      = "pii"
            data-residency  = "eu-only"
            environment     = "production"
            owner           = "platform-team"
          }
        }
        
      non_compliant: |
        resource "aws_s3_bucket" "customer_data" {
          bucket = "acme-customer-data-prod"
          # Missing data-residency and data-class tags
          tags = {
            environment = "production"
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_s3_bucket
        - aws_rds_instance
        - aws_rds_cluster
        - aws_dynamodb_table
        - aws_elasticache_cluster
        - aws_elasticsearch_domain
        - aws_opensearch_domain
        - azurerm_storage_account
        - azurerm_sql_database
        - azurerm_cosmosdb_account
        - google_storage_bucket
        - google_sql_database_instance
        - google_bigtable_instance
    assertions:
      - attribute: 'tags'
        op: 'key_exists'
        key: 'data-residency'
        message: "Resource is missing the 'data-residency' tag required by sovereignty policy."
      - attribute: 'tags'
        op: 'key_exists'
        key: 'data-class'
        message: "Resource is missing the 'data-class' tag required by data classification policy."
    on_fail: violation
  - id: waf-sov-010.tf.aws.provider-region-explicit
    engine: terraform
    automated: true
    title: "AWS provider must have 'region' explicitly set"
    provider: aws
    description: "AWS provider blocks must have an explicit 'region' attribute set to prevent unintended deployments to non-sovereign regions via environment variable fallback."
    expected: 'true'
    remediation: "Set 'region' explicitly in all AWS provider blocks. Use a variable with a validation block to restrict to approved regions.\n"
    example:
      compliant: |
        variable "aws_region" {
          type    = string
          default = "eu-central-1"
          validation {
            condition     = contains(["eu-central-1", "eu-west-1"], var.aws_region)
            error_message = "Region must be in approved sovereign EU list."
          }
        }
        provider "aws" {
          region = var.aws_region
        }
        
      non_compliant: |
        provider "aws" {
          # No region set – defaults to AWS_DEFAULT_REGION env var
        }
        
    scope:
      block_type: provider
    assertions:
      - attribute: 'region'
        op: 'attribute_exists'
        message: "AWS provider block is missing explicit 'region' attribute."
      - attribute: 'region'
        op: 'not_empty'
        message: "AWS provider 'region' must not be empty."
    on_fail: violation
  - id: waf-sov-010.tf.azurerm.location-explicit
    engine: terraform
    automated: true
    title: "Azure resource groups must have 'location' explicitly set"
    provider: azurerm
    description: "Azure resource groups (and key resources) must have an explicit 'location' attribute rather than inheriting from parent or relying on environment defaults."
    expected: 'true'
    remediation: "Set 'location' explicitly on all Azure resources. Use a variable with a validation block to restrict to approved Azure regions.\n"
    example:
      compliant: |
        variable "azure_location" {
          type    = string
          default = "germanywestcentral"
          validation {
            condition     = contains(["germanywestcentral", "westeurope", "northeurope"], var.azure_location)
            error_message = "Location must be an approved sovereign Azure region."
          }
        }
        resource "azurerm_resource_group" "main" {
          name     = "rg-sovereign-prod"
          location = var.azure_location
        }
        
      non_compliant: |
        resource "azurerm_resource_group" "main" {
          name     = "rg-sovereign-prod"
          # No location set
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_resource_group
        - azurerm_storage_account
        - azurerm_sql_server
        - azurerm_kubernetes_cluster
    assertions:
      - attribute: 'location'
        op: 'attribute_exists'
        message: "Azure resource is missing explicit 'location' attribute."
      - attribute: 'location'
        op: 'not_empty'
        message: "Azure resource 'location' must not be empty."
    on_fail: violation
  - id: waf-sov-010.tf.google.region-explicit
    engine: terraform
    automated: true
    title: "GCP resources must have 'region' or 'location' explicitly set"
    provider: google
    description: "GCP resources must have 'region' or 'location' explicitly set to prevent unintended deployment to non-sovereign regions via provider-level defaults."
    expected: 'true'
    remediation: "Set 'location' or 'region' explicitly on all GCP data resources. Use a variable with validation to restrict to approved GCP regions.\n"
    example:
      compliant: |
        variable "gcp_region" {
          type    = string
          default = "europe-west3"
          validation {
            condition     = startswith(var.gcp_region, "europe-")
            error_message = "Only European GCP regions are approved for sovereign workloads."
          }
        }
        resource "google_storage_bucket" "data" {
          name     = "acme-sovereign-data"
          location = var.gcp_region
        }
        
      non_compliant: |
        resource "google_storage_bucket" "data" {
          name = "acme-sovereign-data"
          # No location set – defaults to provider default
        }
        
    scope:
      block_type: resource
      resource_types:
        - google_storage_bucket
        - google_sql_database_instance
        - google_compute_instance
        - google_container_cluster
        - google_bigquery_dataset
    assertions:
      - attribute: 'location'
        op: 'attribute_exists_or_fallback'
        message: "GCP resource is missing explicit 'region' or 'location' attribute."
    on_fail: violation
