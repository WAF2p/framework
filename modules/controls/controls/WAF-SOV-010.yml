  engine: terraform
  automated: true
  title: STACKIT resources must have an explicit region
  provider: stackit
  description: STACKIT resources must have an explicit region. This check validates the Terraform configuration uses the expected resource and attribute.
  expected: 'true'
  remediation: 'Review the Terraform configuration for the listed resource types and ensure the required attribute or tag is present. See the control narrative for provider-specific guidance.

    '
  example:
    compliant: "|\n# Example resource meets the requirement.\nresource \"stackit_project\" \"example\" {\n  # required attribute/tag/label present\n}\n"
    non_compliant: "|\n# Example resource does not meet the requirement.\nresource \"stackit_project\" \"example\" {\n  # Missing required attribute/tag/label\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
    - stackit_server
    - stackit_ske_cluster
    - stackit_object_storage_bucket
  assertions:
  - attribute: region
    op: attribute_exists
    message: STACKIT resource must have an explicit region.
  on_fail: violation
- id: waf-sov-010.config.ovh.data-residency-policy
  engine: config
  automated: true
  title: OVHcloud data-residency policy must be documented
  provider: ovh
  description: OVHcloud public-cloud resources do not expose a native region attribute consistently across all resource types. A version-controlled policy document must therefore define the approved OVHcloud regions, data classifications, and implementation rules for sovereign workloads.
  expected: 'true'
  remediation: 'Create or update `docs/sovereign/waf-sov-010-ovh-data-residency.md`. State the approved OVHcloud regions, data-class handling, review cadence, and owner.

    '
  example:
    compliant: 'docs/sovereign/waf-sov-010-ovh-data-residency.md:


      - Approved OVHcloud regions are documented (e.g. DE-FRA, DE-EDE, EU-CY).

      - Data-class and data-residency handling for OVHcloud is defined.

      - Owner and review cadence are recorded.

      '
    non_compliant: '# `docs/sovereign/waf-sov-010-ovh-data-residency.md` is missing

      # WAF-SOV-010 violation: OVHcloud data-residency policy is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/sovereign/waf-sov-010-ovh-data-residency.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|documented|approved
    message: OVHcloud data-residency policy file must contain a normative requirement statement.
  on_fail: violation
- id: waf-sov-010.tf.hcloud.location-explicit
  engine: terraform
  automated: true
  title: Hetzner Cloud resources must have an explicit location
  provider: hcloud
  description: Hetzner Cloud resources must have an explicit location. This check validates the Terraform configuration uses the expected resource and attribute.
  expected: 'true'
