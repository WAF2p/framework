    '
  example:
    compliant: "|\n# Example resource meets the requirement.\nresource \"hcloud_server\" \"example\" {\n  # required attribute/tag/label present\n}\n"
    non_compliant: "|\n# Example resource does not meet the requirement.\nresource \"hcloud_server\" \"example\" {\n  # Missing required attribute/tag/label\n}\n"
  scope:
    block_type: resource
    resource_types:
    - hcloud_server
    - hcloud_volume
    - hcloud_network
    - hcloud_load_balancer
  assertions:
  - attribute: location
    op: attribute_exists
    message: Hetzner Cloud resource must have an explicit location.
  on_fail: violation
