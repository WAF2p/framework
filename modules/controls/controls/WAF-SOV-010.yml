checks:
- id: waf-sov-010.tf.any.resource-tag-data-residency
  engine: terraform
  automated: true
  title: Data resources must carry 'data-residency' tag
  provider: any
  description: Primary data resources (object storage, relational DB, NoSQL, data warehouses) must be tagged with 'data-residency' to indicate the jurisdiction constraint for that resource.
  expected: 'true'
  remediation: 'Add ''data-residency'' and ''data-class'' tags to all data-storing resources. Acceptable values for ''data-residency'': eu-only, de-only, ch-only, at-only, global-approved. Acceptable values for ''data-class'': pii, health, financial, operational, public, restricted.

    '
  example:
    compliant: "# AWS\nresource \"aws_s3_bucket\" \"customer_data\" {\n  bucket = \"acme-customer-data-prod\"\n  tags = {\n    data-class      = \"pii\"\n    data-residency  = \"eu-only\"\n    environment     = \"production\"\n    owner           = \"platform-team\"\n  }\n}\n\n# Azure\nresource \"azurerm_storage_account\" \"customer_data\" {\n  name             = \"acmestorage\"\n  resource_group_name = azurerm_resource_group.main.name\n  location         = \"germanywestcentral\"\n  tags = {\n    data-class      = \"pii\"\n    data-residency  = \"eu-only\"\n    environment     = \"production\"\n    owner           = \"platform-team\"\n  }\n}\n\n# GCP\nresource \"google_storage_bucket\" \"customer_data\" {\n  name     = \"acme-customer-data-prod\"\n  location = \"europe-west3\"\n  labels = {\n    data-class      = \"pii\"\n    data-residency  = \"eu-only\"\n    environment     = \"production\"\n    owner           = \"platform-team\"\n  }\n}\n\n# StackIT (SchwarzIT)\nresource \"stackit_container_registry\"\
      \ \"customer_data\" {\n  project_id = stackit_project.main.id\n  name       = \"acme-registry\"\n  labels = {\n    data-class      = \"pii\"\n    data-residency  = \"eu-only\"\n  }\n}\n\n# OVH\nresource \"ovh_cloud_project\" \"customer_data\" {\n  description = \"Sovereign workload\"\n  tags        = [\"data-residency=eu-only\", \"data-class=pii\"]\n}\n\n# Hetzner Cloud\nresource \"hcloud_server\" \"customer_data\" {\n  name        = \"sovereign-server\"\n  server_type = \"cx22\"\n  location    = \"fsn1\"\n  labels = {\n    data-class      = \"pii\"\n    data-residency  = \"eu-only\"\n  }\n}\n"
    non_compliant: "resource \"aws_s3_bucket\" \"customer_data\" {\n  bucket = \"acme-customer-data-prod\"\n  # Missing data-residency and data-class tags\n  tags = {\n    environment = \"production\"\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_s3_bucket
    - aws_rds_instance
    - aws_rds_cluster
    - aws_dynamodb_table
    - aws_elasticache_cluster
    - aws_elasticsearch_domain
    - aws_opensearch_domain
    - azurerm_storage_account
    - azurerm_sql_database
    - azurerm_cosmosdb_account
    - google_storage_bucket
    - google_sql_database_instance
    - google_bigtable_instance
    - stackit_container_registry
    - stackit_mysql_instance
    - stackit_opensearch_instance
    - stackit_redis_instance
    - stackit_secret_manager
    - ovh_cloud_project
    - ovh_vps
    - ovh_dedicated_server
    - ovh_ip_loadbalancing
    - hcloud_server
    - hcloud_volume
    - hcloud_network
    - hcloud_load_balancer
    - hcloud_dns_record
  assertions:
  - attribute: tags
    op: key_exists
    key: data-residency
    message: Resource is missing the 'data-residency' tag required by sovereignty policy.
  - attribute: tags
    op: key_exists
    key: data-class
    message: Resource is missing the 'data-class' tag required by data classification policy.
  on_fail: violation
- id: waf-sov-010.tf.aws.provider-region-explicit
  engine: terraform
  automated: true
  title: AWS provider must have 'region' explicitly set
  provider: aws
  description: AWS provider blocks must have an explicit 'region' attribute set to prevent unintended deployments to non-sovereign regions via environment variable fallback.
  expected: 'true'
  remediation: 'Set ''region'' explicitly in all AWS provider blocks. Use a variable with a validation block to restrict to approved regions.

    '
  example:
    compliant: "variable \"aws_region\" {\n  type    = string\n  default = \"eu-central-1\"\n  validation {\n    condition     = contains([\"eu-central-1\", \"eu-west-1\"], var.aws_region)\n    error_message = \"Region must be in approved sovereign EU list.\"\n  }\n}\nprovider \"aws\" {\n  region = var.aws_region\n}\n"
    non_compliant: "provider \"aws\" {\n  # No region set – defaults to AWS_DEFAULT_REGION env var\n}\n"
  scope:
    block_type: provider
    provider_name: aws
  assertions:
  - attribute: region
    op: attribute_exists
    message: AWS provider block is missing explicit 'region' attribute.
  - attribute: region
    op: not_empty
    message: AWS provider 'region' must not be empty.
  on_fail: violation
- id: waf-sov-010.tf.azurerm.location-explicit
  engine: terraform
  automated: true
  title: Azure resource groups must have 'location' explicitly set
  provider: azurerm
  description: Azure resource groups (and key resources) must have an explicit 'location' attribute rather than inheriting from parent or relying on environment defaults.
  expected: 'true'
  remediation: 'Set ''location'' explicitly on all Azure resources. Use a variable with a validation block to restrict to approved Azure regions.

    '
  example:
    compliant: "variable \"azure_location\" {\n  type    = string\n  default = \"germanywestcentral\"\n  validation {\n    condition     = contains([\"germanywestcentral\", \"westeurope\", \"northeurope\"], var.azure_location)\n    error_message = \"Location must be an approved sovereign Azure region.\"\n  }\n}\nresource \"azurerm_resource_group\" \"main\" {\n  name     = \"rg-sovereign-prod\"\n  location = var.azure_location\n}\n"
    non_compliant: "resource \"azurerm_resource_group\" \"main\" {\n  name     = \"rg-sovereign-prod\"\n  # No location set\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_resource_group
    - azurerm_storage_account
    - azurerm_sql_server
    - azurerm_kubernetes_cluster
  assertions:
  - attribute: location
    op: attribute_exists
    message: Azure resource is missing explicit 'location' attribute.
  - attribute: location
    op: not_empty
    message: Azure resource 'location' must not be empty.
  on_fail: violation
- id: waf-sov-010.tf.google.region-explicit
  engine: terraform
  automated: true
  title: GCP resources must have 'region' or 'location' explicitly set
  provider: google
  description: GCP resources must have 'region' or 'location' explicitly set to prevent unintended deployment to non-sovereign regions via provider-level defaults.
  expected: 'true'
  remediation: 'Set ''location'' or ''region'' explicitly on all GCP data resources. Use a variable with validation to restrict to approved GCP regions.

    '
  example:
    compliant: "variable \"gcp_region\" {\n  type    = string\n  default = \"europe-west3\"\n  validation {\n    condition     = startswith(var.gcp_region, \"europe-\")\n    error_message = \"Only European GCP regions are approved for sovereign workloads.\"\n  }\n}\nresource \"google_storage_bucket\" \"data\" {\n  name     = \"acme-sovereign-data\"\n  location = var.gcp_region\n}\n"
    non_compliant: "resource \"google_storage_bucket\" \"data\" {\n  name = \"acme-sovereign-data\"\n  # No location set – defaults to provider default\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_storage_bucket
    - google_sql_database_instance
    - google_compute_instance
    - google_container_cluster
    - google_bigquery_dataset
  assertions:
  - attribute: location
    op: attribute_exists_or_fallback
    fallback_attribute: region
    message: GCP resource is missing explicit 'region' or 'location' attribute.
  on_fail: violation
