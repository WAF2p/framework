checks:
  - id: waf-agn-090.tf.aws.token-monitoring-configured
    engine: terraform
    automated: true
    title: 'Agenten-Token-Usage muss überwacht werden'
    provider: aws
    description: 'Token-Usage (Input, Output, Total) für alle Agenten muss verfolgt und überwacht werden. Der Verbrauch muss mit täglicher Aggregation zu CloudWatch exportiert werden. Anomalien im Token-Usage müssen Alerts auslösen.'
    expected: 'true'
    remediation: 'Konfigurieren Sie CloudWatch-Metriken für Bedrock-Token-Usage. Erstellen Sie Dashboards, die den Token-Verbrauch pro Agent anzeigen. Richten Sie Alarms für ungewöhnliche Token-Spikes ein, die auf ausufernde Prompts oder Modellprobleme hindeuten können.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_metric_alarm" "token_usage" {
          alarm_name          = "agent-token-spike"
          comparison_operator = "GreaterThanThreshold"
          evaluation_periods  = 1
          metric_name         = "InputTokenCount"
          namespace           = "AWS/Bedrock"
          period              = 300
          statistic           = "Sum"
          threshold           = 50000
          unit                = "Count"
          alarm_description   = "Anomalie im Agenten-Token-Verbrauch erkannt"
        }

        resource "aws_cloudwatch_dashboard" "agent_dashboard" {
          dashboard_name = "agent-metrics"

          dashboard_body = jsonencode({
            widgets = [{
              type   = "metric"
              x      = 0
              y      = 0
              width  = 12
              height = 6
              properties = {
                metrics = [
                  ["AWS/Bedrock", "InputTokenCount", "AgentName", "customer-agent"]
                ]
                period = 300
                stat   = "Sum"
                region = "us-east-1"
              }
            }]
          })
        }
      non_compliant: |
        # Kein Token-Monitoring konfiguriert
        # WAF-AGN-090 Verstoß
        # Kosten können nicht verfolgt oder kontrolliert werden

    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_metric_alarm
        - aws_cloudwatch_dashboard
    assertions:
      - attribute: 'alarm_name'
        op: 'not_empty'
        message: 'Token-Usage-Monitoring muss konfiguriert sein.'
    on_fail: violation
  - id: waf-agn-090.tf.aws.budget-alerts-configured
    engine: terraform
    automated: true
    title: 'Budget-Alerts müssen für Agenten-Kosten konfiguriert sein'
    provider: aws
    description: 'Für Agenten-Operationen müssen Kosten-Budgets mit Alerts bei 50 %, 75 %, 90 % und 100 % des Budgets festgelegt sein. Alerts müssen an festgelegte Empfänger gesendet werden, bevor Schwellenwerte erreicht werden.'
    expected: 'true'
    remediation: 'Konfigurieren Sie AWS-Cost-Explorer-Budgets für Bedrock-Ausgaben. Richten Sie Budget-Alerts über SNS-Themen ein. Definieren Sie Budgetzeiträume (monatlich, quartalsweise) und Schwellenprozentsätze.\n'
    example:
      compliant: |
        resource "aws_budgets_budget" "agent_budget" {
          budget_name = "agent-monthly-budget"

          budget_type      = "COST"
          limit_amount     = "500"
          limit_unit       = "USD"
          time_unit        = "MONTHLY"

          cost_types {
            include_tax           = true
            include_subscription  = true
            include_recurring     = true
            include_other_subscription = true
            include_discounts     = true
            use_amortized         = false
            use_blended           = false
          }

          time_period_start = "2026-01-01_00:00"
          time_period_end   = "2026-12-31_23:59"

          notification {
            notification_type       = "ACTUAL"
            comparison_operator     = "GREATER_THAN"
            threshold               = 50
            threshold_type          = "PERCENTAGE"
            notification_state      = "ALARM"
            subscriber_email_addresses = ["team-ops@example.com"]
          }

          notification {
            notification_type       = "ACTUAL"
            comparison_operator     = "GREATER_THAN"
            threshold               = 75
            threshold_type          = "PERCENTAGE"
            notification_state      = "ALARM"
            subscriber_email_addresses = ["team-ops@example.com", "finance@example.com"]
          }

          notification {
            notification_type       = "ACTUAL"
            comparison_operator     = "GREATER_THAN"
            threshold               = 90
            threshold_type          = "PERCENTAGE"
            notification_state      = "ALARM"
            subscriber_email_addresses = ["team-ops@example.com", "finance@example.com"]
          }

          notification {
            notification_type       = "ACTUAL"
            comparison_operator     = "GREATER_THAN"
            threshold               = 100
            threshold_type          = "PERCENTAGE"
            notification_state      = "ALARM"
            subscriber_email_addresses = ["team-ops@example.com", "finance@example.com", "management@example.com"]
          }
        }
      non_compliant: |
        # Keine Budget-Alerts konfiguriert
        # WAF-AGN-090 Verstoß
        # Kostenüberschreitungen werden nicht erkannt

    scope:
      block_type: resource
      resource_types:
        - aws_budgets_budget
    assertions:
      - attribute: 'budget_name'
        op: 'not_empty'
        message: 'Budget-Alerts müssen für Agenten-Kosten konfiguriert sein.'
    on_fail: violation
  - id: waf-agn-090.tf.aws.model-optimization-configured
    engine: terraform
    automated: true
    title: 'Modellauswahl muss für Kosten-Performance optimiert sein'
    provider: aws
    description: 'Agenten müssen das kosteneffektivste Modell verwenden, das die Qualitätsanforderungen erfüllt. Die Modellauswahl sollte Input/Output-Länge, Latenzanforderungen und Kosten pro Token berücksichtigen. Die Optimierung sollte quartalsweise überprüft werden.'
    expected: 'true'
    remediation: 'Dokumentieren Sie Modellauswahlkriterien für jeden Agenten-Use-Case. Vergleichen Sie Claude Instant, Claude Sonnet und Claude Opus basierend auf Qualitätsanforderungen. Verwenden Sie OpenAI GPT-3.5 Turbo vs. GPT-4 basierend auf Aufgabenkomplexität. Implementieren Sie Model-Fallback für Kostenmanagement.\n'
    example:
      compliant: |
        # Dokumentierte Modellauswahlkriterien
        # - Einfache Abfragen: Claude Instant (günstigstes)
        # - Moderate Komplexität: Claude Sonnet (ausgewogen)
        # - Hohe Komplexität: Claude Opus (beste Qualität)
        # Modell-Performance quartalsweise überprüfen

        resource "aws_bedrock_foundation_model" "model_selection" {
          model_id = "anthropic.claude-3-haiku-20240307-v1:0"  # Kostenoptimierte Wahl
          # Modellauswahl im Architecture Decision Record dokumentiert
        }
      non_compliant: |
        # Teure Modelle für einfache Aufgaben verwenden
        # WAF-AGN-090 Verstoß
        # Kosten-Performance nicht optimiert

    scope:
      block_type: resource
      resource_types:
        - aws_bedrock_foundation_model
    assertions:
      - attribute: 'model_id'
        op: 'not_empty'
        message: 'Modellauswahl muss dokumentiert und optimiert sein.'
    on_fail: violation
  - id: waf-agn-090.tf.aws.caching-configured
    engine: terraform
    automated: true
    title: 'Caching muss implementiert sein, um redundante API-Aufrufe zu reduzieren'
    provider: aws
    description: 'Caching muss für wiederholte Abfragen, häufige Prompts und ähnliche Inputs implementiert sein. Cache-Keys müssen Input-Hash und Modell-Identifikator enthalten. Cache-TTL muss basierend auf Datenaktualitätsanforderungen konfiguriert sein.'
    expected: 'true'
    remediation: 'Implementieren Sie eine Caching-Schicht (ElastiCache, DynamoDB TTL) für Agenten-Antworten. Cachen Sie basierend auf Input-Hash, um ähnliche Abfragen effizient zu behandeln. Konfigurieren Sie Cache-Invalidierung basierend auf Datenänderungen. Überwachen Sie Cache-Hit-Raten.\n'
    example:
      compliant: |
        resource "aws_dynamodb_table" "agent_cache" {
          name         = "agent-response-cache"
          billing_mode = "PAY_PER_REQUEST"
          hash_key     = "cache_key"

          attribute {
            name = "cache_key"
            type = "S"
          }

          ttl {
            attribute_name = "expires_at"
            enabled        = true
          }

          # Cache-Keys basierend auf Input-Hash
          # TTL basierend auf Datenaktualitätsanforderungen
        }

        resource "aws_lambda_function" "cache_middleware" {
          function_name = "agent-cache-middleware"
          # Middleware prüft Cache vor API-Aufruf
        }
      non_compliant: |
        # Kein Caching implementiert
        # WAF-AGN-090 Verstoß
        # Alle Abfragen treffen direkt auf die API

    scope:
      block_type: resource
      resource_types:
        - aws_dynamodb_table
        - aws_lambda_function
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Caching muss konfiguriert sein, um redundante API-Aufrufe zu reduzieren.'
    on_fail: violation
