# ID: WAF-AGN-090
id: WAF-AGN-090
pillar: agentic
severity: medium
type:
  - governance
  - configuration
description: |
  Agenten-Operationen müssen ökonomisch und performant sein. Token-Usage und Compute-Kosten MÜSSEN überwacht werden. Budget-Alerts MÜSSEN konfiguriert sein, um Kostenüberschreitungen zu verhindern. Die Modellauswahl MUSS für Kosten-Performance-Tradeoffs optimiert sein. Effizientes Caching und Context-Management MÜSSEN implementiert sein.
