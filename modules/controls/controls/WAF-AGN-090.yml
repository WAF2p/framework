checks:
- id: waf-agn-090.tf.aws.token-monitoring-configured
  engine: terraform
  automated: true
  title: Agent token usage must be monitored
  provider: aws
  description: Token usage (input, output, total) for all agents must be tracked and monitored. Usage must be exported to
    CloudWatch with daily aggregation. Anomalies in token usage must trigger alerts.
  expected: 'true'
  remediation: Configure CloudWatch Metrics for Bedrock token usage. Create dashboards showing token consumption by agent.
    Set alarms for unusual token spikes that may indicate runaway prompts or model issues.\n
  example:
    compliant: "resource \"aws_cloudwatch_metric_alarm\" \"token_usage\" {\n  alarm_name          = \"agent-token-spike\"\n\
      \  comparison_operator = \"GreaterThanThreshold\"\n  evaluation_periods  = 1\n  metric_name         = \"InputTokenCount\"\
      \n  namespace           = \"AWS/Bedrock\"\n  period              = 300\n  statistic           = \"Sum\"\n  threshold\
      \           = 50000\n  unit                = \"Count\"\n  alarm_description   = \"Agent token usage anomaly detected\"\
      \n}\n\nresource \"aws_cloudwatch_dashboard\" \"agent_dashboard\" {\n  dashboard_name = \"agent-metrics\"\n\n  dashboard_body\
      \ = jsonencode({\n    widgets = [{\n      type   = \"metric\"\n      x      = 0\n      y      = 0\n      width  = 12\n\
      \      height = 6\n      properties = {\n        metrics = [\n          [\"AWS/Bedrock\", \"InputTokenCount\", \"AgentName\"\
      , \"customer-agent\"]\n        ]\n        period = 300\n        stat   = \"Sum\"\n        region = \"us-east-1\"\n \
      \     }\n    }]\n  })\n}\n"
    non_compliant: '# No token monitoring configured

      # WAF-AGN-090 Violation

      # Cannot track or control costs

      '
  scope:
    block_type: resource
    resource_types:
    - aws_cloudwatch_metric_alarm
    - aws_cloudwatch_dashboard
  assertions:
  - attribute: alarm_name
    op: not_empty
    message: Token usage monitoring must be configured.
  on_fail: violation
- id: waf-agn-090.tf.aws.budget-alerts-configured
  engine: terraform
  automated: true
  title: Budget alerts must be configured for agent costs
  provider: aws
  description: Cost budgets must be set for agent operations with alerts at 50%, 75%, 90%, and 100% of budget. Alerts must
    be sent to designated recipients before thresholds are reached.
  expected: 'true'
  remediation: Configure AWS Cost Explorer budgets for Bedrock spending. Set up budget alerts via SNS topics. Define budget
    periods (monthly, quarterly) and threshold percentages.\n
  example:
    compliant: "resource \"aws_budgets_budget\" \"agent_budget\" {\n  budget_name = \"agent-monthly-budget\"\n\n  budget_type\
      \      = \"COST\"\n  limit_amount     = \"500\"\n  limit_unit       = \"USD\"\n  time_unit        = \"MONTHLY\"\n\n\
      \  cost_types {\n    include_tax           = true\n    include_subscription  = true\n    include_recurring     = true\n\
      \    include_other_subscription = true\n    include_discounts     = true\n    use_amortized         = false\n    use_blended\
      \           = false\n  }\n\n  time_period_start = \"2026-01-01_00:00\"\n  time_period_end   = \"2026-12-31_23:59\"\n\
      \n  notification {\n    notification_type       = \"ACTUAL\"\n    comparison_operator     = \"GREATER_THAN\"\n    threshold\
      \               = 50\n    threshold_type          = \"PERCENTAGE\"\n    notification_state      = \"ALARM\"\n    subscriber_email_addresses\
      \ = [\"team-ops@example.com\"]\n  }\n\n  notification {\n    notification_type       = \"ACTUAL\"\n    comparison_operator\
      \     = \"GREATER_THAN\"\n    threshold               = 75\n    threshold_type          = \"PERCENTAGE\"\n    notification_state\
      \      = \"ALARM\"\n    subscriber_email_addresses = [\"team-ops@example.com\", \"finance@example.com\"]\n  }\n\n  notification\
      \ {\n    notification_type       = \"ACTUAL\"\n    comparison_operator     = \"GREATER_THAN\"\n    threshold       \
      \        = 90\n    threshold_type          = \"PERCENTAGE\"\n    notification_state      = \"ALARM\"\n    subscriber_email_addresses\
      \ = [\"team-ops@example.com\", \"finance@example.com\"]\n  }\n\n  notification {\n    notification_type       = \"ACTUAL\"\
      \n    comparison_operator     = \"GREATER_THAN\"\n    threshold               = 100\n    threshold_type          = \"\
      PERCENTAGE\"\n    notification_state      = \"ALARM\"\n    subscriber_email_addresses = [\"team-ops@example.com\", \"\
      finance@example.com\", \"management@example.com\"]\n  }\n}\n"
    non_compliant: '# No budget alerts configured

      # WAF-AGN-090 Violation

      # Cost overruns not detected

      '
  scope:
    block_type: resource
    resource_types:
    - aws_budgets_budget
  assertions:
  - attribute: budget_name
    op: not_empty
    message: Budget alerts must be configured for agent costs.
  on_fail: violation
- id: waf-agn-090.tf.aws.model-optimization-configured
  engine: terraform
  automated: true
  title: Model selection must be optimized for cost-performance
  provider: aws
  description: Agents must use the most cost-effective model that meets quality requirements. Model selection should consider
    input/output length, latency requirements, and cost per token. Optimization should be reviewed quarterly.
  expected: 'true'
  remediation: Document model selection criteria for each agent use case. Compare Claude Instant vs Claude Sonnet vs Claude
    Opus based on quality requirements. Use OpenAI GPT-3.5 Turbo vs GPT-4 based on task complexity. Implement model fallback
    for cost management.\n
  example:
    compliant: "# Documented model selection criteria\n# - Simple queries: Claude Instant (cheapest)\n# - Moderate complexity:\
      \ Claude Sonnet (balanced)\n# - High complexity: Claude Opus (best quality)\n# Review model performance quarterly\n\n\
      resource \"aws_bedrock_foundation_model\" \"model_selection\" {\n  model_id = \"anthropic.claude-3-haiku-20240307-v1:0\"\
      \  # Cost-optimized choice\n  # Model selection documented in architecture decision record\n}\n"
    non_compliant: '# Using expensive models for simple tasks

      # WAF-AGN-090 Violation

      # Cost-performance not optimized

      '
  scope:
    block_type: resource
    resource_types:
    - aws_bedrock_foundation_model
  assertions:
  - attribute: model_id
    op: not_empty
    message: Model selection must be documented and optimized.
  on_fail: violation
- id: waf-agn-090.tf.aws.caching-configured
  engine: terraform
  automated: true
  title: Caching must be implemented to reduce redundant API calls
  provider: aws
  description: Caching must be implemented for repeated queries, common prompts, and similar inputs. Cache keys must include
    input hash and model identifier. Cache TTL must be configured based on data freshness requirements.
  expected: 'true'
  remediation: Implement caching layer (ElastiCache, DynamoDB TTL) for agent responses. Cache based on input hash to handle
    similar queries efficiently. Configure cache invalidation based on data changes. Monitor cache hit rates.\n
  example:
    compliant: "resource \"aws_dynamodb_table\" \"agent_cache\" {\n  name         = \"agent-response-cache\"\n  billing_mode\
      \ = \"PAY_PER_REQUEST\"\n  hash_key     = \"cache_key\"\n\n  attribute {\n    name = \"cache_key\"\n    type = \"S\"\
      \n  }\n\n  ttl {\n    attribute_name = \"expires_at\"\n    enabled        = true\n  }\n\n  # Cache keys based on input\
      \ hash\n  # TTL based on data freshness needs\n}\n\nresource \"aws_lambda_function\" \"cache_middleware\" {\n  function_name\
      \ = \"agent-cache-middleware\"\n  # Middleware checks cache before API call\n}\n"
    non_compliant: '# No caching implemented

      # WAF-AGN-090 Violation

      # All queries hit API directly

      '
  scope:
    block_type: resource
    resource_types:
    - aws_dynamodb_table
    - aws_lambda_function
  assertions:
  - attribute: name
    op: not_empty
    message: Caching must be configured to reduce redundant API calls.
  on_fail: violation
- id: waf-agn-090.tf.azurerm.budget-alert-agent
  engine: terraform
  automated: true
  title: Azure Cost Management budget alerts must be configured for AI agent spending
  provider: azurerm
  description: Azure Cost Management budgets must monitor AI service spending (OpenAI, Cognitive Services) with alerts at
    75%, 90%, and 100% thresholds.
  expected: 'true'
  remediation: 'Configure azurerm_consumption_budget_subscription or azurerm_consumption_budget_resource_group with filters
    for AI service resource groups and alert email contacts.

    '
  example:
    compliant: "resource \"azurerm_consumption_budget_subscription\" \"agent_budget\" {\n  name            = \"agent-spend-budget\"\
      \n  subscription_id = data.azurerm_subscription.current.id\n\n  amount     = 1000\n  time_grain = \"Monthly\"\n\n  time_period\
      \ {\n    start_date = \"2026-01-01T00:00:00Z\"\n    end_date   = \"2026-12-31T23:59:59Z\"\n  }\n\n  notification {\n\
      \    enabled   = true\n    threshold = 75\n    operator  = \"EqualTo\"\n    contact_emails = [\"team-ops@example.com\"\
      ]\n  }\n\n  notification {\n    enabled   = true\n    threshold = 90\n    operator  = \"EqualTo\"\n    contact_emails\
      \ = [\"team-ops@example.com\", \"finance@example.com\"]\n  }\n}\n"
    non_compliant: "resource \"azurerm_cognitive_account\" \"ai\" {\n  name = \"ai-services\"\n  # No spending budget or alert\
      \ configured\n  # WAF-AGN-090 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_consumption_budget_subscription
    - azurerm_consumption_budget_resource_group
  assertions:
  - attribute: notification
    op: attribute_exists
    message: Budget must have notification thresholds configured.
  - attribute: amount
    op: greater_than
    expected: 0
    message: Budget must define a positive spending limit.
  on_fail: violation
- id: waf-agn-090.tf.google.budget-alert-agent
  engine: terraform
  automated: true
  title: GCP budgets must be configured for agent cost control
  provider: google
  description: GCP budgets must monitor Vertex AI, Cloud Run, and Cloud Logging spending for agent operations with threshold
    alerts.
  expected: 'true'
  remediation: 'Configure google_billing_budget with filters for Vertex AI / Cloud Run services and alert pubsub/email channels.

    '
  example:
    compliant: "resource \"google_billing_budget\" \"agent_budget\" {\n  billing_account = data.google_billing_account.account.id\n\
      \  display_name    = \"Agent Operations Budget\"\n\n  amount {\n    specified_amount {\n      currency_code = \"EUR\"\
      \n      units = \"1000\"\n    }\n  }\n\n  threshold_rules {\n    threshold_percent = 75\n  }\n\n  threshold_rules {\n\
      \    threshold_percent = 90\n  }\n\n  all_updates_rule {\n    monitoring_notification_channels = [google_monitoring_notification_channel.agent_budget.id]\n\
      \  }\n}\n"
    non_compliant: "resource \"google_cloud_run_service\" \"agent\" {\n  name = \"agent-service\"\n  # No billing budget configured\n\
      \  # WAF-AGN-090 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_billing_budget
  assertions:
  - attribute: threshold_rules
    op: attribute_exists
    message: Billing budget must define threshold alert rules.
  - attribute: amount
    op: attribute_exists
    message: Billing budget must define a spending amount.
  on_fail: violation
- id: waf-agn-090.tf.stackit.agentic-efficiency-reviewed
  engine: terraform
  automated: true
  title: Agent operations must be economic and performant for stackit
  provider: stackit
  description: Agent operations must be economic and performant must be documented in IaC via a agentic-efficiency-reviewed
    tag/label on stackit_project. This validates the control is tracked as code.
  expected: 'true'
  remediation: 'Add a agentic-efficiency-reviewed tag/label to the stackit_project resource to show the stackit implementation
    of WAF-AGN-090 is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    agentic-efficiency-reviewed = \"true\"\n\
      \  }\n}\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing agentic-efficiency-reviewed labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: agentic-efficiency-reviewed
    message: stackit_project is missing the agentic-efficiency-reviewed tag/label.
