checks:
  - id: waf-agn-090.tf.aws.token-monitoring-configured
    engine: terraform
    automated: true
    title: 'Agent token usage must be monitored'
    provider: aws
    description: 'Token usage (input, output, total) for all agents must be tracked and monitored. Usage must be exported to CloudWatch with daily aggregation. Anomalies in token usage must trigger alerts.'
    expected: 'true'
    remediation: 'Configure CloudWatch Metrics for Bedrock token usage. Create dashboards showing token consumption by agent. Set alarms for unusual token spikes that may indicate runaway prompts or model issues.\n'
    example:
      compliant: |
        resource "aws_cloudwatch_metric_alarm" "token_usage" {
          alarm_name          = "agent-token-spike"
          comparison_operator = "GreaterThanThreshold"
          evaluation_periods  = 1
          metric_name         = "InputTokenCount"
          namespace           = "AWS/Bedrock"
          period              = 300
          statistic           = "Sum"
          threshold           = 50000
          unit                = "Count"
          alarm_description   = "Agent token usage anomaly detected"
        }

        resource "aws_cloudwatch_dashboard" "agent_dashboard" {
          dashboard_name = "agent-metrics"

          dashboard_body = jsonencode({
            widgets = [{
              type   = "metric"
              x      = 0
              y      = 0
              width  = 12
              height = 6
              properties = {
                metrics = [
                  ["AWS/Bedrock", "InputTokenCount", "AgentName", "customer-agent"]
                ]
                period = 300
                stat   = "Sum"
                region = "us-east-1"
              }
            }]
          })
        }
      non_compliant: |
        # No token monitoring configured
        # WAF-AGN-090 Violation
        # Cannot track or control costs

    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_metric_alarm
        - aws_cloudwatch_dashboard
    assertions:
      - attribute: 'alarm_name'
        op: 'not_empty'
        message: 'Token usage monitoring must be configured.'
    on_fail: violation
  - id: waf-agn-090.tf.aws.budget-alerts-configured
    engine: terraform
    automated: true
    title: 'Budget alerts must be configured for agent costs'
    provider: aws
    description: 'Cost budgets must be set for agent operations with alerts at 50%, 75%, 90%, and 100% of budget. Alerts must be sent to designated recipients before thresholds are reached.'
    expected: 'true'
    remediation: 'Configure AWS Cost Explorer budgets for Bedrock spending. Set up budget alerts via SNS topics. Define budget periods (monthly, quarterly) and threshold percentages.\n'
    example:
      compliant: |
        resource "aws_budgets_budget" "agent_budget" {
          budget_name = "agent-monthly-budget"

          budget_type      = "COST"
          limit_amount     = "500"
          limit_unit       = "USD"
          time_unit        = "MONTHLY"

          cost_types {
            include_tax           = true
            include_subscription  = true
            include_recurring     = true
            include_other_subscription = true
            include_discounts     = true
            use_amortized         = false
            use_blended           = false
          }

          time_period_start = "2026-01-01_00:00"
          time_period_end   = "2026-12-31_23:59"

          notification {
            notification_type       = "ACTUAL"
            comparison_operator     = "GREATER_THAN"
            threshold               = 50
            threshold_type          = "PERCENTAGE"
            notification_state      = "ALARM"
            subscriber_email_addresses = ["team-ops@example.com"]
          }

          notification {
            notification_type       = "ACTUAL"
            comparison_operator     = "GREATER_THAN"
            threshold               = 75
            threshold_type          = "PERCENTAGE"
            notification_state      = "ALARM"
            subscriber_email_addresses = ["team-ops@example.com", "finance@example.com"]
          }

          notification {
            notification_type       = "ACTUAL"
            comparison_operator     = "GREATER_THAN"
            threshold               = 90
            threshold_type          = "PERCENTAGE"
            notification_state      = "ALARM"
            subscriber_email_addresses = ["team-ops@example.com", "finance@example.com"]
          }

          notification {
            notification_type       = "ACTUAL"
            comparison_operator     = "GREATER_THAN"
            threshold               = 100
            threshold_type          = "PERCENTAGE"
            notification_state      = "ALARM"
            subscriber_email_addresses = ["team-ops@example.com", "finance@example.com", "management@example.com"]
          }
        }
      non_compliant: |
        # No budget alerts configured
        # WAF-AGN-090 Violation
        # Cost overruns not detected

    scope:
      block_type: resource
      resource_types:
        - aws_budgets_budget
    assertions:
      - attribute: 'budget_name'
        op: 'not_empty'
        message: 'Budget alerts must be configured for agent costs.'
    on_fail: violation
  - id: waf-agn-090.tf.aws.model-optimization-configured
    engine: terraform
    automated: true
    title: 'Model selection must be optimized for cost-performance'
    provider: aws
    description: 'Agents must use the most cost-effective model that meets quality requirements. Model selection should consider input/output length, latency requirements, and cost per token. Optimization should be reviewed quarterly.'
    expected: 'true'
    remediation: 'Document model selection criteria for each agent use case. Compare Claude Instant vs Claude Sonnet vs Claude Opus based on quality requirements. Use OpenAI GPT-3.5 Turbo vs GPT-4 based on task complexity. Implement model fallback for cost management.\n'
    example:
      compliant: |
        # Documented model selection criteria
        # - Simple queries: Claude Instant (cheapest)
        # - Moderate complexity: Claude Sonnet (balanced)
        # - High complexity: Claude Opus (best quality)
        # Review model performance quarterly

        resource "aws_bedrock_foundation_model" "model_selection" {
          model_id = "anthropic.claude-3-haiku-20240307-v1:0"  # Cost-optimized choice
          # Model selection documented in architecture decision record
        }
      non_compliant: |
        # Using expensive models for simple tasks
        # WAF-AGN-090 Violation
        # Cost-performance not optimized

    scope:
      block_type: resource
      resource_types:
        - aws_bedrock_foundation_model
    assertions:
      - attribute: 'model_id'
        op: 'not_empty'
        message: 'Model selection must be documented and optimized.'
    on_fail: violation
  - id: waf-agn-090.tf.aws.caching-configured
    engine: terraform
    automated: true
    title: 'Caching must be implemented to reduce redundant API calls'
    provider: aws
    description: 'Caching must be implemented for repeated queries, common prompts, and similar inputs. Cache keys must include input hash and model identifier. Cache TTL must be configured based on data freshness requirements.'
    expected: 'true'
    remediation: 'Implement caching layer (ElastiCache, DynamoDB TTL) for agent responses. Cache based on input hash to handle similar queries efficiently. Configure cache invalidation based on data changes. Monitor cache hit rates.\n'
    example:
      compliant: |
        resource "aws_dynamodb_table" "agent_cache" {
          name         = "agent-response-cache"
          billing_mode = "PAY_PER_REQUEST"
          hash_key     = "cache_key"

          attribute {
            name = "cache_key"
            type = "S"
          }

          ttl {
            attribute_name = "expires_at"
            enabled        = true
          }

          # Cache keys based on input hash
          # TTL based on data freshness needs
        }

        resource "aws_lambda_function" "cache_middleware" {
          function_name = "agent-cache-middleware"
          # Middleware checks cache before API call
        }
      non_compliant: |
        # No caching implemented
        # WAF-AGN-090 Violation
        # All queries hit API directly

    scope:
      block_type: resource
      resource_types:
        - aws_dynamodb_table
        - aws_lambda_function
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Caching must be configured to reduce redundant API calls.'
    on_fail: violation
