# ID: WAF-AGN-010
id: WAF-AGN-010
pillar: agentic
severity: high
type:
  - governance
  - configuration
description: |
  Jeder Agent muss identifizierbar, authentifizierbar und nachvollziehbar sein. Agenten MÜSSEN eindeutige, stabile IDs besitzen. Die Authentifizierung über Token oder Zertifikate ist für alle Agenten-Kommunikationen verpflichtend. Alle Agenten-Interaktionen MÜSSEN in einem Audit-Trail für Sicherheit und Compliance protokolliert werden.
regulatory_mapping:
  - framework: 'ISO 27001:2022'
    controls:
      - 'A.8.2 – Privileged access rights'
      - 'A.8.5 – Secure authentication'
      - 'A.5.17 – Authentication information'
  - framework: 'ISO 27017'
    controls:
      - 'CLD.9.5 – Segregation in virtual computing environments'
  - framework: 'CIS Controls v8'
    controls:
      - 'CIS 5 – Account Management'
      - 'CIS 6 – Access Control Management'
  - framework: 'SOC 2 Type II'
    controls:
      - 'CC6.1 – Logical and physical access controls'
      - 'CC6.2 – Provisioning and removal of access'
  - framework: 'NIST SP 800-53'
    controls:
      - 'AC-2 – Account Management'
      - 'IA-2 – Identification and Authentication'
  - framework: 'NIST CSF 2.0'
    controls:
      - 'PR.AA-01 – Identities and credentials are managed'
      - 'PR.AA-03 – Users, services and hardware are authenticated'
  - framework: 'GDPR'
    controls:
      - 'Art. 32 – Security of processing'
      - 'Art. 5(1)(f) – Integrity and confidentiality'
  - framework: 'PCI DSS v4.0'
    controls:
      - 'Req 7 – Restrict access by business need to know'
      - 'Req 8 – Identify and authenticate access'
  - framework: 'CSA STAR'
    controls:
      - 'CCM IAM-01 – Identity and Access Management Policy'
      - 'CCM IAM-02 – Strong Password Policy and Procedures'
  - framework: 'BSI C5:2020'
    controls:
      - 'IDM-01 – Identity and access management policy'
      - 'IDM-02 – Authentication of users'
  - framework: 'TISAX'
    controls:
      - 'Information security – Identity and access management requirements'
  - framework: 'ANSSI SecNumCloud'
    controls:
      - 'Domain – Identity and access management'
  - framework: 'BIO'
    controls:
      - 'BIO – Logische toegangsbeveiliging (logical access control)'
  - framework: 'ENS High'
    controls:
      - 'op.acc.5 – Mecanismo de autenticación'
      - 'op.acc.7 – Gestión de privilegios'
  - framework: 'UK NCSC CAF'
    controls:
      - 'B2 – Identity and access control'
  - framework: 'FedRAMP'
    controls:
      - 'AC-2, IA-2 (Moderate/High baseline)'
  - framework: 'CMMC 2.0'
    controls:
      - 'AC.L2-3.1.1 – Limit system access to authorized users'
      - 'IA.L2-3.5.3 – Multifactor authentication'
  - framework: 'IT-Grundschutz'
    controls:
      - 'ORP.4 – Identitäts- und Berechtigungsmanagement'
  - framework: 'IRAP'
    controls:
      - 'ISM – Identification and authentication'
  - framework: 'CCCS PBMM'
    controls:
      - 'AC-2, IA-2 – Account and authenticator management'
  - framework: 'MAS TRM'
    controls:
      - 'Ch.6 – Access control'
  - framework: 'ISMAP'
    controls:
      - 'Identity and access management controls'
  - framework: 'FISC'
    controls:
      - 'Technical measures – User authentication and access control'
  - framework: 'DORA'
    controls:
      - 'Art. 9 – Protection and prevention'
  - framework: 'EUCS (ENISA)'
    controls:
      - 'IAM-01 – Identity and access management'
      - 'IAM-02 – Authentication controls'
checks:
  - id: waf-agn-010.tf.aws.bedrock-agent-id-defined
    engine: terraform
    automated: true
    title: 'AWS-Bedrock-Agenten müssen eindeutige Identifikatoren und Authentifizierung besitzen'
    provider: aws
    description: 'AWS-Bedrock-Agenten müssen eine eindeutige, stabile agent_id sowie Authentifizierung über IAM-Rollen oder API-Schlüssel besitzen. Alle Agenten-Interaktionen müssen über CloudWatch protokolliert werden.'
    expected: 'true'
    remediation: 'Definieren Sie eine aws_bedrockagent-Ressource mit einer eindeutigen agent_id und verknüpfen Sie sie mit einer IAM-Rolle zur Authentifizierung. Aktivieren Sie CloudWatch-Logging für Agenten-Interaktionen.\n'
    example:
      compliant: |
        resource "aws_bedrockagent" "customer_support_agent" {
          agent_name = "customer-support-agent"
          description = "Agent für Kundensupport-Anfragen"
          agent_resources = [{
            model_arn = aws_bedrock_foundation_model.claude.arn
          }]
          # Eindeutige agent_id wird automatisch zugewiesen
          # Authentifizierung über IAM-Rolle
        }
        resource "aws_cloudwatch_log_group" "agent_logs" {
          name = "/aws/bedrock/customer-support-agent"
        }
      non_compliant: |
        # Kein Agent definiert – unauthentifizierter Agenten-Zugriff
        # WAF-AGN-010 Verstoß
        # Agenten ohne ID und Authentifizierung sind nicht erlaubt

    scope:
      block_type: resource
      resource_types:
        - aws_bedrockagent
    assertions:
      - attribute: 'agent_name'
        op: 'not_empty'
        message: 'Agent muss einen eindeutigen Namen/Identifikator besitzen.'
      - attribute: 'agent_resources'
        op: 'attribute_exists'
        message: 'Agent muss Ressourcen konfiguriert haben.'
    on_fail: violation
  - id: waf-agn-010.tf.google.vertex-agent-id-defined
    engine: terraform
    automated: true
    title: 'Google-Vertex-AI-Agenten müssen eindeutige Identifikatoren und Authentifizierung besitzen'
    provider: google
    description: 'Google-Vertex-AI-Agenten müssen eine eindeutige agent_id und Authentifizierung über IAM-Service-Accounts besitzen. Alle Interaktionen müssen über Cloud Logging protokolliert werden.'
    expected: 'true'
    remediation: 'Definieren Sie eine google_vertex_ai_agent-Ressource mit eindeutigem Identifikator und Service-Account-Authentifizierung. Konfigurieren Sie Cloud Logging für Agenten-Interaktionen.\n'
    example:
      compliant: |
        resource "google_vertex_ai_agent" "fraud_detection" {
          display_name = "fraud-detection-agent"
          description  = "Agent für Betrugserkennung"
          # Eindeutige agent_id wird automatisch zugewiesen
          # Authentifizierung über Service-Account
        }
        resource "google_logging_project_sink" "agent_logs" {
          name = "agent-logs"
          destination = "storage.googleapis.com/agent-logs-bucket"
          filter = "resource.type=vertex_ai_agent"
        }
      non_compliant: |
        # Kein Agent definiert – unauthentifizierter Zugriff
        # WAF-AGN-010 Verstoß

    scope:
      block_type: resource
      resource_types:
        - google_vertex_ai_agent
    assertions:
      - attribute: 'display_name'
        op: 'not_empty'
        message: 'Agent muss einen Anzeigenamen/Identifikator besitzen.'
    on_fail: violation
  - id: waf-agn-010.tf.azure.ai-agent-id-defined
    engine: terraform
    automated: true
    title: 'Azure-AI-Agenten müssen eindeutige Identifikatoren und Authentifizierung besitzen'
    provider: azurerm
    description: 'Azure-AI-Agenten müssen eine eindeutige agent_id und Authentifizierung über Azure AD oder Managed Identity besitzen. Alle Interaktionen müssen über Application Insights protokolliert werden.'
    expected: 'true'
    remediation: 'Definieren Sie eine azure_ai_agent-Ressource mit eindeutigem Identifikator und Managed-Identity-Authentifizierung. Konfigurieren Sie Application Insights für das Logging.\n'
    example:
      compliant: |
        resource "azurerm_cognitive_deployment" "agent" {
          name                       = "customer-service-agent"
          cognitive_account_id       = azurerm_cognitive_account.main.id
          model_name                 = "gpt-4"
          format                     = "OpenAI"
          # Authentifizierung über Managed Identity
        }
        resource "azurerm_application_insights" "agent_ai" {
          name                = "agent-insights"
          resource_group_name = azurerm_resource_group.main.name
          location            = azurerm_resource_group.main.location
          workspace_id        = azurerm_log_analytics_workspace.main.id
        }
      non_compliant: |
        # Kein Agent definiert – unauthentifizierter Zugriff
        # WAF-AGN-010 Verstoß

    scope:
      block_type: resource
      resource_types:
        - azurerm_cognitive_deployment
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Agent muss einen eindeutigen Namen/Identifikator besitzen.'
    on_fail: violation
  - id: waf-agn-010.audit.agent-interactions-logged
    engine: config
    automated: true
    title: 'Agenten-Interaktionen müssen im Audit-Trail protokolliert werden'
    provider: multi
    description: 'Alle Agenten-Interaktionen (Input, Output, Tool-Calls, Entscheidungen) müssen in einem Audit-Trail protokolliert werden. Die Logs müssen Zeitstempel, Agenten-ID, Benutzer-ID (falls zutreffend) und Ergebnis enthalten.'
    expected: 'true'
    remediation: 'Konfigurieren Sie Logging für alle Agenten-Plattformen (Bedrock, Vertex AI, Azure OpenAI), um Logs an ein zentrales Audit-System (CloudWatch, Cloud Logging, Application Insights) zu senden.\n'
    example:
      compliant: |
        # Agenten-Logs sind konfiguriert und fließen in das Audit-System
        # CloudWatch-Log-Gruppe: /aws/bedrock/*
        # Cloud Logging: vertex-ai-agent-logs
        # Application Insights: agent-interaction-data
      non_compliant: |
        # Kein Audit-Logging konfiguriert
        # WAF-AGN-010 Verstoß

    scope:
      block_type: resource
      resource_types:
        - aws_cloudwatch_log_group
        - google_logging_project_sink
        - azurerm_application_insights
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Audit-Logging muss konfiguriert sein.'
    on_fail: violation
