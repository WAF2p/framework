checks:
- id: waf-agn-010.tf.aws.bedrock-agent-id-defined
  engine: terraform
  automated: true
  title: AWS Bedrock agents must have unique identifiers and authentication
  provider: aws
  description: AWS Bedrock agents must have a unique, stable agent_id and authentication via IAM roles or API keys. All agent
    interactions must be logged via CloudWatch.
  expected: 'true'
  remediation: Define an aws_bedrockagent resource with a unique agent_id and associate it with an IAM role for authentication.
    Enable CloudWatch logging for agent interactions.\n
  example:
    compliant: "resource \"aws_bedrockagent\" \"customer_support_agent\" {\n  agent_name = \"customer-support-agent\"\n  description\
      \ = \"Agent for customer support inquiries\"\n  agent_resources = [{\n    model_arn = aws_bedrock_foundation_model.claude.arn\n\
      \  }]\n  # Unique agent_id automatically assigned\n  # Authentication via IAM role\n}\nresource \"aws_cloudwatch_log_group\"\
      \ \"agent_logs\" {\n  name = \"/aws/bedrock/customer-support-agent\"\n}\n"
    non_compliant: '# No agent defined – unauthenticated agent access

      # WAF-AGN-010 Violation

      # Agents without IDs and authentication are not permitted

      '
  scope:
    block_type: resource
    resource_types:
    - aws_bedrockagent
  assertions:
  - attribute: agent_name
    op: not_empty
    message: Agent must have a unique name/identifier.
  - attribute: agent_resources
    op: attribute_exists
    message: Agent must have resources configured.
  on_fail: violation
- id: waf-agn-010.tf.google.vertex-agent-id-defined
  engine: terraform
  automated: true
  title: Google Vertex AI agents must have unique identifiers and authentication
  provider: google
  description: Google Vertex AI agents must have unique agent_id and authentication via IAM service accounts. All interactions
    must be logged via Cloud Logging.
  expected: 'true'
  remediation: Define a vertex_ai_agent resource with unique identifier and service account authentication. Configure Cloud
    Logging for agent interactions.\n
  example:
    compliant: "resource \"google_vertex_ai_agent\" \"fraud_detection\" {\n  display_name = \"fraud-detection-agent\"\n  description\
      \  = \"Agent for fraud detection\"\n  # Unique agent_id automatically assigned\n  # Authentication via service account\n\
      }\nresource \"google_logging_project_sink\" \"agent_logs\" {\n  name = \"agent-logs\"\n  destination = \"storage.googleapis.com/agent-logs-bucket\"\
      \n  filter = \"resource.type=vertex_ai_agent\"\n}\n"
    non_compliant: '# No agent defined – unauthenticated access

      # WAF-AGN-010 Violation

      '
  scope:
    block_type: resource
    resource_types:
    - google_vertex_ai_agent
  assertions:
  - attribute: display_name
    op: not_empty
    message: Agent must have a display name/identifier.
  on_fail: violation
- id: waf-agn-010.tf.azurerm.ai-agent-id-defined
  engine: terraform
  automated: true
  title: Azure AI agents must have unique identifiers and authentication
  provider: azurerm
  description: Azure AI agents must have unique agent_id and authentication via Azure AD or Managed Identity. All interactions
    must be logged via Application Insights.
  expected: 'true'
  remediation: Define an azure_ai_agent resource with unique identifier and Managed Identity authentication. Configure Application
    Insights for logging.\n
  example:
    compliant: "resource \"azurerm_cognitive_deployment\" \"agent\" {\n  name                       = \"customer-service-agent\"\
      \n  cognitive_account_id       = azurerm_cognitive_account.main.id\n  model_name                 = \"gpt-4\"\n  format\
      \                     = \"OpenAI\"\n  # Authentication via Managed Identity\n}\nresource \"azurerm_application_insights\"\
      \ \"agent_ai\" {\n  name                = \"agent-insights\"\n  resource_group_name = azurerm_resource_group.main.name\n\
      \  location            = azurerm_resource_group.main.location\n  workspace_id        = azurerm_log_analytics_workspace.main.id\n\
      }\n"
    non_compliant: '# No agent defined – unauthenticated access

      # WAF-AGN-010 Violation

      '
  scope:
    block_type: resource
    resource_types:
    - azurerm_cognitive_deployment
  assertions:
  - attribute: name
    op: not_empty
    message: Agent must have a unique name/identifier.
  on_fail: violation
- id: waf-agn-010.config.multi.identity-access
  engine: config
  automated: true
  title: Agent interactions must be logged in audit trail
  provider: multi
  description: A version-controlled policy document must exist at `docs/agentic/waf-agn-010-identity-access.md` and document
    the cross-provider implementation of this control. The checker validates that the file exists and contains a normative
    requirement statement (MUST/SHALL/required/mandatory).
  expected: 'true'
  remediation: 'Create or update `docs/agentic/waf-agn-010-identity-access.md`. State the requirement, how it is implemented
    for cross-provider, the review cadence, and the owner.

    '
  example:
    compliant: '|

      docs/agentic/waf-agn-010-identity-access.md:

      - The cross-provider implementation of WAF-AGN-010 is documented.

      - Implementation status and owner are recorded.

      - Review cadence is defined (e.g. quarterly).

      '
    non_compliant: '|

      # `docs/agentic/waf-agn-010-identity-access.md` is missing or does not contain a normative requirement.

      # WAF-AGN-010 violation: cross-provider control is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/agentic/waf-agn-010-identity-access.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/agentic/waf-agn-010-identity-access.md` must contain a normative requirement statement.
  on_fail: violation
- id: waf-agn-010.tf.stackit.agentic-audit-logged
  engine: terraform
  automated: true
  title: Every agent must be identifiable, authenticatable, and traceable for stackit
  provider: stackit
  description: Every agent must be identifiable, authenticatable, and traceable must be documented in IaC via a agentic-audit-logged
    tag/label on stackit_project. This validates the control is tracked as code.
  expected: 'true'
  remediation: 'Add a agentic-audit-logged tag/label to the stackit_project resource to show the stackit implementation of
    WAF-AGN-010 is tracked in IaC.

    '
  example:
    compliant: "|\nresource \"stackit_project\" \"example\" {\n  labels = {\n    agentic-audit-logged = \"true\"\n  }\n}\n"
    non_compliant: "|\nresource \"stackit_project\" \"example\" {\n  # Missing agentic-audit-logged labels\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_project
  assertions:
  - attribute: labels
    op: key_exists
    key: agentic-audit-logged
    message: stackit_project is missing the agentic-audit-logged tag/label.
  on_fail: violation
