checks:
  - id: waf-agn-050.tf.aws.content-filters-enabled
    engine: terraform
    automated: true
    title: 'AWS-Bedrock-Agenten müssen Content-Filter konfiguriert haben'
    provider: aws
    description: 'AWS-Bedrock-Agenten müssen Content-Filtering über Guardrails aktiviert haben. Filter müssen schädliche, beleidigende oder unangemessene Inhalte gemäß Unternehmensrichtlinie blockieren.'
    expected: 'true'
    remediation: 'Erstellen und konfigurieren Sie AWS-Bedrock-Guardrails mit Content-Filtering. Definieren Sie Content-Policies für Hassrede, Gewalt, sexuelle Inhalte und schädliche Aktivitäten. Wenden Sie Guardrails auf alle Agenten an.\n'
    example:
      compliant: |
        resource "aws_bedrock_guardrail" "organizational_guardrail" {
          name = "organizational-guardrail"

          blocked_input_messages = [{
            text = "hate-speech"
          }]

          blocked_output_messages = [{
            text = "hate-speech"
          }]

          # Content-Filter konfiguriert
        }

        resource "aws_bedrockagent" "filtered_agent" {
          agent_name = "content-filtered-agent"

          guardrail_configuration {
            guardrail_arn = aws_bedrock_guardrail.organizational_guardrail.arn
            guardrail_version = "DRAFT"
          }
        }
      non_compliant: |
        resource "aws_bedrockagent" "unfiltered" {
          agent_name = "no-content-filter"
          # Kein Guardrail konfiguriert
          # WAF-AGN-050 Verstoß
        }

    scope:
      block_type: resource
      resource_types:
        - aws_bedrock_guardrail
        - aws_bedrockagent
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Content-Filter (Guardrails) müssen konfiguriert sein.'
    on_fail: violation
  - id: waf-agn-050.tf.aws.action-boundaries-configured
    engine: terraform
    automated: true
    title: 'Agenten-Aktions-Boundaries müssen konfiguriert sein'
    provider: aws
    description: 'Agenten müssen Aktions-Boundaries über IAM-Rollen und Tool-Schemas definiert haben. Agenten dürfen keine Aktionen außerhalb ihres Scopes ausführen. Maximale Token-Limits und Output-Längen müssen konfiguriert sein.'
    expected: 'true'
    remediation: 'Konfigurieren Sie IAM-Rollen mit Least-Privilege-Berechtigungen für Agenten-Aktionen. Definieren Sie strikte Tool-Schemas, die einschränken, welche Werkzeuge Agenten nutzen dürfen. Setzen Sie Output-Token-Limits und Input-Längenbeschränkungen in der Agenten-Konfiguration.\n'
    example:
      compliant: |
        resource "aws_iam_role" "agent_role" {
          name = "agent-role"

          assume_role_policy = jsonencode({
            Version = "2012-10-17"
            Statement = [{
              Effect = "Allow"
              Principal = {
                Service = "bedrock.amazonaws.com"
              }
              Action = "sts:AssumeRole"
            }]
          })
        }

        resource "aws_iam_role_policy" "agent_limits" {
          name = "agent-limits"
          role = aws_iam_role.agent_role.id

          policy = jsonencode({
            Version = "2012-10-17"
            Statement = [{
              Effect = "Allow"
              Action = [
                "s3:GetObject",
                "s3:ListBucket"
              ]
              Resource = [
                "arn:aws:s3:::allowed-bucket/*"
              ]
            }]
          })
        }
      non_compliant: |
        resource "aws_iam_role" "unlimited_role" {
          name = "unlimited-agent-role"
          # Keine Policy-Beschränkungen
          # WAF-AGN-050 Verstoß
        }

    scope:
      block_type: resource
      resource_types:
        - aws_iam_role
        - aws_bedrockagent
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Aktions-Boundaries (IAM-Policies) müssen konfiguriert sein.'
    on_fail: violation
  - id: waf-agn-050.tf.aws.human-in-the-loop-configured
    engine: terraform
    automated: true
    title: 'Human-in-the-Loop muss für sensible Entscheidungen konfiguriert sein'
    provider: aws
    description: 'Für Hochrisiko-Agenten-Entscheidungen (finanziell, rechtlich, personenbezogene Daten) MUSS eine menschliche Genehmigung erforderlich sein. Der Human-in-the-Loop-Workflow muss über AWS Bedrock oder ein externes Genehmigungssystem konfiguriert sein.'
    expected: 'true'
    remediation: 'Konfigurieren Sie Human-in-the-Loop-Genehmigungsworkflows für sensible Agenten-Aktionen. Verwenden Sie die Genehmigungsfunktion von AWS Bedrock oder integrieren Sie ein externes Genehmigungssystem (ServiceNow, Jira, individuell). Definieren Sie Entscheidungstypen, die eine menschliche Prüfung erfordern.\n'
    example:
      compliant: |
        resource "aws_bedrockagent" "hitable_agent" {
          agent_name = "human-in-loop-agent"

          human_interaction_configuration {
            human_interpretation_prompt = "Prüfen Sie die Agenten-Entscheidung auf Korrektheit"
            human_interpretation_timeout = 3600
            human_interpretation_output_context_name = "approval"
          }
        }
      non_compliant: |
        resource "aws_bedrockagent" "no_human" {
          agent_name = "fully-automated-agent"
          # Kein Human-in-the-Loop für sensible Entscheidungen
          # WAF-AGN-050 Verstoß
        }

    scope:
      block_type: resource
      resource_types:
        - aws_bedrockagent
    assertions:
      - attribute: 'agent_name'
        op: 'not_empty'
        message: 'Human-in-the-Loop muss für sensible Entscheidungen konfiguriert sein.'
    on_fail: violation
