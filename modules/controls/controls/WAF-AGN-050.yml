checks:
  - id: waf-agn-050.tf.aws.content-filters-enabled
    engine: terraform
    automated: true
    title: 'AWS Bedrock agents must have content filters configured'
    provider: aws
    description: 'AWS Bedrock agents must have content filtering enabled via guardrails. Filters must block harmful, offensive, or inappropriate content according to organizational policy.'
    expected: 'true'
    remediation: 'Create and configure AWS Bedrock guardrails with content filtering. Define content policies for hate speech, violence, sexual content, and harmful activity. Apply guardrails to all agents.\n'
    example:
      compliant: |
        resource "aws_bedrock_guardrail" "organizational_guardrail" {
          name = "organizational-guardrail"

          blocked_input_messages = [{
            text = "hate-speech"
          }]

          blocked_output_messages = [{
            text = "hate-speech"
          }]

          # Content filters configured
        }

        resource "aws_bedrockagent" "filtered_agent" {
          agent_name = "content-filtered-agent"

          guardrail_configuration {
            guardrail_arn = aws_bedrock_guardrail.organizational_guardrail.arn
            guardrail_version = "DRAFT"
          }
        }
      non_compliant: |
        resource "aws_bedrockagent" "unfiltered" {
          agent_name = "no-content-filter"
          # No guardrail configured
          # WAF-AGN-050 Violation
        }

    scope:
      block_type: resource
      resource_types:
        - aws_bedrock_guardrail
        - aws_bedrockagent
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Content filters (guardrails) must be configured.'
    on_fail: violation
  - id: waf-agn-050.tf.aws.action-boundaries-configured
    engine: terraform
    automated: true
    title: 'Agent action boundaries must be configured'
    provider: aws
    description: 'Agents must have action boundaries defined via IAM roles and tool schemas. Agents must not be able to perform actions outside their scope. Maximum token limits and output lengths must be configured.'
    expected: 'true'
    remediation: 'Configure IAM roles with least-privilege permissions for agent actions. Define strict tool schemas limiting what tools agents can use. Set output token limits and input length constraints in agent configuration.\n'
    example:
      compliant: |
        resource "aws_iam_role" "agent_role" {
          name = "agent-role"

          assume_role_policy = jsonencode({
            Version = "2012-10-17"
            Statement = [{
              Effect = "Allow"
              Principal = {
                Service = "bedrock.amazonaws.com"
              }
              Action = "sts:AssumeRole"
            }]
          })
        }

        resource "aws_iam_role_policy" "agent_limits" {
          name = "agent-limits"
          role = aws_iam_role.agent_role.id

          policy = jsonencode({
            Version = "2012-10-17"
            Statement = [{
              Effect = "Allow"
              Action = [
                "s3:GetObject",
                "s3:ListBucket"
              ]
              Resource = [
                "arn:aws:s3:::allowed-bucket/*"
              ]
            }]
          })
        }
      non_compliant: |
        resource "aws_iam_role" "unlimited_role" {
          name = "unlimited-agent-role"
          # No policy restrictions
          # WAF-AGN-050 Violation
        }

    scope:
      block_type: resource
      resource_types:
        - aws_iam_role
        - aws_bedrockagent
    assertions:
      - attribute: 'name'
        op: 'not_empty'
        message: 'Action boundaries (IAM policies) must be configured.'
    on_fail: violation
  - id: waf-agn-050.tf.aws.human-in-the-loop-configured
    engine: terraform
    automated: true
    title: 'Human-in-the-loop must be configured for sensitive decisions'
    provider: aws
    description: 'For high-risk agent decisions (financial, legal, personal data), human approval MUST be required. The human-in-the-loop workflow must be configured via AWS Bedrock or external approval system.'
    expected: 'true'
    remediation: 'Configure human-in-the-loop approval workflows for sensitive agent actions. Use AWS Bedrock’s approval feature or integrate with an external approval system (ServiceNow, Jira, custom). Define decision types requiring human review.\n'
    example:
      compliant: |
        resource "aws_bedrockagent" "hitable_agent" {
          agent_name = "human-in-loop-agent"

          human_interaction_configuration {
            human_interpretation_prompt = "Review agent decision for accuracy"
            human_interpretation_timeout = 3600
            human_interpretation_output_context_name = "approval"
          }
        }
      non_compliant: |
        resource "aws_bedrockagent" "no_huawei" {
          agent_name = "fully-automated-agent"
          # No human-in-the-loop for sensitive decisions
          # WAF-AGN-050 Violation
        }

    scope:
      block_type: resource
      resource_types:
        - aws_bedrockagent
    assertions:
      - attribute: 'agent_name'
        op: 'not_empty'
        message: 'Human-in-the-loop must be configured for sensitive decisions.'
    on_fail: violation
