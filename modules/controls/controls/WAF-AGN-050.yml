# ID: WAF-AGN-050
id: WAF-AGN-050
pillar: agentic
severity: high
type:
  - governance
  - configuration
description: |
  Fail-Safe-, Alignment- und Verifikationsmechanismen MÜSSEN vorhanden sein. Content-Filter MÜSSEN so konfiguriert sein, dass unangemessene Inhalte blockiert werden. Aktions-Boundaries MÜSSEN verhindern, dass Agenten nicht autorisierte Aktionen ausführen. Human-in-the-Loop MUSS für sensible Entscheidungen konfiguriert sein. Guardrails MÜSSEN mit den Unternehmenswerten übereinstimmen.
