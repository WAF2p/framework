checks:
- id: waf-agn-050.tf.aws.content-filters-enabled
  engine: terraform
  automated: true
  title: AWS Bedrock agents must have content filters configured
  provider: aws
  description: AWS Bedrock agents must have content filtering enabled via guardrails. Filters must block harmful, offensive,
    or inappropriate content according to organizational policy.
  expected: 'true'
  remediation: Create and configure AWS Bedrock guardrails with content filtering. Define content policies for hate speech,
    violence, sexual content, and harmful activity. Apply guardrails to all agents.\n
  example:
    compliant: "resource \"aws_bedrock_guardrail\" \"organizational_guardrail\" {\n  name = \"organizational-guardrail\"\n\
      \n  blocked_input_messages = [{\n    text = \"hate-speech\"\n  }]\n\n  blocked_output_messages = [{\n    text = \"hate-speech\"\
      \n  }]\n\n  # Content filters configured\n}\n\nresource \"aws_bedrockagent\" \"filtered_agent\" {\n  agent_name = \"\
      content-filtered-agent\"\n\n  guardrail_configuration {\n    guardrail_arn = aws_bedrock_guardrail.organizational_guardrail.arn\n\
      \    guardrail_version = \"DRAFT\"\n  }\n}\n"
    non_compliant: "resource \"aws_bedrockagent\" \"unfiltered\" {\n  agent_name = \"no-content-filter\"\n  # No guardrail\
      \ configured\n  # WAF-AGN-050 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_bedrock_guardrail
    - aws_bedrockagent
  assertions:
  - attribute: name
    op: not_empty
    message: Content filters (guardrails) must be configured.
  on_fail: violation
- id: waf-agn-050.tf.aws.action-boundaries-configured
  engine: terraform
  automated: true
  title: Agent action boundaries must be configured
  provider: aws
  description: Agents must have action boundaries defined via IAM roles and tool schemas. Agents must not be able to perform
    actions outside their scope. Maximum token limits and output lengths must be configured.
  expected: 'true'
  remediation: Configure IAM roles with least-privilege permissions for agent actions. Define strict tool schemas limiting
    what tools agents can use. Set output token limits and input length constraints in agent configuration.\n
  example:
    compliant: "resource \"aws_iam_role\" \"agent_role\" {\n  name = \"agent-role\"\n\n  assume_role_policy = jsonencode({\n\
      \    Version = \"2012-10-17\"\n    Statement = [{\n      Effect = \"Allow\"\n      Principal = {\n        Service =\
      \ \"bedrock.amazonaws.com\"\n      }\n      Action = \"sts:AssumeRole\"\n    }]\n  })\n}\n\nresource \"aws_iam_role_policy\"\
      \ \"agent_limits\" {\n  name = \"agent-limits\"\n  role = aws_iam_role.agent_role.id\n\n  policy = jsonencode({\n  \
      \  Version = \"2012-10-17\"\n    Statement = [{\n      Effect = \"Allow\"\n      Action = [\n        \"s3:GetObject\"\
      ,\n        \"s3:ListBucket\"\n      ]\n      Resource = [\n        \"arn:aws:s3:::allowed-bucket/*\"\n      ]\n    }]\n\
      \  })\n}\n"
    non_compliant: "resource \"aws_iam_role\" \"unlimited_role\" {\n  name = \"unlimited-agent-role\"\n  # No policy restrictions\n\
      \  # WAF-AGN-050 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_iam_role
    - aws_bedrockagent
  assertions:
  - attribute: name
    op: not_empty
    message: Action boundaries (IAM policies) must be configured.
  on_fail: violation
- id: waf-agn-050.tf.aws.human-in-the-loop-configured
  engine: terraform
  automated: true
  title: Human-in-the-loop must be configured for sensitive decisions
  provider: aws
  description: For high-risk agent decisions (financial, legal, personal data), human approval MUST be required. The human-in-the-loop
    workflow must be configured via AWS Bedrock or external approval system.
  expected: 'true'
  remediation: Configure human-in-the-loop approval workflows for sensitive agent actions. Use AWS Bedrock’s approval feature
    or integrate with an external approval system (ServiceNow, Jira, custom). Define decision types requiring human review.\n
  example:
    compliant: "resource \"aws_bedrockagent\" \"hitable_agent\" {\n  agent_name = \"human-in-loop-agent\"\n\n  human_interaction_configuration\
      \ {\n    human_interpretation_prompt = \"Review agent decision for accuracy\"\n    human_interpretation_timeout = 3600\n\
      \    human_interpretation_output_context_name = \"approval\"\n  }\n}\n"
    non_compliant: "resource \"aws_bedrockagent\" \"no_huawei\" {\n  agent_name = \"fully-automated-agent\"\n  # No human-in-the-loop\
      \ for sensitive decisions\n  # WAF-AGN-050 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_bedrockagent
  assertions:
  - attribute: agent_name
    op: not_empty
    message: Human-in-the-loop must be configured for sensitive decisions.
  on_fail: violation
- id: waf-agn-050.tf.azurerm.content-safety-policy
  engine: terraform
  automated: true
  title: Azure AI Content Safety must have fail-safe filters configured
  provider: azurerm
  description: Azure AI Content Safety accounts must have content filters configured to block hate, violence, sexual, and
    self-harm content for agent outputs.
  expected: 'true'
  remediation: 'Deploy azurerm_cognitive_account with kind "ContentSafety" and configure content filter policies. Apply filters
    to agent deployments.

    '
  example:
    compliant: "resource \"azurerm_cognitive_account\" \"content_safety\" {\n  name                = \"content-safety-account\"\
      \n  location            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n\
      \  kind                = \"ContentSafety\"\n  sku_name            = \"S0\"\n}\n\n# Content filter policy applied at\
      \ application level or via azurerm_cognitive_account_content_filter\n"
    non_compliant: "resource \"azurerm_cognitive_account\" \"content_safety\" {\n  name                = \"content-safety-account\"\
      \n  location            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n\
      \  kind                = \"ContentSafety\"\n  sku_name            = \"S0\"\n  # No content filter policy applied\n \
      \ # WAF-AGN-050 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_cognitive_account
  assertions:
  - attribute: kind
    op: equals
    expected: ContentSafety
    message: A Content Safety cognitive account must exist for fail-safe filtering.
  - attribute: sku_name
    op: not_empty
    message: Content Safety account must have a configured SKU.
  on_fail: violation
- id: waf-agn-050.tf.google.vertex-safety-filters
  engine: terraform
  automated: true
  title: GCP Vertex AI agents must have safety filters configured
  provider: google
  description: GCP Vertex AI agents must have safety filter settings configured to block harmful content categories and prevent
    unauthorized actions.
  expected: 'true'
  remediation: 'Configure google_vertex_ai_agent with safety_settings block defining thresholds for HATE_SPEECH, HARASSMENT,
    SEXUALLY_EXPLICIT, and DANGEROUS_CONTENT.

    '
  example:
    compliant: "resource \"google_vertex_ai_agent\" \"safe_agent\" {\n  display_name = \"safe-agent\"\n\n  safety_settings\
      \ {\n    category  = \"HATE_SPEECH\"\n    threshold = \"BLOCK_LOW_AND_ABOVE\"\n  }\n\n  safety_settings {\n    category\
      \  = \"DANGEROUS_CONTENT\"\n    threshold = \"BLOCK_MEDIUM_AND_ABOVE\"\n  }\n}\n"
    non_compliant: "resource \"google_vertex_ai_agent\" \"unsafe_agent\" {\n  display_name = \"unsafe-agent\"\n  # No safety_settings\
      \ configured\n  # WAF-AGN-050 Violation\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_vertex_ai_agent
  assertions:
  - attribute: safety_settings
    op: attribute_exists
    message: Vertex AI agent must have safety_settings configured.
  on_fail: violation
