# Retrieved from wafpass-server: http://localhost:8000
# ID: WAF-COST-010
id: WAF-COST-010
pillar: cost
severity: high
type:
  - governance
  - configuration
description: |
  All cloud resources MUST carry mandatory cost allocation tags: cost-center, owner, environment, and workload. These tags are required on all resource types that generate billable costs (compute, storage, database, network, managed services). Tagging MUST be enforced in the CI/CD pipeline; deployments without full tag compliance MUST be blocked or flagged as violations.
regulatory_mapping:
  - framework: 'FinOps Foundation'
    controls:
      - 'Inform Phase – Cost Allocation and Showback'
      - 'Operate Phase – Tagging and Cost Attribution'
  - framework: 'ISO 20000'
    controls:
      - 'Service financial management – cost allocation'
  - framework: 'Internal Governance'
    controls:
      - 'Cloud Cost Governance Policy – Resource Ownership'
      - 'FinOps Charter – Accountability and Transparency'
checks:
  - id: waf-cost-010.tf.aws.compute-mandatory-tags
    engine: terraform
    automated: true
    title: 'AWS compute resources must have all mandatory cost allocation tags'
    provider: aws
    description: 'EC2 instances, ECS services, EKS node groups, Lambda functions and other compute resources must carry all mandatory cost allocation tags: cost-center, owner, environment, and workload.'
    expected: 'true'
    remediation: 'Use the shared mandatory-tags module to generate the complete tag map. Add module "tags" { source = "../../modules/mandatory-tags"; cost_center = ...; owner = ...; environment = ...; workload = ...; } Then set tags = module.tags.tags on every resource.\n'
    example:
      compliant: |
        # AWS
        module "tags" {
          source      = "../../modules/mandatory-tags"
          cost_center = "fintech-platform"
          owner       = "payments-team"
          environment = "production"
          workload    = "payment-service"
        }
        resource "aws_instance" "app" {
          ami           = data.aws_ami.ubuntu.id
          instance_type = "t3.medium"
          tags          = module.tags.tags
        }

        # Azure
        resource "azurerm_virtual_machine" "app" {
          name                = "payment-app-vm"
          resource_group_name = azurerm_resource_group.main.name
          location            = "germanywestcentral"
          tags = merge(module.tags.tags, {
            Name = "payment-app-vm"
          })
        }

        # StackIT (SchwarzIT)
        resource "stackit_load_balancer" "app" {
          project_id = stackit_project.main.id
          name       = "payment-app-lb"
          tags = merge(module.tags.tags, {
            Name = "payment-app-lb"
          })
        }

        # OVH
        resource "ovh_cloud_project_instance" "app" {
          project_id = ovh_cloud_project.main.id
          name       = "payment-app-vm"
          flavor     = "b2-7"
          image      = "Ubuntu 22.04"
          tags = merge(module.tags.tags, {
            Name = "payment-app-vm"
          })
        }

        # Hetzner Cloud
        resource "hcloud_server" "app" {
          name        = "payment-app-server"
          server_type = "cx22"
          location    = "fsn1"
          labels = merge(module.tags.tags, {
            Name = "payment-app-server"
          })
        }

      non_compliant: |
        resource "aws_instance" "app" {
          ami           = data.aws_ami.ubuntu.id
          instance_type = "t3.medium"
          tags = {
            Name = "payment-app"
            # Missing: cost-center, owner, environment, workload
          }
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_instance
        - aws_launch_template
        - aws_eks_node_group
        - aws_ecs_service
        - aws_lambda_function
        - aws_db_instance
        - aws_rds_cluster
        - aws_elasticache_cluster
        - aws_s3_bucket
        - aws_cloudwatch_log_group
        - stackit_project
        - stackit_container_registry
        - stackit_mysql_instance
        - stackit_opensearch_instance
        - stackit_redis_instance
        - stackit_secret_manager
        - stackit_load_balancer
        - stackit_network
        - stackit_dns_zone
        - stackit_log_service
        - ovh_cloud_project
        - ovh_vps
        - ovh_dedicated_server
        - ovh_ip_loadbalancing
        - hcloud_server
        - hcloud_volume
        - hcloud_network
        - hcloud_load_balancer
        - hcloud_dns_record
    assertions:
      - attribute: 'tags'
        op: 'key_exists'
        key: 'cost-center'
        message: "Resource is missing the mandatory 'cost-center' tag."
      - attribute: 'tags'
        op: 'key_exists'
        key: 'owner'
        message: "Resource is missing the mandatory 'owner' tag."
      - attribute: 'tags'
        op: 'key_exists'
        key: 'environment'
        message: "Resource is missing the mandatory 'environment' tag."
      - attribute: 'tags'
        op: 'key_exists'
        key: 'workload'
        message: "Resource is missing the mandatory 'workload' tag."
    on_fail: violation
  - id: waf-cost-010.tf.azurerm.resource-group-mandatory-tags
    engine: terraform
    automated: true
    title: 'Azure resource groups must have all mandatory cost allocation tags'
    provider: azurerm
    description: 'Azure resource groups must carry all mandatory cost allocation tags. Tags applied to resource groups propagate to child resources through Azure Cost Management.'
    expected: 'true'
    remediation: 'Add all mandatory tags to Azure resources. For resource groups, ensure tags include cost-center, owner, environment, and workload. Use Azure Policy to enforce tag inheritance.\n'
    example:
      compliant: |
        resource "azurerm_resource_group" "main" {
          name     = "rg-payment-service-prod"
          location = var.location
          tags = {
            cost-center = "fintech-platform"
            owner       = "payments-team"
            environment = "production"
            workload    = "payment-service"
            managed-by  = "terraform"
          }
        }
        
      non_compliant: |
        resource "azurerm_resource_group" "main" {
          name     = "rg-payment-service-prod"
          location = var.location
          # Missing all mandatory tags – WAF-COST-010 violation
        }
        
    scope:
      block_type: resource
      resource_types:
        - azurerm_resource_group
        - azurerm_virtual_machine
        - azurerm_storage_account
        - azurerm_sql_database
        - azurerm_kubernetes_cluster
        - stackit_project
        - stackit_container_registry
        - stackit_mysql_instance
        - stackit_opensearch_instance
        - stackit_redis_instance
        - stackit_secret_manager
        - ovh_cloud_project
        - ovh_vps
        - ovh_dedicated_server
        - hcloud_server
        - hcloud_volume
        - hcloud_network
        - hcloud_load_balancer
    assertions:
      - attribute: 'tags'
        op: 'key_exists'
        key: 'cost-center'
        message: "Azure resource is missing the mandatory 'cost-center' tag."
      - attribute: 'tags'
        op: 'key_exists'
        key: 'owner'
        message: "Azure resource is missing the mandatory 'owner' tag."
      - attribute: 'tags'
        op: 'key_exists'
        key: 'environment'
        message: "Azure resource is missing the mandatory 'environment' tag."
      - attribute: 'tags'
        op: 'key_exists'
        key: 'workload'
        message: "Azure resource is missing the mandatory 'workload' tag."
    on_fail: violation
