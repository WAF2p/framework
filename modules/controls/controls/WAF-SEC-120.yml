checks:
  - id: waf-sec-120.tf.aws.eks-private-endpoint
    engine: terraform
    automated: true
    title: 'EKS cluster API server endpoint must not be publicly accessible'
    provider: aws
    description: 'The aws_eks_cluster vpc_config block must be present. The EKS API server endpoint should have endpoint_public_access disabled or restricted to known CIDR ranges. Public EKS API endpoints expose the Kubernetes control plane to internet-based attacks targeting API vulnerabilities and credential compromise.'
    expected: 'true'
    remediation: "Add a vpc_config block to the aws_eks_cluster resource. Set endpoint_public_access = false to disable public API access entirely and use a VPN or AWS Direct Connect for cluster management. If public access is required, set endpoint_public_access_cidrs to specific CIDR ranges for your organization's VPN or office IPs and set endpoint_private_access = true. Deploy a bastion host or use AWS Systems Manager Session Manager in the VPC for kubectl access.\n"
    example:
      compliant: |
        resource "aws_eks_cluster" "main" {
          name     = "production-cluster"
          role_arn = aws_iam_role.eks_cluster.arn
          version  = "1.30"
        
          vpc_config {
            subnet_ids              = aws_subnet.private[*].id
            endpoint_private_access = true
            endpoint_public_access  = false
            security_group_ids      = [aws_security_group.eks_cluster.id]
          }
        
          enabled_cluster_log_types = ["api", "audit", "authenticator", "controllerManager", "scheduler"]
        
          tags = {
            environment = "production"
          }
        }
        
      non_compliant: |
        resource "aws_eks_cluster" "main" {
          name     = "production-cluster"
          role_arn = aws_iam_role.eks_cluster.arn
          version  = "1.30"
        
          vpc_config {
            subnet_ids             = aws_subnet.public[*].id
            endpoint_public_access = true   # WAF-SEC-120 violation: public API server endpoint
            # endpoint_private_access not set – defaults to false
          }
          # enabled_cluster_log_types not set – audit logging disabled
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_eks_cluster
    assertions:
      - attribute: 'vpc_config'
        op: 'attribute_exists'
        message: 'EKS cluster must have a vpc_config block defined to configure endpoint access restrictions.'
    on_fail: violation
  - id: waf-sec-120.tf.aws.ecr-scan-on-push
    engine: terraform
    automated: true
    title: 'Container images must be sourced from ECR repositories with scanning enabled'
    provider: aws
    description: 'All aws_ecr_repository resources supplying container images to production EKS or ECS workloads must have image_scanning_configuration with scan_on_push = true. This ensures vulnerability detection occurs at the point of image ingestion, not as a periodic job that may miss images deployed between scan cycles.'
    expected: 'true'
    remediation: 'Add an image_scanning_configuration block with scan_on_push = true to all aws_ecr_repository resources. Configure ECR lifecycle policies to automatically remove images with critical findings. Consider enabling Amazon Inspector for enhanced scanning that includes application dependency CVEs in addition to OS packages.\n'
    example:
      compliant: |
        resource "aws_ecr_repository" "app" {
          name                 = "production-app"
          image_tag_mutability = "IMMUTABLE"
        
          image_scanning_configuration {
            scan_on_push = true
          }
        
          encryption_configuration {
            encryption_type = "KMS"
            kms_key         = aws_kms_key.ecr.arn
          }
        }
        
      non_compliant: |
        resource "aws_ecr_repository" "app" {
          name                 = "production-app"
          image_tag_mutability = "MUTABLE"
          # No image_scanning_configuration – WAF-SEC-120 violation
          # Vulnerability scanning not enforced at push time
        }
        
    scope:
      block_type: resource
      resource_types:
        - aws_ecr_repository
    assertions:
      - attribute: 'image_scanning_configuration'
        op: 'attribute_exists'
        message: 'ECR repository must have image_scanning_configuration defined to ensure all pushed images are scanned for vulnerabilities.'
    on_fail: violation
