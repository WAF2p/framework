checks:
- id: waf-sec-120.tf.aws.eks-private-endpoint
  engine: terraform
  automated: true
  title: EKS cluster API server endpoint must not be publicly accessible
  provider: aws
  description: The aws_eks_cluster vpc_config block must be present. The EKS API server endpoint should have endpoint_public_access disabled or restricted to known CIDR ranges. Public EKS API endpoints expose the Kubernetes control plane to internet-based attacks targeting API vulnerabilities and credential compromise.
  expected: 'true'
  remediation: 'Add a vpc_config block to the aws_eks_cluster resource. Set endpoint_public_access = false to disable public API access entirely and use a VPN or AWS Direct Connect for cluster management. If public access is required, set endpoint_public_access_cidrs to specific CIDR ranges for your organization''s VPN or office IPs and set endpoint_private_access = true. Deploy a bastion host or use AWS Systems Manager Session Manager in the VPC for kubectl access.

    '
  example:
    compliant: "resource \"aws_eks_cluster\" \"main\" {\n  name     = \"production-cluster\"\n  role_arn = aws_iam_role.eks_cluster.arn\n  version  = \"1.30\"\n\n  vpc_config {\n    subnet_ids              = aws_subnet.private[*].id\n    endpoint_private_access = true\n    endpoint_public_access  = false\n    security_group_ids      = [aws_security_group.eks_cluster.id]\n  }\n\n  enabled_cluster_log_types = [\"api\", \"audit\", \"authenticator\", \"controllerManager\", \"scheduler\"]\n\n  tags = {\n    environment = \"production\"\n  }\n}\n"
    non_compliant: "resource \"aws_eks_cluster\" \"main\" {\n  name     = \"production-cluster\"\n  role_arn = aws_iam_role.eks_cluster.arn\n  version  = \"1.30\"\n\n  vpc_config {\n    subnet_ids             = aws_subnet.public[*].id\n    endpoint_public_access = true   # WAF-SEC-120 violation: public API server endpoint\n    # endpoint_private_access not set – defaults to false\n  }\n  # enabled_cluster_log_types not set – audit logging disabled\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_eks_cluster
  assertions:
  - attribute: vpc_config
    op: attribute_exists
    message: EKS cluster must have a vpc_config block defined to configure endpoint access restrictions.
  on_fail: violation
- id: waf-sec-120.tf.aws.ecr-scan-on-push
  engine: terraform
  automated: true
  title: Container images must be sourced from ECR repositories with scanning enabled
  provider: aws
  description: All aws_ecr_repository resources supplying container images to production EKS or ECS workloads must have image_scanning_configuration with scan_on_push = true. This ensures vulnerability detection occurs at the point of image ingestion, not as a periodic job that may miss images deployed between scan cycles.
  expected: 'true'
  remediation: Add an image_scanning_configuration block with scan_on_push = true to all aws_ecr_repository resources. Configure ECR lifecycle policies to automatically remove images with critical findings. Consider enabling Amazon Inspector for enhanced scanning that includes application dependency CVEs in addition to OS packages.\n
  example:
    compliant: "resource \"aws_ecr_repository\" \"app\" {\n  name                 = \"production-app\"\n  image_tag_mutability = \"IMMUTABLE\"\n\n  image_scanning_configuration {\n    scan_on_push = true\n  }\n\n  encryption_configuration {\n    encryption_type = \"KMS\"\n    kms_key         = aws_kms_key.ecr.arn\n  }\n}\n"
    non_compliant: "resource \"aws_ecr_repository\" \"app\" {\n  name                 = \"production-app\"\n  image_tag_mutability = \"MUTABLE\"\n  # No image_scanning_configuration – WAF-SEC-120 violation\n  # Vulnerability scanning not enforced at push time\n}\n"
  scope:
    block_type: resource
    resource_types:
    - aws_ecr_repository
  assertions:
  - attribute: image_scanning_configuration
    op: attribute_exists
    message: ECR repository must have image_scanning_configuration defined to ensure all pushed images are scanned for vulnerabilities.
  on_fail: violation
- id: waf-sec-120.tf.azurerm.aks-private-cluster
  engine: terraform
  automated: true
  title: Azure Kubernetes Service clusters must use private cluster mode
  provider: azurerm
  description: All azurerm_kubernetes_cluster resources must have private_cluster_enabled = true and public_network_access_enabled = false to limit API server exposure.
  expected: 'true'
  remediation: 'Enable private_cluster_enabled and set public_network_access_enabled = false on every AKS cluster. Connect to the API server via private endpoints or Azure Bastion.

    '
  example:
    compliant: "resource \"azurerm_kubernetes_cluster\" \"app\" {\n  name                = \"app-aks\"\n  location            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n  dns_prefix          = \"app-aks\"\n  private_cluster_enabled = true\n  public_network_access_enabled = false\n  default_node_pool {\n    name       = \"default\"\n    node_count = 2\n    vm_size    = \"Standard_D2s_v3\"\n  }\n  identity {\n    type = \"SystemAssigned\"\n  }\n}\n"
    non_compliant: "resource \"azurerm_kubernetes_cluster\" \"app\" {\n  name                = \"app-aks\"\n  location            = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n  dns_prefix          = \"app-aks\"\n  # private_cluster_enabled defaults to false\n  default_node_pool {\n    name       = \"default\"\n    node_count = 2\n    vm_size    = \"Standard_D2s_v3\"\n  }\n}\n"
  scope:
    block_type: resource
    resource_types:
    - azurerm_kubernetes_cluster
  assertions:
  - attribute: private_cluster_enabled
    op: is_true
    message: AKS cluster must have private cluster mode enabled.
  - attribute: public_network_access_enabled
    op: is_false
    message: AKS cluster must disable public network access to the API server.
  on_fail: violation
- id: waf-sec-120.tf.google.gke-private-cluster
  engine: terraform
  automated: true
  title: Google Kubernetes Engine clusters must use private nodes
  provider: google
  description: All google_container_cluster resources must have private_cluster_config.enable_private_nodes = true and master_authorized_networks_config enabled to restrict API server access.
  expected: 'true'
  remediation: 'Configure private_cluster_config with enable_private_nodes = true and define master_authorized_networks_config with trusted CIDRs on every GKE cluster.

    '
  example:
    compliant: "resource \"google_container_cluster\" \"app\" {\n  name     = \"app-gke\"\n  location = \"europe-west3\"\n  private_cluster_config {\n    enable_private_nodes    = true\n    enable_private_endpoint = false\n    master_ipv4_cidr_block  = \"172.16.0.0/28\"\n  }\n  master_authorized_networks_config {\n    cidr_blocks {\n      cidr_block   = \"10.0.0.0/8\"\n      display_name = \"internal-network\"\n    }\n  }\n}\n"
    non_compliant: "resource \"google_container_cluster\" \"app\" {\n  name     = \"app-gke\"\n  location = \"europe-west3\"\n  # private_cluster_config not set – nodes have public IPs by default\n}\n"
  scope:
    block_type: resource
    resource_types:
    - google_container_cluster
  assertions:
  - attribute: private_cluster_config.enable_private_nodes
    op: is_true
    message: GKE cluster must use private nodes.
  - attribute: master_authorized_networks_config
    op: attribute_exists
    message: GKE cluster must restrict master authorized networks.
  on_fail: violation
- id: waf-sec-120.tf.stackit.database-backup-enabled
  engine: terraform
  automated: true
  title: STACKIT managed databases must have backup and point-in-time recovery enabled
  provider: stackit
  description: stackit_postgres_flex_instance, stackit_mysql_instance, stackit_redis_instance, and stackit_opensearch_instance resources must have automated backups enabled with a documented retention and recovery procedure.
  expected: 'true'
  remediation: Enable automated backups on all STACKIT managed data services. Define retention, encryption, and recovery SLAs in a documented backup policy.\n
  example:
    compliant: "resource \"stackit_postgres_flex_instance\" \"app\" {\n  project_id = var.stackit_project_id\n  name       = \"app-db\"\n  version    = \"15\"\n  # backups enabled with retention >= 7 days\n}\n"
    non_compliant: "resource \"stackit_postgres_flex_instance\" \"app\" {\n  project_id = var.stackit_project_id\n  name       = \"app-db\"\n  # WAF-SEC-120 violation: backups not configured\n}\n"
  scope:
    block_type: resource
    resource_types:
    - stackit_postgres_flex_instance
    - stackit_mysql_instance
    - stackit_redis_instance
    - stackit_opensearch_instance
  assertions:
  - attribute: name
    op: attribute_exists
    message: STACKIT managed database must have backups and recovery configured.
  on_fail: violation
- id: waf-sec-120.config.ovh.ovh-identity-access
  engine: config
  automated: true
  title: OVHcloud workloads must have backup and recovery procedures documented
  provider: ovh
  description: A version-controlled policy document must exist at `docs/security/waf-sec-120-ovh-identity-access.md` and document the OVHcloud implementation of this control. The checker validates that the file exists and contains a normative requirement statement (MUST/SHALL/required/mandatory).
  expected: 'true'
  remediation: 'Create or update `docs/security/waf-sec-120-ovh-identity-access.md`. State the requirement, how it is implemented for OVHcloud, the review cadence, and the owner.

    '
  example:
    compliant: '|

      docs/security/waf-sec-120-ovh-identity-access.md:

      - The OVHcloud implementation of WAF-SEC-120 is documented.

      - Implementation status and owner are recorded.

      - Review cadence is defined (e.g. quarterly).

      '
    non_compliant: '|

      # `docs/security/waf-sec-120-ovh-identity-access.md` is missing or does not contain a normative requirement.

      # WAF-SEC-120 violation: OVHcloud control is not documented

      '
  scope:
    block_type: file
    path_pattern: docs/security/waf-sec-120-ovh-identity-access.md
  assertions:
  - attribute: content
    op: matches
    pattern: (?i)MUST|SHALL|required|mandatory|enforced|documented
    message: Policy file `docs/security/waf-sec-120-ovh-identity-access.md` must contain a normative requirement statement.
  on_fail: violation
- id: waf-sec-120.tf.hcloud.volume-backups-enabled
  engine: terraform
  automated: true
  title: Hetzner Cloud volumes must have backups enabled
  provider: hcloud
  description: All hcloud_volume resources storing production data must have backups enabled via hcloud_volume or server backup settings, with documented retention and recovery procedures.
  expected: 'true'
  remediation: Enable backups on hcloud_volume resources or the attached hcloud_server. Document backup retention and recovery runbooks.\n
  example:
    compliant: "resource \"hcloud_volume\" \"app\" {\n  name      = \"app-data\"\n  size      = 100\n  server_id = hcloud_server.app.id\n  # backups enabled via server or volume backup policy\n}\n"
    non_compliant: "resource \"hcloud_volume\" \"app\" {\n  name      = \"app-data\"\n  size      = 100\n  server_id = hcloud_server.app.id\n  # WAF-SEC-120 violation: backups not verified\n}\n"
  scope:
    block_type: resource
    resource_types:
    - hcloud_volume
  assertions:
  - attribute: name
    op: attribute_exists
    message: Hetzner Cloud volume must have backups enabled or documented.
  on_fail: finding
